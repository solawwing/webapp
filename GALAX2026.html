<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GALAX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000; overflow: hidden;
    touch-action: none; user-select: none;
    -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #c { display: block; background: #000; }
  #overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #0ff;
    font-family: 'Montserrat', sans-serif; text-align: center;
    pointer-events: none; text-shadow: 0 0 8px #0ff;
  }
  #overlay .title {
    font-size: clamp(28px, 8vw, 56px); letter-spacing: 20px; font-weight: normal;
    margin-bottom: 12px; margin-right: -20px;
  }
  #overlay .sub { font-size: clamp(12px, 3.2vw, 16px); letter-spacing: 2px; opacity: 0.85; margin: 4px 0; margin-right: -2px; }
  #overlay .blink { animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #overlay .hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div id="titleScreen">
    <div class="title" style="font-size:clamp(8px,3.5vw,18px);">GALAX2026</div>
    <div class="sub blink" style="margin-top:24px;">TAP TO START</div>
  </div>
  <div id="overScreen" class="hidden">
    <div class="title" style="font-size:clamp(8px,3.5vw,18px);">GAME OVER</div>
    <div class="sub" id="finalScoreLine"></div>
    <div class="sub" id="hiScoreLine2"></div>
    <div class="sub blink" style="margin-top:24px;">TAP TO RETRY</div>
  </div>
</div>

<script>
(function(){
"use strict";

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const titleScreen = document.getElementById('titleScreen');
const overScreen = document.getElementById('overScreen');
const hiScoreLine2 = document.getElementById('hiScoreLine2');
const finalScoreLine = document.getElementById('finalScoreLine');

let W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);
let lastLayoutCount = 20;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layoutFormation(lastLayoutCount);
}
window.addEventListener('resize', resize);

// ---------- persistent high score ----------
let highScore = 0;
async function loadHighScore() {
  try {
    const res = await window.storage.get('galaga-wireframe-highscore', false);
    if (res && res.value) highScore = parseInt(res.value, 10) || 0;
  } catch (e) { /* no saved score yet */ }
}
async function saveHighScore() {
  try { await window.storage.set('galaga-wireframe-highscore', String(highScore), false); }
  catch (e) { /* ignore storage failure */ }
}
loadHighScore();

// ---------- game state ----------
const STATE = { TITLE: 0, PLAYING: 1, GAMEOVER: 2 };
let state = STATE.TITLE;
let score = 0;
let wave = 1;

// ---------- utility ----------
function bezier(p0, p1, p2, p3, t) {
  const u = 1 - t;
  const x = u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x;
  const y = u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y;
  return { x, y };
}
function dist2(ax, ay, bx, by) { const dx = ax-bx, dy = ay-by; return dx*dx + dy*dy; }
function rand(a, b) { return a + Math.random() * (b - a); }
function choice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function lerpAngle(a, b, t) {
  let diff = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

// ---------- player ----------
const player = {
  x: 0, y: 0, r: 9,
  targetX: 0, targetY: 0, lives: 3, alive: true,
  invT: 0, fireCd: 0, fireInterval: 0.28, weapon: 'NORMAL', weaponLevel: 0,
  rapidLevel: 0, burstRemaining: 0, burstTimer: 0,
  warping: false, warpT: 0, warpTrail: [],
};
function resetPlayer() {
  player.x = W / 2; player.targetX = W / 2;
  player.y = H - 90; player.targetY = H - 90;
  player.lives = 3; player.alive = true; player.invT = 2.0; player.fireCd = 0;
  player.weapon = 'NORMAL'; player.weaponLevel = 0;
  player.rapidLevel = 0; player.burstRemaining = 0; player.burstTimer = 0;
  player.warping = false; player.warpT = 0; player.warpTrail = [];
}

// ---------- items ----------
const ITEM_TYPES = ['DOUBLE', 'WIDE', 'HOMING', 'LASER', 'GRAVITY'];
const ITEM_COLORS = { DOUBLE: '#4ef0ff', WIDE: '#ffd23f', HOMING: '#7CFF7C', LASER: '#39fff3', RAPID: '#ffffff', GRAVITY: '#c77dff' };
let items = [];
let killCount = 0;
let pickupTexts = [];
let particles = [];
function spawnDeathParticles(x, y, color, count, maxSpeed) {
  const n = count || 6;
  const spdMax = maxSpeed || 220;
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const spd = rand(60, spdMax);
    particles.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      angle: rand(0, Math.PI * 2), spin: rand(-6, 6),
      r: rand(3, 6), t: 0, duration: rand(0.5, 1.4), color,
    });
  }
}
function spawnBossExplosion(x, y) {
  // huge central burst
  spawnDeathParticles(x, y, '#ff2e6b', 140, 480);
  spawnDeathParticles(x, y, '#ffffff', 60, 380);
  // secondary bursts scattered across the whole screen for a big finale feel
  for (let k = 0; k < 10; k++) {
    const px = rand(0, W), py = rand(0, H * 0.7);
    spawnDeathParticles(px, py, k % 2 === 0 ? '#ff2e6b' : '#ffd23f', 14, 260);
  }
}

// ---------- gravity shockwaves ----------
let shockwaves = [];
function spawnShockwave(x, y, maxR) {
  shockwaves.push({ x, y, maxR, t: 0, duration: 0.6 });
}
function updateShockwaves(dt) {
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const s = shockwaves[i];
    s.t += dt;
    if (s.t >= s.duration) shockwaves.splice(i, 1);
  }
}
function drawShockwaves() {
  shockwaves.forEach(s => {
    const frac = s.t / s.duration;
    const r = Math.max(2, s.maxR * frac);
    const alpha = Math.max(0, 1 - frac);
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#c77dff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.stroke();
    // inner echo ring for extra visibility
    ctx.globalAlpha = alpha * 0.6;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, Math.max(1, r * 0.6), 0, Math.PI * 2);
    ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.lineWidth = 1;
  });
}

// splash damage: applies 1 damage to every enemy within radius of (x,y), excluding the enemy that was directly hit
function applyGravitySplash(x, y, radius, excludeEnemy) {
  spawnShockwave(x, y, radius);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e === excludeEnemy) continue;
    if (dist2(x, y, e.x, e.y) <= radius * radius) {
      e.hp -= 1;
      if (e.hp <= 0) {
        handleEnemyDeath(e);
        enemies.splice(i, 1);
      } else if (e.type !== 'GIANTBOSS') {
        spawnDeathParticles(e.x, e.y, e.def.color, 3);
      }
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.duration) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.angle += p.spin * dt;
  }
}
function drawParticles() {
  ctx.lineWidth = 1;
  particles.forEach(p => {
    const frac = p.t / p.duration;
    ctx.globalAlpha = 1 - frac;
    ctx.strokeStyle = p.color;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle);
    ctx.beginPath();
    drawDownTriangle(0, 0, p.r);
    ctx.stroke();
    ctx.restore();
    ctx.globalAlpha = 1;
  });
}
function pickItemType() {
  // the weapon type currently equipped is half as likely to drop again
  const weights = ITEM_TYPES.map(t => t === player.weapon ? 0.5 : 1);
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < ITEM_TYPES.length; i++) {
    r -= weights[i];
    if (r <= 0) return ITEM_TYPES[i];
  }
  return ITEM_TYPES[ITEM_TYPES.length - 1];
}
function spawnItem(x, y) {
  items.push({ x, y, vy: 90, type: pickItemType(), r: 14, angle: 0, spin: rand(1.5, 3) * (Math.random() < 0.5 ? -1 : 1) });
}
function spawnRapidItem(x, y) {
  items.push({ x, y, vy: 90, type: 'RAPID', r: 14, angle: 0, spin: rand(1.5, 3) * (Math.random() < 0.5 ? -1 : 1) });
}
function updateItems(dt) {
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.vy * dt;
    it.angle += it.spin * dt;
    if (it.y > H + 20) { items.splice(i, 1); continue; }
    const rr = (player.r + it.r) * (player.r + it.r);
    if (player.alive && dist2(player.x, player.y, it.x, it.y) < rr) {
      if (it.type === 'RAPID') {
        player.rapidLevel = Math.min(3, player.rapidLevel + 1);
        pickupTexts.push({ text: 'RAPID Lv' + player.rapidLevel, x: player.x, y: player.y - player.r - 6, t: 0, duration: 2.0 });
      } else {
        if (player.weapon === it.type) {
          player.weaponLevel = Math.min(5, player.weaponLevel + 1);
        } else {
          player.weapon = it.type;
          player.weaponLevel = 1;
        }
        pickupTexts.push({ text: it.type + ' Lv' + player.weaponLevel, x: player.x, y: player.y - player.r - 6, t: 0, duration: 2.0 });
      }
      items.splice(i, 1);
    }
  }
}
const ITEM_GLYPHS = { DOUBLE: 'D', WIDE: 'W', HOMING: 'H', LASER: 'L', RAPID: '^', GRAVITY: 'G' };
function drawItems() {
  ctx.lineWidth = 1;
  items.forEach(it => {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.angle);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.strokeRect(-14, -14, 28, 28);
    ctx.restore();
    // glyph stays upright even while the square rotates
    ctx.fillStyle = '#ffffff';
    ctx.font = '300 11px "Montserrat", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ITEM_GLYPHS[it.type], it.x, it.y);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  });
}
function updatePickupTexts(dt) {
  for (let i = pickupTexts.length - 1; i >= 0; i--) {
    const p = pickupTexts[i];
    p.t += dt;
    const fade = p.fadeDuration || 0.6;
    if (p.t >= p.duration + fade) pickupTexts.splice(i, 1);
  }
}
function drawPickupTexts() {
  pickupTexts.forEach(p => {
    const fade = p.fadeDuration || 0.6;
    let alpha, size, rise;
    if (p.t < p.duration) {
      // hold phase: grow quickly, then stay fully visible
      const growFrac = Math.min(1, p.t / 0.3);
      size = 6 * (1 + growFrac * 1.8);
      rise = growFrac * 18;
      alpha = 1;
    } else {
      // fade phase: stay large, drift up slightly, fade to transparent
      const fadeFrac = (p.t - p.duration) / fade;
      size = 6 * 2.8;
      rise = 18 + fadeFrac * 10;
      alpha = 1 - fadeFrac;
    }
    ctx.globalAlpha = Math.max(0, alpha);
    ctx.fillStyle = '#7CFFF0';
    ctx.font = `300 ${size}px "Montserrat", sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - rise);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  });
}

function findNearestEnemy(x, y) {
  let best = null, bestD = Infinity;
  enemies.forEach(e => {
    const d = dist2(x, y, e.x, e.y);
    if (d < bestD) { bestD = d; best = e; }
  });
  return best;
}
function findNearestEnemyExcluding(x, y, excludeSet) {
  let best = null, bestD = Infinity;
  enemies.forEach(e => {
    if (excludeSet.has(e)) return;
    const d = dist2(x, y, e.x, e.y);
    if (d < bestD) { bestD = d; best = e; }
  });
  return best;
}
function fanAngles(n, step) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push((i - (n - 1) / 2) * step);
  return arr;
}
function xOffsets(n, spacing) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push((i - (n - 1) / 2) * spacing);
  return arr;
}
const DOUBLE_COUNTS = [0, 2, 3, 4, 5, 7];
const WIDE_COUNTS = [0, 3, 4, 5, 6, 7];
const HOMING_COUNTS = [0, 1, 2, 3, 4, 5];
const LASER_SPECS = [null,
  { length: 50, pierce: 2 },
  { length: 75, pierce: 2 },
  { length: 100, pierce: 3 },
  { length: 200, pierce: 4 },
  { length: 300, pierce: 10 },
];
function fireWeapon() {
  const bx = player.x, by = player.y - player.r;
  const lvl = player.weaponLevel;
  if (player.weapon === 'DOUBLE') {
    const n = DOUBLE_COUNTS[lvl];
    xOffsets(n, 25).forEach(ox => {
      playerBullets.push({ x: bx + ox, y: by, vx: 0, vy: -540, r: 3, power: 2 });
    });
  } else if (player.weapon === 'WIDE') {
    const n = WIDE_COUNTS[lvl];
    fanAngles(n, 20).forEach(a => {
      const rad = a * Math.PI / 180;
      playerBullets.push({ x: bx, y: by, vx: Math.sin(rad) * 540, vy: -Math.cos(rad) * 540, r: 3, power: 2 });
    });
  } else if (player.weapon === 'HOMING') {
    const n = HOMING_COUNTS[lvl];
    const usedTargets = new Set();
    fanAngles(n, 20).forEach(a => {
      const rad = a * Math.PI / 180;
      const target = findNearestEnemyExcluding(bx, by, usedTargets) || findNearestEnemy(bx, by);
      if (target) usedTargets.add(target);
      playerBullets.push({ x: bx, y: by, vx: Math.sin(rad) * 540, vy: -Math.cos(rad) * 540, r: 3, homing: true, target, power: 1 });
    });
  } else if (player.weapon === 'LASER') {
    const spec = LASER_SPECS[lvl];
    playerBullets.push({ x: bx, y: by, vx: 0, vy: -700, r: 3, laser: true, length: spec.length, pierceLeft: spec.pierce, hitSet: new Set(), power: 5 });
  } else if (player.weapon === 'GRAVITY') {
    playerBullets.push({ x: bx, y: by, vx: 0, vy: -540, r: 3, power: 3, gravity: true, gravityRadius: lvl * 50 });
  } else {
    playerBullets.push({ x: bx, y: by, vx: 0, vy: -540, r: 3, power: 3 });
  }
}

// ---------- bullets ----------
let playerBullets = [];
let enemyBullets = [];

// ---------- enemy types ----------
const TYPES = {
  A: { hp: 5, score: 25, color: '#ff2e2e', r: 9, speedMul: 1.5 },
  B: { hp: 4, score: 15, color: '#ff8c1a', r: 9, speedMul: 1.2 },
  C: { hp: 3, score: 10, color: '#fff01a', r: 9, speedMul: 1.0 },
  D: { hp: 2, score: 5,  color: '#39FF14', r: 9, speedMul: 0.8 },
  E: { hp: 1, score: 2,  color: '#39fff3', r: 9, speedMul: 0.5 },
};
let globalSpeedBonus = 0; // +0.2 per boss destroyed, applied on top of each type's speedMul

let enemies = [];
let formationSlots = []; // {x,y,type,filled}
let formationOffsetX = 0, formationOffsetT = 0;
let spawnQueue = [];
let spawnTimer = 0;
let waveClearTimer = 0;
let diveTimer = 0;

const TIER_ORDER = ['E', 'D', 'C', 'B', 'A'];
function pickEnemyType(rowFrac) {
  // rowFrac: 0 = top of formation, 1 = bottom
  if (wave >= 100) return 'A'; // wave 100: every enemy is 'A'
  if (wave <= 1) return 'E';   // wave 1: every enemy is 'E'
  const waveFrac = clamp((wave - 1) / 99, 0, 1);
  // row-based bonus peaks mid-game and fades out at both wave extremes, so early
  // waves stay E-dominant across the whole formation (not just the bottom rows)
  const posBias = (1 - rowFrac) * waveFrac * (1 - waveFrac) * 2;
  const strength = clamp(waveFrac + posBias, 0, 1); // 0..1
  const centerIdx = strength * 4; // 0 (E) .. 4 (A), continuous
  const weights = TIER_ORDER.map((_, i) => Math.max(0, 1 - Math.abs(i - centerIdx) / 2));
  const total = weights.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < TIER_ORDER.length; i++) {
    r -= weights[i];
    if (r <= 0) return TIER_ORDER[i];
  }
  return TIER_ORDER[TIER_ORDER.length - 1];
}

function layoutFormation(count, forceType) {
  formationSlots = [];
  if (!count || count <= 0) return;
  const perRow = 8;
  const rows = Math.ceil(count / perRow);
  const topMargin = H * 0.12;
  const rowGap = Math.min(46, H * 0.06);
  const usableW = Math.min(W * 0.86, 520);
  const startX = (W - usableW) / 2;
  let remaining = count;
  for (let r = 0; r < rows; r++) {
    const inRow = Math.min(perRow, remaining);
    remaining -= inRow;
    const gap = usableW / inRow;
    const rowFrac = rows > 1 ? r / (rows - 1) : 0; // 0 = top (a-leaning), 1 = bottom (e-leaning)
    for (let i = 0; i < inRow; i++) {
      const idx = formationSlots.length;
      formationSlots.push({
        x: startX + gap * (i + 0.5),
        y: topMargin + r * rowGap,
        type: forceType || pickEnemyType(rowFrac),
        filled: false,
        slotId: idx,
      });
    }
  }
}

function makeEnemy(slot, fromLeft, entryMode) {
  const t = TYPES[slot.type];
  let startX, startY, c1, c2;
  if (entryMode === 'CENTER') {
    startX = W / 2; startY = -60;
    c1 = { x: W / 2 + (slot.x - W / 2) * 0.25, y: H * 0.04 };
    c2 = { x: slot.x, y: slot.y - 90 };
  } else if (entryMode === 'TOP') {
    startX = slot.x; startY = -60;
    c1 = { x: slot.x, y: H * 0.05 };
    c2 = { x: slot.x, y: slot.y - 60 };
  } else { // LEFTRIGHT (default)
    startX = fromLeft ? -60 : W + 60; startY = -60;
    c1 = { x: fromLeft ? W * 0.25 : W * 0.75, y: H * 0.15 };
    c2 = { x: slot.x + (fromLeft ? -80 : 80), y: slot.y - 60 };
  }
  return {
    type: slot.type, def: t, hp: t.hp, maxHp: t.hp,
    slot, state: 'enter',
    x: startX, y: startY,
    p0: { x: startX, y: startY }, p1: c1, p2: c2, p3: { x: slot.x, y: slot.y },
    t: 0, duration: rand(2.6, 3.4) / (t.speedMul + globalSpeedBonus),
    diveCd: rand(2, 5),
    swayPhase: rand(0, Math.PI * 2),
    angle: 0,
  };
}

const BOSS_TYPES = {
  X: { color: '#ff2e2e', sides: 3 },
  Y: { color: '#ff8c1a', sides: 4 },
  Z: { color: '#fff01a', sides: 5 },
};
function makeBossEnemy() {
  const bossHp = wave * 5;
  const key = choice(['X', 'Y', 'Z']);
  const bossType = BOSS_TYPES[key];
  const t = { hp: bossHp, score: 100, color: bossType.color, r: 54, sides: bossType.sides };
  const startX = W / 2, startY = -100;
  const target = { x: W / 2, y: H * 0.2 };
  return {
    type: 'GIANTBOSS', bossKey: key, def: t, hp: bossHp, maxHp: bossHp,
    slot: null, state: 'enter',
    x: startX, y: startY,
    p0: { x: startX, y: startY }, p1: { x: W * 0.3, y: H * 0.05 }, p2: { x: W * 0.7, y: H * 0.1 }, p3: target,
    t: 0, duration: 2.4,
    angle: 0, swayPhase: 0,
    bossT: 0, fireTimer: 1.4,
  };
}

let starReverse = false;

function waveEnemyCount(w) {
  const m = ((w - 1) % 5) + 1;
  if (m === 1) return 20;
  if (m === 2) return 20;
  if (m === 3) return 25;
  if (m === 4) return 30;
  return 0; // boss wave (escorts handled separately)
}

function startWave() {
  const m = ((wave - 1) % 5) + 1;
  enemies = [];
  spawnQueue = [];
  starReverse = false;
  if (m === 5) {
    starReverse = true;
    specialStars = [];
    enemies.push(makeBossEnemy());
    // escort enemies: 10 total, all tier A, half entering from the top, half from left/right
    const escortCount = 10;
    lastLayoutCount = escortCount;
    layoutFormation(escortCount, 'A');
    formationSlots.forEach(s => s.filled = false);
    spawnQueue = formationSlots.map((s, i) => ({
      slot: s, delay: i * 0.08,
      fromLeft: i % 2 === 0,
      entryMode: i % 2 === 0 ? 'TOP' : 'LEFTRIGHT',
    }));
  } else {
    const count = waveEnemyCount(wave);
    lastLayoutCount = count;
    layoutFormation(count);
    formationSlots.forEach(s => s.filled = false);
    let entryMode = 'LEFTRIGHT';
    if (m === 1) entryMode = 'TOP';
    else if (m === 2) entryMode = 'LEFTRIGHT';
    else if (m === 3) entryMode = 'TOP';
    else if (m === 4) entryMode = 'CENTER';
    spawnQueue = formationSlots.map((s, i) => ({ slot: s, delay: i * 0.08, fromLeft: i % 2 === 0, entryMode }));
  }
  spawnTimer = 0;
  waveClearTimer = 0;
  diveTimer = rand(2.5, 4.5);
  waveAnnounce = { text: 'WAVE ' + wave, t: 0, hold: 1.2, fade: 0.6 };
}

let waveAnnounce = null;
function updateWaveAnnounce(dt) {
  if (!waveAnnounce) return;
  waveAnnounce.t += dt;
  if (waveAnnounce.t >= waveAnnounce.hold + waveAnnounce.fade) waveAnnounce = null;
}
function drawSpacedText(text, cx, cy, fontPx, spacing) {
  ctx.font = `300 ${fontPx}px "Montserrat", sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const chars = text.split('');
  const widths = chars.map(c => ctx.measureText(c).width);
  const totalWidth = widths.reduce((s, w) => s + w, 0) + spacing * (chars.length - 1);
  let x = cx - totalWidth / 2;
  chars.forEach((c, i) => {
    ctx.fillText(c, x, cy);
    x += widths[i] + spacing;
  });
}

function drawWaveAnnounce() {
  if (!waveAnnounce) return;
  const a = waveAnnounce;
  let alpha;
  if (a.t < a.hold) {
    alpha = Math.min(1, a.t / 0.25);
  } else {
    alpha = 1 - (a.t - a.hold) / a.fade;
  }
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.fillStyle = '#7CFFF0';
  // match the title screen's style: same font-size clamp and 20px letter-spacing
  const fontPx = clamp(W * 0.035, 8, 18);
  drawSpacedText(a.text, W / 2, H / 2, fontPx, 20);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 1;
}

function updateSpawns(dt) {
  for (let i = spawnQueue.length - 1; i >= 0; i--) {
    const sq = spawnQueue[i];
    sq.delay -= dt;
    if (sq.delay <= 0) {
      sq.slot.filled = true;
      const e = makeEnemy(sq.slot, sq.fromLeft, sq.entryMode);
      enemies.push(e);
      spawnQueue.splice(i, 1);
    }
  }
}

function pickDivers() {
  const idle = enemies.filter(e => e.state === 'formation');
  if (idle.length === 0) return;
  const n = Math.random() < 0.5 ? 1 : 2;
  for (let k = 0; k < n; k++) {
    if (idle.length === 0) break;
    const idx = Math.floor(Math.random() * idle.length);
    const e = idle.splice(idx, 1)[0];
    startDive(e);
  }
}

function startDive(e) {
  e.state = 'dive';
  e.t = 0;
  e.duration = rand(3.2, 4.2) / (e.def.speedMul + globalSpeedBonus);
  e.p0 = { x: e.x, y: e.y };
  const midX = clamp(player.x + rand(-80, 80), 40, W - 40);
  e.p1 = { x: e.x + rand(-60, 60), y: H * 0.4 };
  e.p2 = { x: midX, y: H * 0.75 };
  e.p3 = { x: midX + rand(-40, 40), y: H + 80 };
  e.fired = false;
}

function startReturn(e) {
  e.state = 'return';
  e.t = 0;
  e.duration = rand(2.6, 3.2) / (e.def.speedMul + globalSpeedBonus);
  const fromLeft = Math.random() < 0.5;
  e.x = fromLeft ? -60 : W + 60;
  e.y = -60;
  e.p0 = { x: e.x, y: e.y };
  e.p1 = { x: fromLeft ? W * 0.3 : W * 0.7, y: H * 0.2 };
  e.p2 = { x: e.slot.x + (fromLeft ? -60 : 60), y: e.slot.y - 50 };
  e.p3 = { x: e.slot.x, y: e.slot.y };
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function fireEnemyBullet(e) {
  const dx = player.x - e.x, dy = player.y - e.y;
  const len = Math.max(1, Math.hypot(dx, dy));
  const spd = 260 * (2 / 3);
  enemyBullets.push({ x: e.x, y: e.y, vx: dx/len*spd, vy: dy/len*spd, r: 4 });
}

function fireBossBarrage(e) {
  // bullets fired in all directions (omnidirectional), pattern varies by boss type
  const n = e.bossKey === 'Z' ? 24 : 12; // Z: finer angle steps, more bullets per volley
  const spd = 220 * (2 / 3);
  const offset = e.barrageAngle || 0;
  for (let k = 0; k < n; k++) {
    const a = offset + (k / n) * Math.PI * 2;
    enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 4 });
  }
  if (e.bossKey === 'Y') {
    // Y: continuous barrage, rotate slightly each volley for a spinning coverage effect
    e.barrageAngle = offset + 0.2;
  }
}

function updateEnemies(dt) {
  formationOffsetT += dt;
  formationOffsetX = Math.sin(formationOffsetT * 0.35) * 26;

  diveTimer -= dt;
  if (diveTimer <= 0 && enemies.some(e => e.state === 'formation')) {
    pickDivers();
    diveTimer = rand(2.2, 4.0);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ox = e.x, oy = e.y;
    if (e.state === 'enter') {
      e.t += dt / e.duration;
      if (e.t >= 1) {
        if (e.type === 'GIANTBOSS') {
          e.state = 'bossmove';
          e.x = e.p3.x; e.y = e.p3.y;
          e.bossT = 0;
        } else {
          e.state = 'formation';
          e.x = e.slot.x; e.y = e.slot.y;
        }
      } else {
        const p = bezier(e.p0, e.p1, e.p2, e.p3, e.t);
        e.x = p.x; e.y = p.y;
      }
    } else if (e.state === 'bossmove') {
      e.bossT += dt;
      e.x = W / 2 + Math.sin(e.bossT * 0.5) * (W * 0.3);
      e.y = H * 0.2 + Math.sin(e.bossT * 0.8) * 12;
      e.fireTimer -= dt;
      if (e.fireTimer <= 0) {
        fireBossBarrage(e);
        e.fireTimer = 2.0;
      }
    } else if (e.state === 'formation') {
      e.x = e.slot.x + formationOffsetX;
      e.y = e.slot.y + Math.sin(formationOffsetT * 0.9 + e.swayPhase) * 3;
    } else if (e.state === 'dive') {
      e.t += dt / e.duration;
      if (!e.fired && e.t > 0.35) { fireEnemyBullet(e); e.fired = true; }
      if (e.t >= 1) {
        startReturn(e);
      } else {
        const p = bezier(e.p0, e.p1, e.p2, e.p3, e.t);
        e.x = p.x; e.y = p.y;
      }
    } else if (e.state === 'return') {
      e.t += dt / e.duration;
      if (e.t >= 1) {
        e.state = 'formation';
        e.x = e.slot.x; e.y = e.slot.y;
      } else {
        const p = bezier(e.p0, e.p1, e.p2, e.p3, e.t);
        e.x = p.x; e.y = p.y;
      }
    }
    const dx = e.x - ox, dy = e.y - oy;
    if (dx * dx + dy * dy > 0.0001) {
      const target = Math.atan2(dy, dx) - Math.PI / 2;
      e.angle = lerpAngle(e.angle, target, Math.min(1, dt * 10));
    }
  }
}

// ---------- input ----------
let dragging = false;
let lastPointer = { x: 0, y: 0 };
function pointerToXY(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return { x: clientX - rect.left, y: clientY - rect.top };
}
canvas.addEventListener('pointerdown', e => {
  if (state === STATE.TITLE) { beginGame(); return; }
  if (state === STATE.GAMEOVER) { beginGame(); return; }
  dragging = true;
  const p = pointerToXY(e.clientX, e.clientY);
  player.targetX = p.x; player.targetY = p.y - 50;
});
canvas.addEventListener('pointermove', e => {
  if (dragging) {
    const p = pointerToXY(e.clientX, e.clientY);
    player.targetX = p.x; player.targetY = p.y - 50;
  }
});
window.addEventListener('pointerup', () => { dragging = false; });

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'Enter') && (state === STATE.TITLE || state === STATE.GAMEOVER)) {
    beginGame();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function beginGame() {
  state = STATE.PLAYING;
  overlay.style.display = 'none';
  score = 0; wave = 1; killCount = 0; starReverse = false; globalSpeedBonus = 0;
  resetPlayer();
  playerBullets = []; enemyBullets = []; items = []; pickupTexts = []; particles = []; shockwaves = [];
  startWave();
}

function endGame() {
  state = STATE.GAMEOVER;
  if (score > highScore) { highScore = score; saveHighScore(); }
  finalScoreLine.textContent = 'SCORE: ' + score;
  hiScoreLine2.textContent = 'HIGH SCORE: ' + highScore;
  titleScreen.classList.add('hidden');
  overScreen.classList.remove('hidden');
  overlay.style.display = 'flex';
}

// ---------- update ----------
function updatePlayer(dt) {
  if (player.warping) {
    player.warpTrail.push({ x: player.x, y: player.y });
    if (player.warpTrail.length > 16) player.warpTrail.shift();
    player.warpT += dt;
    const speed = 90 + player.warpT * player.warpT * 700; // accelerating warp
    player.y -= speed * dt;
    if (player.invT > 0) player.invT -= dt;
    if (player.y < -60 || player.warpT > 2.5) {
      player.warping = false;
      player.warpTrail = [];
      player.x = W / 2; player.targetX = W / 2;
      player.y = H - 90; player.targetY = H - 90;
      player.invT = 0.8;
    }
    return;
  }

  if (keys['ArrowLeft'] || keys['KeyA']) player.targetX -= 380 * dt;
  if (keys['ArrowRight'] || keys['KeyD']) player.targetX += 380 * dt;
  if (keys['ArrowUp'] || keys['KeyW']) player.targetY -= 380 * dt;
  if (keys['ArrowDown'] || keys['KeyS']) player.targetY += 380 * dt;
  player.targetX = clamp(player.targetX, player.r + 4, W - player.r - 4);
  player.targetY = clamp(player.targetY, player.r + 4, H - player.r - 4);
  player.x += (player.targetX - player.x) * Math.min(1, dt * 14);
  player.y += (player.targetY - player.y) * Math.min(1, dt * 14);

  if (player.invT > 0) player.invT -= dt;

  // rapid-fire burst: extra volleys fired quickly, bypassing the "screen clear" gate
  if (player.burstRemaining > 0) {
    player.burstTimer -= dt;
    if (player.burstTimer <= 0) {
      fireWeapon();
      player.burstRemaining -= 1;
      player.burstTimer = 0.12;
    }
  } else if (player.alive && playerBullets.length === 0) {
    // auto-fire, but only one bullet volley allowed on screen at a time
    fireWeapon();
    const rapidCount = player.rapidLevel === 1 ? 2 : player.rapidLevel === 2 ? 3 : player.rapidLevel === 3 ? 5 : 1;
    player.burstRemaining = rapidCount - 1;
    player.burstTimer = 0.12;
  }
}

function updateBullets(dt) {
  for (let i = playerBullets.length - 1; i >= 0; i--) {
    const b = playerBullets[i];
    if (!b.trail) b.trail = [];
    b.trail.push({ x: b.x, y: b.y });
    const maxTrail = b.laser ? 40 : 14;
    if (b.trail.length > maxTrail) b.trail.shift();
    if (b.homing) {
      if (!b.target || b.target.hp <= 0 || enemies.indexOf(b.target) === -1) {
        const targeted = new Set(
          playerBullets.filter(o => o !== b && o.homing && o.target).map(o => o.target)
        );
        b.target = findNearestEnemyExcluding(b.x, b.y, targeted) || findNearestEnemy(b.x, b.y);
      }
      if (b.target) {
        const dx = b.target.x - b.x, dy = b.target.y - b.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const dvx = dx / len * 540, dvy = dy / len * 540;
        const turn = Math.min(1, 7 * dt);
        b.vx += (dvx - b.vx) * turn;
        b.vy += (dvy - b.vy) * turn;
      }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y < -20 || b.y > H + 20 || b.x < -20 || b.x > W + 20) playerBullets.splice(i, 1);
  }
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (!b.trail) b.trail = [];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 10) b.trail.shift();
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) enemyBullets.splice(i, 1);
  }
}

function handleEnemyDeath(e) {
  score += e.def.score * wave * 10;
  if (e.slot) e.slot.filled = false;
  killCount += 1;
  if (e.type === 'GIANTBOSS') {
    spawnBossExplosion(e.x, e.y);
    globalSpeedBonus += 0.2;
  } else {
    spawnDeathParticles(e.x, e.y, e.def.color, 18);
  }
  if (killCount % 20 === 0) spawnItem(e.x, e.y);
  if (killCount % 75 === 0) spawnRapidItem(e.x + 20, e.y);
}

function handleCollisions() {
  // player bullets vs enemies
  for (let j = playerBullets.length - 1; j >= 0; j--) {
    const b = playerBullets[j];
    if (b.laser) {
      const top = b.y - b.length, bottom = b.y;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (b.hitSet.has(e)) continue;
        const closestY = clamp(e.y, top, bottom);
        const rr = (e.def.r + b.r) * (e.def.r + b.r);
        if (dist2(e.x, e.y, b.x, closestY) < rr) {
          b.hitSet.add(e);
          e.hp -= (b.power || 1);
          if (e.hp <= 0) {
            handleEnemyDeath(e);
            enemies.splice(i, 1);
          } else if (e.type !== 'GIANTBOSS') {
            spawnDeathParticles(e.x, e.y, e.def.color, 3);
          }
          b.pierceLeft -= 1;
          if (b.pierceLeft <= 0) break;
        }
      }
      if (b.pierceLeft <= 0) playerBullets.splice(j, 1);
    } else {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const rr = (e.def.r + b.r) * (e.def.r + b.r);
        if (dist2(e.x, e.y, b.x, b.y) < rr) {
          playerBullets.splice(j, 1);
          e.hp -= (b.power || 1);
          if (e.hp <= 0) {
            const ex = e.x, ey = e.y;
            handleEnemyDeath(e);
            enemies.splice(i, 1);
            if (b.gravity) applyGravitySplash(ex, ey, b.gravityRadius, e);
          } else if (e.type !== 'GIANTBOSS') {
            spawnDeathParticles(e.x, e.y, e.def.color, 3);
          }
          break;
        }
      }
    }
  }
  if (!player.alive || player.invT > 0) return;
  // enemy bullets vs player
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    const rr = (player.r + b.r) * (player.r + b.r);
    if (dist2(player.x, player.y, b.x, b.y) < rr) {
      enemyBullets.splice(i, 1);
      hitPlayer();
      return;
    }
  }
  // enemies vs player (collision)
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i];
    const rr = (player.r + e.def.r) * (player.r + e.def.r);
    if (dist2(player.x, player.y, e.x, e.y) < rr) {
      hitPlayer();
      return;
    }
  }
}

function hitPlayer() {
  player.lives -= 1;
  player.invT = 2.0;
  player.rapidLevel = 0; player.burstRemaining = 0;
  if (player.weapon !== 'NORMAL') {
    player.weaponLevel -= 1;
    pickupTexts.push({ text: 'POWER DOWN', x: player.x, y: player.y - player.r - 6, t: 0, duration: 2.0 });
    if (player.weaponLevel <= 0) {
      player.weapon = 'NORMAL';
      player.weaponLevel = 0;
    }
  }
  player.targetX = W / 2; player.x = W / 2;
  player.targetY = H - 90; player.y = H - 90;
  if (player.lives <= 0) {
    player.alive = false;
    setTimeout(endGame, 700);
  }
}

function checkWaveClear() {
  if (state !== STATE.PLAYING) return;
  if (enemies.length === 0 && spawnQueue.length === 0) {
    waveClearTimer += 1/60;
    if (waveClearTimer > 1.2) {
      wave += 1;
      startWave();
      if (player.alive) {
        player.warping = true;
        player.warpT = 0;
        player.warpTrail = [];
        player.invT = 1.5;
      }
    }
  }
}

// ---------- drawing (all wireframe: stroke only, no fills) ----------
function drawPlayer() {
  if (!player.alive) return;
  if (!player.warping && player.invT > 0 && Math.floor(player.invT * 10) % 2 === 0) return; // blink

  if (player.warping) {
    // trailing afterimage streak while warping upward off-screen
    player.warpTrail.forEach((p, idx) => {
      const alpha = ((idx + 1) / (player.warpTrail.length + 1)) * 0.5;
      drawPlayerShape(p.x, p.y, `rgba(124,255,240,${alpha})`);
    });
  }
  drawPlayerShape(player.x, player.y, '#7CFFF0');
}

function drawPlayerShape(x, y, color) {
  const r = player.r;
  const scaleY = 1.5;
  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.beginPath();
  // upward-pointing triangle, stretched 1.5x vertically
  ctx.moveTo(x, y - r * scaleY);
  ctx.lineTo(x - r * 0.8660254, y + r * 0.5 * scaleY);
  ctx.lineTo(x + r * 0.8660254, y + r * 0.5 * scaleY);
  ctx.closePath();
  ctx.stroke();
}

function drawDownTriangle(x, y, r) {
  ctx.moveTo(x, y + r);
  ctx.lineTo(x - r * 0.8660254, y - r * 0.5);
  ctx.lineTo(x + r * 0.8660254, y - r * 0.5);
  ctx.closePath();
}

function drawPolygonDown(cx, cy, r, sides) {
  for (let k = 0; k < sides; k++) {
    const theta = (k * 2 * Math.PI) / sides;
    const px = cx + r * Math.sin(theta);
    const py = cy + r * Math.cos(theta);
    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
}

function hexToRgba(hex, alpha) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function drawEnemy(e) {
  const x = e.x, y = e.y, r = e.def.r;
  ctx.lineWidth = 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(e.angle);
  if (e.type === 'GIANTBOSS') {
    ctx.strokeStyle = e.def.color;
    ctx.beginPath();
    drawPolygonDown(0, 0, r, e.def.sides);
    ctx.stroke();
  } else {
    // outer triangle (HP=1 size) is fully opaque; each additional HP point adds
    // a nested triangle 3px smaller (drawn inward), at 30% opacity
    const n = Math.max(1, e.hp);
    for (let k = 0; k < n; k++) {
      ctx.strokeStyle = k === 0 ? e.def.color : hexToRgba(e.def.color, 0.5);
      ctx.beginPath();
      drawDownTriangle(0, 0, Math.max(1, r - k * 3));
      ctx.stroke();
    }
  }
  ctx.restore();
  if (e.type === 'GIANTBOSS') drawBossHpBar(e);
}

function drawBossHpBar(e) {
  const barW = W / 2, barH = 5;
  const barX = W / 2 - barW / 2, barY = 60;
  const frac = Math.max(0, e.hp / e.maxHp);
  ctx.strokeStyle = 'rgba(255,46,90,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, barY, barW, barH);
  ctx.fillStyle = 'rgba(255,46,90,0.5)';
  ctx.fillRect(barX, barY, barW * frac, barH);
}

function drawBullets() {
  ctx.lineWidth = 1;
  playerBullets.forEach(b => {
    if (b.laser) {
      if (b.trail) {
        b.trail.forEach((p, idx) => {
          const alpha = ((idx + 1) / (b.trail.length + 1)) * 0.4;
          ctx.strokeStyle = `rgba(57,255,243,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p.x, p.y - b.length);
          ctx.stroke();
        });
      }
      ctx.strokeStyle = '#39fff3';
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x, b.y - b.length);
      ctx.stroke();
    } else {
      if (b.trail) {
        b.trail.forEach((p, idx) => {
          const alpha = ((idx + 1) / (b.trail.length + 1)) * 0.4;
          ctx.strokeStyle = `rgba(186,255,201,${alpha})`;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y - 6);
          ctx.lineTo(p.x, p.y + 6);
          ctx.stroke();
        });
      }
      ctx.strokeStyle = '#baffc9';
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - 6);
      ctx.lineTo(b.x, b.y + 6);
      ctx.stroke();
    }
  });
  ctx.lineWidth = 1;
  enemyBullets.forEach(b => {
    if (b.trail) {
      b.trail.forEach((p, idx) => {
        const alpha = ((idx + 1) / (b.trail.length + 1)) * 0.4;
        ctx.strokeStyle = `rgba(255,107,107,${alpha})`;
        ctx.strokeRect(p.x - 2, p.y - 2, 4, 4);
      });
    }
    ctx.strokeStyle = '#ff6b6b';
    ctx.strokeRect(b.x - 2, b.y - 2, 4, 4);
  });
}

function drawStarfield(dt) {
  const dir = starReverse ? -1 : 1;
  let speedFactor = starReverse ? 3 : 1;
  if (player.warping) {
    // ramp up alongside the player's accelerating warp speed
    speedFactor *= 1 + Math.min(1, player.warpT / 1.1) * 5;
  }
  starLayers.forEach(layer => {
    ctx.strokeStyle = layer.color;
    ctx.fillStyle = layer.color;
    ctx.lineWidth = 1;
    layer.stars.forEach(s => {
      const prevY = s.y;
      s.y += layer.speed * speedFactor * dt * dir;
      let wrapped = false;
      if (dir > 0 && s.y > H) { s.y = 0; s.x = rand(0, W); wrapped = true; }
      if (dir < 0 && s.y < 0) { s.y = H; s.x = rand(0, W); wrapped = true; }
      if (!wrapped) {
        ctx.beginPath();
        ctx.moveTo(s.x, prevY);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
      }
      ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    });
  });
}
let starLayers = [];
function initStars() {
  // 3 depth layers: back = slow + dim, front = fast + bright
  const defs = [
    { count: 26, speed: 40,  color: 'rgba(255,255,255,0.14)' }, // back
    { count: 22, speed: 90,  color: 'rgba(255,255,255,0.28)' }, // mid
    { count: 16, speed: 170, color: 'rgba(255,255,255,0.55)' }, // front
  ];
  starLayers = defs.map(d => ({
    speed: d.speed, color: d.color,
    stars: Array.from({ length: d.count }, () => ({
      x: rand(0, window.innerWidth), y: rand(0, window.innerHeight),
    })),
  }));
}

// occasional rotating 8x8 wireframe square drifting through the starfield (never during boss waves)
let specialStars = [];
let specialStarTimer = 4;
function updateSpecialStars(dt) {
  if (!starReverse) {
    specialStarTimer -= dt;
    if (specialStarTimer <= 0) {
      specialStars.push({
        x: rand(0, W), y: -10, speed: 90,
        angle: 0, spin: rand(1, 3) * (Math.random() < 0.5 ? -1 : 1),
      });
      specialStarTimer = rand(5, 11);
    }
  }
  for (let i = specialStars.length - 1; i >= 0; i--) {
    const s = specialStars[i];
    s.y += s.speed * dt;
    s.angle += s.spin * dt;
    if (s.y > H + 20) specialStars.splice(i, 1);
  }
}
function drawSpecialStars() {
  if (starReverse) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  specialStars.forEach(s => {
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.angle);
    ctx.strokeRect(-4, -4, 8, 8);
    ctx.restore();
  });
}

function drawHUD() {
  ctx.fillStyle = '#7CFFF0';
  ctx.font = '12px "Montserrat", sans-serif';
  ctx.textBaseline = 'top';

  // SCORE: centered
  ctx.textAlign = 'center';
  ctx.fillText('SCORE ' + score, W / 2, 10);

  // WAVE: left-aligned
  ctx.textAlign = 'left';
  ctx.fillText('WAVE ' + wave, 12, 10);

  // item status: right side
  ctx.textAlign = 'right';
  if (player.weapon !== 'NORMAL') ctx.fillText(player.weapon + ' Lv' + player.weaponLevel, W - 12, 28);
  if (player.rapidLevel > 0) ctx.fillText('RAPID Lv' + player.rapidLevel, W - 12, 40);
  ctx.textAlign = 'left';

  // LIVES: triangle icons only, right-aligned
  ctx.strokeStyle = '#7CFFF0'; ctx.lineWidth = 1;
  for (let i = 0; i < player.lives; i++) {
    const lx = W - 20 - i * 16, ly = 17;
    ctx.beginPath();
    ctx.moveTo(lx, ly - 6);
    ctx.lineTo(lx - 5, ly + 5);
    ctx.lineTo(lx + 5, ly + 5);
    ctx.closePath();
    ctx.stroke();
  }
}

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  ctx.clearRect(0, 0, W, H);
  drawStarfield(dt);
  updateSpecialStars(dt);
  drawSpecialStars();

  if (state === STATE.PLAYING) {
    updateSpawns(dt);
    updatePlayer(dt);
    updateEnemies(dt);
    updateBullets(dt);
    updateItems(dt);
    updatePickupTexts(dt);
    updateWaveAnnounce(dt);
    handleCollisions();
    checkWaveClear();
  }
  updateParticles(dt);
  updateShockwaves(dt);

  enemies.forEach(drawEnemy);
  drawBullets();
  drawItems();
  drawParticles();
  drawShockwaves();
  drawPlayer();
  drawPickupTexts();
  if (state === STATE.PLAYING) { drawHUD(); drawWaveAnnounce(); }

  requestAnimationFrame(frame);
}

resize();
initStars();
requestAnimationFrame(frame);

})();
</script>
