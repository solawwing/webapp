<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>DOT EDITOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --panel:#000000;
    --line:#000000;
    --neon:#39fff3;
    --neon-dim:#1b6f6a;
    --text:#dfe9ec;
    --sub:#7fa0a3;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:#000000; color:var(--text);
    font-family:'Roboto Mono', monospace; font-weight:400;
    -webkit-user-select:none; user-select:none; overscroll-behavior:none;
    min-height:100svh; height:100%;
  }
  .num{font-family:'Roboto Mono', monospace;}
  #app{
    max-width:520px; margin:0 auto; padding:10px 4px 32px;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:#000000;
  }
  h1{
    font-size:clamp(16px,4.5vw,20px); letter-spacing:4px; font-weight:700;
    color:var(--neon); margin:6px 0 0; text-shadow:0 0 10px rgba(57,255,243,.35);
  }
  .sub{font-size:11px; color:var(--sub); letter-spacing:1px; margin-top:-8px;}

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px; width:100%;
  }
  .panel.grid-panel{ padding:2px; }

  /* grid canvas */
  #gridWrap{ position:relative; width:100%; aspect-ratio:1/1; touch-action:none; }
  #checker, #gridCanvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
    image-rendering:pixelated; border-radius:4px;
  }
  #gridCanvas{ cursor:crosshair; }

  /* toolbar */
  .row{ display:flex; align-items:center; gap:10px; width:100%; flex-wrap:wrap; }
  .row.between{ justify-content:space-between; }
  label.small{ font-size:11px; color:var(--sub); letter-spacing:1px; }

  .swatches{ display:grid; grid-template-columns:repeat(5, 1fr); gap:8px; width:212px; }
  .swatch-wrap{ position:relative; }
  .swatch{
    width:100%; aspect-ratio:1/1; border-radius:4px; border:1px solid #ffffff;
    padding:0; cursor:pointer; display:block;
  }
  .swatch.active{ outline:2px solid var(--neon); outline-offset:2px; }
  .swatch.erase{
    background:
      linear-gradient(45deg,#333 25%,transparent 25%,transparent 75%,#333 75%,#333),
      linear-gradient(45deg,#333 25%,transparent 25%,transparent 75%,#333 75%,#333);
    background-size:8px 8px; background-position:0 0,4px 4px; background-color:#111;
    display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--sub);
  }
  .swatch-color-input{
    position:absolute; top:0; left:0; width:100%; height:100%;
    opacity:0; pointer-events:none; border:none; padding:0;
  }
  .hint{ font-size:10px; color:var(--sub); letter-spacing:1px; }
  input[type=color]{
    width:34px; height:26px; border:1px solid var(--line); border-radius:4px;
    background:none; padding:0; cursor:pointer;
  }

  button{
    font-family:'Roboto Mono', monospace; font-size:12px; letter-spacing:1px;
    background:var(--bg); color:var(--text); border:1px solid #555;
    border-radius:6px; padding:9px 12px; cursor:pointer;
  }
  button.accent{ color:var(--neon); border-color:var(--neon-dim); }
  button:active{ opacity:.6; }

  #previewWrap{
    position:relative; width:120px; height:120px; margin:0 auto;
    border-radius:4px; overflow:hidden; border:1px solid var(--line);
  }
  #previewCheck, #previewCanvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
    image-rendering:pixelated;
  }

  /* ascii modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,6,9,.82);
    display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal-overlay[hidden]{ display:none; }
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:100%; max-width:460px; max-height:86vh; display:flex; flex-direction:column;
    overflow:hidden;
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border-bottom:1px solid var(--line);
    font-size:12px; letter-spacing:3px; color:var(--neon);
  }
  .modal-header button{ padding:4px 9px; }
  .modal-body{ padding:14px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
  #asciiGrid{
    font-size:9px; line-height:1.35; color:var(--text); background:#0d1218;
    border:1px solid var(--line); border-radius:6px; padding:8px;
    white-space:pre; overflow-x:auto; margin:0;
  }
  .legend-row{ display:flex; align-items:center; gap:8px; font-size:12px; }
  .legend-swatch{
    width:16px; height:16px; border-radius:3px; border:1px solid var(--line); flex:none;
  }
  .legend-idx{ width:18px; color:var(--sub); }
  .hexInput{
    background:#0d1218; color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:8px 10px; font-size:13px; letter-spacing:1px; width:110px;
    text-transform:lowercase;
  }
  .hexInput:focus{ outline:none; border-color:var(--neon-dim); }
  .colorBox, .colorBar{
    display:block; width:100%; border-radius:6px; border:1px solid var(--line);
    touch-action:none; cursor:crosshair;
  }
  .colorBox{ height:150px; }
  .colorBar{ height:20px; }
  .presetGrid{
    display:grid; grid-template-columns:repeat(10, 1fr); gap:5px;
    max-height:120px; overflow-y:auto; padding:8px;
    border:1px solid var(--line); border-radius:6px; background:#0d1218;
  }
  .presetGrid button{
    width:100%; aspect-ratio:1/1; border-radius:3px; border:1px solid rgba(255,255,255,.08);
    padding:0; cursor:pointer;
  }
</style>
</head>
<body style="background:#000000;">
<div id="app">

  <div style="width:100%; align-self:flex-start; font-family:'Roboto Mono', monospace; font-size:12px; letter-spacing:1px; color:var(--text); padding:0 2px;">exclusive DOT editor</div>

  <div class="panel grid-panel">
    <div id="gridWrap">
      <canvas id="checker"></canvas>
      <canvas id="gridCanvas"></canvas>
    </div>
  </div>

  <div class="row" style="align-items:flex-start; gap:2px;">
    <div class="panel" style="width:auto; flex:none;">
      <div id="previewWrap">
        <canvas id="previewCheck"></canvas>
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>

    <div class="panel" style="flex:1; min-width:0;">
      <div class="row" style="margin-bottom:2px;">
        <div class="swatches" id="swatches"></div>
        <button id="palletBtn">PALLET</button>
      </div>
    </div>
  </div>

  <div class="panel" style="padding-left:2px; padding-right:2px;">
    <div class="row between" style="gap:2px;">
      <button id="clearBtn" style="flex:1;">ALL CLEAR</button>
      <button id="gridToggleBtn" style="flex:1;">GRID ON/OFF</button>
      <button id="asciiBtn" style="flex:1;">SHOW ASCII</button>
    </div>
    <div class="row" style="margin-top:2px; gap:2px;">
      <button id="shiftLeftBtn" style="flex:1;">◀</button>
      <button id="shiftRightBtn" style="flex:1;">▶</button>
      <button id="shiftUpBtn" style="flex:1;">▲</button>
      <button id="shiftDownBtn" style="flex:1;">▼</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="asciiModal" hidden>
  <div class="modal">
    <div class="modal-header">
      <span>ASCII DATA</span>
      <button id="asciiClose">✕</button>
    </div>
    <div class="modal-body">
      <pre id="asciiGrid" class="num"></pre>
      <div id="asciiLegend"></div>
      <button class="accent" id="asciiCopyBtn">COPY</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal" hidden>
  <div class="modal" style="max-width:320px;">
    <div class="modal-body" style="gap:16px;">
      <div id="confirmMsg" style="font-size:13px; text-align:center;"></div>
      <div class="row" style="justify-content:center; gap:12px;">
        <button id="confirmNo">CANCEL</button>
        <button class="accent" id="confirmYes">CLEAR</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="colorEditModal" hidden>
  <div class="modal" style="max-width:320px;">
    <div class="modal-header">
      <span>COLOR <span id="colorEditSlotNum" class="num"></span></span>
      <button id="colorEditClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="row" style="justify-content:center;">
        <span class="legend-swatch" id="colorEditPreview" style="width:40px; height:40px;"></span>
        <input type="text" id="colorEditHex" class="num hexInput" maxlength="7" placeholder="#rrggbb">
      </div>
      <canvas id="slBox" width="260" height="150" class="colorBox"></canvas>
      <canvas id="hueBar" width="260" height="20" class="colorBar"></canvas>
      <div class="hint" style="text-align:center;">PRESETS</div>
      <div class="presetGrid" id="colorEditPresets"></div>
      <div class="row" style="justify-content:center; gap:12px;">
        <button id="colorEditCancel">CANCEL</button>
        <button class="accent" id="colorEditApply">APPLY</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const SIZE = 24;
  const grid = new Array(SIZE*SIZE).fill(null); // null = transparent, 0-7 = palette slot index

  const gridCanvas = document.getElementById('gridCanvas');
  const checker = document.getElementById('checker');
  const gctx = gridCanvas.getContext('2d');
  const cctx = checker.getContext('2d');

  const previewCanvas = document.getElementById('previewCanvas');
  const previewCheck = document.getElementById('previewCheck');
  const pctx = previewCanvas.getContext('2d');
  const pcctx = previewCheck.getContext('2d');

  let showGrid = true;
  let currentSlot = 1;
  let paletteColors = ['#000000','#ffffff','#41a3fd','#9cff00','#ff1a17','#ff901a','#fed796','#976e16','#000000','#000000'];

  function resizeCanvas(canvas, ctx, cssSizePx){
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cssSizePx * dpr;
    canvas.height = cssSizePx * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function layout(){
    const wrapRect = document.getElementById('gridWrap').getBoundingClientRect();
    const size = Math.round(wrapRect.width);
    resizeCanvas(gridCanvas, gctx, size);
    resizeCanvas(checker, cctx, size);
    drawChecker(cctx, size, SIZE);
    drawGrid();

    resizeCanvas(previewCanvas, pctx, 120);
    resizeCanvas(previewCheck, pcctx, 120);
    drawChecker(pcctx, 120, 8);
    drawPreview();
  }

  function drawChecker(ctx, sizePx, tiles){
    const cell = sizePx / tiles;
    for(let y=0;y<tiles;y++){
      for(let x=0;x<tiles;x++){
        ctx.fillStyle = ((x+y)%2===0) ? '#3a3a3a' : '#242424';
        ctx.fillRect(x*cell, y*cell, cell, cell);
      }
    }
  }

  function drawGrid(){
    const size = gridCanvas.getBoundingClientRect().width;
    const cell = size / SIZE;
    gctx.clearRect(0,0,size,size);
    for(let y=0;y<SIZE;y++){
      for(let x=0;x<SIZE;x++){
        const c = grid[y*SIZE+x];
        if(c !== null){
          gctx.fillStyle = paletteColors[c];
          gctx.fillRect(x*cell, y*cell, cell+0.5, cell+0.5);
        }
      }
    }
    if(showGrid){
      const mid = SIZE/2;
      for(let i=0;i<=SIZE;i++){
        const isMid = (i === mid);
        gctx.strokeStyle = isMid ? 'rgba(57,255,243,0.55)' : 'rgba(57,255,243,0.12)';
        gctx.lineWidth = isMid ? 1.5 : 1;
        const p = Math.round(i*cell)+0.5;
        gctx.beginPath(); gctx.moveTo(p,0); gctx.lineTo(p,size); gctx.stroke();
        gctx.beginPath(); gctx.moveTo(0,p); gctx.lineTo(size,p); gctx.stroke();
      }
    }
  }

  function drawPreview(){
    const size = 120;
    const cell = size / SIZE;
    pctx.clearRect(0,0,size,size);
    for(let y=0;y<SIZE;y++){
      for(let x=0;x<SIZE;x++){
        const c = grid[y*SIZE+x];
        if(c !== null){
          pctx.fillStyle = paletteColors[c];
          pctx.fillRect(x*cell, y*cell, cell+0.5, cell+0.5);
        }
      }
    }
  }

  function render(){ drawGrid(); drawPreview(); }

  // --- input handling: tap a black cell to paint, tap a colored cell to erase it ---
  let pointerDown = false;
  let dragColorApplied = -1; // last idx touched during this drag

  function cellFromEvent(e){
    const rect = gridCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cell = rect.width / SIZE;
    const cx = Math.floor(x/cell);
    const cy = Math.floor(y/cell);
    if(cx<0||cy<0||cx>=SIZE||cy>=SIZE) return -1;
    return cy*SIZE+cx;
  }

  function paintCell(idx){
    if(idx<0) return;
    grid[idx] = (grid[idx] !== null) ? null : currentSlot;
  }

  gridCanvas.addEventListener('pointerdown', (e)=>{
    gridCanvas.setPointerCapture(e.pointerId);
    const idx = cellFromEvent(e);
    if(idx<0) return;
    pointerDown = true;
    paintCell(idx);
    dragColorApplied = idx;
    render();
  });

  gridCanvas.addEventListener('pointermove', (e)=>{
    if(!pointerDown) return;
    const idx = cellFromEvent(e);
    if(idx<0 || idx===dragColorApplied) return;
    paintCell(idx);
    dragColorApplied = idx;
    render();
  });

  window.addEventListener('pointerup', ()=>{ pointerDown = false; });
  window.addEventListener('pointercancel', ()=>{ pointerDown = false; });

  // --- palette: 8 fixed slots (0=black, 1-7 customizable), each independently recolorable ---
  const swatchWrap = document.getElementById('swatches');
  const swatchButtons = [];
  function buildSwatches(){
    swatchWrap.innerHTML = '';
    swatchButtons.length = 0;
    paletteColors.forEach((color, slot)=>{
      const btn = document.createElement('button');
      btn.className = 'swatch' + (slot===currentSlot ? ' active' : '');
      btn.style.background = color;

      btn.addEventListener('click', ()=>{
        currentSlot = slot;
        updateSwatchActiveStates();
        updatePalletBtnState();
      });

      swatchWrap.appendChild(btn);
      swatchButtons.push(btn);
    });
  }
  function updateSwatchActiveStates(){
    swatchButtons.forEach((btn, slot)=>{
      btn.classList.toggle('active', slot===currentSlot);
    });
  }
  function updatePalletBtnState(){
    const btn = document.getElementById('palletBtn');
    btn.disabled = (currentSlot === 0);
    btn.style.opacity = (currentSlot === 0) ? '0.35' : '1';
  }
  buildSwatches();
  updatePalletBtnState();

  document.getElementById('palletBtn').addEventListener('click', ()=>{
    if(currentSlot === 0) return; // color 0 (black) is fixed and not editable
    openColorEditModal(currentSlot);
  });

  // --- color edit modal (replaces native <input type=color> which doesn't open in some embedded views) ---
  const colorEditModal = document.getElementById('colorEditModal');
  const colorEditHex = document.getElementById('colorEditHex');
  const colorEditPreview = document.getElementById('colorEditPreview');
  const colorEditSlotNum = document.getElementById('colorEditSlotNum');
  const colorEditPresets = document.getElementById('colorEditPresets');
  const slBox = document.getElementById('slBox');
  const hueBar = document.getElementById('hueBar');
  const slCtx = slBox.getContext('2d');
  const hueCtx = hueBar.getContext('2d');
  let editingSlot = 0;
  let currentHue = 0;

  function hslToHex(h, s, l){
    s/=100; l/=100;
    const k = n => (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const f = n => l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n), 1)));
    const toHex = x => Math.round(255*x).toString(16).padStart(2,'0');
    return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
  }

  function hexToHsl(hex){
    const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
    const max = Math.max(r,g,b), min = Math.min(r,g,b);
    let h = 0;
    const l = (max+min)/2;
    const d = max-min;
    if(d !== 0){
      switch(max){
        case r: h = ((g-b)/d) % 6; break;
        case g: h = (b-r)/d + 2; break;
        default: h = (r-g)/d + 4;
      }
      h *= 60;
      if(h < 0) h += 360;
    }
    return h;
  }

  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  }

  function drawHueBar(){
    const w = hueBar.width, h = hueBar.height;
    const grad = hueCtx.createLinearGradient(0,0,w,0);
    for(let i=0;i<=6;i++) grad.addColorStop(i/6, hslToHex(i*60,100,50));
    hueCtx.fillStyle = grad;
    hueCtx.fillRect(0,0,w,h);
  }
  drawHueBar();

  function buildPresetColors(){
    const colors = [];
    for(let i=0;i<10;i++) colors.push(hslToHex(0,0, Math.round(i * 100/9)));
    const lightnessLevels = [80,65,50,35,20];
    for(const l of lightnessLevels){
      for(let h=0; h<360; h+=18) colors.push(hslToHex(h,85,l));
    }
    return colors;
  }

  function buildColorEditPresets(){
    colorEditPresets.innerHTML = '';
    buildPresetColors().forEach(c=>{
      const p = document.createElement('button');
      p.style.background = c;
      p.addEventListener('click', ()=>{
        setColorFromHex(c);
        currentHue = hexToHsl(c);
        drawSLBox(currentHue);
      });
      colorEditPresets.appendChild(p);
    });
  }
  buildColorEditPresets();

  function drawSLBox(hue){
    const w = slBox.width, h = slBox.height;
    slCtx.fillStyle = hslToHex(hue,100,50);
    slCtx.fillRect(0,0,w,h);
    const whiteGrad = slCtx.createLinearGradient(0,0,w,0);
    whiteGrad.addColorStop(0,'#fff'); whiteGrad.addColorStop(1,'rgba(255,255,255,0)');
    slCtx.fillStyle = whiteGrad; slCtx.fillRect(0,0,w,h);
    const blackGrad = slCtx.createLinearGradient(0,0,0,h);
    blackGrad.addColorStop(0,'rgba(0,0,0,0)'); blackGrad.addColorStop(1,'#000');
    slCtx.fillStyle = blackGrad; slCtx.fillRect(0,0,w,h);
  }

  function setColorFromHex(hex){
    colorEditHex.value = hex;
    colorEditPreview.style.background = hex;
  }

  function pickFromSLBox(clientX, clientY){
    const rect = slBox.getBoundingClientRect();
    const x = Math.max(0, Math.min(slBox.width-1, Math.round((clientX-rect.left) * (slBox.width/rect.width))));
    const y = Math.max(0, Math.min(slBox.height-1, Math.round((clientY-rect.top) * (slBox.height/rect.height))));
    const data = slCtx.getImageData(x,y,1,1).data;
    setColorFromHex(rgbToHex(data[0],data[1],data[2]));
  }

  function pickHue(clientX){
    const rect = hueBar.getBoundingClientRect();
    const frac = Math.max(0, Math.min(1, (clientX-rect.left)/rect.width));
    currentHue = frac*360;
    drawSLBox(currentHue);
  }

  let slDown = false, hueDown = false;
  slBox.addEventListener('pointerdown', e=>{
    slDown = true; slBox.setPointerCapture(e.pointerId); pickFromSLBox(e.clientX, e.clientY);
  });
  slBox.addEventListener('pointermove', e=>{ if(slDown) pickFromSLBox(e.clientX, e.clientY); });
  hueBar.addEventListener('pointerdown', e=>{
    hueDown = true; hueBar.setPointerCapture(e.pointerId); pickHue(e.clientX);
  });
  hueBar.addEventListener('pointermove', e=>{ if(hueDown) pickHue(e.clientX); });
  window.addEventListener('pointerup', ()=>{ slDown = false; hueDown = false; });

  function openColorEditModal(slot){
    editingSlot = slot;
    const hex = paletteColors[slot];
    colorEditSlotNum.textContent = slot;
    currentHue = hexToHsl(hex);
    drawSLBox(currentHue);
    colorEditHex.style.borderColor = '';
    setColorFromHex(hex);
    colorEditModal.hidden = false;
  }

  colorEditHex.addEventListener('input', ()=>{
    let v = colorEditHex.value.trim();
    if(v && v[0] !== '#') v = '#' + v;
    if(isValidHex(v)) colorEditPreview.style.background = v;
  });

  document.getElementById('colorEditApply').addEventListener('click', ()=>{
    let v = colorEditHex.value.trim();
    if(v && v[0] !== '#') v = '#' + v;
    if(!isValidHex(v)){
      colorEditHex.style.borderColor = '#ff1744';
      return;
    }
    paletteColors[editingSlot] = v.toLowerCase();
    swatchButtons[editingSlot].style.background = v;
    render();
    colorEditModal.hidden = true;
  });
  document.getElementById('colorEditCancel').addEventListener('click', ()=>{
    colorEditModal.hidden = true;
  });
  document.getElementById('colorEditClose').addEventListener('click', ()=>{
    colorEditModal.hidden = true;
  });
  colorEditModal.addEventListener('click', (e)=>{
    if(e.target === colorEditModal) colorEditModal.hidden = true;
  });

  const confirmModal = document.getElementById('confirmModal');
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    document.getElementById('confirmMsg').textContent = 'Clear everything?';
    confirmModal.hidden = false;
  });
  document.getElementById('confirmNo').addEventListener('click', ()=>{
    confirmModal.hidden = true;
  });
  document.getElementById('confirmYes').addEventListener('click', ()=>{
    for(let i=0;i<grid.length;i++) grid[i]=null;
    render();
    confirmModal.hidden = true;
  });
  confirmModal.addEventListener('click', (e)=>{
    if(e.target === confirmModal) confirmModal.hidden = true;
  });

  document.getElementById('gridToggleBtn').addEventListener('click', ()=>{
    showGrid = !showGrid;
    drawGrid();
  });

  function shiftGrid(dx, dy){
    const next = new Array(SIZE*SIZE).fill(null);
    for(let y=0;y<SIZE;y++){
      for(let x=0;x<SIZE;x++){
        let nx = x + dx;
        if(nx < 0) nx = SIZE - 1;
        if(nx >= SIZE) nx = 0;
        let ny = y + dy;
        if(ny < 0) ny = SIZE - 1;
        if(ny >= SIZE) ny = 0;
        next[ny*SIZE + nx] = grid[y*SIZE + x];
      }
    }
    for(let i=0;i<grid.length;i++) grid[i] = next[i];
    render();
  }

  document.getElementById('shiftLeftBtn').addEventListener('click', ()=> shiftGrid(-1, 0));
  document.getElementById('shiftRightBtn').addEventListener('click', ()=> shiftGrid(1, 0));
  document.getElementById('shiftUpBtn').addEventListener('click', ()=> shiftGrid(0, -1));
  document.getElementById('shiftDownBtn').addEventListener('click', ()=> shiftGrid(0, 1));

  // --- ascii (numeric) export ---
  const asciiModal = document.getElementById('asciiModal');

  function buildAsciiData(){
    const legend = [{ idx:'_', label:'transparent' }];
    paletteColors.forEach((hex, slot)=> legend.push({ idx:slot, hex: hex.toLowerCase() }));
    const rows = [];
    for(let y=0;y<SIZE;y++){
      const rowVals = [];
      for(let x=0;x<SIZE;x++){
        const c = grid[y*SIZE+x];
        rowVals.push(c === null ? '_' : c);
      }
      rows.push(rowVals.join(','));
    }
    return { text: rows.join('\n'), legend };
  }

  function renderAscii(){
    const { text, legend } = buildAsciiData();
    document.getElementById('asciiGrid').textContent = text;
    const legendEl = document.getElementById('asciiLegend');
    legendEl.innerHTML = '';
    legend.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'legend-row';
      const swatchStyle = item.hex ? ('background:'+item.hex) :
        'background:linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%,#3a3a3a),linear-gradient(45deg,#3a3a3a 25%,transparent 25%,transparent 75%,#3a3a3a 75%,#3a3a3a); background-size:6px 6px; background-position:0 0,3px 3px; background-color:#242424;';
      row.innerHTML =
        '<span class="legend-swatch" style="'+swatchStyle+'"></span>' +
        '<span class="num legend-idx">'+item.idx+'</span>' +
        '<span class="num">'+(item.hex || item.label)+'</span>';
      legendEl.appendChild(row);
    });
  }

  document.getElementById('asciiBtn').addEventListener('click', ()=>{
    renderAscii();
    asciiModal.hidden = false;
  });
  document.getElementById('asciiClose').addEventListener('click', ()=>{
    asciiModal.hidden = true;
  });
  asciiModal.addEventListener('click', (e)=>{
    if(e.target === asciiModal) asciiModal.hidden = true;
  });
  function isValidHex(v){ return /^#[0-9a-f]{6}$/i.test(v); }

  document.getElementById('asciiCopyBtn').addEventListener('click', ()=>{
    const { text, legend } = buildAsciiData();
    const legendText = legend.map(l=> l.idx+': '+(l.hex || l.label)).join('\n');
    const full = text + '\n\n' + legendText;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(full).catch(()=>{});
    }
  });

  window.addEventListener('resize', layout);
  layout();
})();
</script>
</body>
</html>
