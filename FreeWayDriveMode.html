<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FREEWAY DRIVE MODE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:"Orbitron",sans-serif;font-weight:400}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.btn{position:fixed;display:flex;align-items:center;justify-content:center;box-sizing:border-box;touch-action:none;color:#3fe;border:1.5px solid #3fe;background:rgba(0,255,220,.06);letter-spacing:.08em}
#brake{right:calc(18px + env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;color:#f55;border-color:#f55;background:rgba(255,60,60,.10);font-size:15px}
#brake.on{background:rgba(255,60,60,.55);color:#fff}
#view{right:calc(14px + env(safe-area-inset-right));top:calc(84px + env(safe-area-inset-top));padding:5px 10px;font-size:11px;border-radius:14px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="brake" class="btn">BRAKE</div>
<div id="view" class="btn">VIEW LOW</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Orbitron",sans-serif';
const BG='#000';
let W=0,H=0,DPR=1,F=300,CX=0,CY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W*0.85,H*1.15);CX=W/2;CY=H*0.45;
}
addEventListener('resize',resize);resize();

const DS=4,NEAR=0.5,NSEG=84;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);};

/* ================= TRACK ================= */
let trk=[],G,SC,TH='';
let CUR=null,FK=null,nextFork=1;
const newG=()=>({h:0,x:0,y:0,z:0,k:0,sl:0,tk:0,tsl:0,left:0,type:'str'});
const newSC=()=>({type:'none',left:40,c:0,side:-1,cs:1});
function useR(R){CUR=R;trk=R.trk;G=R.G;SC=R.SC;TH=R.th;}
function inR(R,fn){const o=CUR;useR(R);try{return fn();}finally{useR(o);}}
let FP={},courseChg=[],chgIdx=0;
function planFor(n){
  if(!FP[n]){const T=['S','C','M','U'],a=T[Math.random()*4|0],o=T.filter(x=>x!==a);FP[n]={a,b:o[Math.random()*3|0]};}
  return FP[n];
}
function initWorld(){useR({trk:[],G:newG(),SC:newSC(),th:'S'});FK=null;nextFork=1;FP={};courseChg=[];chgIdx=0;}
/* 3kmごとに道が二手に分かれる（左=COAST / 右=MOUNTAIN） */
const FK_IDX=750;
const noRail=i=>false;
const quiet=i=>false;
initWorld();
const RNAME={S:'STANDARD',C:'COAST',M:'MOUNTAIN',U:'UPDOWN',F:'FOREST',B:'BAY BRIDGE'};
const SLM={S:1,C:0.6,M:1,U:2.5,F:1,B:1};
function pickSeg(){
  pickSeg0();G.tsl*=SLM[TH]||1;
  if(TH==='M'&&G.tsl!==0&&G.type!=='fork'){
    const up=G.y>110?false:G.y<-15?true:Math.random()<0.8;
    G.tsl=Math.abs(G.tsl)*(up?1:-1);
  }
}
function pickSeg0(){
  const prev=G.type;let r=Math.random();
  if(TH==='C')r=0.2+r*0.8;
  if(trk.length<30){G.type='str';G.left=30;G.tk=0;G.tsl=0;return;}
  if(TH==='B'){
    const ix=trk.length,rem=125-(ix%125),br=Math.floor(ix/125)%2===0;
    G.type=br?'bri':'cur';G.left=Math.min(rem,br?50+(Math.random()*40|0):40+(Math.random()*30|0));G.tk=rnd(-1,1)*0.0012;
    G.tsl=(G.y>40?-1:G.y<0?1:(Math.random()<.5?-1:1))*rnd(0.005,0.025);return;
  }
  if(G.ph===1){G.ph=2;G.type='fork';G.left=34;G.tk=G.fside*0.0016;G.tsl=0;return;}
  G.ph=0;
  if(quiet(trk.length)||quiet(trk.length+60)){G.type='cur';G.left=20;G.tk=rnd(-1,1)*0.0015;G.tsl=0;return;}
  if(Math.random()<(TH==='U'?0.25:0.12)&&prev!=='steep'&&prev!=='tun'&&prev!=='bri'){
    G.type='steep';G.left=24+(Math.random()*14|0);
    const sg=G.y>90?-1:G.y<-15?1:(Math.random()<.5?-1:1);
    G.tsl=sg*rnd(0.22,0.3);G.tk=rnd(-1,1)*0.002;
  }
  else if(r<0.13&&prev!=='tun'){G.type='tun';G.left=40+(Math.random()*40|0);G.tk=rnd(-1,1)*0.0025;G.tsl=0;}
  else if(r<0.26&&prev!=='bri'){G.type='bri';G.left=32+(Math.random()*30|0);G.tk=rnd(-1,1)*0.003;G.tsl=0;}
  else if(r<0.56){G.type='cur';G.left=25+(Math.random()*35|0);G.tk=(Math.random()<.5?-1:1)/rnd(110,380);G.tsl=rnd(-0.05,0.05);}
  else if(r<0.82){
    G.type='hill';G.left=36+(Math.random()*40|0);
    const sg=G.y>90?-1:G.y<-15?1:(Math.random()<.5?-1:1);
    G.tsl=sg*rnd(0.09,0.17);G.tk=rnd(-1,1)*0.002;
  }else{G.type='str';G.left=15+(Math.random()*30|0);G.tk=0;G.tsl=rnd(-0.04,0.04);}
}
function sceneStep(){
  if(quiet(trk.length)||TH==='F'||TH==='B'){SC.type='none';SC.left=Math.max(SC.left,5);}
  if(SC.left<=0){
    const q0=Math.random(),q=TH==='C'?(q0<0.06?0.1:q0<0.97?0.7:0.9):TH==='M'?(q0<0.06?0.1:q0<0.1?0.7:0.9):q0;
    if(q<0.6){SC.type='none';SC.left=40+(Math.random()*80|0);}
    else if(q<0.8){SC.type='sea';SC.side=Math.random()<.5?-1:1;SC.left=50+(Math.random()*60|0);}
    else{SC.type='cliff';SC.cs=TH==='M'&&Math.random()<0.65?0:(Math.random()<.5?-1:1);SC.left=40+(Math.random()*60|0);}
  }
  SC.left--;
  SC.c+=((SC.type==='cliff'?1:0)-SC.c)*0.12;
}
function genNext(){
  if(quiet(trk.length+25)&&(G.type==='tun'||G.type==='bri'||G.type==='steep'))G.left=0;
  if(G.left<=0)pickSeg();
  G.left--;
  G.k+=(G.tk-G.k)*0.12;G.sl+=(G.tsl-G.sl)*0.1;
  sceneStep();
  trk.push({x:G.x,y:G.y,z:G.z,h:G.h,k:G.k,sl:G.sl,tn:G.type==='tun',br:G.type==='bri',sea:SC.type==='sea'?SC.side:0,cl:SC.c,cs:SC.cs,th:TH});
  G.x+=Math.sin(G.h)*DS;G.z+=Math.cos(G.h)*DS;G.y+=G.sl*DS;G.h+=G.k*DS;
  if(G.shl>0){G.shl--;G.x-=Math.cos(G.h)*1.5;G.z+=Math.sin(G.h)*1.5;}
  if(trk.length-1===nextFork*FK_IDX){
    nextFork++;
    const T=['S','C','M','U','F','B'].filter(x=>x!==CUR.th);
    CUR.th=T[Math.random()*5|0];TH=CUR.th;SC.left=0;
    courseChg.push({s:(trk.length-1)*DS,th:CUR.th});
  }
}
function makeFork(){
  const A=CUR,B={trk:A.trk.slice(),G:Object.assign({},A.G),SC:Object.assign({},A.SC),th:'C'};
  const pl=planFor(nextFork);B.th=pl.b;A.th=pl.a;TH=A.th;
  for(const[R,sd,m,m2]of[[A,1,0.15,0.25],[B,-1,1.4,1]]){const g=R.G;g.type='fork';g.left=14;g.tk=sd*0.0034*m;g.tsl=0;g.ph=1;g.fside=sd*m2;}
  FK={A,B,iF:trk.length-1,F:(trk.length-1)*DS,dec:false,dB:0,other:null};
}
function ensure(i){while(trk.length<=i+2)genNext();}
function trkAt(s){
  if(s<0)s=0;
  const f=s/DS,i=Math.floor(f),t=f-i;ensure(i+2);
  const a=trk[i],b=trk[i+1];
  return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t,h:a.h+(b.h-a.h)*t,k:a.k,sl:a.sl+(b.sl-a.sl)*t,tn:a.tn,br:a.br};
}
/* 路面上の位置と向き */
function basis(s,l,dir,yaw){
  const a=trkAt(s),ch=Math.cos(a.h),sh=Math.sin(a.h);
  const ph=Math.atan(a.sl),cp=Math.cos(ph),sp=Math.sin(ph);
  const tf=[sh*cp,sp,ch*cp],tr=[ch,0,-sh];
  const up=[tf[1]*tr[2]-tf[2]*tr[1],tf[2]*tr[0]-tf[0]*tr[2],tf[0]*tr[1]-tf[1]*tr[0]];
  const pos=[a.x+tr[0]*l,a.y,a.z+tr[2]*l];
  let f=tf,r=tr;
  if(dir<0){f=[-tf[0],-tf[1],-tf[2]];r=[-tr[0],0,-tr[2]];}
  if(yaw){
    const cy=Math.cos(yaw),sy=Math.sin(yaw);
    const f2=[f[0]*cy+r[0]*sy,f[1]*cy+r[1]*sy,f[2]*cy+r[2]*sy];
    const r2=[r[0]*cy-f[0]*sy,r[1]*cy-f[1]*sy,r[2]*cy-f[2]*sy];
    f=f2;r=r2;
  }
  return{pos,r,u:up,f};
}

/* ================= STATE ================= */
const LANES=[-6.3,-2.1,2.1,6.3];
const ACC=[8.5,6.8,5.4,4.5,4.0,3.8,3.6];
const GMAX=[14,25,36,46,56,64,72];
const P={s:40,l:-6.3,lv:0,v:0,gear:1,rpm:0.15,thr:0,brk:false,steer:0,camL:-6.3,pass:0,crash:0,inv:0,shake:0,flash:0,msg:'',msgT:0};
let cars=[];
let state='title';
let tAcc=0,overT=0;

const COLS=['#f6f','#fa3','#9f6','#6af','#f66','#ff6','#c9f'];
let spawnCount=0;
function spawn(minD,maxD){
  let same=Math.random()<0.6;
  if(same&&P.s+maxD<1000)same=false;
  let s=P.s+(same?rnd(minD,maxD):rnd(minD+120,maxD+60));
  if(same&&s<1000){same=false;s=P.s+rnd(minD+120,maxD+60);}
  const lane=same?(Math.random()<.5?0:1):(Math.random()<.5?2:3);
  for(const c of cars)if(c.lane===lane&&Math.abs(c.s-s)<60)return;
  const trl=(spawnCount+1)%10===0;
  spawnCount++;
  cars.push({s,l:LANES[lane],lane,dir:same?1:-1,sp:trl?(same?rnd(9.6,15.2):rnd(14.4,21.6)):(same?rnd(14,30):rnd(20,34)),col:COLS[(Math.random()*COLS.length)|0],pd:null,ahead:true,kind:trl?'trl':'car',hl:trl?6.6:2.1});
}
function initTraffic(){cars=[];for(let i=0;i<8;i++)spawn(90,520);}
initTraffic();

/* ================= INPUT ================= */
const inp={id:null,ox:0,oy:0,x:0,y:0,active:false,brake:false,bid:null};
const keys={};
const R_STICK=70;
function stickSteer(){const dx=inp.x-inp.ox;return Math.abs(dx)<6?0:clamp(dx/48,-1,1);}
function stickThr(){return clamp((inp.oy-inp.y-8)/46,0,1);}
function resetGame(){
  Object.assign(P,{s:40,l:-6.3,lv:0,v:0,gear:1,rpm:0.15,thr:0,brk:false,steer:0,camL:-6.3,pass:0,crash:0,inv:0,shake:0,flash:0,msg:'',msgT:0});
  initWorld();initTraffic();WK=null;state='run';overT=0;
}
function startGame(){
  if(state!=='title')return;
  state='run';
}
let paused=false,lastTap=0,lastTapX=0,lastTapY=0,evMode=false,titleTapT=0,startTimer=null;
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('.btn'))return;
  e.preventDefault();
  if(state==='title'){
    const tn=performance.now();
    if(startTimer&&tn-titleTapT<320){clearTimeout(startTimer);startTimer=null;evMode=true;startGame();}
    else{titleTapT=tn;startTimer=setTimeout(()=>{startTimer=null;evMode=false;startGame();},300);}
    return;
  }
  else if(state==='over'){if(overT>0.8)resetGame();return;}
  if(paused){paused=false;return;}
  if(inp.id!==null)return;
  inp.id=e.pointerId;inp.ox=inp.x=e.clientX;inp.oy=inp.y=e.clientY;inp.active=true;
},{passive:false});
addEventListener('pointermove',e=>{
  if(e.pointerId!==inp.id)return;
  inp.x=e.clientX;inp.y=e.clientY;
  const dx=inp.x-inp.ox,dy=inp.y-inp.oy,d=Math.hypot(dx,dy);
  if(d>R_STICK){inp.ox+=dx/d*(d-R_STICK);inp.oy+=dy/d*(d-R_STICK);}
});
function endPtr(e){if(e.pointerId===inp.id){inp.id=null;inp.active=false;}}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
const brakeEl=document.getElementById('brake');
brakeEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();inp.brake=true;inp.bid=e.pointerId;brakeEl.classList.add('on');if(state==='title'){if(startTimer){clearTimeout(startTimer);startTimer=null;}evMode=false;startGame();}});
function brakeUp(e){if(e.pointerId===inp.bid){inp.brake=false;inp.bid=null;brakeEl.classList.remove('on');}}
addEventListener('pointerup',brakeUp);addEventListener('pointercancel',brakeUp);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyP'&&state!=='title'&&state!=='over')paused=!paused;if(state==='title'&&e.code==='KeyE'){evMode=true;startGame();}else if(state==='title'&&(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp')){evMode=false;startGame();}else if(state==='over'&&overT>0.8&&(e.code==='Space'||e.code==='Enter'))resetGame();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});

const CAMH=[2,4,6],CAMN=['LOW','MIDDLE','TOP'],CAMSEQ=[0,1,2,1];let camP=0,camI=0;
const viewEl=document.getElementById('view');
viewEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();camP=(camP+1)%CAMSEQ.length;camI=CAMSEQ[camP];viewEl.textContent='VIEW '+CAMN[camI];});

/* ================= UPDATE ================= */
function update(dt){
  let steer=inp.active?stickSteer():0,thr=1,brk=inp.brake;
  if(keys.ArrowLeft||keys.KeyA)steer-=1;
  if(keys.ArrowRight||keys.KeyD)steer+=1;
    if(keys.ArrowDown||keys.KeyS||keys.Space)brk=true;
  steer=clamp(steer,-1,1);
  if(brk)thr=0;
  P.thr=thr;P.brk=brk;P.steer=steer;
  const tr=trkAt(P.s);
  /* 縦方向 */
  let a=evMode?thr*9*(1-P.v/110):thr*ACC[P.gear-1];
  a-=0.0006*P.v*P.v+0.12;
  a-=tr.sl*7;
  if(thr<0.05)a-=0.9;
  if(brk)a-=17;
  P.v=clamp(P.v+a*dt,0,66.67);
  /* オートマ */
  if(evMode)P.gear=1;
  else if(P.gear<7&&P.v>GMAX[P.gear-1]*0.96)P.gear++;
  else if(P.gear>1&&P.v<GMAX[P.gear-2]*0.7)P.gear--;
  const rt=clamp(0.18+0.78*P.v/(evMode?66.67:GMAX[P.gear-1]),0.18,1)+thr*0.04;
  P.rpm+=(rt-P.rpm)*Math.min(1,dt*10);
  /* 横方向（遠心力でカーブ外側へ流れる） */
  const maxLat=1.2*Math.max(3.8,9-0.1*P.v)*Math.min(1,P.v/5);
  const tgt=steer*maxLat-tr.k*P.v*P.v*0.25;
  P.lv+=(tgt-P.lv)*Math.min(1,dt*7);
  P.l+=P.lv*dt;
  const cl_=clampL(P.l,FK&&!FK.dec&&P.s>FK.F?FK.dB:-1);
  if(cl_!==P.l){
    const sg=P.l>cl_?1:-1;P.l-=sg*Math.min(Math.abs(P.l-cl_),8*dt+0.02);
    if(!(FK&&(!FK.dec||(FK.lsw&&P.s<FK.F+160))&&P.s>FK.F&&sg<0)){if(P.lv*sg>0)P.lv=0;P.v*=1-Math.min(1,1.5*dt);P.shake=Math.max(P.shake,0.35);}
  }
  P.s+=P.v*dt;
  P.shake=Math.max(0,P.shake-dt*2.5);P.inv=Math.max(0,P.inv-dt);P.flash=Math.max(0,P.flash-dt*2.2);P.msgT=Math.max(0,P.msgT-dt);
  while(chgIdx<courseChg.length&&P.s>=courseChg[chgIdx].s){P.msg=RNAME[courseChg[chgIdx].th]+' ROUTE';P.msgT=3;P.msgC='#fff';chgIdx++;}
  updTraffic(dt,true);
}
let WK=null,dyT=0;
function rot(v,a,t){const c=Math.cos(t),s=Math.sin(t),d=a[0]*v[0]+a[1]*v[1]+a[2]*v[2];return[v[0]*c+(a[1]*v[2]-a[2]*v[1])*s+a[0]*d*(1-c),v[1]*c+(a[2]*v[0]-a[0]*v[2])*s+a[1]*d*(1-c),v[2]*c+(a[0]*v[1]-a[1]*v[0])*s+a[2]*d*(1-c)];}
function startWreck(sg,v0){
  WK={s:P.s,l:P.l,y:0,vs:Math.max(v0,14)*0.85,vl:sg*5,vy:9,ax:0,ay:0,az:0,rx:-5,ry:sg*2.2,rz:sg*6,t:0,fin:0};
  state='dying';P.v=0;P.lv=0;P.shake=0;P.msgT=0;
}
function wreckStep(dt,real){
  const w=WK;w.t+=real;
  w.vy-=26*dt;w.s+=w.vs*dt;w.l+=w.vl*dt;w.y+=w.vy*dt;
  w.ax+=w.rx*dt;w.ay+=w.ry*dt;w.az+=w.rz*dt;
  if(w.y<0){
    w.y=0;
    if(w.vy<-2){w.vy*=-0.42;w.rx*=0.7;w.rz*=0.75;w.ry*=0.7;}else w.vy=0;
    const fr=Math.exp(-3.2*dt);w.vs*=fr;w.vl*=fr;
    w.rx*=Math.exp(-1.2*dt);w.rz*=Math.exp(-0.9*dt);w.ry*=Math.exp(-1.5*dt);
  }
  if(Math.abs(w.l)>9.4){w.l=9.4*Math.sign(w.l);w.vl*=-0.4;}
  P.s=w.s;P.l=w.l;
  if(w.y===0&&w.vs<5&&w.t>1.5){
    w.rx=w.rz=w.ry=0;
    const tx=Math.round(w.ax/Math.PI)*Math.PI,tz=Math.round(w.az/Math.PI)*Math.PI;
    w.ax+=(tx-w.ax)*Math.min(1,dt*5);w.az+=(tz-w.az)*Math.min(1,dt*5);
    if(Math.abs(tx-w.ax)<0.03&&Math.abs(tz-w.az)<0.03){w.fin+=real;if(w.fin>0.8){state='over';overT=0;}}
  }
}
function wreckBasis(){
  const w=WK,B=basis(w.s,w.l,1,0);
  let r=B.r,u=B.u,f=B.f;const u0=u;
  r=rot(r,u,w.ay);f=rot(f,u,w.ay);
  u=rot(u,r,w.ax);f=rot(f,r,w.ax);
  r=rot(r,f,w.az);u=rot(u,f,w.az);
  const pos=[0,1,2].map(n=>B.pos[n]+u0[n]*w.y+(u0[n]-u[n])*0.8);
  return{pos,r,u,f};
}
function clampL(l,dB){
  if(dB<0)return clamp(l,-8.6,8.6);
  if(dB<17.2)return clamp(l,-dB-8.6,8.6);
  if(l>=-8.6)return Math.min(l,8.6);
  if(l<=-dB+8.6)return Math.max(l,-dB-8.6);
  return l<-dB*0.2?-dB+8.6:-8.6;
}
function forkUpdate(){
  if(!FK)return;
  if(FK.dec){if(P.s>FK.F+560){FK=null;nextFork++;}return;}
  if(P.s<FK.F)return;

function updTraffic(dt,live){
  for(const c of cars){
    if(c.dir>0){
      for(const d of cars)if(d!==c&&d.lane===c.lane&&d.s>c.s&&d.s-c.s<28+c.hl+d.hl&&d.sp<c.sp)c.sp=d.sp;
      c.s+=c.sp*dt;
    }else c.s-=c.sp*dt;
    if(!live)continue;
    if(c.dir>0&&c.ahead&&c.s<P.s-3){c.ahead=false;P.pass++;}
    const ds=c.s-P.s,dl=Math.abs(c.l-P.l);
    if(P.inv<=0&&dl<1.85&&(Math.abs(ds)<c.hl+2.1||(c.pd!==null&&c.pd*ds<0&&Math.abs(ds-c.pd)<30))){
      const sg=P.l>=c.l?1:-1;
      const v0=P.v;P.lv=sg*5;P.v*=c.dir<0?0.3:0.45;P.inv=1.2;P.shake=1;P.flash=1;P.crash++;P.msg='CRASH!';P.msgC='#f55';P.msgT=1.2;
      c.dead=true;
      if(P.crash>=3)startWreck(sg,v0);

  if(cars.length<Math.round(6*f)&&Math.random()<dt*0.9*f)spawn(300,520);

const cam=[0,0,0];let RC=[1,0,0],UC=[0,1,0],FC=[0,0,1],UW=[0,1,0];
function norm(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l];}
function setCamera(dt){
  P.camL+=(P.l*0.75-P.camL)*Math.min(1,dt*6);
  const sC=Math.max(0,P.s-9.5);
  const b=basis(sC,P.camL,1,0),t=basis(P.s+18,P.camL*0.6,1,0);
  const sh=P.shake*0.25;
  cam[0]=b.pos[0]+(Math.random()-.5)*sh;cam[1]=b.pos[1]+CAMH[camI]+(Math.random()-.5)*sh;cam[2]=b.pos[2]+(Math.random()-.5)*sh;
  FC=norm([t.pos[0]-cam[0],t.pos[1]+1.0-cam[1],t.pos[2]-cam[2]]);

  UC=[FC[1]*RC[2]-FC[2]*RC[1],FC[2]*RC[0]-FC[0]*RC[2],FC[0]*RC[1]-FC[1]*RC[0]];

function prepTrack(i0,i1){
  ensure(i1+3);

const add=(p,v,m)=>[p[0]+v[0]*m,p[1]+v[1]*m,p[2]+v[2]*m];
function seg(a,b){
  let za=a[2],zb=b[2];
  if(za<NEAR&&zb<NEAR)return;
  let ax=a[0],ay=a[1],bx=b[0],by=b[1];
  if(za<NEAR){const t=(NEAR-za)/(zb-za);ax+=(bx-ax)*t;ay+=(by-ay)*t;za=NEAR;}
  else if(zb<NEAR){const t=(NEAR-zb)/(za-zb);bx+=(ax-bx)*t;by+=(ay-by)*t;zb=NEAR;}

function clipPoly(pts){
  const out=[],n=pts.length;

function drawMountains(){

function drawCar(B,col,brk,fa,M){

      ctx.stroke();
      ctx.strokeStyle='#ffd060';ctx.lineWidth=2.6;ctx.beginPath();
      if(!(i&1)){seg(pt(k,-3.8,6.3),pt(k1,-3.8,6.3));seg(pt(k,3.8,6.3),pt(k1,3.8,6.3));}
      ctx.stroke();ctx.lineWidth=1.6;
      if(!nextT){ctx.strokeStyle='#ffe9a0';ctx.beginPath();const r=ringPts(k1,1);for(let j=0;j<6;j++)seg(r[j],r[j+1]);ctx.stroke();}
      if(!prevT){
        const zc=pt(k,0,0)[2],wx=Math.max(29,W*0.5/F*zc*1.8),o=[pt(k,-wx,-1),pt(k,wx,-1),pt(k,wx,18),pt(k,-wx,18)],n=ringPts(k,1);
        if(o.every(p=>p[2]>=NEAR)&&n.every(p=>p[2]>=NEAR)){
          ctx.beginPath();polyPath(o);polyPath(n);ctx.fillStyle=BG;ctx.fill('evenodd');
          ctx.strokeStyle='#fa4';ctx.lineWidth=1;ctx.beginPath();polyPath(o);polyPath(n);ctx.stroke();ctx.lineWidth=1.6;
        }
      }
    }else{
      /* 海 */
      if(t.th==='B'){drawSea(i,k,k1,fa,-1);drawSea(i,k,k1,fa,1);ctx.globalAlpha=fa;}
      else if(t.sea)drawSea(i,k,k1,fa,t.sea);
      /* 崖（右） */
      if(t.cl>0.04)for(const m of(t.cs===0?[-1,1]:[t.cs])){
        const n1=trk[i+1],H0=t.cl*(24+21*hash(i*0.7+m*3)),H1=n1.cl*(24+21*hash((i+1)*0.7+m*3));
        const x0=m*(11+H0*0.35+hash(i*1.3+m)),x1=m*(11+H1*0.35+hash((i+1)*1.3+m));
        const b0=pt(k,m*11,0),b1=pt(k1,m*11,0),t0=pt(k,x0,H0),t1=pt(k1,x1,H1);
        fillPoly([b0,t0,t1,b1],BG);
        ctx.strokeStyle='#c87';ctx.beginPath();
        seg(t0,t1);
        if(!(i&1))seg(b0,t0);
        seg(pt(k,m*11+(x0-m*11)*0.5,H0*0.5),pt(k1,m*11+(x1-m*11)*0.5,H1*0.5));
        if(i%3===0)seg(pt(k,m*11+(x0-m*11)*0.3,H0*0.3),pt(k,m*11+(x0-m*11)*0.8,H0*0.8));
        ctx.stroke();
      }
      /* 街灯 */
      if(i%8===0&&!noRail(i)){
        const sd=((i>>3)&1)?11.3:-11.3,e=sd-Math.sign(sd)*2.6;
        if(!((t.sea&&Math.sign(sd)===t.sea)||(t.cl>0.3&&(t.cs===0||Math.sign(sd)===t.cs)))){ctx.strokeStyle='#8a9';ctx.beginPath();
        seg(pt(k,sd,0),pt(k,sd,7.5));seg(pt(k,sd,7.5),pt(k,e,7.5));ctx.stroke();
        ctx.strokeStyle='#f4ff70';ctx.lineWidth=Math.max(0.5,F*0.12/Math.max(pt(k,e,7.3)[2],1));ctx.globalAlpha=fa;ctx.beginPath();seg(pt(k,e-0.9,7.3),pt(k,e+0.9,7.3));ctx.stroke();ctx.lineWidth=1.6;ctx.globalAlpha=fa;}
      }
      /* 木 */
      if(t.th==='F'){
        for(const side of[-1,1])for(let n=0;n<2;n++){
          const hh=hash(i*2.7+n*11+side*5);
          if(hh>0.55)continue;
          drawTree(k,side*(12.5+hash(i*1.9+n*7+side)*22),3.5,14+hash(i*3.1+n*5+side)*10,3.0);
        }
      }else if(t.th!=='B'&&hash(i)<0.3&&!noRail(i)&&!((t.sea&&(hash(i+99)<.5?-1:1)===t.sea)||(t.cl>0.3&&(t.cs===0||(hash(i+99)<.5?-1:1)===t.cs)))){
        drawTree(k,(hash(i+99)<.5?-1:1)*(13+hash(i+7)*26),1.6,7.5,2.2);
      }
    }
    /* この区間にいる車 */
    if(GH&&i>=GH.iF)drawGhost(i,k,k1,fa);
    const lst=bk.get(i);
    if(lst)for(const c of lst){
      if(c.player)drawCar(WK?wreckBasis():basis(P.s,P.l,1,Math.atan2(P.lv,Math.max(P.v,8))*0.8),'#7ff',WK?false:P.brk,fa);
      else drawCar(basis(c.s,c.l,c.dir,0),c.col,false,fa,c.kind==='trl'?TRLM:null);
    }
  }
  ctx.globalAlpha=1;
  drawHUD();
}

function drawTree(k,lat,tr,hp,w){
  const base=pt(k,lat,0),c=add(base,UW,tr),ap=add(base,UW,hp);
  const Xw=[RC[0],UC[0],FC[0]],Zw=[RC[2],UC[2],FC[2]];
  const p1=add(c,Xw,w),p2=add(c,Zw,w),p3=add(c,Xw,-w),p4=add(c,Zw,-w);
  ctx.strokeStyle='#2a8';ctx.beginPath();
  seg(base,c);seg(ap,p1);seg(ap,p2);seg(ap,p3);seg(ap,p4);
  seg(p1,p2);seg(p2,p3);seg(p3,p4);seg(p4,p1);ctx.stroke();
}
function drawSea(i,k,k1,fa,m){
        ctx.strokeStyle='#2a9bd8';ctx.beginPath();
        seg(pt(k,10.4*m,-6),pt(k1,10.4*m,-6));
        if(i%4===0)seg(pt(k,10.4*m,0),pt(k,10.4*m,-6));
        ctx.stroke();
        const NW=5;
        for(let j=0;j<NW;j++){
          const u=tAcc*0.12+j/NW,cyc=Math.floor(u),pp=u-cyc;
          if(hash(i*0.37+j*5.1+cyc*13.7)<0.3)continue;
          for(let q=0;q<7;q++){
            const pq=pp-q*0.05;if(pq<=0)break;
            const eq=0.5-0.5*Math.cos(Math.PI*pq),xo=ii=>m*(10.4+72*Math.pow(1-eq,2)-Math.sin(ii*0.22+j*2+tAcc*0.7)*2.2);
            ctx.globalAlpha=fa*Math.sin(Math.PI*pq)*Math.pow(1-q/7,1.5);
            ctx.beginPath();seg(pt(k,xo(i),-6),pt(k1,xo(i+1),-6));ctx.stroke();
          }
        }
        ctx.globalAlpha=fa;
}
/* ================= HUD ================= */
function drawHUD(){
  ctx.globalAlpha=1;
  if(P.flash>0){ctx.fillStyle='rgba(255,40,40,'+(P.flash*0.35)+')';ctx.fillRect(0,0,W,H);}
  const px=16,py=26;
  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';ctx.fillStyle='#3fe';
  ctx.font='400 13px '+FONT;ctx.fillText('FREE WAY DRIVE MODE',px,py);
  const kmh=Math.round(P.v*3.6);
  const R=70,KY=1,gcx=px+R,gcy=py+34+R*KY,N=40,rp=clamp(P.rpm,0,1);
  ctx.textAlign='right';
  ctx.font='400 34px '+FONT;ctx.fillText(String(P.gear),gcx-6,gcy-2);
  ctx.font='400 10px '+FONT;ctx.fillText(evMode?'EV':'GEAR',gcx-6,gcy+15);
  ctx.textAlign='left';
  ctx.font='400 43px '+FONT;
  const cw=ctx.measureText('0').width,sx=gcx+12+cw*3,ds=String(kmh);
  ctx.textAlign='center';
  for(let i=0;i<ds.length;i++)ctx.fillText(ds[ds.length-1-i],sx-cw*(i+0.5),gcy-2);
  ctx.textAlign='right';ctx.font='400 12px '+FONT;ctx.fillText('km/h',sx,gcy+15);
  ctx.textAlign='left';
  ctx.textAlign='left';
  const ang=t=>Math.PI*(1+t*0.5),wd=t=>18;
  const gp=(t,r)=>[gcx+r*Math.cos(ang(t)),gcy+KY*r*Math.sin(ang(t))];
  const TK=Math.round(Math.PI/2*Math.sqrt(((R-6)**2+((R-6)*KY)**2)/2)/2),lit=Math.round(rp*TK);
  ctx.lineWidth=1;
  for(let i=0;i<lit;i++){
    const t=(i+0.5)/TK,n0=gp(t,R-1),n1=gp(t,R-wd(t)+1);
    ctx.strokeStyle=t>0.88?'#f55':'#3fe';
    ctx.beginPath();ctx.moveTo(n0[0],n0[1]);ctx.lineTo(n1[0],n1[1]);ctx.stroke();
  }
  ctx.textAlign='right';ctx.fillStyle='#3fe';
  ctx.font='400 18px '+FONT;
  ctx.fillText(((P.s-40)/1000).toFixed(2)+' km',W-16,py+16);
  ctx.font='400 13px '+FONT;
  ctx.fillText('PASS '+P.pass+'   CRASH '+P.crash+'/3',W-16,py+38);
  if(P.msgT>0){
    ctx.textAlign='center';ctx.fillStyle=P.msgC||'#f55';ctx.globalAlpha=clamp(P.msgT*2,0,1)*(P.msgC==='#fff'&&Math.floor(P.msgT/0.4)%2?0.12:1);
    ctx.font='400 '+Math.min(W*0.1,46)*(P.msgC==='#fff'?0.6:1)+'px '+FONT;ctx.fillText(P.msg,W/2,H*0.3);ctx.globalAlpha=1;
  }
  if(inp.active&&state==='run'){
    ctx.strokeStyle='rgba(60,255,238,.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(inp.ox,inp.oy,46,0,7);ctx.stroke();
    ctx.fillStyle='rgba(60,255,238,.4)';
    ctx.beginPath();ctx.arc(inp.x,inp.y,16,0,7);ctx.fill();
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#f55';
    ctx.font='400 '+Math.min(W*0.09,32)+'px '+FONT;ctx.fillText('GAME OVER',W/2,H*0.32);
    ctx.fillStyle='#3fe';ctx.font='400 '+Math.min(W*0.045,16)+'px '+FONT;
    ctx.fillText(((P.s-40)/1000).toFixed(2)+' km   PASS '+P.pass,W/2,H*0.42);
    if(overT>0.8&&(tAcc*1.6|0)%2===0)ctx.fillText('TAP TO RESTART',W/2,H*0.52);
  }
  if(state==='title'){
    ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#3fe';
    const fs=Math.min(W*0.09,32);
    ctx.font='400 '+fs+'px '+FONT;ctx.fillText('FREEWAY',W/2,H*0.27);ctx.fillText('DRIVE MODE',W/2,H*0.27+fs*1.25);
    if((tAcc*1.6|0)%2===0){ctx.font='400 '+Math.min(W*0.045,16)+'px '+FONT;ctx.fillText('TAP TO START',W/2,H*0.45);}
  }
}

/* ================= LOOP ================= */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,Math.max(0.001,(ts-last)/1000||0.016));last=ts;
  if(paused){
    render(0);
    ctx.save();ctx.textAlign='center';ctx.fillStyle='#3fe';ctx.globalAlpha=1;
    ctx.font='400 '+Math.min(W*0.09,32)+'px '+FONT;ctx.fillText('PAUSE',W/2,H*0.4);
    ctx.font='400 '+Math.min(W*0.045,16)+'px '+FONT;ctx.fillText('TAP TO RESUME',W/2,H*0.4+Math.min(W*0.09,32));
    ctx.restore();requestAnimationFrame(frame);return;
  }
  tAcc+=dt;
  if(state==='run')update(dt);else{const ts=state==='dying'?0.3:1;updTraffic(dt*ts,false);if(state==='dying'){wreckStep(dt*ts,dt);P.flash=Math.max(0,P.flash-dt*2.2);}if(state==='over'){overT+=dt;P.flash=Math.max(0,P.flash-dt*2.2);P.shake=0;}}
  render(dt);
  requestAnimationFrame(frame);
}
window.__wd={setTh(x){CUR.th=x;TH=x;},get WK(){return WK;},P,get trk(){return trk;},get FK(){return FK;},get cur(){return CUR;},get cars(){return cars;},update,get state(){return state;},set state(v){state=v;},ensure,inp};
requestAnimationFrame(frame);
})();
