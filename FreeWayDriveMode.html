<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>

<body>
<canvas id="c"></canvas>
<div id="brake" class="btn">BRAKE</div>
<div id="view" class="btn">VIEW</div>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const FONT='"Orbitron",sans-serif';
const BG='#000';
let W=0,H=0,DPR=1,F=300,CX=0,CY=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  F=Math.min(W*0.85,H*1.15);CX=W/2;CY=H*0.45;
}
addEventListener('resize',resize);resize();

const DS=4,NEAR=0.5,NSEG=84;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hash=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);};

/* ================= TRACK ================= */
let trk=[],G,SC,TH='';
let CUR=null,FK=null,nextFork=1,VIS=new Set();
const newG=()=>({h:0,x:0,y:0,z:0,k:0,sl:0,tk:0,tsl:0,left:0,type:'str'});
const newSC=()=>({type:'none',left:40,c:0,side:-1,cs:1});
function useR(R){CUR=R;trk=R.trk;G=R.G;SC=R.SC;TH=R.th;}
function inR(R,fn){const o=CUR;useR(R);try{return fn();}finally{useR(o);}}
let FP={},courseChg=[],chgIdx=0;
function planFor(n){
  if(!FP[n]){const T=['S','C','M','U'],a=T[Math.random()*4|0],o=T.filter(x=>x!==a);FP[n]={a,b:o[Math.random()*3|0]};}
  return FP[n];
}
function initWorld(){useR({trk:[],G:newG(),SC:newSC(),th:'S'});FK=null;nextFork=1;VIS=new Set();FP={};courseChg=[];chgIdx=0;}
/* 3kmごとに道が二手に分かれる（左=COAST / 右=MOUNTAIN） */
const FK_IDX=750;
const noRail=i=>false;
const quiet=i=>false;
initWorld();
const RNAME={S:'STANDARD',C:'COAST',M:'MOUNTAIN',U:'HILLY TOWN',F:'FOREST',B:'BAY BRIDGE',T:'METROPOLITAN',D:'DESERT'};
const SLM={S:1,C:0.6,M:1,U:2.5,F:1,B:1,T:1,D:1};
function pickSeg(){
  if(TH==='D'){
    /* 約6割が直線、残りは非常にゆるいカーブ。坂もゆるい */
    const q=Math.random();
    if(q<0.6){G.type='str';G.left=40+(Math.random()*70|0);G.tk=0;G.tsl=rnd(-0.012,0.012);}
    else if(q<0.9){G.type='cur';G.left=30+(Math.random()*40|0);G.tk=(Math.random()<.5?-1:1)/rnd(700,1400);G.tsl=rnd(-0.015,0.015);}
    else{G.type='hill';G.left=40+(Math.random()*40|0);const sg=G.y>60?-1:G.y<-10?1:(Math.random()<.5?-1:1);G.tsl=sg*rnd(0.025,0.04);G.tk=0;}
    return;
  }
  pickSeg0();G.tsl*=SLM[TH]||1;
  if(TH==='M'&&G.tsl!==0&&G.type!=='fork'){
    const up=G.y>110?false:G.y<-15?true:Math.random()<0.8;
    G.tsl=Math.abs(G.tsl)*(up?1:-1);
  }
}
function pickSeg0(){
  const prev=G.type;let r=Math.random();
  if(TH==='C')r=0.2+r*0.8;
  if(TH==='T')r=0.26+r*0.74;
  if(trk.length<30){G.type='str';G.left=30;G.tk=0;G.tsl=0;return;}
  if(TH==='B'){
    const ix=trk.length,lc=ix%750,br=lc>=125&&lc<625,zb=lc<125?125-lc:lc<625?625-lc:750-lc;
    G.type=br?'bri':'cur';G.left=Math.min(zb,br?50+(Math.random()*40|0):40+(Math.random()*30|0));G.tk=rnd(-1,1)*0.0012;
    G.tsl=lc<125?0.16:lc>=625?-0.16:(G.y>40?-1:G.y<0?1:(Math.random()<.5?-1:1))*rnd(0.005,0.025);return;
  }
  if(G.ph===1){G.ph=2;G.type='fork';G.left=34;G.tk=G.fside*0.0016;G.tsl=0;return;}
  G.ph=0;
  if(quiet(trk.length)||quiet(trk.length+60)){G.type='cur';G.left=20;G.tk=rnd(-1,1)*0.0015;G.tsl=0;return;}
  if(Math.random()<(TH==='U'?0.25:0.12)&&prev!=='steep'&&prev!=='tun'&&prev!=='bri'){
    G.type='steep';G.left=24+(Math.random()*14|0);
    const sg=G.y>90?-1:G.y<-15?1:(Math.random()<.5?-1:1);
    G.tsl=sg*rnd(0.22,0.3);G.tk=rnd(-1,1)*0.002;
  }
  else if(r<0.13&&prev!=='tun'){G.type='tun';G.left=40+(Math.random()*40|0);G.tk=rnd(-1,1)*0.0025;G.tsl=0;}
  else if(r<0.26&&prev!=='bri'&&TH!=='F'&&(TH!=='M'||Math.random()<0.25)){G.type='bri';G.left=32+(Math.random()*30|0);G.tk=rnd(-1,1)*0.003;G.tsl=0;}
  else if(r<0.56){G.type='cur';G.left=25+(Math.random()*35|0);G.tk=(Math.random()<.5?-1:1)/(TH==='T'?rnd(80,230):rnd(110,380));G.tsl=rnd(-0.05,0.05);}
  else if(r<0.82){
    G.type='hill';G.left=36+(Math.random()*40|0);
    const sg=G.y>90?-1:G.y<-15?1:(Math.random()<.5?-1:1);
    G.tsl=sg*rnd(0.09,0.17);G.tk=rnd(-1,1)*0.002;
  }else{G.type='str';G.left=15+(Math.random()*30|0);G.tk=0;G.tsl=rnd(-0.04,0.04);}
}
function sceneStep(){
  if(quiet(trk.length)||TH==='F'||TH==='B'||TH==='T'){SC.type='none';SC.left=Math.max(SC.left,5);}
  if(SC.left<=0){
    const q0=Math.random(),q=TH==='D'?(q0<0.9?0.1:0.9):TH==='C'?(q0<0.06?0.1:q0<0.97?0.7:0.9):TH==='M'?(q0<0.06?0.1:q0<0.1?0.7:0.9):q0;
    if(q<0.6){SC.type='none';SC.left=40+(Math.random()*80|0);}
    else if(q<0.8){SC.type='sea';SC.side=Math.random()<.5?-1:1;SC.left=50+(Math.random()*60|0);}
    else{SC.type='cliff';SC.cs=TH==='M'&&Math.random()<0.65?0:(Math.random()<.5?-1:1);SC.left=40+(Math.random()*60|0);SC.tt=TH==='M'&&Math.random()<0.5?1.8:1;}
  }
  SC.left--;
  SC.c+=((SC.type==='cliff'?1:0)-SC.c)*0.12;
  SC.ch=(SC.ch||1)+((SC.tt||1)-(SC.ch||1))*0.08;
}
function genNext(){
  if(quiet(trk.length+25)&&(G.type==='tun'||G.type==='bri'||G.type==='steep'))G.left=0;
  if(G.left<=0)pickSeg();
  G.left--;
  G.k+=(G.tk-G.k)*0.12;G.sl+=(G.tsl-G.sl)*0.1;
  sceneStep();
  trk.push({x:G.x,y:G.y,z:G.z,h:G.h,k:G.k,sl:G.sl,tn:G.type==='tun',br:G.type==='bri',sea:SC.type==='sea'?SC.side:0,cl:SC.c,cs:SC.cs,ch:SC.ch||1,th:TH});
  G.x+=Math.sin(G.h)*DS;G.z+=Math.cos(G.h)*DS;G.y+=G.sl*DS;G.h+=G.k*DS;
  if(G.shl>0){G.shl--;G.x-=Math.cos(G.h)*1.5;G.z+=Math.sin(G.h)*1.5;}
  if(trk.length-1===nextFork*FK_IDX){
    nextFork++;
    VIS.add(CUR.th);let T=['S','C','M','U','F','B','T','D'].filter(x=>x!==CUR.th&&!VIS.has(x));
    if(!T.length){VIS=new Set([CUR.th]);T=['S','C','M','U','F','B','T','D'].filter(x=>x!==CUR.th);}
    CUR.th=T[Math.random()*T.length|0];TH=CUR.th;SC.left=0;if(TH==='B'||TH==='F'||TH==='D')G.left=0;
    courseChg.push({s:(trk.length-1)*DS,th:CUR.th});
  }
}
function makeFork(){
  const A=CUR,B={trk:A.trk.slice(),G:Object.assign({},A.G),SC:Object.assign({},A.SC),th:'C'};
  const pl=planFor(nextFork);B.th=pl.b;A.th=pl.a;TH=A.th;
  for(const[R,sd,m,m2]of[[A,1,0.15,0.25],[B,-1,1.4,1]]){const g=R.G;g.type='fork';g.left=14;g.tk=sd*0.0034*m;g.tsl=0;g.ph=1;g.fside=sd*m2;}
  FK={A,B,iF:trk.length-1,F:(trk.length-1)*DS,dec:false,dB:0,other:null};
}
function ensure(i){while(trk.length<=i+2)genNext();}
function trkAt(s){
  if(s<0)s=0;
  const f=s/DS,i=Math.floor(f),t=f-i;ensure(i+2);
  const a=trk[i],b=trk[i+1];
  return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:a.z+(b.z-a.z)*t,h:a.h+(b.h-a.h)*t,k:a.k,sl:a.sl+(b.sl-a.sl)*t,tn:a.tn,br:a.br};
}
/* 路面上の位置と向き */
function basis(s,l,dir,yaw){
  const a=trkAt(s),ch=Math.cos(a.h),sh=Math.sin(a.h);
  const ph=Math.atan(a.sl),cp=Math.cos(ph),sp=Math.sin(ph);
  const tf=[sh*cp,sp,ch*cp],tr=[ch,0,-sh];
  const up=[tf[1]*tr[2]-tf[2]*tr[1],tf[2]*tr[0]-tf[0]*tr[2],tf[0]*tr[1]-tf[1]*tr[0]];
  const pos=[a.x+tr[0]*l,a.y,a.z+tr[2]*l];
  let f=tf,r=tr;
  if(dir<0){f=[-tf[0],-tf[1],-tf[2]];r=[-tr[0],0,-tr[2]];}
  if(yaw){
    const cy=Math.cos(yaw),sy=Math.sin(yaw);
    const f2=[f[0]*cy+r[0]*sy,f[1]*cy+r[1]*sy,f[2]*cy+r[2]*sy];
    const r2=[r[0]*cy-f[0]*sy,r[1]*cy-f[1]*sy,r[2]*cy-f[2]*sy];
    f=f2;r=r2;
  }
  return{pos,r,u:up,f};
}

/* ================= STATE ================= */
const LANES=[-6.3,-2.1,2.1,6.3];
const ACC=[8.5,6.8,5.4,4.5,4.0,4.0,4.2];
const GMAX=[11.7,21,30,38,46.7,53.3,60];
const P={s:40,l:-6.3,lv:0,v:0,gear:1,rpm:0.15,thr:0,brk:false,steer:0,camL:-6.3,pass:0,score:0,sct:0,crash:0,inv:0,shake:0,flash:0,msg:'',msgT:0};
let cars=[];
let state='title';
let tAcc=0,overT=0;

const COLS=['#f6f','#fa3','#9f6','#6af','#f66','#ff6','#c9f'];
let spawnCount=0;
function spawn(minD,maxD){
  let same=Math.random()<0.4;
  if(same&&P.s+maxD<1000)same=false;
  let s=P.s+(same?rnd(minD,maxD):rnd(minD+120,maxD+60));
  if(same&&s<1000){same=false;s=P.s+rnd(minD+120,maxD+60);}
  const lane=same?(Math.random()<.5?0:1):(Math.random()<.5?2:3);
  for(const c of cars)if(c.lane===lane&&Math.abs(c.s-s)<60)return;
  const trl=(spawnCount+1)%10===0;
  spawnCount++;
  cars.push({s,l:LANES[lane],lane,dir:same?1:-1,sp:trl?(same?rnd(9.6,15.2):rnd(14.4,21.6)):(same?rnd(14,30):rnd(20,34)),col:COLS[(Math.random()*COLS.length)|0],pd:null,ahead:true,kind:trl?'trl':'car',hl:trl?6.6:2.1});
}
function initTraffic(){cars=[];for(let i=0;i<8;i++)spawn(90,520);}
initTraffic();

/* ================= INPUT ================= */
const inp={id:null,ox:0,oy:0,x:0,y:0,active:false,brake:false,bid:null};
const keys={};
const R_STICK=70;
function stickSteer(){const dx=inp.x-inp.ox;return Math.abs(dx)<6?0:clamp(dx/48,-1,1);}
function stickThr(){return clamp((inp.oy-inp.y-8)/46,0,1);}
function resetGame(){
  Object.assign(P,{s:40,l:-6.3,lv:0,v:0,gear:1,rpm:0.15,thr:0,brk:false,steer:0,camL:-6.3,pass:0,score:0,sct:0,crash:0,inv:0,shake:0,flash:0,msg:'',msgT:0});
  initWorld();initTraffic();WK=null;state='run';overT=0;
}
function startGame(){
  if(state!=='title')return;
  state='run';
}
let qrOpen=false;const QRN=33,QRD='111111101111101111100111001111111100000100001100010111000001000001101110100110110001001100101011101101110101100101100100001001011101101110101011111001000011001011101100000101011010010111110101000001111111101010101010101010101111111000000001100001111011100000000000100010111000100011000110011111001100010011011011110000001010001100011101110011000101101001110001010011010010000001001000111010000000011110111100111101001110001011011001001000001110010101101001100100101010110001111011101111011011010010010000010011001101101111011000001111110100000101011110101010010011011000001010101100001000001100110010100000101101101101010101010111101011011011001111101111100010001111111000101111011011101011011111100001000110000100100010101010000010110101111100000001100100110000011001110011111001111011110000111010111111101001111111111110110000000001000111111100100100010110111111101101000101100100101011010100000100000100111011100100010001101110101101001100101110111111011101110100111011011100001001111100101110100100100010101000101111100100000100100010001011100100000000111111101101101101001101101001001';
let paused=false,lastTap=0,lastTapX=0,lastTapY=0,evMode=false,titleTapT=0,startTimer=null;
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('.btn'))return;
  e.preventDefault();
  if(state==='title'){
    const tn=performance.now();
    if(qrOpen){qrOpen=false;return;}
    if(startTimer&&tn-titleTapT<320){clearTimeout(startTimer);startTimer=null;
      const fs=Math.min(W*0.09,32);
      if(e.clientY>H*0.27-fs*1.1&&e.clientY<H*0.27+fs*1.6){qrOpen=true;}else{evMode=true;startGame();}}
    else{titleTapT=tn;startTimer=setTimeout(()=>{startTimer=null;evMode=false;startGame();},300);}
    return;
  }
  else if(state==='over'){if(overT>0.8)resetGame();return;}
  if(paused){paused=false;return;}
  if(inp.id!==null)return;
  inp.id=e.pointerId;inp.ox=inp.x=e.clientX;inp.oy=inp.y=e.clientY;inp.active=true;
},{passive:false});
addEventListener('pointermove',e=>{
  if(e.pointerId!==inp.id)return;
  inp.x=e.clientX;inp.y=e.clientY;
  const dx=inp.x-inp.ox,dy=inp.y-inp.oy,d=Math.hypot(dx,dy);
  if(d>R_STICK){inp.ox+=dx/d*(d-R_STICK);inp.oy+=dy/d*(d-R_STICK);}
});
function endPtr(e){if(e.pointerId===inp.id){inp.id=null;inp.active=false;}}
addEventListener('pointerup',endPtr);addEventListener('pointercancel',endPtr);
const brakeEl=document.getElementById('brake');
brakeEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();inp.brake=true;inp.bid=e.pointerId;brakeEl.classList.add('on');if(state==='title'){if(startTimer){clearTimeout(startTimer);startTimer=null;}evMode=false;startGame();}});
function brakeUp(e){if(e.pointerId===inp.bid){inp.brake=false;inp.bid=null;brakeEl.classList.remove('on');}}
addEventListener('pointerup',brakeUp);addEventListener('pointercancel',brakeUp);
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyP'&&state!=='title'&&state!=='over')paused=!paused;if(state==='title'&&e.code==='KeyE'){evMode=true;startGame();}else if(state==='title'&&(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp')){evMode=false;startGame();}else if(state==='over'&&overT>0.8&&(e.code==='Space'||e.code==='Enter'))resetGame();if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=false;});

const CAMH=[2,4,6,1.5],CAMB=[9.5,9.5,9.5,0],CAMN=['LOW','MIDDLE','TOP','FRONT'],CAMSEQ=[0,1,2,3];let camP=0,camI=0;
const viewEl=document.getElementById('view');
viewEl.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();camP=(camP+1)%CAMSEQ.length;camI=CAMSEQ[camP];viewEl.textContent='VIEW';});

/* ================= UPDATE ================= */
function update(dt){
  let steer=inp.active?stickSteer():0,thr=1,brk=inp.brake;
  if(keys.ArrowLeft||keys.KeyA)steer-=1;
  if(keys.ArrowRight||keys.KeyD)steer+=1;
    if(keys.ArrowDown||keys.KeyS||keys.Space)brk=true;
  steer=clamp(steer,-1,1);
  if(brk)thr=0;
  P.thr=thr;P.brk=brk;P.steer=steer;
  const tr=trkAt(P.s);
  /* 縦方向 */
  /* 最高速度は坂と慣性で変わる：下りでは伸び、上りでは縮む。超えた分は慣性でじわじわ戻る */
  const slE=evMode?Math.min(tr.sl,0):tr.sl;
  const vmx=55.56+(slE<0?-slE*60:-slE*40);
  let a=(evMode?thr*13.5*(1-P.v/120):thr*ACC[P.gear-1])*clamp((vmx-P.v)/4,0,1);
  a-=0.0006*P.v*P.v+0.12;
  a-=slE*7;
  if(P.v>vmx)a-=1.2*(P.v-vmx);
  if(thr<0.05)a-=0.9;
  if(brk)a-=17;
  P.v=clamp(P.v+a*dt,0,72);
  P.sct+=dt;while(P.sct>=0.5){P.sct-=0.5;P.score+=Math.round(P.v*3.6);}
  /* オートマ */
  if(evMode)P.gear=1;
  else if(P.gear<7&&P.v>GMAX[P.gear-1]*0.96)P.gear++;
  else if(P.gear>1&&P.v<GMAX[P.gear-2]*0.7)P.gear--;
  const rt=clamp(0.18+0.78*P.v/(evMode?55.56:GMAX[P.gear-1]),0.18,1)+thr*0.04;
  P.rpm+=(rt-P.rpm)*Math.min(1,dt*10);
  /* 横方向（遠心力でカーブ外側へ流れる） */
  const maxLat=1.2*Math.max(3.8,9-0.1*P.v)*Math.min(1,P.v/5);
  const tgt=steer*maxLat-tr.k*P.v*P.v*0.25;
  P.lv+=(tgt-P.lv)*Math.min(1,dt*7);
  P.l+=P.lv*dt;
  const cl_=clampL(P.l,FK&&!FK.dec&&P.s>FK.F?FK.dB:-1);
  if(cl_!==P.l){
    const sg=P.l>cl_?1:-1;P.l-=sg*Math.min(Math.abs(P.l-cl_),8*dt+0.02);
    if(!(FK&&(!FK.dec||(FK.lsw&&P.s<FK.F+160))&&P.s>FK.F&&sg<0)){if(P.lv*sg>0)P.lv=0;P.v*=1-Math.min(1,1.5*dt);P.shake=Math.max(P.shake,0.35);}
  }
  P.s+=P.v*dt;
  P.shake=Math.max(0,P.shake-dt*2.5);P.inv=Math.max(0,P.inv-dt);P.flash=Math.max(0,P.flash-dt*2.2);P.msgT=Math.max(0,P.msgT-dt);

        if(t.th==='C')drawPalm(k,(hash(i+99)<.5?-1:1)*(13+hash(i+7)*26),6.5+hash(i*1.3)*2.5,hash(i*2.1)*6.28);
        else drawTree(k,(hash(i+99)<.5?-1:1)*(13+hash(i+7)*26),1.6,7.5,2.2);
      }
    }

    if(GH&&i>=GH.iF)drawGhost(i,k,k1,fa);
    const lst=bk.get(i);
    if(lst)for(const c of lst){
      if(c.player){if(camI!==3||WK)drawCar(WK?wreckBasis():basis(P.s,P.l,1,Math.atan2(P.lv,Math.max(P.v,8))*0.8),'#7ff',WK?false:P.brk,fa,null,P.s);}
      else drawCar(basis(c.s,c.l,c.dir,0),c.col,false,fa,c.kind==='trl'?TRLM:null,c.s*c.dir);
    }
  }
  ctx.globalAlpha=1;
  ctx.restore();
  drawRain(dt);
  drawHUD();drawNav();
}

function drawTree(k,lat,tr,hp,w){

  const Xw=[RC[0],UC[0],FC[0]],Zw=[RC[2],UC[2],FC[2]];
  const p1=add(c,Xw,w),p2=add(c,Zw,w),p3=add(c,Xw,-w),p4=add(c,Zw,-w);
  ctx.strokeStyle='#2a8';ctx.beginPath();
  seg(base,c);seg(ap,p1);seg(ap,p2);seg(ap,p3);seg(ap,p4);
  seg(p1,p2);seg(p2,p3);seg(p3,p4);seg(p4,p1);ctx.stroke();
}
function drawPalm(k,lat,hp,ph){
  const base=pt(k,lat,0),Xw=[RC[0],UC[0],FC[0]],Zw=[RC[2],UC[2],FC[2]];

  for(let j=0;j<6;j++){
    const a=ph+j*Math.PI/3,dx=Math.cos(a),dz=Math.sin(a),L=3.4;

/* ===== METROPOLITAN：高層ビル群と頭上の高速道路 ===== */
function cityFace(pts,col,al,fa){

function drawCity(i,k,fa){
  if(k+11>NSEG)return;
  ctx.lineWidth=1;
  /* 頭上：長く続く高架（線のみ） */
  for(const sd of[-1,1]){
    const blk=Math.floor(i/24);
    if(hash(blk*1.7+sd*9.3)<0.5){
      const hh=22+hash(blk*2.9+sd)*28,lat=sd*(4+hash(blk*4.1+sd)*16);
      ctx.globalAlpha=fa*0.55;ctx.strokeStyle='#f8c';ctx.beginPath();
      seg(pt(k,lat-5,hh),pt(k+1,lat-5,hh));seg(pt(k,lat+5,hh),pt(k+1,lat+5,hh));
      seg(pt(k,lat-5,hh-1.2),pt(k+1,lat-5,hh-1.2));seg(pt(k,lat+5,hh-1.2),pt(k+1,lat+5,hh-1.2));
      if(i%3===0)seg(pt(k,lat-5,hh),pt(k,lat+5,hh));
      ctx.stroke();
      ctx.globalAlpha=fa*0.3;ctx.strokeStyle='#fd3';ctx.beginPath();
      if(i%2===0)seg(pt(k,lat,hh),pt(k+1,lat,hh));ctx.stroke();
    }
  }
  /* 高層ビル */
  if(i%4===0){
    for(const sd of[-1,1]){
      const hb=hash(i*0.77+sd*3.1);
      if(hash(i*1.13+sd*5.3)<0.1)continue;
      const H=25+hb*hb*100+hb*20,lat0=11.8+hash(i*1.9+sd)*4,w=14+hash(i*2.7+sd*2)*16;
      const col=hash(i*0.41+sd)<0.5?'#5ad0ff':'#a98cff',lo=sd*lat0,hi=sd*(lat0+w);
      cityFace([pt(k,lo,0),pt(k+3,lo,0),pt(k+3,lo,H),pt(k,lo,H)],col,0.9,fa);
      cityFace([pt(k,lo,0),pt(k,hi,0),pt(k,hi,H),pt(k,lo,H)],col,0.9,fa);
      if(k<72){
        ctx.globalAlpha=fa*0.3;ctx.strokeStyle=col;ctx.beginPath();
        for(let y=6;y<H-2;y+=6){seg(pt(k,lo,y),pt(k+3,lo,y));seg(pt(k,lo,y),pt(k,hi,y));}
        seg(pt(k+1,lo,0),pt(k+1,lo,H));seg(pt(k+2,lo,0),pt(k+2,lo,H));
        ctx.stroke();
      }
    }
  }
  /* 頭上：道路をまたぐ高架 */
  if(k>=1){
    if(hash(i*2.31+0.5)<0.11){
      const hv=14+hash(i*5.1)*46;
      cityFace([pt(k,-90,hv),pt(k,90,hv),pt(k+2,90,hv),pt(k+2,-90,hv)],'#f8c',0.9,fa);
      cityFace([pt(k,-90,hv-1.6),pt(k,90,hv-1.6),pt(k,90,hv),pt(k,-90,hv)],'#f8c',0.9,fa);
      ctx.globalAlpha=fa*0.5;ctx.strokeStyle='#fd3';ctx.beginPath();seg(pt(k+1,-90,hv),pt(k+1,90,hv));
      for(const sx of[-10.6,10.6])seg(pt(k,sx,0),pt(k,sx,hv-1.6));ctx.stroke();
    }else if(hash(i*3.77+1.2)<0.07){
      const hv=12+hash(i*6.3)*44,d=hash(i*1.1)<0.5?1:-1,a=d>0?-90:90,b=-a;
      cityFace([pt(k,a,hv),pt(k+8,b,hv),pt(k+10,b,hv),pt(k+2,a,hv)],'#f8c',0.9,fa);
    }
  }
  ctx.globalAlpha=fa;
}

/* ===== DESERT：サボテンと草 ===== */
function drawDesert(i,k,fa){
  ctx.lineWidth=1;
  for(const sd of[-1,1]){
    /* サボテン */
    if(hash(i*1.91+sd*4.3)<0.1){
      const lat=sd*(13+hash(i*3.1+sd)*30),h=3.5+hash(i*0.37+sd)*4,a1=h*(0.35+hash(i*2.2)*0.25),a2=h*(0.25+hash(i*5.3)*0.25);
      ctx.globalAlpha=fa;ctx.strokeStyle='#5c6';ctx.beginPath();
      seg(pt(k,lat,0),pt(k,lat,h));

      seg(pt(k,lat-0.45,h*0.92),pt(k,lat,h));seg(pt(k,lat+0.45,h*0.92),pt(k,lat,h));
      const ah=h*0.55,bh=h*0.4;
      seg(pt(k,lat-0.45,ah),pt(k,lat-1.6,ah));seg(pt(k,lat-1.6,ah),pt(k,lat-1.6,ah+a1));
      seg(pt(k,lat+0.45,bh),pt(k,lat+1.5,bh));seg(pt(k,lat+1.5,bh),pt(k,lat+1.5,bh+a2));
      ctx.stroke();

    if(hash(i*2.71+sd*1.7)<0.28){
      const lat=sd*(10.6+hash(i*4.3+sd)*28),h=0.5+hash(i*1.3+sd)*0.7;

  }
  ctx.globalAlpha=fa;
}

  {const tt=performance.now()/1000;ctx.strokeStyle='#aff';ctx.lineWidth=1;
   for(let j=0;j<2;j++){const ph=(tt*0.4+j*0.5)%1;ctx.globalAlpha=1-ph*0.6;ctx.beginPath();ctx.arc(cx,by,2+ph*12,0,6.2832);ctx.stroke();}
   ctx.globalAlpha=1;ctx.beginPath();ctx.arc(cx,by,3,0,6.2832);ctx.stroke();}

}

      const q=Math.floor(Math.min(W*0.7,300)/(QRN+4))/2,z=Math.round(q*(QRN+4)),x0=Math.round((W-z)/2),y0=Math.round(H*0.5-z/2);
      ctx.fillStyle='#fff';ctx.fillRect(x0,y0,z,z);ctx.fillStyle='#000';
      for(let r=0;r<QRN;r++)for(let c=0;c<QRN;c++)if(QRD.charCodeAt(r*QRN+c)===49){const ax=Math.round(x0+(c+2)*q),ay=Math.round(y0+(r+2)*q);ctx.fillRect(ax,ay,Math.round(x0+(c+3)*q)-ax,Math.round(y0+(r+3)*q)-ay);}
      ctx.fillStyle='#3fe';ctx.font='400 '+Math.min(W*0.04,14)+'px '+FONT;ctx.textAlign='center';
      ctx.fillText('TAP TO CLOSE',W/2,y0+z+26);
    }
  }
}

/* ================= LOOP ================= */
let last=0;
function frame(ts){
  const dt=Math.min(0.05,Math.max(0.001,(ts-last)/1000||0.016));last=ts;
  if(paused){
    render(0);
    ctx.save();ctx.textAlign='center';ctx.fillStyle='#3fe';ctx.globalAlpha=1;
    ctx.font='400 '+Math.min(W*0.09,32)+'px '+FONT;ctx.fillText('PAUSE',W/2,H*0.4);
    ctx.font='400 '+Math.min(W*0.045,16)+'px '+FONT;ctx.fillText('TAP TO RESUME',W/2,H*0.4+Math.min(W*0.09,32));
    ctx.restore();requestAnimationFrame(frame);return;
  }
  tAcc+=dt;
  if(state==='run')update(dt);else{const ts=state==='dying'?0.3:1;updTraffic(dt*ts,false);if(state==='dying'){wreckStep(dt*ts,dt);P.flash=Math.max(0,P.flash-dt*2.2);}if(state==='over'){overT+=dt;P.flash=Math.max(0,P.flash-dt*2.2);P.shake=0;}}
  render(dt);
  requestAnimationFrame(frame);
}
window.__wd={RN,setTh(x){CUR.th=x;TH=x;},get WK(){return WK;},P,get trk(){return trk;},get FK(){return FK;},get cur(){return CUR;},get cars(){return cars;},update,get state(){return state;},set state(v){state=v;},ensure,inp};
requestAnimationFrame(frame);
})();
</script>
