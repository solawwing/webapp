<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>座標計測</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0e1210;
    --panel:#141915;
    --line:#2a332c;
    --ink:#e8ecdf;
    --ink-dim:#7c8a76;
    --brass:#c8a24a;
    --brass-dim:#8a7038;
    --ok:#5fae6e;
    --warn:#c96a4a;
    --mono: "BIZ UDPGothic", "SF Mono","Consolas","Menlo",monospace;
  }
  body.lang-en{
    --mono: "Montserrat", "SF Mono","Consolas","Menlo",monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #1a2118 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family: var(--mono);
    overflow:hidden;
    overscroll-behavior:none;
  }
  .wrap{
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .top{
    flex:0 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 18px 0;
  }
  .ticker{
    flex:0 0 auto;
    height:26px;
    background:#000;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    position:relative;
  }
  .tickerTrack{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change: transform;
    animation: none;
  }
  .tickerTrack .tickerEmpty{
    color:#ff2df2;
    font-size:11px;
    letter-spacing:.05em;
    padding-left:18px;
  }
  .tickerItem{
    display:inline-flex;
    align-items:baseline;
    gap:0;
    padding:0 28px 0 0;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.02em;
    color:#ff9d1f;
    text-shadow:0 0 4px currentColor;
  }
  .tickerItem .tName{ font-weight:400; font-size:14px; color:#FF0000; margin-right:6px; }
  .stationSuffixSmall{ font-size:0.5em; vertical-align:bottom; }
  .tickerItem .tDist{ color:#22e5e5; font-size:14px; margin-left:6px; }
  .tickerItem .tDist .tUnit{ font-size:9px; }
  .tickerItem.near-blink{
    animation: dist-blink 0.8s step-start infinite;
  }
  @keyframes dist-blink{
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0.1; }
  }
  .tickerItem .tLine{ color:#FF9D1F; font-size:9px; margin-right:6px; }
  .tickerItem .tSep{ color:#FFFFFF; font-size:14px; padding-right:0; }
  .tickerItem .tNearest{ color:#39FF14; font-size:14px; margin-right:2px; }
  @keyframes ticker-scroll{
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .mapPane{
    flex:1 1 auto;
    min-height:160px;
    position:relative;
    border-top:1px solid var(--line);
  }
  #map{
    position:absolute; inset:0;
    background:var(--panel);
  }
  #map .leaflet-tile-pane{
    filter: grayscale(0.9) sepia(0.15) hue-rotate(190deg) saturate(1.3) brightness(.3) contrast(1.5);
  }
  #map .leaflet-marker-pane,
  #map .leaflet-marker-pane *,
  #map .leaflet-overlay-pane,
  #map .leaflet-overlay-pane *,
  #map .leaflet-arrowPane-pane,
  #map .leaflet-arrowPane-pane *{
    filter:none;
  }
  .station-label{
    background:transparent; border:none;
  }
  .station-label .pin{
    width:8px; height:8px; border-radius:50%;
    background:#ff2d95;
    margin:0 auto 3px;
  }
  .station-label .name{
    font-family: var(--mono);
    font-size:14px;
    font-weight:400;
    letter-spacing:.015em;
    white-space:nowrap;
    text-align:center;
    background:rgba(0,0,0,0.2);
    padding:0px 3px;
    border-radius:4px;
    display:block;
    width:fit-content;
    margin:0 auto;
    text-shadow:
      1px 0 0 var(--label-color,#fff), -1px 0 0 var(--label-color,#fff),
      0 1px 0 var(--label-color,#fff), 0 -1px 0 var(--label-color,#fff),
      1px 1px 0 var(--label-color,#fff), -1px 1px 0 var(--label-color,#fff),
      1px -1px 0 var(--label-color,#fff), -1px -1px 0 var(--label-color,#fff);
  }
  .station-label .lineName{
    font-family: var(--mono);
    font-size:9px;
    font-weight:400;
    letter-spacing:.01em;
    white-space:nowrap;
    text-align:center;
    background:rgba(0,0,0,0.2);
    padding:0px 3px;
    border-radius:4px;
    display:block;
    width:fit-content;
    margin:0 auto;
    text-shadow:
      1px 0 0 var(--label-color,#fff), -1px 0 0 var(--label-color,#fff),
      0 1px 0 var(--label-color,#fff), 0 -1px 0 var(--label-color,#fff),
      1px 1px 0 var(--label-color,#fff), -1px 1px 0 var(--label-color,#fff),
      1px -1px 0 var(--label-color,#fff), -1px -1px 0 var(--label-color,#fff);
  }
  .statusFoot{
    flex:0 0 auto;
    min-height:34px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 18px;
    padding-bottom:env(safe-area-inset-bottom);
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .mapOverlay{
    flex:0 0 auto;
    font-size:9px; letter-spacing:.08em; text-transform:uppercase;
    color:#FFFFFF;
    white-space:nowrap;
  }
  .fetchStatusLabel{
    flex:1 1 auto;
    min-width:0;
    font-size:9px; letter-spacing:.02em;
    color:#39FF14;
    font-family: var(--mono);
    text-align:right;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .recenterBtn{
    position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px; z-index:500;
    width:38px; height:38px; border-radius:2px;
    background:rgba(14,18,16,.85); border:1px solid #FF9D1F;
    color:#FF9D1F; display:flex; align-items:center; justify-content:center;
    font-size:16px; -webkit-appearance:none;
  }
  .recenterBtn:active{ background:rgba(255,157,31,.15); }
  .mapModeBtn{
    position:absolute; top:14px; right:14px; z-index:500;
    width:50px; height:50px; border-radius:50%;
    background:#000000; border:1px solid #39FF14;
    color:#39FF14; display:none; align-items:center; justify-content:center;
    font-family: var(--mono);
    font-size:12px; line-height:1.3; text-align:center;
    -webkit-appearance:none; cursor:pointer;
  }
  .mapModeBtn:active{ background:rgba(57,255,20,.15); }

  .grayToggleBtn{
    position:absolute; top:84px; right:32px; z-index:500;
    width:12.5px; height:12.5px; border-radius:50%;
    background:#000000; border:1px solid #39FF14;
    color:#39FF14; display:none; align-items:center; justify-content:center;
    font-family: var(--mono);
    font-size:0; line-height:1; text-align:center;
    -webkit-appearance:none; cursor:pointer;
  }
  .grayToggleBtn:active{ background:rgba(57,255,20,.15); }

  /* header */
  .head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-bottom:2px; margin-bottom:10px;
    border-bottom:1px solid var(--line);
    letter-spacing:.06em;
  }
  .head .title{ font-family:"BIZ UDPGothic","SF Mono","Consolas","Menlo",monospace; font-size:12px; font-weight:700; color:#22e5e5; text-transform:uppercase; transition: letter-spacing 3s ease-in-out; letter-spacing:.12em; }
  .head .title.stretching{ letter-spacing:.5em; }
  .title .waveChar{
    display:inline-block;
    transition: transform 0.15s ease;
  }
  .head .status{ font-size:10px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); flex:none; }
  .dot.live{ background:#39FF14; box-shadow:0 0 6px #39FF14; animation:pulse 2s infinite; }
  .dot.err{ background:#FF3B3B; box-shadow:0 0 6px #FF3B3B; }
  .dot.low{ background:#FF3B3B; box-shadow:0 0 6px #FF3B3B; animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes ripple{
    0%   { transform:scale(0.2); opacity:.7; }
    100% { transform:scale(1);   opacity:0; }
  }
  .pulse-ring{
    position:absolute;
    top:50%; left:50%;
    width:54px; height:54px;
    margin-top:-27px; margin-left:-27px;
    border-radius:50%;
    background: currentColor;
    box-sizing:border-box;
    animation: ripple 2.2s ease-out infinite;
    transform-origin: center center;
  }
  .pulse-ring-delay{
    animation-delay: 1.1s;
  }

  /* main coordinate display */
  .coords{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .coordGrid{
    display:grid;
    grid-template-columns: auto 1fr;
    align-items:center;
    row-gap:6px;
    column-gap:16px;
  }
  .coordItem{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .coordItem .clabel{
    font-size:9px; letter-spacing:.06em; color:var(--ink-dim);
    text-transform:uppercase; flex:none;
    line-height:1.4;
    text-align:left;
  }
  .coordItem .hemi{ color:#39FF14; }
  .coordItem .hemiJa{
    color:#39FF14;
    font-size:9px;
    letter-spacing:.04em;
  }
  .coordItem .value{
    font-size:clamp(13px, 4.4vw, 17px);
    font-weight:600;
    letter-spacing:0;
    line-height:1.1;
    font-variant-numeric: tabular-nums;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    text-align:right;
  }

  /* secondary grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, auto);
    justify-content:end;
    gap:20px;
    margin-top:-2px;
  }
  .cell{
    padding:0;
    text-align:left;
  }
  .cell .clabel{ font-size:8px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:3px; }
  .cell .cval{ font-size:14px; color:var(--ink); font-variant-numeric: tabular-nums; }
  body.lang-en .cell .cval{
    text-align:right;
  }
  .cell .cval .unit{ font-size:10px; color:var(--ink-dim); margin-left:2px; }
  .addressBox{
    display:flex;
    align-items:baseline;
    gap:4px;
    min-width:0;
  }
  .addressLabel{
    font-size:11px;
    color:#39FF14;
    flex:none;
  }
  .addressVal{
    font-size:11px;
    color:#FFFFFF;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .msg{
    text-align:center; color:var(--warn); font-size:12px;
    padding:10px 0 0; letter-spacing:.02em; line-height:1.6;
  }

  .infoModalOverlay{
    position:absolute;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .infoModalOverlay.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .infoModal{
    width:95%;
    height:95%;
    background:rgba(20,25,21,0.9);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    overflow-y:auto;
    overflow-x:hidden;
    padding:8px 8px;
    box-sizing:border-box;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--mono);
  }
  .infoLine2{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    color:#39FF14;
    letter-spacing:.04em;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,0.25);
  }
  .gyroBtn{
    display:flex; align-items:center; justify-content:center; gap:4px;
    font-family: var(--mono);
    font-size:10px;
    letter-spacing:.02em;
    text-align:center;
    color:#FFFFFF;
    background:rgba(255,255,255,0.08);
    border:1px solid #FFFFFF;
    border-radius:8px;
    padding:8px 20px;
    -webkit-appearance:none;
    cursor:pointer;
  }
  .gyroBtn:active{
    background:rgba(255,255,255,.2);
  }
  .gyroBtn.enabled{
    color:#39FF14;
    border-color:#39FF14;
    background:rgba(57,255,20,0.15);
  }
  .infoTableView{ display:block; }
  .infoSingleView{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:calc(100% - 30px);
    text-align:center;
    gap:14px;
    position:relative;
    z-index:0;
  }
  .infoModal.singleMode .infoTableView{ display:none; }
  .infoModal.singleMode .infoSingleView{ display:flex; }
  .singleStationName{
    font-size:42px;
    font-weight:400;
    color:#FF0000;
    white-space:normal;
    text-align:center;
    line-height:1.1;
    padding:0 8px;
  }
  .singleStationLine{
    font-size:12px;
    color:#FF9D1F;
    white-space:normal;
    text-align:center;
    line-height:1.3;
    padding:0 8px;
  }
  .singleStationDist{
    font-size:28px;
    font-weight:700;
    color:#22e5e5;
    margin-top:10px;
  }
  .singleStationTime{
    font-size:28px;
    font-weight:700;
    color:#22e5e5;
  }
  .singleStationSpeed{
    font-size:28px;
    font-weight:700;
    color:#22e5e5;
  }
  .singleUnit{
    font-size:14px;
    margin-left:2px;
  }
  .singleStationDirWrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    margin-top:10px;
  }
  .singleStationAddress{
    color:#FFFFFF;
    font-size:16px;
    text-align:center;
    margin-top:14px;
    white-space:pre-line;
    overflow-wrap:break-word;
    word-break:break-all;
    padding:0 8px;
  }
  .singleStationDirWrap .dirArrow{
    border-left-width:12px;
    border-right-width:12px;
    border-bottom-width:39px;
  }
  .gyroActive .singleStationDirWrap .dirArrow{
    border-bottom-color:#39FF14;
  }
  /* 方角の星: ウィンドウ内の任意の位置から発生し、駅の方角へ向けて流れる。3階層で奥ほど暗く・遅い */
  .dirStarField{
    position:absolute;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
    opacity:0.6;
  }
  .dirStar{
    position:absolute;
    top:0; left:0;
    will-change: transform, opacity;
  }
  .dirStar-l0{ background:#FFFFFF; }
  .dirStar-l1{ background:rgba(255,255,255,.55); }
  .dirStar-l2{ background:rgba(255,255,255,.25); }
  .singleStationDirText{
    font-size:20px;
    color:#FFFFFF;
  }
  .singleStationDirText.infoDirSingle{
    font-weight:700;
  }
  .infoStationList{
    overflow-x:auto;
  }
  .infoStationTable{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
    font-family: var(--mono);
  }
  .infoTh{
    font-size:10px;
    color:#39FF14;
    letter-spacing:.02em;
    padding:4px 3px 6px 3px;
    white-space:nowrap;
    vertical-align:top;
    background:rgba(0,255,0,0.2);
    border-bottom:2px solid #39FF14;
  }
  .infoThName{ text-align:left; width:54%; }
  .infoThDist{ text-align:right; width:19%; }
  .infoThTime{ text-align:right; width:14%; }
  .infoThDir{ text-align:center; width:13%; }
  .infoTd{
    padding:8px 3px;
    white-space:nowrap;
    font-size:13px;
    color:#FFFFFF;
    vertical-align:top;
    height:20px;
  }
  .infoRowNear .infoTd{
    background:rgba(57,255,20,0.1);
  }
  .infoSingleView.singleNear{
    background:rgba(57,255,20,0.1);
    border-radius:8px;
  }
  .infoTdName{
    text-align:left;
    white-space:normal;
  }
  .infoNameMain{
    color:#FF0000;
    font-weight:400;
    font-size:16px;
    line-height:1.15;
  }
  .infoTdLine{
    color:#FF9D1F;
    font-size:11px;
    text-align:left;
    white-space:normal;
    line-height:1.1;
    margin-top:1px;
  }
  .infoTdDist{
    color:#22e5e5;
    font-size:13px;
    text-align:right !important;
    white-space:nowrap;
  }
  .infoDistWrap{
    display:block;
    text-align:right;
  }
  .infoUnit{
    font-size:6pt;
  }
  .infoTdTime{
    color:#22e5e5;
    font-size:13px;
    text-align:right;
    white-space:nowrap;
  }
  .infoTdDir{
    color:#FFFFFF;
    font-size:11px;
    text-align:center;
    white-space:nowrap;
  }
  .infoTdDir .dirWrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .dirArrow{
    display:inline-block;
    width:0;
    height:0;
    border-left:4px solid transparent;
    border-right:4px solid transparent;
    border-bottom:13px solid #FFFFFF;
    vertical-align:middle;
  }
  .gyroActive .dirArrow{
    border-bottom-color:#39FF14;
  }
  .dirText{
    vertical-align:middle;
  }
  .infoDirSingle{
    font-weight:700;
  }

  /* leaflet dark-theme tweaks */
  .leaflet-control-zoom a{
    background:rgba(14,18,16,.85) !important;
    color:#FF9D1F !important;
    border-color:#FF9D1F !important;
    border-width:1px !important;
    font-family: var(--mono) !important;
  }
  .leaflet-bar,
  .leaflet-bar a,
  .leaflet-bar a:hover{
    border-color:#FF9D1F !important;
    border-width:1px !important;
  }
  .leaflet-control-attribution{
    background:rgba(14,18,16,.7) !important;
    color:var(--ink-dim) !important;
    font-size:9px !important;
    font-family: var(--mono) !important;
  }
  .leaflet-control-attribution a{ color:var(--brass-dim) !important; }
  .leaflet-container{
    font-family: var(--mono) !important;
  }

  /* crosshair decoration */
  .mark{
    position:fixed; pointer-events:none; opacity:.5;
    color:var(--line);
    font-size:10px;
  }

  /* 言語切替演出: 画面中央にテキストを表示し、左右に広がりながらフェードアウトする */
  .langGimmick{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    text-align:center;
    opacity:0;
    pointer-events:none;
    z-index:9999;
    white-space:nowrap;
  }
  .langGimmick.playing{
    animation: langGimmickFade 2.5s ease-out forwards;
  }
  @keyframes langGimmickFade{
    0%   { opacity:0; }
    8%   { opacity:1; }
    48%  { opacity:1; }
    100% { opacity:0; }
  }
  .langGimmickMain{
    font-family: var(--mono);
    font-size:18px;
    font-weight:700;
    color:#39FF14;
    text-shadow:0 0 12px rgba(57,255,20,0.6);
    letter-spacing:.15em;
  }
  .langGimmick.playing .langGimmickMain{
    animation: langGimmickSpread 2.5s ease-out forwards;
  }
  @keyframes langGimmickSpread{
    0%   { letter-spacing:.15em; }
    48%  { letter-spacing:.15em; }
    100% { letter-spacing:1.8em; }
  }
  .langGimmickFace{
    font-family: var(--mono);
    font-size:16px;
    color:#39FF14;
    margin-top:4px;
  }
  /* 英語モードでは、タイトル以外は太字を使用しない */
  body.lang-en .singleStationDist,
  body.lang-en .singleStationTime,
  body.lang-en .singleStationSpeed,
  body.lang-en .singleStationDirText.infoDirSingle,
  body.lang-en .infoDirSingle,
  body.lang-en .coordItem .value,
  body.lang-en .langGimmickMain{
    font-weight:400;
  }
  body.lang-en .langGimmickMain{
    font-size:22px;
  }
  /* 英語モードでは、ウィンドウ内の距離・徒歩・速度の数字部分を1.5倍に拡大する(単位は対象外) */
  body.lang-en .infoTdDist,
  body.lang-en .infoTdTime{
    font-size:16px;
  }
  body.lang-en .singleStationDist,
  body.lang-en .singleStationTime,
  body.lang-en .singleStationSpeed{
    font-size:38px;
  }
  /* 英語モードでは、ウィンドウ(一覧)の駅名を1.2倍に拡大する */
  body.lang-en .infoNameMain{
    font-size:18px;
  }
  /* 英語モードでは、ウィンドウ(単一駅)の距離・分数・速度の行間を狭くする */
  body.lang-en .singleStationTime,
  body.lang-en .singleStationSpeed{
    margin-top:-6px;
  }

  /* 地図上の駅取得待ちオーバーレイ: 初回・言語切替時、駅名取得が終わるまで中央に表示する */
  .mapWaitOverlay{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    z-index:600;
    text-align:center;
  }
  .mapWaitOverlay.active{
    display:flex;
  }
  .mapWaitText{
    font-family: var(--mono);
    font-size:12px;
    font-weight:700;
    color:#39FF14;
    text-shadow:0 0 10px rgba(57,255,20,0.6);
    letter-spacing:.15em;
    white-space:nowrap;
    margin-top:100px;
    animation: mapWaitPulse 3.5s ease-out infinite;
  }
  body.lang-en .mapWaitText{
    font-weight:400;
  }
  @keyframes mapWaitPulse{
    0%      { opacity:0; letter-spacing:.15em; }
    14.29%  { opacity:1; letter-spacing:.15em; }
    71.43%  { opacity:0; letter-spacing:1em; }
    100%    { opacity:0; letter-spacing:1em; }
  }

  /* 保存済み駅一覧: 画面下部のダブルタップで開く、端末に蓄積された全駅データの一覧 */
  .storedListOverlay{
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition: opacity 0.35s ease, visibility 0.35s ease;
  }
  .storedListOverlay.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
  }
  .storedListModal{
    width:90%;
    height:85%;
    background:rgba(20,25,21,0.95);
    border:1px solid rgba(255,255,255,0.5);
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    overflow-y:auto;
    padding:10px 12px;
    box-sizing:border-box;
    font-family: var(--mono);
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .storedListHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:13px;
    color:#39FF14;
    letter-spacing:.04em;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,0.25);
  }
  .storedListCount{
    color:#FFFFFF;
    font-size:11px;
  }
  .storedListBody{
    overflow-x:auto;
  }
  .storedListEmpty{
    color:var(--ink-dim);
    font-size:13px;
    text-align:center;
    padding:30px 0;
  }
  .storedListTable{
    width:100%;
    min-width:480px;
    border-collapse:collapse;
    font-size:11px;
  }
  .storedListTable th{
    color:#39FF14;
    font-size:10px;
    text-align:left;
    font-weight:400;
    padding:4px 3px;
    border-bottom:1px solid rgba(255,255,255,0.25);
    white-space:nowrap;
    position:sticky;
    top:0;
    background:rgba(20,25,21,0.95);
    cursor:pointer;
    user-select:none;
  }
  .storedListTable td{
    padding:5px 3px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    vertical-align:top;
  }
  .stCol-no{ color:#FFFFFF; text-align:right; white-space:nowrap; }
  .stCol-name{ color:#FF0000; white-space:normal; }
  .stCol-lat, .stCol-lng{ color:#22e5e5; white-space:nowrap; font-variant-numeric: tabular-nums; }
  .stCol-lines{ color:#FF9D1F; white-space:normal; }
  .stCol-dist{ color:#22e5e5; text-align:right; white-space:nowrap; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="head">
      <div class="title" id="titleText">WHERE YOU AT?</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">待機中</span></div>
    </div>

    <div class="coords" id="coordsCloseArea">
      <div class="coordGrid">
        <div class="coordItem">
          <span class="clabel">LAT <span class="hemi" id="latHemi">—</span><br><span class="hemiJa" id="latHemiJa">—</span></span>
          <span class="value" id="latVal">--.------°</span>
        </div>
        <div class="grid">
          <div class="cell">
            <div class="clabel" id="labelAccuracy">精度</div>
            <div class="cval" id="accVal">--<span class="unit">m</span></div>
          </div>
          <div class="cell">
            <div class="clabel" id="labelAltitude">高度</div>
            <div class="cval" id="altVal">--<span class="unit">m</span></div>
          </div>
          <div class="cell">
            <div class="clabel" id="labelSpeed">速度</div>
            <div class="cval" id="spdVal">--<span class="unit">km/h</span></div>

          <span class="clabel">LNG <span class="hemi" id="lngHemi">—</span><br><span class="hemiJa" id="lngHemiJa">—</span></span>
          <span class="value" id="lngVal">--.------°</span>
        </div>
        <div class="addressBox">
          <span class="addressLabel" id="labelWhereAmI">今どこ？</span>
          <span class="addressVal" id="addressVal">情報取得中‥</span>
        </div>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="ticker">
    <div class="tickerTrack" id="tickerTrack">
      <span class="tickerEmpty" id="tickerInitialMsg">電光掲示を準備中‥</span>
    </div>
  </div>

  <div class="mapPane">
    <div id="map"></div>
    <button class="recenterBtn" id="recenterBtn" aria-label="現在地に戻る">◎</button>
    <button class="mapModeBtn" id="mapModeBtn" aria-label="最寄り駅一覧を表示">文字<br>表示</button>
    <button class="grayToggleBtn" id="grayToggleBtn" aria-label="保存済み駅(遠方)の表示切替"></button>

    <div class="mapWaitOverlay" id="mapWaitOverlay">
      <span class="mapWaitText" id="mapWaitText">・・・　しばらくお待ち下さい　・・・</span>
    </div>

    <div class="infoModalOverlay" id="infoModalOverlay">
      <div class="infoModal" id="infoModal">
        <div class="infoLine2">
          <span id="labelNearestStation">最寄り駅</span>
          <button class="gyroBtn" id="gyroBtn" type="button">ジャイロOFF</button>
        </div>
        <div class="infoTableView" id="infoTableView">
          <div class="infoStationList" id="infoStationList"></div>
        </div>
        <div class="infoSingleView" id="infoSingleView">
          <div class="dirStarField" id="dirStarField"></div>
          <div class="singleStationName" id="singleStationName">--</div>
          <div class="singleStationLine" id="singleStationLine">--</div>
          <div class="singleStationDist" id="singleStationDist">--<span class="singleUnit">m</span></div>
          <div class="singleStationTime" id="singleStationTime">--<span class="singleUnit">分</span></div>
          <div class="singleStationSpeed" id="singleStationSpeed">--<span class="singleUnit">km/h</span></div>
          <div class="singleStationDirWrap" id="singleStationDirWrap"></div>
          <div class="singleStationAddress" id="singleStationAddress">--</div>
        </div>
      </div>
    </div>
  </div>

  <div class="statusFoot" id="statusFootCloseArea">
    <span class="mapOverlay" id="stationCountLabel">MAP VIEW</span>
    <span class="fetchStatusLabel" id="fetchStatusLabel">待機中</span>
  </div>

</div>

<div class="langGimmick" id="langGimmick">
  <div class="langGimmickMain" id="langGimmickMain"></div>
  <div class="langGimmickFace">Ｕ(｡╹ ꒳ ╹｡)Ｕ</div>
</div>

<div class="storedListOverlay" id="storedListOverlay">
  <div class="storedListModal" id="storedListModal">
    <div class="storedListHeader">
      <span id="storedListTitle">保存済み駅一覧</span>
      <span class="storedListCount" id="storedListCount"></span>
    </div>
    <div class="storedListBody" id="storedListBody"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // ============================================================
  // 多言語対応(インバウンド向け英語モード)
  // ============================================================
  let currentLang = 'ja'; // 'ja' | 'en' — 地図エリア以外のダブルタップで切り替える

  const I18N = {

      orientationDenied: '方角センサーの利用が許可されませんでした。',
      orientationFailed: '方角センサーを有効化できませんでした。',
      geoNotSupported: 'このブラウザは位置情報に対応していません。',
      pageTitle: '座標計測',
      geoErrPermission: '位置情報の利用が許可されていません。設定から許可してください。',
      geoErrPosition: '位置情報を取得できませんでした。電波状況を確認してください。',
      geoErrTimeout: 'タイムアウトしました。再試行してください。',
      geoErrUnknown: '不明なエラーが発生しました。',
      addressFailed: '取得失敗',
      addressUnknown: '住所不明',
      stationCount: (n) => `駅 ${n}件`,
      stationSuffix: '駅',
      dirs: ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'],
      fsWaitingPosition: '現在地の取得待ち…',
      fsFetchingBasic: '基本駅情報(1〜2km圏)を取得中…',
      fsWaitingNoStation: '待機中だが駅未取得のため再試行…',
      fsWaitingExtLines: (reason) => `待機中(移動量少)だが${reason}のため再試行…`,
      fsExtLinesReflected: '取得完了(拡張・路線名を反映)',
      fsWaitingThinned: '待機中(移動量が少ないため間引き)',
      fsServerSwitch: (i, total) => `基本駅情報を取得中…(サーバー切替 ${i}/${total})`,
      fsBasicToExtended: '基本取得完了 → 拡張情報を準備中…',
      fsFetchingExtended: '拡張駅情報(2〜10km圏)を取得中…',
      fsFetchingLines: '路線名を取得中…',
      fsAllDone: '取得完了(全ての情報を反映済み)',
      fsExtLinesPartialFail: '拡張・路線名の取得は一部失敗(基本の駅名は表示済み)',
      fsBasicDone: '取得完了(基本情報を反映済み)',
      fsFailedRetry: (reason, sec, count) => `取得失敗(${reason}) ${sec}秒後に再試行(${count}回目)`,
      fsUnexpectedError: (sec, count) => `予期しないエラー ${sec}秒後に再試行(${count}回目)`,
      reasonExtNotFetched: '2〜10km圏未取得',
      reasonLinesNotFetched: '路線名未取得',
      reasonTimeout: 'タイムアウト',

    },
    en: {
      statusWaiting: 'Waiting',
      statusReceiving: 'Receiving',
      statusError: 'Error',
      statusAcquiring: 'Acquiring…',
      statusStopped: 'Stopped',
      statusLowAccuracy: (m) => `Low accuracy (skipped ${m}m)`,
      accuracy: 'Accuracy',
      altitude: 'Altitude',
      speed: 'Speed',
      whereAmI: 'Where?',
      acquiringInfo: 'Loading…',
      pleaseWait: '・・・　PLEASE WAIT　・・・',
      storedListTitle: 'Saved Stations',
      storedCount: (n) => `${n}`,
      storedEmpty: 'No saved stations yet',
      tickerPreparing: 'Preparing display…',
      tickerNoStations: 'No stations found within 2km',
      noStationsNearby: 'No stations found nearby',
      near: 'near',
      gyroOff: 'GYRO OFF',
      gyroOn: 'GYRO ON',
      nearestStation: 'Nearest Stations',
      nearestTag: 'Prox.:',
      walk: 'Walk',
      direction: 'Dir.',
      minUnit: 'min',
      recenterLabel: 'Return to current location',
      mapModeAriaLabel: 'Show nearest station list',
      mapModeLabel: 'List<br>View',
      orientationDenied: 'Permission to use the orientation sensor was denied.',
      orientationFailed: 'Could not enable the orientation sensor.',
      geoNotSupported: 'This browser does not support geolocation.',
      pageTitle: 'Coordinate Tracker',
      geoErrPermission: 'Location access was not granted. Please allow it in your settings.',
      geoErrPosition: 'Could not get your location. Please check your signal.',
      geoErrTimeout: 'Request timed out. Please try again.',
      geoErrUnknown: 'An unknown error occurred.',
      addressFailed: 'Failed to load',
      addressUnknown: 'Unknown address',
      stationCount: (n) => `${n} stations`,
      stationSuffix: ' Sta.',
      dirs: ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSW', 'SW', 'WSW', 'W', 'WNW', 'NW', 'NNW'],
      fsWaitingPosition: 'Waiting for GPS position…',
      fsFetchingBasic: 'Fetching nearby stations (1-2km)…',
      fsWaitingNoStation: 'Waiting, retrying (no stations yet)…',
      fsWaitingExtLines: (reason) => `Waiting (moved little), retrying — ${reason}…`,
      fsExtLinesReflected: 'Done (extended range & lines updated)',
      fsWaitingThinned: 'Waiting (moved very little)',
      fsServerSwitch: (i, total) => `Fetching stations… (switching server ${i}/${total})`,
      fsBasicToExtended: 'Basic fetch done → preparing extended range…',
      fsFetchingExtended: 'Fetching extended stations (2-10km)…',
      fsFetchingLines: 'Fetching line names…',
      fsAllDone: 'Done (all data reflected)',
      fsExtLinesPartialFail: 'Extended/line fetch partly failed (basic names shown)',
      fsBasicDone: 'Done (basic data reflected)',
      fsFailedRetry: (reason, sec, count) => `Failed (${reason}), retrying in ${sec}s (attempt ${count})`,
      fsUnexpectedError: (sec, count) => `Unexpected error, retrying in ${sec}s (attempt ${count})`,
      reasonExtNotFetched: 'extended range not fetched',
      reasonLinesNotFetched: 'line names not fetched',
      reasonTimeout: 'timeout',
      reasonUnknown: 'unknown',
    }
  };

  function t(key, ...args){
    const entry = I18N[currentLang][key];
    if(typeof entry === 'function') return entry(...args);
    return entry !== undefined ? entry : key;
  }

  // OSMのタグから、現在の言語に応じた名称を取得する(英語名が無い駅もあるため、日本語名にフォールバックする)
  function getLocalizedName(tags){
    if(!tags) return null;
    if(currentLang === 'en'){
      return tags['name:en'] || tags['name:ja'] || tags.name || null;
    }
    return tags['name:ja'] || tags.name || null;
  }

  // 路線名は、英語名が無い場合に日本語へフォールバックすると読めない駅名以上に分かりにくいため、
  // 英語モードでは英語名(name:en)が無ければ取得しない(呼び出し側で「－」等の代替表示をする)
  function getLocalizedLineName(tags){
    if(!tags) return null;
    if(currentLang === 'en'){
      return tags['name:en'] || null;
    }
    return tags['name:ja'] || tags.name || null;
  }

  // 電光掲示板用の「距離+徒歩時間」表記(言語によって語順・単語が異なるため専用関数にする)
  function formatDistWalk(dist, walkMin){
    if(currentLang === 'en'){
      return `${Math.round(dist)}<span class="tUnit">m (</span>${walkMin}<span class="tUnit">min walk)</span>`;
    }
    return `${Math.round(dist)}<span class="tUnit">m(徒歩</span>${walkMin}<span class="tUnit">分)</span>`;
  }

  const dot = document.getElementById('dot');
  const titleTextEl = document.getElementById('titleText');
  const labelAccuracyEl = document.getElementById('labelAccuracy');
  const labelAltitudeEl = document.getElementById('labelAltitude');
  const labelSpeedEl = document.getElementById('labelSpeed');
  const labelWhereAmIEl = document.getElementById('labelWhereAmI');
  const labelNearestStationEl = document.getElementById('labelNearestStation');
  const tickerInitialMsgEl = document.getElementById('tickerInitialMsg');
  const recenterBtnEl = document.getElementById('recenterBtn');
  const mapModeBtnEl = document.getElementById('mapModeBtn');
  const langGimmickEl = document.getElementById('langGimmick');
  const mapWaitOverlayEl = document.getElementById('mapWaitOverlay');
  const mapWaitTextEl = document.getElementById('mapWaitText');
  const storedListOverlayEl = document.getElementById('storedListOverlay');
  const storedListModalEl = document.getElementById('storedListModal');
  const storedListTitleEl = document.getElementById('storedListTitle');
  const storedListCountEl = document.getElementById('storedListCount');
  const storedListBodyEl = document.getElementById('storedListBody');

  // 地図上の駅取得待ちオーバーレイ: 初回・言語切替時、駅名取得が終わるまで中央に表示する
  function showMapWaitOverlay(){
    if(!mapWaitOverlayEl) return;
    if(mapWaitTextEl) mapWaitTextEl.textContent = t('pleaseWait');
    mapWaitOverlayEl.classList.add('active');
    // display:noneから表示に切り替わった直後は、ブラウザによってはCSSアニメーションの
    // 開始が正しくトリガーされないことがあるため、強制リフローで確実にリスタートさせる
    if(mapWaitTextEl){
      mapWaitTextEl.style.animation = 'none';
      void mapWaitTextEl.offsetWidth;
      mapWaitTextEl.style.animation = '';
    }
  }
  function hideMapWaitOverlay(){
    if(!mapWaitOverlayEl) return;
    mapWaitOverlayEl.classList.remove('active');
  }
  const langGimmickMainEl = document.getElementById('langGimmickMain');

  // 言語切替演出: 切替前の言語(fromLang)に応じて挨拶を表示し、左右に広がりながらフェードアウトさせる
  function playLangGimmick(fromLang){
    if(!langGimmickEl) return;
    if(langGimmickMainEl) langGimmickMainEl.textContent = (fromLang === 'ja') ? 'HELLO' : 'こんにちは';
    langGimmickEl.classList.remove('playing');
    void langGimmickEl.offsetWidth; // 強制リフローで再生を確実にリセットする
    langGimmickEl.classList.add('playing');
  }

  // 言語切り替え時、静的なラベル・ボタン類の表示をまとめて更新する
  function applyStaticLabels(){
    document.title = t('pageTitle');
    document.body.classList.toggle('lang-en', currentLang === 'en');
    if(labelAccuracyEl) labelAccuracyEl.textContent = t('accuracy');
    if(labelAltitudeEl) labelAltitudeEl.textContent = t('altitude');
    if(labelSpeedEl) labelSpeedEl.textContent = t('speed');
    if(labelWhereAmIEl) labelWhereAmIEl.textContent = t('whereAmI');
    if(labelNearestStationEl) labelNearestStationEl.textContent = t('nearestStation');
    if(storedListTitleEl) storedListTitleEl.textContent = t('storedListTitle');
    if(tickerInitialMsgEl) tickerInitialMsgEl.textContent = t('tickerPreparing');
    if(recenterBtnEl) recenterBtnEl.setAttribute('aria-label', t('recenterLabel'));
    if(mapModeBtnEl){
      mapModeBtnEl.setAttribute('aria-label', t('mapModeAriaLabel'));
      mapModeBtnEl.innerHTML = t('mapModeLabel');
    }
    if(gyroBtn) gyroBtn.textContent = gyroListenerAttached ? t('gyroOn') : t('gyroOff');
    if(typeof fetchStatusLabel !== 'undefined' && fetchStatusLabel) fetchStatusLabel.textContent = t('statusWaiting');
  }

  // 言語切り替え本体: 静的ラベルを即座に更新し、駅データ・住所は言語が異なるため再取得する
  function switchLanguage(){
    const fromLang = currentLang;
    currentLang = (currentLang === 'ja') ? 'en' : 'ja';
    applyStaticLabels();
    playLangGimmick(fromLang);

    // ウィンドウ(一覧・単一駅)が開いていれば閉じる
    if(infoModalOverlay && infoModalOverlay.classList.contains('open')){
      closeInfoModal();
    }

    // 駅データ(駅名・路線名)は取得時の言語でキャッシュされているため、切り替え時は再取得する。
    // 表示中の一覧・電光掲示・単一駅欄・地図上のマーカー/矢印も、古い言語のまま残らないよう
    // 一度クリアしてから始める
    clearStations();
    clearStoredStationMarkers();
    // 「HELLO/こんにちは」の演出(2.5秒)と表示が重ならないよう、待機表示は演出が終わってから出す。
    // ただし演出の間に取得が終わっていれば(cachedStationsが埋まっていれば)不要なので出さない
    setTimeout(()=>{
      if(cachedStations.length === 0) showMapWaitOverlay();
    }, 2500);
    try{ updateNearestArrow(null, null); }catch(e){ console.warn('updateNearestArrow clear failed (non-critical):', e); }
    // 予約済みの再試行・間引きタイマーが残っていると、再取得と二重に走ってしまうことがあるため、
    // 一度クリアしてタイマー・失敗カウントをリセットしてから即座に取得をやり直す
    clearTimeout(stationFetchTimer);
    clearTimeout(stationRetryTimer);
    stationFailCount = 0;
    // 切替タイミングで前回の取得が進行中だった場合、実行中フラグが立ったままだと

  // --- タイトルの波打ちアニメーション: 文字ごとにspan分割し、たまにランダムな間隔で波打たせる ---
  (function setupTitleWave(){
    const titleEl = document.getElementById('titleText');
    if(!titleEl) return;
    const text = titleEl.textContent;
    titleEl.innerHTML = '';
    const chars = [];
    for(const ch of text){
      const span = document.createElement('span');
      span.className = 'waveChar';
      span.textContent = ch === ' ' ? '\u00A0' : ch; // 半角スペースはノーブレークスペースにして折り返し崩れを防ぐ
      titleEl.appendChild(span);
      chars.push(span);
    }
    chars.forEach((span)=>{
      span.style.transform = 'translateY(0)';
    });

    const STRETCH_MS = 3000;   // 伸びる/縮む時間(CSSのtransitionと合わせる)
    const STEP_MS = 220;       // 1文字ずつ切り替わる間隔
    const WAVE_ITERATIONS = 3; // 波の繰り返し回数(文字列を先頭から末尾まで1周するのを1回とする)
    const WAVE_GAP_MS = 2000;  // 波と波の間に空ける休止時間
    const UP_PX = -6;   // 現在アクティブな文字の高さ
    const DOWN_PX = 0;  // それ以外の文字の高さ(元の位置より下げない)

    function sleep(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 1周分: 常に1文字だけがUP、それ以外は全てDOWNの状態にし、アクティブな文字を順番に送っていく
    async function triggerSingleWave(){
      for(let idx = 0; idx < chars.length; idx++){
        chars.forEach((span, i)=>{
          span.style.transform = 'translateY(' + (i === idx ? UP_PX : DOWN_PX) + 'px)';
        });
        await sleep(STEP_MS);
      }
      // 1周終えたら全員ニュートラルに戻す
      chars.forEach(span => { span.style.transform = 'translateY(0)'; });
    }

    async function playWave(){
      // 1. 文字間隔を広げる(右に伸びる)
      titleEl.classList.add('stretching');
      await sleep(STRETCH_MS);

      // 2. 休止を挟みながらWAVE_ITERATIONS回、文字送りの波を繰り返す
      for(let i = 0; i < WAVE_ITERATIONS; i++){
        await triggerSingleWave();
        if(i < WAVE_ITERATIONS - 1){
          await sleep(WAVE_GAP_MS);
        }
      }

      // 3. 文字間隔を元に戻す(左に縮む)
      titleEl.classList.remove('stretching');
    }

    function scheduleNextWave(){
      const delay = 10000 + Math.random() * 20000; // アニメーション終了後、10〜30秒空けてから次を再生
      setTimeout(async ()=>{
        await playWave();
        scheduleNextWave();
      }, delay);
    }
    scheduleNextWave();
  })();

  // --- 精度フィルタ & 移動平均 ---
  const MAX_ACCEPT_ACCURACY = 100; // これより精度(誤差半径)が悪い測位は棄却 [m]
  const FORCE_ACCEPT_AFTER = 5;    // 悪い精度でも連続でこの回数棄却したら強制採用
  const SMOOTH_WINDOW = 5;        // 移動平均に使う直近サンプル数
  let recentFixes = [];           // { lat, lng, accuracy } の履歴
  let rejectStreak = 0;           // 精度不足で連続棄却した回数

  function smoothedPosition(lat, lng, accuracy){
    // 直近の平均から大きく離れた場合は「移動した」とみなし履歴をリセット(古い位置に引きずられて動きが鈍く見える問題の対策)
    if(recentFixes.length > 0){
      const last = recentFixes[recentFixes.length - 1];
      const jump = L.latLng(lat, lng).distanceTo([last.lat, last.lng]);
      if(jump > 100){
        recentFixes = [];
      }
    }

    recentFixes.push({ lat, lng, accuracy });
    if(recentFixes.length > SMOOTH_WINDOW) recentFixes.shift();

    // 精度が良いサンプルほど重みを大きくした加重平均
    let wSum = 0, latSum = 0, lngSum = 0;
    recentFixes.forEach(f=>{
      const w = 1 / Math.max(f.accuracy, 5); // 精度(誤差)が小さいほど重み大
      wSum += w;
      latSum += f.lat * w;
      lngSum += f.lng * w;
    });
    return { lat: latSum / wSum, lng: lngSum / wSum };
  }

  // 中心点から指定方位角(度)・距離(m)先の緯度経度を計算(球面上の目的地点)
  function destinationPoint(lat, lng, bearingDeg, distanceM){
    const R = 6378137; // 地球の半径[m]
    const brng = bearingDeg * Math.PI / 180;
    const lat1 = lat * Math.PI / 180;
    const lng1 = lng * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distanceM / R) + Math.cos(lat1) * Math.sin(distanceM / R) * Math.cos(brng));
    const lng2 = lng1 + Math.atan2(
      Math.sin(brng) * Math.sin(distanceM / R) * Math.cos(lat1),
      Math.cos(distanceM / R) - Math.sin(lat1) * Math.sin(lat2)
    );
    return L.latLng(lat2 * 180 / Math.PI, lng2 * 180 / Math.PI);
  }

  function radiusLabelIcon(text, color){

      className: '',

      iconSize: [50, 16],

    });

  function updateMap(lat, lng, accuracy, altitude){

  function handleDeviceOrientation(event){

  function clearStoredStationMarkers(){
    storedStationMarkers.forEach(m => map.removeLayer(m));
    storedStationMarkers = [];
  }

  // 端末に保存されている全駅を地図上に表示する。cachedStations(現在取得中の10km圏、通常の色分け)と
  // 重複する駅は除外し、それ以外を表示する。10km以内は通常の距離別配色、10kmを超えるものはグレーにする。
  let showGrayStations = false; // 10kmを超える保存済み駅(グレー)の表示ON/OFF(初期は非表示)

  function renderStoredStationsOnMap(origin){
    clearStoredStationMarkers();
    if(!origin) return;
    const stored = loadStoredStations();
    if(stored.length === 0) return;
    const activeIds = new Set(cachedStations.map(s => s.id));
    stored.forEach(s=>{
      if(activeIds.has(s.id)) return; // 既にcachedStations側のマーカーで表示済み
      const dist = origin.distanceTo([s.lat, s.lng]);
      const isFar = dist > STATION_RADIUS_XFAR;
      if(isFar && !showGrayStations) return; // グレー表示OFFなら遠方の駅はスキップ
      const color = isFar ? COLOR_STORED_FAR : colorForStationDistance(dist);
      const m = L.marker([s.lat, s.lng], { icon: stationIcon(s.name, color, s.lines), interactive:false }).addTo(map);
      storedStationMarkers.push(m);
    });
  }

  // 駅名が1件でも取得できていれば「文字表示」ボタンを表示・有効化する。取得できていなければ隠す。
  function updateMapModeBtnVisibility(){
    if(!mapModeBtn) return;
    if(cachedStations.length > 0){
      mapModeBtn.style.display = 'flex';
      if(grayToggleBtn) grayToggleBtn.style.display = 'flex';
    } else {
      mapModeBtn.style.display = 'none';
      if(grayToggleBtn) grayToggleBtn.style.display = 'none';
    }
  }

  function stationIcon(name, color, lines){
    const lineText = (lines && lines.length > 0)
      ? lines.slice(0, 2).join(' / ') + (lines.length > 2 ? ' 他' : '')
      : '';
    const lineHtml = lineText
      ? `<div class="lineName" style="color:#fff; --label-color:${color};">${lineText}</div>`
      : '';
    return L.divIcon({
      className: 'station-label',
      html: '<div class="pin" style="background:'+color+'"></div><div class="name" style="color:#fff; --label-color:'+color+';">'+name+'</div>' + lineHtml,
      iconSize: [140, 48],
      iconAnchor: [70, 4]
    });
  }

  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter'
  ];

  function fetchWithTimeout(url, ms){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), ms);
    return fetch(url, {
      signal: controller.signal,
      headers: { 'Accept': 'application/json' }
    }).finally(()=> clearTimeout(timer));
  }

  // --- 住所表示(逆ジオコーディング / Nominatim) ---
  let lastAddressCenter = null;
  let lastAddressFetchTime = 0;
  const ADDRESS_MIN_DISTANCE = 15;   // これ以上動いたら再取得 [m]
  const ADDRESS_MIN_INTERVAL = 5000; // 最短でもこの間隔は空ける [ms] (Nominatimの利用ポリシー上、あまり短くしすぎない)
  let isFetchingStations = false; // 駅取得と住所取得のネットワーク処理が重ならないようにする排他フラグ
  let isFetchingExtended = false; // 拡張取得(10km圏)・路線名取得の重複実行を防ぐフラグ(Overpassの同時実行制限対策)
  let hasFetchedLines = false; // 路線名取得(fetchStationLines)が一度でも何らかの路線名を反映できたか
  let hasFetchedExtended = false; // 拡張取得(2〜10km圏)が一度でも成功したか
  let stationFetchAttempted = false; // 一度でも駅取得を開始したか(最初の駅取得より前に住所取得が走らないようにする)

  // --- 駅情報のローカル蓄積(通信削減): 一度取得した駅は端末に保存し、同じ場所を再訪した際や
  //     オフライン時にOverpassへ問い合わせずに表示できるようにする。言語ごとに別キーで保存する。
  const STATION_STORAGE_KEY_PREFIX = 'whereyouat_stations_';
  const STATION_STORAGE_MAX = 3000; // 保存件数の上限(localStorage容量対策のための概算値)

  function getStationStorageKey(){
    return STATION_STORAGE_KEY_PREFIX + currentLang;
  }

  function loadStoredStations(){
    try{
      const raw = localStorage.getItem(getStationStorageKey());
      if(!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    }catch(e){
      console.warn('loadStoredStations failed (non-critical):', e);
      return [];
    }
  }

  // 新しく取得した駅データを、既存の蓄積データにマージして保存する(駅IDで重複排除、最新の情報で上書き)
  function saveStoredStations(newStations){
    if(!newStations || newStations.length === 0) return;
    try{
      const existing = loadStoredStations();
      const map = new Map(existing.map(s => [s.id, s]));
      newStations.forEach(s=>{
        if(s.id != null){
          map.set(s.id, { id:s.id, name:s.name, lat:s.lat, lng:s.lng, lines:s.lines });
        }
      });
      let merged = Array.from(map.values());
      if(merged.length > STATION_STORAGE_MAX){
        merged = merged.slice(merged.length - STATION_STORAGE_MAX); // 古い分から間引く
      }
      localStorage.setItem(getStationStorageKey(), JSON.stringify(merged));
    }catch(e){
      console.warn('saveStoredStations failed (non-critical, storage may be full):', e);
    }
  }

  // 蓄積データのうち、指定した中心から半径内にあるものだけを返す
  function getStoredStationsNear(originLatLng, radiusM){
    const stored = loadStoredStations();
    return stored.filter(s=>{
      const d = originLatLng.distanceTo([s.lat, s.lng]);
      return d <= radiusM;
    });
  }

  async function fetchAddress(lat, lng){
    try{
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&accept-language=${currentLang}`;
      const res = await fetchWithTimeout(url, 12000);
      if(!res.ok) return;
      const data = await res.json();
      let addressText;
      let singleAddressText;
      if(data && data.address){
        const a = data.address;
        // 都道府県・市区町村・町名・丁目・番地までの基本住所と、道路名・建物名を分けて組み立てる。
        // 「丁目」に相当する情報はNominatim(OSM)側のデータ整備状況によって
        // neighbourhood/quarter以外(residential/hamlet/city_districtなど)に入っていることがあるため、
        // より多くの候補フィールドを見るようにする
        const baseParts = [
          a.state,
          a.city || a.town || a.village || a.county,
          a.suburb || a.city_district || a.borough,
          a.neighbourhood || a.quarter || a.residential || a.hamlet,
          a.house_number
        ].filter(Boolean);
        // amenityタグには「カフェ」「レストラン」等の店舗・飲食店も分類されるため(OSMではshopではなくamenityになることが多い)、
        // Nominatimが返すその地点の分類(data.type)を見て、店舗・飲食店系なら建物名の候補から除外する
        const SHOP_LIKE_TYPES = ['cafe','restaurant','fast_food','bar','pub','bakery','ice_cream','food_court','biergarten','nightclub'];
        const isShopLikePOI = SHOP_LIKE_TYPES.includes(data.type);
        const roadBuildingParts = [
          a.road,
          (a.amenity && !isShopLikePOI) ? a.amenity : (a.building || a.tourism || a.leisure)
        ].filter(Boolean);

        const baseAddress = baseParts.length > 0 ? baseParts.join(' ') : (data.display_name || t('addressUnknown'));
        const roadBuilding = roadBuildingParts.join(' ');

        // 電光表示エリア: 従来通り1行で全て繋げる
        addressText = baseAddress + ' ' + t('near') + (roadBuilding ? ' ' + roadBuilding : '');
        // ウィンドウ(単一駅): 1行目「住所 付近」、2行目「道路 建物施設」の2行形式(英語モードでは2行目を省略)
        singleAddressText = (roadBuilding && currentLang === 'ja') ? (baseAddress + ' ' + t('near') + '\n' + roadBuilding) : (baseAddress + ' ' + t('near'));
      } else {
        addressText = t('addressUnknown');
        singleAddressText = t('addressUnknown');
      }
      addressVal.textContent = addressText;
      if(singleStationAddressEl) singleStationAddressEl.textContent = singleAddressText;
    }catch(e){
      console.warn('fetchAddress (Nominatim fallback) failed:', e);
      addressVal.textContent = t('addressFailed');
      if(singleStationAddressEl) singleStationAddressEl.textContent = t('addressFailed');
    }
  }

  function refreshAddressIfNeeded(lat, lng){
    // 拡張取得(2〜10km圏)・路線名取得は数十秒かかることもあり、これでブロックし続けると住所取得が
    // 事実上止まってしまうため、基本の駅取得(通常は数秒で完了)中のみ住所取得を待たせる
    if(isFetchingStations || !stationFetchAttempted) return;
    const now = Date.now();
    const current = L.latLng(lat, lng);
    if(lastAddressCenter){
      const moved = lastAddressCenter.distanceTo(current);
      if(moved < ADDRESS_MIN_DISTANCE && (now - lastAddressFetchTime) < ADDRESS_MIN_INTERVAL){
        return; // 移動が小さく、時間も経っていなければスキップ
      }
    }
    lastAddressCenter = current;
    lastAddressFetchTime = now;
    fetchAddress(lat, lng);
  }

  const STATION_RADIUS_NEAR = 1000; // 蛍光赤 [m]
  const STATION_RADIUS_FAR  = 2000; // 蛍光オレンジ [m]
  const STATION_RADIUS_XFAR = 10000; // 蛍光ブルー(これを超えると非表示) [m]
  const COLOR_NEAR = '#ff3b3b'; // 蛍光赤
  const COLOR_FAR  = '#ff9d1f'; // 蛍光オレンジ
  const COLOR_XFAR = '#25A2FF'; // 蛍光ブルー(2001m〜5000m)
  const COLOR_STORED_FAR = '#888888'; // グレー(保存済み駅のうち10kmを超えるもの)

  function colorForStationDistance(dist){
    if(dist <= STATION_RADIUS_NEAR) return COLOR_NEAR;
    if(dist <= STATION_RADIUS_FAR) return COLOR_FAR;
    return COLOR_XFAR;
  }

  const tickerTrack = document.getElementById('tickerTrack');

  let lastTickerKey = null; // 直近表示した駅の並び順(名前ベース)を記録し、変化がなければアニメーションを再スタートさせない

  function formatLineName(lines){
    if(!lines || lines.length === 0) return currentLang === 'en' ? '－' : '';
    let joined = lines.slice(0,2).join('/') + (lines.length > 2 ? (currentLang === 'en' ? ' etc.' : '他') : '');
    if(joined.length > 10) joined = joined.slice(0, 9) + '‥';
    return joined;
  }

  // 単一駅モードでは省略せず全路線名をそのまま表示する
  function formatLineNameFull(lines){
    if(!lines || lines.length === 0) return currentLang === 'en' ? '－' : '';
    return lines.join(' / ');
  }

  // 2点間の方位角(度)を計算し、8方位の文字列に変換する
  function calculateBearing(lat1, lng1, lat2, lng2){
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const dLng = toRad(lng2 - lng1);
    const y = Math.sin(dLng) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
    const brng = toDeg(Math.atan2(y, x));
    return (brng + 360) % 360;
  }
  function bearingToDirection(bearing){
    const dirs = t('dirs');
    return dirs[Math.round(bearing / 22.5) % 16];
  }

  // 三角形の描画角度を計算する: デバイスの向きが分かっていれば、そのデバイスの正面を0度とした相対角度にする
  // (実際にスマホを回すと、駅の方向を指すように動く)。分からなければ真北基準のまま。
  function displayBearing(bearing){
    if(deviceHeading == null) return bearing;
    return ((bearing - deviceHeading) % 360 + 360) % 360;
  }

  const infoStationListEl = document.getElementById('infoStationList');
  const infoSingleViewEl = document.getElementById('infoSingleView');
  const singleStationNameEl = document.getElementById('singleStationName');
  const singleStationLineEl = document.getElementById('singleStationLine');
  const singleStationDistEl = document.getElementById('singleStationDist');
  const singleStationTimeEl = document.getElementById('singleStationTime');
  const singleStationSpeedEl = document.getElementById('singleStationSpeed');
  const singleStationDirWrapEl = document.getElementById('singleStationDirWrap');
  const dirStarFieldEl = document.getElementById('dirStarField');

  // 方角の星: 常に同じ星を保持したまま位置を毎フレーム更新し、方角・速度が変わっても
  // その場から新しい方向へ移動を続けるようにする(全部作り直すとリセットされたように見えるため)
  const DIR_STAR_TOTAL = 20;
  const DIR_STAR_LAYERS = 3;
  const DIR_STAR_BASE_SPEED = [70, 45, 28]; // 各階層の基準px/秒(手前ほど速い)
  let dirStars = []; // { el, layer, x, y }
  let dirStarBearingDeg = null;
  let dirStarSpeedScale = 2.4;
  let dirStarRafId = null;
  let dirStarLastTime = null;

  function computeStarSpeedScaleAndBracket(){
    let speedScale, speedBracket = 0;
    if(currentSpeedKmh == null || currentSpeedKmh < 5){
      speedScale = 2.4; // 最低速度(値なし・0〜5km/hはとくにゆっくり)
    } else {
      const MAX_BRACKET = 19; // 5km刻みで100km/hまで
      speedBracket = Math.min(Math.floor(currentSpeedKmh / 5), MAX_BRACKET);
      const startScale = 1.0;
      const minScale = 0.25;
      speedScale = startScale - (startScale - minScale) * ((speedBracket - 1) / (MAX_BRACKET - 1));
    }
    return { speedScale, speedBracket };
  }

  function initDirStars(){
    if(!dirStarFieldEl) return;
    dirStarFieldEl.innerHTML = '';
    dirStars = [];
    const { speedBracket } = computeStarSpeedScaleAndBracket();
    const starSize = 3 + speedBracket;
    const w = dirStarFieldEl.clientWidth || 300;
    const h = dirStarFieldEl.clientHeight || 300;
    for(let i = 0; i < DIR_STAR_TOTAL; i++){
      const layer = i % DIR_STAR_LAYERS;
      const el = document.createElement('div');
      el.className = 'dirStar dirStar-l' + layer;
      el.style.width = starSize + 'px';
      el.style.height = starSize + 'px';
      dirStarFieldEl.appendChild(el);
      dirStars.push({ el, layer, x: Math.random() * w, y: Math.random() * h });
    }
  }

  function dirStarTick(now){
    if(!dirStarFieldEl || dirStars.length === 0 || dirStarBearingDeg == null){
      dirStarRafId = null;
      return;
    }
    if(dirStarLastTime == null) dirStarLastTime = now;
    const deltaSec = Math.min(0.1, (now - dirStarLastTime) / 1000);
    dirStarLastTime = now;

    const w = dirStarFieldEl.clientWidth || 300;
    const h = dirStarFieldEl.clientHeight || 300;
    const rad = dirStarBearingDeg * Math.PI / 180;
    const dx = Math.sin(rad);
    const dy = -Math.cos(rad); // 北(0度)=画面上方向
    const moveX = -dx, moveY = -dy; // 星は方角の方から流れてくる(移動方向は方角ベクトルの逆)
    const trailPx = 3 + (2.4 - dirStarSpeedScale) * 6;
    const shadowAlpha = [0.35, 0.2, 0.1];

    dirStars.forEach(star=>{
      const speedPxPerSec = DIR_STAR_BASE_SPEED[star.layer] / dirStarSpeedScale;
      star.x += moveX * speedPxPerSec * deltaSec;
      star.y += moveY * speedPxPerSec * deltaSec;
      const margin = 24;
      if(star.x < -margin || star.x > w + margin || star.y < -margin || star.y > h + margin){
        // 画面外に出たら、中心付近から方角寄りにオフセットした新しい位置から再度流れてくる
        star.x = w/2 + dx * 60 + (Math.random() - 0.5) * w * 0.7;
        star.y = h/2 + dy * 60 + (Math.random() - 0.5) * h * 0.7;
      }
      star.el.style.transform = `translate(${star.x.toFixed(1)}px, ${star.y.toFixed(1)}px)`;
      star.el.style.boxShadow = `${(dx*trailPx).toFixed(1)}px ${(dy*trailPx).toFixed(1)}px 0 0 rgba(255,255,255,${shadowAlpha[star.layer]})`;
    });

    dirStarRafId = requestAnimationFrame(dirStarTick);
  }

  function startDirStarLoop(){
    if(dirStarRafId != null) return;
    dirStarLastTime = null;
    dirStarRafId = requestAnimationFrame(dirStarTick);
  }

  function stopDirStars(){
    if(dirStarRafId != null){
      cancelAnimationFrame(dirStarRafId);
      dirStarRafId = null;
    }
    dirStars = [];
    if(dirStarFieldEl) dirStarFieldEl.innerHTML = '';
    dirStarBearingDeg = null;
  }

  // 方角・速度を更新する。星自体は作り直さず、既存の位置から新しい方向・速度で動き続けさせる
  function updateDirStars(bearingDeg){
    if(!dirStarFieldEl) return;
    if(bearingDeg == null){
      stopDirStars();
      return;
    }
    const { speedScale, speedBracket } = computeStarSpeedScaleAndBracket();
    dirStarSpeedScale = speedScale;
    dirStarBearingDeg = bearingDeg;
    if(dirStars.length === 0){
      initDirStars();
    } else {
      const starSize = 3 + speedBracket;
      dirStars.forEach(star=>{
        star.el.style.width = starSize + 'px';
        star.el.style.height = starSize + 'px';
      });
    }
    startDirStarLoop();
  }
  const singleStationAddressEl = document.getElementById('singleStationAddress');

  function updateInfoModal(){
    if(!infoStationListEl) return;
    if(!marker) return;

    const origin = marker.getLatLng();
    const nearby = cachedStations
      .map(s => ({ name: s.name, dist: origin.distanceTo([s.lat, s.lng]), lines: s.lines, lat: s.lat, lng: s.lng }));

    if(!nearby || nearby.length === 0){
      infoStationListEl.innerHTML = `<div style="color:var(--ink-dim); font-size:13px;">${t('noStationsNearby')}</div>`;
      if(infoSingleViewEl) infoSingleViewEl.classList.remove('singleNear');
      if(singleStationNameEl) singleStationNameEl.textContent = '‥';
      if(singleStationLineEl) singleStationLineEl.textContent = '‥';

      if(singleStationTimeEl) singleStationTimeEl.innerHTML = '‥<span class="singleUnit">' + t('minUnit') + '</span>';
      if(singleStationSpeedEl) singleStationSpeedEl.innerHTML = (currentSpeedKmh != null ? currentSpeedKmh.toFixed(1) : '‥') + '<span class="singleUnit">km/h</span>';
      if(singleStationDirWrapEl) singleStationDirWrapEl.innerHTML = '';
      stopDirStars();
      return;
    }
    const top3 = nearby.slice().sort((a,b)=> a.dist - b.dist).slice(0, 9);

    // 単一駅表示(一番近い駅)の更新
    const nearest = top3[0];
    if(nearest){
      const nearestLineNameJoined = formatLineNameFull(nearest.lines);
      const nearestWalkMin = Math.round(nearest.dist / 80);
      let nearestDirText = '‥';
      let nearestBearing = null;
      if(origin && nearest.lat != null && nearest.lng != null){
        nearestBearing = calculateBearing(origin.lat, origin.lng, nearest.lat, nearest.lng);
        nearestDirText = bearingToDirection(nearestBearing);
      }
      const nearestDirClass = nearestDirText.length === 1 ? 'infoDirSingle' : '';

        : '';
      if(infoSingleViewEl) infoSingleViewEl.classList.toggle('singleNear', nearest.dist <= 200);
      if(singleStationNameEl) singleStationNameEl.innerHTML = nearest.name + '<span class="stationSuffixSmall">' + t('stationSuffix') + '</span>';
      if(singleStationLineEl) singleStationLineEl.textContent = nearestLineNameJoined || '‥';
      if(singleStationDistEl) singleStationDistEl.innerHTML = Math.round(nearest.dist).toLocaleString('ja-JP') + '<span class="singleUnit">m</span>';
      if(singleStationTimeEl) singleStationTimeEl.innerHTML = nearestWalkMin + '<span class="singleUnit">' + t('minUnit') + '</span>';
      if(singleStationSpeedEl) singleStationSpeedEl.innerHTML = (currentSpeedKmh != null ? currentSpeedKmh.toFixed(1) : '‥') + '<span class="singleUnit">km/h</span>';
      if(singleStationDirWrapEl){
        singleStationDirWrapEl.innerHTML = `${nearestDirArrowHtml}<span class="singleStationDirText ${nearestDirClass}">${nearestDirText}</span>`;
      }
      // 方角の星: 位置は保持したまま、方角・速度だけを更新する
      if(nearestBearing != null){
        updateDirStars(displayBearing(nearestBearing));
      } else {
        stopDirStars();
      }
    }

    const rowsHtml = top3.map((s, idx)=>{
      const lineNameJoined = formatLineName(s.lines);
      const walkMin = Math.round(s.dist / 80);
      let dirText = '‥';
      let bearing = null;
      if(origin && s.lat != null && s.lng != null){
        bearing = calculateBearing(origin.lat, origin.lng, s.lat, s.lng);
        dirText = bearingToDirection(bearing);
      }
      const dirClass = dirText.length === 1 ? 'infoDirSingle' : '';
      const dirArrowHtml = bearing != null
        ? `<span class="dirArrow" style="transform:rotate(${displayBearing(bearing)}deg);"></span>`
        : '';
      const rowClass = s.dist <= 200 ? 'infoRowNear' : '';
      return `<tr class="${rowClass}">
        <td class="infoTd infoTdName">
          <div class="infoNameMain">${s.name}<span class="stationSuffixSmall">${t('stationSuffix')}</span></div>
          <div class="infoTdLine">${lineNameJoined || '‥'}</div>
        </td>
        <td class="infoTd infoTdDist"><span class="infoDistWrap">${Math.round(s.dist).toLocaleString('ja-JP')}<span class="infoUnit">m</span></span></td>
        <td class="infoTd infoTdTime">${walkMin}<span class="infoUnit">${t('minUnit')}</span></td>
        <td class="infoTd infoTdDir ${dirClass}"><span class="dirWrap">${dirArrowHtml}<span class="dirText">${dirText}</span></span></td>
      </tr>`;
    }).join('');

    infoStationListEl.innerHTML = `<table class="infoStationTable">
      <thead>
        <tr>
          <th class="infoTh infoThName">${currentLang === 'en' ? 'Station' : '駅名'}</th>
