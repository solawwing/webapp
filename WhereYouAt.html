          <th class="infoTh infoThTime">${t('walk')}</th>
          <th class="infoTh infoThDir">${t('direction')}</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  function updateTicker(nearby){
    if(!nearby || nearby.length === 0){
      lastTickerKey = null;
      tickerTrack.innerHTML = `<span class="tickerEmpty">${t('tickerNoStations')}</span>`;
      tickerTrack.style.animation = 'none';
      return;
    }
    const top3 = nearby.slice().sort((a,b)=> a.dist - b.dist).slice(0, 3);
    const key = top3.map(s => s.name).join('|');

    if(key === lastTickerKey){
      // 駅の並び順に変化なし: アニメーションを止めずに距離・徒歩分の数字、路線名だけを更新する
      const itemEls = tickerTrack.querySelectorAll('.tickerItem');
      const distEls = tickerTrack.querySelectorAll('.tDist');
      const total = top3.length;
      distEls.forEach((el, i)=>{
        const s = top3[i % total];
        const walkMin = Math.round(s.dist / 80);
        el.innerHTML = formatDistWalk(s.dist, walkMin);
      });
      itemEls.forEach((el, i)=>{
        const s = top3[i % total];
        el.classList.toggle('near-blink', s.dist <= 200);

        // 路線名は後から非同期で届くことがあるため、既存要素の有無に関わらず反映する
        const lineNameJoined = formatLineName(s.lines);
        let lineEl = el.querySelector('.tLine');
        if(lineNameJoined){
          if(!lineEl){
            lineEl = document.createElement('span');
            lineEl.className = 'tLine';
            const nameEl = el.querySelector('.tName');
            if(nameEl) nameEl.insertAdjacentElement('afterend', lineEl);
          }
          lineEl.textContent = lineNameJoined;
        } else if(lineEl){
          lineEl.remove();
        }
      });
      return;
    }
    lastTickerKey = key;

    const circledNumbers = ['①', '②', '③'];
    const itemsHtml = top3.map((s, idx)=>{
      const lineNameJoined = formatLineName(s.lines);
      const lineText = lineNameJoined ? '<span class="tLine">' + lineNameJoined + '</span>' : '';
      const walkMin = Math.round(s.dist / 80); // 徒歩1分=80mとして換算(整数)
      const nearestTag = idx === 0 ? `<span class="tNearest">${t('nearestTag')}</span>` : '';
      const blinkClass = s.dist <= 200 ? ' near-blink' : '';
      const distText = formatDistWalk(s.dist, walkMin);
      const num = '<span class="tSep">' + circledNumbers[idx % circledNumbers.length] + '</span>';
      return `<span class="tickerItem${blinkClass}">${num}${nearestTag}<span class="tName">${s.name}<span class="stationSuffixSmall">${t('stationSuffix')}</span></span>${lineText}<span class="tDist">${distText}</span></span>`;
    }).join('');

    // シームレスループのため2回連結
    tickerTrack.innerHTML = itemsHtml + itemsHtml;

    // コンテンツ量に応じて速度を調整(短すぎず長すぎない一定速度になるよう)
    const approxWidth = top3.reduce((sum, s)=> sum + s.name.length * 14 + 90, 0);
    const duration = Math.max(10, (approxWidth * 2) / 60); // おおよそ60px/秒
    tickerTrack.style.animation = `ticker-scroll ${duration}s linear infinite`;
  }

  let cachedStations = []; // { name, lat, lng, lines } 直近取得した駅の生データ(距離を都度再計算するため)

  // --- 最寄り駅への矢印: requestAnimationFrameで「線が伸びて到達→フェードアウト」を矢印の先端と完全同期させる ---
  let arrowControlPoints = null; // { p0, p1, p2, cosLat } 現在の曲線制御点(GPS更新のたびに差し替え)
  let arrowAnimId = null;
  let arrowAnimStart = null;
  const ARROW_CYCLE_MS = 2600;   // 1周期
  const ARROW_DRAW_END = 0.6;    // このタイミングで線が最寄り駅に到達

  function bezierPoint(p0, p1, p2, t){
    return {
      x: (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x,
      y: (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y
    };
  }

  function arrowAnimFrame(ts){
    if(!arrowControlPoints){ arrowAnimId = null; return; }
    if(!arrowAnimStart) arrowAnimStart = ts;
    const cycle = ((ts - arrowAnimStart) % ARROW_CYCLE_MS) / ARROW_CYCLE_MS; // 0〜1

    const { p0, p1, p2, cosLat } = arrowControlPoints;

    let drawT, opacity;
    if(cycle < ARROW_DRAW_END){
      drawT = cycle / ARROW_DRAW_END; // 線が伸びる進行度 0〜1
      opacity = drawT; // 現在地(薄い/透明)→最寄り駅(濃い/不透明)へ徐々にフェードイン
    } else {
      drawT = 1;
      opacity = 1 - (cycle - ARROW_DRAW_END) / (1 - ARROW_DRAW_END); // 到達後、最寄り駅側からフェードアウト
    }

    // 現在の進行度(drawT)まで曲線を点列化(矢印の先端はこの曲線の終点と常に一致する)
    const steps = 24;
    const linePoints = [];
    for(let i = 0; i <= steps; i++){
      const t = (i / steps) * drawT;
      const pt = bezierPoint(p0, p1, p2, t);
      linePoints.push(L.latLng(pt.y, pt.x / cosLat));
    }
    const tip = linePoints[linePoints.length - 1];

    // 接線方向(矢印の向き)
    const tangentX = 2*(1-drawT)*(p1.x-p0.x) + 2*drawT*(p2.x-p1.x);
    const tangentY = 2*(1-drawT)*(p1.y-p0.y) + 2*drawT*(p2.y-p1.y);
    const angleDeg = Math.atan2(tangentX, tangentY) * 180 / Math.PI;

    if(!nearestArrowLine){
      nearestArrowLine = L.polyline(linePoints, { color: '#39FF14', weight: 5, smoothFactor: 1, pane: 'arrowPane' }).addTo(map);
      if(nearestArrowLine.bringToFront) nearestArrowLine.bringToFront();
    } else {
      nearestArrowLine.setLatLngs(linePoints);
    }
    const pathEl = nearestArrowLine._path;
    if(pathEl) pathEl.style.opacity = String(opacity);

    if(!nearestArrowHead){
      const arrowIcon = L.divIcon({
        className: '',
        html: `<div class="arrow-head-inner" style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #39FF14;transform:rotate(${angleDeg}deg);transform-origin:center center;"></div>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
      nearestArrowHead = L.marker(tip, { icon: arrowIcon, interactive:false, pane: 'arrowPane' }).addTo(map);
    } else {
      nearestArrowHead.setLatLng(tip);
      const el = nearestArrowHead.getElement();
      const inner = el ? el.querySelector('.arrow-head-inner') : null;
      if(inner) inner.style.transform = `rotate(${angleDeg}deg)`;
      if(el) el.style.opacity = String(opacity);
    }

    arrowAnimId = requestAnimationFrame(arrowAnimFrame);
  }

  // 現在地から最寄り駅方向への矢印(放物線の制御点だけを更新する軽量な関数。実際の描画はrequestAnimationFrameループが担当)
  function updateNearestArrow(originLatLng, nearestLatLng){
    if(!originLatLng || !nearestLatLng){
      arrowControlPoints = null;
      if(arrowAnimId){ cancelAnimationFrame(arrowAnimId); arrowAnimId = null; }
      if(nearestArrowLine){ map.removeLayer(nearestArrowLine); nearestArrowLine = null; }
      if(nearestArrowHead){ map.removeLayer(nearestArrowHead); nearestArrowHead = null; }
      return;
    }

    // 緯度による経度方向の縮尺差を補正した簡易平面座標(短距離のみ対象なので十分な精度)
    const latRad = originLatLng.lat * Math.PI / 180;
    const cosLat = Math.cos(latRad) || 1;

    const p0 = { x: originLatLng.lng * cosLat, y: originLatLng.lat };
    const p2 = { x: nearestLatLng.lng * cosLat, y: nearestLatLng.lat };

    const dx = p2.x - p0.x;
    const dy = p2.y - p0.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1e-9;

    // 駅の方角に関わらず、放物線の頂点(制御点)は常に画面上側(北方向)に膨らませる
    const bulge = dist * 0.28 * 1.5; // 膨らみ量(距離の28%、高さは従来の1.5倍)
    const p1 = { x: (p0.x + p2.x) / 2, y: (p0.y + p2.y) / 2 + bulge };

    arrowControlPoints = { p0, p1, p2, cosLat };

    if(!arrowAnimId){
      arrowAnimStart = null;
      arrowAnimId = requestAnimationFrame(arrowAnimFrame);
    }
  }

  function refreshTickerDistances(){
    if(!marker || cachedStations.length === 0) return;
    const origin = marker.getLatLng();
    const nearby = cachedStations
      .map(s => ({ name: s.name, dist: origin.distanceTo([s.lat, s.lng]), lines: s.lines, lat: s.lat, lng: s.lng }))
      .filter(s => s.dist <= STATION_RADIUS_XFAR);
    updateTicker(nearby);
    try{ updateInfoModal(); }catch(modalErr){ console.warn('updateInfoModal failed (non-critical):', modalErr); }

    try{
      if(nearby.length > 0){
        const nearest = nearby.slice().sort((a,b)=> a.dist - b.dist)[0];
        updateNearestArrow(origin, L.latLng(nearest.lat, nearest.lng));
      } else {
        updateNearestArrow(null, null);
      }
    }catch(arrowErr){
      console.warn('updateNearestArrow failed (non-critical):', arrowErr);
    }
  }

  let preferredEndpointIndex = 0; // 直近成功したエンドポイントを優先する

  function orderedEndpoints(){
    const list = OVERPASS_ENDPOINTS.slice();
    const [preferred] = list.splice(preferredEndpointIndex, 1);
    return preferred ? [preferred, ...list] : list;
  }

  // 2km〜10km圏の駅は失敗しても基本表示(1km/2km圏)に影響しないよう、別途ベストエフォートで取得
  async function fetchExtendedStations(origin){
    // サーバー側で「10km圏 - 2km圏」の差分だけを取得し、レスポンスを軽量化する
    const query = `[out:json][timeout:15];
      (
        node["railway"="station"](around:${STATION_RADIUS_XFAR},${origin.lat},${origin.lng});
        -
        node["railway"="station"](around:${STATION_RADIUS_FAR},${origin.lat},${origin.lng});
      );
      out body;`;

    for(const endpoint of orderedEndpoints()){
      try{
        const res = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(query), 20000);
        if(!res.ok) continue;
        const data = await res.json();
        const stationNodes = (data.elements || []).filter(el => el.type === 'node' && el.tags && el.tags.railway === 'station');
        if(stationNodes.length === 0){
          hasFetchedExtended = true; // クエリ自体は成功(該当範囲に駅が無かっただけ)
          return;
        }

        // 基本取得(cachedStations)に、まだ含まれていない駅だけ追加する
        const existingIds = new Set(cachedStations.map(s => s.id));
        let addedCount = 0;
        stationNodes.forEach(el=>{
          if(existingIds.has(el.id)) return; // 既に基本取得(2km圏)で描画済み
          const name = getLocalizedName(el.tags);
          if(!name) return;
          const dist = origin.distanceTo([el.lat, el.lon]);
          if(dist > STATION_RADIUS_XFAR) return; // 念のための保険(サーバー側で既に絞り込み済み)
          // networkタグは日本語の事業者名(例:"都営地下鉄")であることが多く、英語モードでフォールバック
          // 表示すると分かりにくいため、日本語モードのときだけ暫定の路線名として使う
          const lines = (currentLang === 'ja' && el.tags.network) ? [el.tags.network] : [];
          cachedStations.push({ name, lat: el.lat, lng: el.lon, lines, id: el.id });
          const color = colorForStationDistance(dist);
          const m = L.marker([el.lat, el.lon], { icon: stationIcon(name, color, lines), interactive:false }).addTo(map);
          stationMarkers.push(m);
          addedCount++;
        });
        if(addedCount > 0){
          mapOverlay.textContent = t('stationCount', cachedStations.length);
          saveStoredStations(cachedStations); // 通信削減のため端末に蓄積しておく
          renderStoredStationsOnMap(origin); // 保存済み駅(10km超も含め全件)を地図上に表示
          try{ refreshTickerDistances(); }catch(e){ console.warn('refreshTickerDistances failed (non-critical):', e); }
        }
        hasFetchedExtended = true; // 拡張取得(2〜10km圏)に成功
        return; // 成功したらそこで終了(他のエンドポイントは試さない)
      }catch(e){
        console.warn('fetchExtendedStations endpoint failed (non-critical):', endpoint, e);
      }
    }
  }

  // 路線名はベストエフォートで後追い取得(失敗しても駅表示自体には影響しない)
  async function fetchStationLines(origin){
    try{
      const stationNodes = cachedStations; // {name, lat, lng, lines, id} の配列(基本取得のレスポンスに依存しない)
      // まずエリア内の駅ノードを.stationsとして取得し、それらのいずれかをメンバーに含む
      // route relationだけに絞り込む(back-reference)。これにより無関係な路線を除外しつつ、
      // 大江戸線のような駅数の多い環状路線でも、対象駅を含むrelationを確実に拾いやすくする。
      const lineQuery = `[out:json][timeout:20];
        node["railway"="station"](around:${STATION_RADIUS_XFAR},${origin.lat},${origin.lng})->.stations;
        rel(bn.stations)["type"="route"]["route"~"^(train|subway|light_rail)$"];
        out body;`;

      let data = null;
      for(const endpoint of orderedEndpoints()){
        try{
          const res = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(lineQuery), 25000);
          if(!res.ok) continue;
          data = await res.json();
          break;
        }catch(e){
          console.warn('fetchStationLines endpoint failed (non-critical):', endpoint, e);
        }
      }
      if(!data) return;
      const routeRelations = (data.elements || []).filter(el => el.type === 'relation');
      if(routeRelations.length === 0) return;

      const stationIdToLines = new Map();
      routeRelations.forEach(rel=>{
        const lineName = getLocalizedLineName(rel.tags) || (rel.tags && rel.tags.ref) || null;
        if(!lineName) return;
        (rel.members || []).forEach(mem=>{
          if(mem.type !== 'node') return;
          if(!stationIdToLines.has(mem.ref)) stationIdToLines.set(mem.ref, new Set());
          stationIdToLines.get(mem.ref).add(lineName);
        });
        const relText = [rel.tags.from, rel.tags.to, rel.tags.via].filter(Boolean).join(' ');
        if(relText){
          stationNodes.forEach(st=>{
            const stName = st.name || '';
            if(stName && relText.includes(stName)){
              if(!stationIdToLines.has(st.id)) stationIdToLines.set(st.id, new Set());
              stationIdToLines.get(st.id).add(lineName);
            }
          });
        }
      });

      if(stationIdToLines.size === 0) return;

      // キャッシュと地図上のラベルに路線名を反映
      cachedStations.forEach(s=>{
        const lineSet = stationIdToLines.get(s.id);
        if(lineSet){
          lineSet.forEach(l => { if(!s.lines.includes(l)) s.lines.push(l); });
        }
      });
      hasFetchedLines = true; // 路線名の反映に成功した(次回以降、移動量が少なくても再取得を控えられる)
      try{ refreshTickerDistances(); }catch(e){ console.warn('refreshTickerDistances failed (non-critical):', e); }

      // 地図上のラベルも路線名付きで再描画(失敗しても既存ラベルが消えたままにならないよう、新規描画が全て成功した場合のみ置き換える)
      try{
        const origin2 = marker.getLatLng();
        const newMarkers = [];
        cachedStations.forEach(s=>{
          const dist = origin2.distanceTo([s.lat, s.lng]);
          if(dist > STATION_RADIUS_XFAR) return;
          const color = colorForStationDistance(dist);
          const m = L.marker([s.lat, s.lng], { icon: stationIcon(s.name, color, s.lines), interactive:false });
          newMarkers.push(m);
        });
        clearStations();
        newMarkers.forEach(m=>{ m.addTo(map); stationMarkers.push(m); });
      }catch(e){
        console.warn('station label redraw failed (non-critical, existing labels kept):', e);
      }
    }catch(e){
      console.warn('fetchStationLines failed (non-critical):', e);
    }
  }

  // 端末に蓄積済みの駅データがあれば、それを使って地図・電光掲示・一覧・矢印を即座に表示する。
  // 通信開始前(体感速度向上)と、通信が全て失敗した場合の代替表示の両方で使う。
  // 既に駅データが1件でもあれば何もしない(戻り値: 表示できたらtrue)
  // 保存済み駅一覧モーダル: 端末に蓄積された全駅データを、現在地からの距離順に一覧表示する
  let storedListSortKey = null; // 'id' | 'name' | 'lat' | 'lng' | 'lines' | null(No.=保存順)
  let storedListSortAsc = true;

  function openStoredListModal(){
    if(!storedListOverlayEl) return;
    // 開くたびに、近い順(距離昇順)で表示し直す
    storedListSortKey = 'dist';
    storedListSortAsc = true;
    renderStoredList();
    // 前回開いた時のスクロール位置が残らないよう、先頭に戻す
    if(storedListModalEl) storedListModalEl.scrollTop = 0;
    storedListOverlayEl.classList.add('open');
  }

  function renderStoredList(){
    let stored = loadStoredStations();
    const origin = marker ? marker.getLatLng() : null;
    // 現在地からの距離を各駅に付与しておく(表示・ソート両方で使う)
    stored = stored.map(s => ({ ...s, dist: origin ? origin.distanceTo([s.lat, s.lng]) : null }));

    if(storedListSortKey){
      const key = storedListSortKey;
      stored = stored.slice().sort((a, b)=>{
        let av, bv;
        if(key === 'lines'){
          av = (a.lines && a.lines[0]) || '';
          bv = (b.lines && b.lines[0]) || '';
        } else if(key === 'dist'){
          av = (a.dist == null ? Infinity : a.dist);
          bv = (b.dist == null ? Infinity : b.dist);
        } else {
          av = a[key];
          bv = b[key];
        }
        let cmp;
        if(typeof av === 'string' || typeof bv === 'string'){
          cmp = String(av).localeCompare(String(bv));
        } else {
          cmp = (av - bv);
        }
        return storedListSortAsc ? cmp : -cmp;
      });
    }

    if(storedListCountEl) storedListCountEl.textContent = t('storedCount', stored.length);
    if(!storedListBodyEl) return;
    if(stored.length === 0){
      storedListBodyEl.innerHTML = `<div class="storedListEmpty">${t('storedEmpty')}</div>`;
      return;
    }
    const rowsHtml = stored.map((s, i)=>{
      const lineText = (s.lines && s.lines.length > 0) ? s.lines.join(' / ') : '';
      const distText = s.dist != null ? Math.round(s.dist).toLocaleString('ja-JP') + 'm' : '‥';
      return `<tr>
        <td class="stCol-no">${i + 1}</td>
        <td class="stCol-name">${s.name}</td>
        <td class="stCol-lat">${s.lat.toFixed(5)}</td>
        <td class="stCol-lng">${s.lng.toFixed(5)}</td>
        <td class="stCol-lines">${lineText}</td>
        <td class="stCol-dist">${distText}</td>
      </tr>`;
    }).join('');
    // No.は保存順に戻すための特別列(ソートキー'no'扱い)。それ以外は矢印でソート方向を示す
    const arrow = (key)=> storedListSortKey === key ? (storedListSortAsc ? ' ▲' : ' ▼') : '';
    storedListBodyEl.innerHTML = `<table class="storedListTable">
      <thead>
        <tr>
          <th class="stCol-no" data-sort="no">No.${storedListSortKey === null ? ' ▲' : ''}</th>
          <th class="stCol-name" data-sort="name">${currentLang === 'en' ? 'Name' : '駅名'}${arrow('name')}</th>
          <th class="stCol-lat" data-sort="lat">Lat${arrow('lat')}</th>
          <th class="stCol-lng" data-sort="lng">Lng${arrow('lng')}</th>
          <th class="stCol-lines" data-sort="lines">${currentLang === 'en' ? 'Lines' : '路線名'}${arrow('lines')}</th>
          <th class="stCol-dist" data-sort="dist">${currentLang === 'en' ? 'Dist.' : '距離'}${arrow('dist')}</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;

    // 列見出しタップでソート切替(No.は保存順に戻す専用)
    storedListBodyEl.querySelectorAll('th[data-sort]').forEach(th=>{
      th.addEventListener('click', (ev)=>{
        ev.stopPropagation(); // モーダルを閉じる処理に伝播させない
        const key = th.getAttribute('data-sort');
        if(key === 'no'){
          storedListSortKey = null;
        } else if(storedListSortKey === key){
          storedListSortAsc = !storedListSortAsc;
        } else {
          storedListSortKey = key;
          storedListSortAsc = true;
        }
        renderStoredList();
      });
    });
  }
  function closeStoredListModal(){
    if(storedListOverlayEl) storedListOverlayEl.classList.remove('open');
  }
  if(storedListOverlayEl){
    storedListOverlayEl.addEventListener('click', ()=>{ closeStoredListModal(); });
  }

  function showStoredStationsFallback(origin){
    if(cachedStations.length > 0) return false;
    const stored = getStoredStationsNear(origin, STATION_RADIUS_XFAR);
    if(stored.length === 0) return false;
    clearStations();
    cachedStations = stored.slice();
    const nearby = [];
    stored.forEach(s=>{
      const dist = origin.distanceTo([s.lat, s.lng]);
      if(dist > STATION_RADIUS_XFAR) return;
      const color = colorForStationDistance(dist);
      const m = L.marker([s.lat, s.lng], { icon: stationIcon(s.name, color, s.lines), interactive:false }).addTo(map);
      stationMarkers.push(m);
      nearby.push({ name:s.name, dist, lines:s.lines, lat:s.lat, lng:s.lng });
    });
    mapOverlay.textContent = nearby.length > 0 ? t('stationCount', nearby.length) : 'MAP VIEW';
    hideMapWaitOverlay();
    updateMapModeBtnVisibility();
    try{ updateTicker(nearby); }catch(tickerErr){ console.warn('updateTicker failed (non-critical):', tickerErr); }
    try{ updateInfoModal(); }catch(modalErr){ console.warn('updateInfoModal failed (non-critical):', modalErr); }
    try{
      if(nearby.length > 0){
        const nearest = nearby.slice().sort((a,b)=> a.dist - b.dist)[0];
        updateNearestArrow(origin, L.latLng(nearest.lat, nearest.lng));
      }
    }catch(arrowErr){ console.warn('updateNearestArrow failed (non-critical):', arrowErr); }
    renderStoredStationsOnMap(origin); // 10kmを超える保存済み駅もグレーで併せて表示
    return true;
  }

  async function fetchStations(){
    if(isFetchingStations) return; // 既に実行中なら重複実行しない
    isFetchingStations = true;
    stationFetchAttempted = true;
    try{
      if(!marker){ setFetchStatus(t('fsWaitingPosition')); return; }

      const origin = marker.getLatLng(); // 現在地(GPS)中心

      // 端末に蓄積済みの駅データがあれば、Overpassとの通信を待たずに先に表示しておく(体感速度の向上)。
      // この後の通信が成功すれば、最新のデータで上書き・追加される
      showStoredStationsFallback(origin);

      // 定期実行・地図移動など、fetchStationsが呼ばれたことが分かるよう一旦「取得中」を表示する
      setFetchStatus(t('fsFetchingBasic'));

      // 速度が速い(20km/h以上)、または速度が取得できていない場合は間引き距離を広めに(200m)、
      // それ以外(低速で移動中)は細かく再取得できるよう狭めに(100m)する
      const stationSkipDistance = (currentSpeedKmh == null || currentSpeedKmh >= 20) ? 200 : 100;
      if(lastStationCenter && lastStationCenter.distanceTo(origin) < stationSkipDistance){
        if(cachedStations.length === 0){
          // 駅データが1件も無いなら、間引きせず通常通り取得を続行する
          setFetchStatus(t('fsWaitingNoStation'));
        } else if(!hasFetchedExtended || !hasFetchedLines){
          // 駅(基本)はあるが、拡張(2〜10km圏)または路線名がまだ反映されていない場合、
          // 基本取得はやり直さず(せっかく取得済みのデータが失われないよう)拡張・路線名取得だけ再試行する
          const reason = !hasFetchedExtended ? t('reasonExtNotFetched') : t('reasonLinesNotFetched');
          setFetchStatus(t('fsWaitingExtLines', reason));
          if(!isFetchingExtended){
            isFetchingExtended = true;
            fetchExtendedStations(origin).then(()=>{
              return fetchStationLines(origin);
            }).then(()=>{
              setFetchStatus(t('fsExtLinesReflected'));
            }).catch(e=>{
              console.warn('retry fetchExtendedStations/fetchStationLines failed (non-critical):', e);
            }).finally(()=>{
              isFetchingExtended = false;
            });
          }
          return;
        } else {
          setFetchStatus(t('fsWaitingThinned'));
          return; // 駅・拡張・路線名とも揃っているので、現在地がほぼ動いていなければAPI再取得は間引く
        }
      }

      // まず駅ノードのみを軽量取得(路線リレーションは含めない: レスポンスを軽くして成功率を上げる)
      const stationQuery = `[out:json][timeout:10];node["railway"="station"](around:${STATION_RADIUS_FAR},${origin.lat},${origin.lng});out body;`;

      let succeeded = false;
      let lastError = null;
      const endpoints = orderedEndpoints();
      for(let i = 0; i < endpoints.length; i++){
        const endpoint = endpoints[i];
        try{
          if(i > 0) setFetchStatus(t('fsServerSwitch', i+1, endpoints.length));
          // クライアント側の待機時間は、クエリ内のサーバー側timeout(10秒)より必ず長くする
          const res = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(stationQuery), 14000);
          if(!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          clearStations();

          const stationNodes = (data.elements || []).filter(el => el.type === 'node' && el.tags && el.tags.railway === 'station');

          let count = 0;
          const nearby = []; // { name, dist, lines, lat, lng }
          cachedStations = [];
          hasFetchedLines = false; // 駅データを作り直したので、路線名も改めて未取得の状態に戻す
          hasFetchedExtended = false; // 拡張取得(2〜10km圏)も改めて未取得の状態に戻す
          stationNodes.forEach(el=>{
            const name = getLocalizedName(el.tags);
            if(!name) return;
            const dist = origin.distanceTo([el.lat, el.lon]);
            const lines = (currentLang === 'ja' && el.tags.network) ? [el.tags.network] : [];
            cachedStations.push({ name, lat: el.lat, lng: el.lon, lines, id: el.id });
            if(dist > STATION_RADIUS_XFAR) return; // 10km超は非表示
            const color = colorForStationDistance(dist);
            const m = L.marker([el.lat, el.lon], { icon: stationIcon(name, color, lines), interactive:false }).addTo(map);
            stationMarkers.push(m);
            nearby.push({ name, dist, lines, lat: el.lat, lng: el.lon });
            count++;
          });
          mapOverlay.textContent = count > 0 ? t('stationCount', count) : 'MAP VIEW';
          hideMapWaitOverlay(); // 駅名取得(基本)が完了したので待機表示を消す
          saveStoredStations(cachedStations); // 通信削減のため端末に蓄積しておく
          renderStoredStationsOnMap(origin); // 保存済み駅(10km超も含め全件)を地図上に表示
          setFetchStatus(t('fsBasicToExtended'));
          updateMapModeBtnVisibility();
          try{ updateTicker(nearby); }catch(tickerErr){ console.warn('updateTicker failed (non-critical):', tickerErr); }
          try{ updateInfoModal(); }catch(modalErr){ console.warn('updateInfoModal failed (non-critical):', modalErr); }
          try{
            if(nearby.length > 0){
              const nearest = nearby.slice().sort((a,b)=> a.dist - b.dist)[0];
              updateNearestArrow(origin, L.latLng(nearest.lat, nearest.lng));
            } else {
              updateNearestArrow(null, null);
            }
          }catch(arrowErr){
            console.warn('updateNearestArrow failed (non-critical):', arrowErr);
          }
          lastStationCenter = origin; // 成功時のみ記録(失敗時は次回も必ず再試行させる)
          clearTimeout(stationRetryTimer);
          stationFailCount = 0;
          succeeded = true;

          // 使えたエンドポイントを次回優先にする
          preferredEndpointIndex = OVERPASS_ENDPOINTS.indexOf(endpoint);
          if(preferredEndpointIndex < 0) preferredEndpointIndex = 0;

          // 基本の駅名(1km/2km圏)はここまでで確定・表示済み。以降の拡張取得・路線名取得は
          // バックグラウンドで続けるが、住所取得をブロックし続けないようフラグはここで先に解除する。
          isFetchingStations = false;

          // 2km〜10km圏の駅、路線名は、同じサーバーへの同時リクエストを避けるため順番に実行する
          // (失敗しても基本の駅表示には影響しないベストエフォート処理。Overpassは同時実行数が
          //  厳しく制限されているため、既に実行中なら重複させない)
          if(!isFetchingExtended){
            isFetchingExtended = true;
            setFetchStatus(t('fsFetchingExtended'));
            fetchExtendedStations(origin).then(()=>{
              setFetchStatus(t('fsFetchingLines'));
              return fetchStationLines(origin);
            }).then(()=>{
              setFetchStatus(t('fsAllDone'));
            }).catch(()=>{
              setFetchStatus(t('fsExtLinesPartialFail'));
            }).finally(()=>{
              isFetchingExtended = false;
            });
          } else {
            setFetchStatus(t('fsBasicDone'));
          }
          break;
        }catch(e){
          lastError = e;
          console.warn('overpass endpoint failed:', endpoint, e);
        }
      }
      if(!succeeded){
        stationFailCount++;
        const reason = lastError ? (lastError.name === 'AbortError' ? t('reasonTimeout') : lastError.message) : t('reasonUnknown');
        const backoff = Math.min(30000, 3000 * Math.pow(2, stationFailCount - 1));
        setFetchStatus(t('fsFailedRetry', reason, Math.round(backoff/1000), stationFailCount));

        // 通信に失敗し、まだ駅データが無ければ、端末に蓄積済みのデータで代替表示する(通信削減・オフライン対応)
        showStoredStationsFallback(origin);

        clearTimeout(stationRetryTimer);
        // 連続失敗するほど間隔を伸ばす(3秒→6秒→12秒...最大30秒): 過度な連打によるレート制限を避ける
        stationRetryTimer = setTimeout(fetchStations, backoff);
      }
    }catch(e){
      console.error('fetchStations error:', e);
      stationFailCount++;
      const backoff = Math.min(30000, 3000 * Math.pow(2, stationFailCount - 1));
      setFetchStatus(t('fsUnexpectedError', Math.round(backoff/1000), stationFailCount));
      clearTimeout(stationRetryTimer);
      stationRetryTimer = setTimeout(fetchStations, backoff);
    }finally{
      isFetchingStations = false;
    }
  }

  map.on('moveend', ()=>{
    clearTimeout(stationFetchTimer);
    stationFetchTimer = setTimeout(fetchStations, 1500);
  });

  function fmtCoord(v){
    const abs = Math.abs(v);
    return abs.toFixed(6) + '°';
  }


  function onPosition(pos){
    const c = pos.coords;
    lastErrorCode = null; // GPSが正常に受信できたので、直近のエラー状態を解除する

    // 精度の悪い測位は原則棄却するが、一定回数連続したら強制的に採用する(GPSが止まって見える問題の対策)
    if(c.accuracy != null && c.accuracy > MAX_ACCEPT_ACCURACY && rejectStreak < FORCE_ACCEPT_AFTER){
      rejectStreak++;
      dot.className = 'dot low';
      statusText.textContent = t('statusLowAccuracy', Math.round(c.accuracy));
      accVal.innerHTML = Math.round(c.accuracy) + '<span class="unit">m</span>';
      return;
    }
    rejectStreak = 0;

    dot.className = 'dot live';
    statusText.textContent = t('statusReceiving');
    msg.textContent = '';

    const smoothed = smoothedPosition(c.latitude, c.longitude, c.accuracy || 30);

    latVal.textContent = fmtCoord(smoothed.lat);
    lngVal.textContent = fmtCoord(smoothed.lng);
    latHemi.textContent = smoothed.lat >= 0 ? 'N' : 'S';
    latHemiJa.textContent = currentLang === 'en' ? '' : (smoothed.lat >= 0 ? '北緯' : '南緯');
    lngHemi.textContent = smoothed.lng >= 0 ? 'E' : 'W';
    lngHemiJa.textContent = currentLang === 'en' ? '' : (smoothed.lng >= 0 ? '東経' : '西経');

    accVal.innerHTML = (c.accuracy != null ? Math.round(c.accuracy) : '--') + '<span class="unit">m</span>';
    altVal.innerHTML = (c.altitude != null ? Math.round(c.altitude) : '--') + '<span class="unit">m</span>';
    // GPSのspeedフィールドは、ブラウザ・デバイスによって取得できないことが多いため、
    // その場合は前回位置からの移動距離と経過時間から自前で速度を推定するフォールバックを設ける
    const nowMs = Date.now();
    if(c.speed != null){
      currentSpeedKmh = c.speed * 3.6;
    } else if(lastSpeedCalcPos){
      const distM = L.latLng(smoothed.lat, smoothed.lng).distanceTo([lastSpeedCalcPos.lat, lastSpeedCalcPos.lng]);
      const dtSec = (nowMs - lastSpeedCalcPos.time) / 1000;
      // 極端に短い/長い間隔は測位ノイズの影響が大きく信頼できないため、算出対象から除外する
      currentSpeedKmh = (dtSec >= 1 && dtSec <= 15) ? (distM / dtSec) * 3.6 : null;
    } else {
      currentSpeedKmh = null;
    }
    lastSpeedCalcPos = { lat: smoothed.lat, lng: smoothed.lng, time: nowMs };
    const kmh = currentSpeedKmh != null ? currentSpeedKmh.toFixed(1) : '--';
    spdVal.innerHTML = kmh + '<span class="unit">km/h</span>';

    // 一定速度以上で移動中はGPSの進行方向(heading)を向きとして優先する(静止中はコンパスセンサー側に任せる)
    if(currentSpeedKmh != null && currentSpeedKmh >= HEADING_SPEED_THRESHOLD && c.heading != null && !isNaN(c.heading)){
      deviceHeading = c.heading;
    }

    updateMap(smoothed.lat, smoothed.lng, c.accuracy, c.altitude);
    refreshTickerDistances(); // 通信を伴わない軽量処理: GPS移動のたびに距離表示だけ更新
    // 住所取得はGPS更新の同期処理から切り離し、少し遅延させて実行する(他のネットワーク処理との競合を避けるため)
    setTimeout(()=>{
      try{ refreshAddressIfNeeded(smoothed.lat, smoothed.lng); }catch(addrErr){ console.warn('refreshAddressIfNeeded failed (non-critical):', addrErr); }
    }, 50);
  }

  let lastErrorCode = null; // 直近のGeolocationエラーコード(言語切替時にメッセージを再表示するため)

  function onError(err){
    dot.className = 'dot err';
    statusText.textContent = t('statusError');
    lastErrorCode = err.code;
    const messages = {
      1: t('geoErrPermission'),
      2: t('geoErrPosition'),
      3: t('geoErrTimeout')
    };
    msg.textContent = messages[err.code] || t('geoErrUnknown');
    stop();
  }

  function start(){
    if(!('geolocation' in navigator)){
      msg.textContent = t('geoNotSupported');
      return;
    }
    recentFixes = [];
    rejectStreak = 0;
    dot.className = 'dot';
    statusText.textContent = t('statusAcquiring');
    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 15000
    });
  }

  function stop(){
    if(watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if(dot.className !== 'dot err'){
      dot.className = 'dot';
      statusText.textContent = t('statusStopped');
    }
  }

  // auto start on load
  start();

  setTimeout(()=> map.invalidateSize(), 200);
  setTimeout(()=> map.invalidateSize(), 800); // レイアウト確定の遅延分の保険
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=> map.invalidateSize()); // Webフォント読み込みで高さが変わるケースに対応
  }
  window.addEventListener('resize', ()=> map.invalidateSize());
  window.addEventListener('orientationchange', ()=> setTimeout(()=> map.invalidateSize(), 300));

  // .mapPane自体のサイズ変化(共有シートの開閉、アドレスバーの表示切替等)にも追従
  if(window.ResizeObserver){
    const mapPaneEl = document.querySelector('.mapPane');
    if(mapPaneEl){
      const ro = new ResizeObserver(()=> map.invalidateSize());
      ro.observe(mapPaneEl);
    }
  }

  setTimeout(fetchStations, 500);
  // 駅情報の再取得はGPS更新とは無関係に、一定間隔(10秒)だけで判断する
  // (GPS更新のたびにトリガーすると通信処理がGPS表示の体感速度を妨げるため分離)
  setInterval(fetchStations, 10000);
</script>
</body>
</html>
