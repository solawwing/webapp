<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>座標計測</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0e1210;
    --panel:#141915;
    --line:#2a332c;
    --ink:#e8ecdf;
    --ink-dim:#7c8a76;
    --brass:#c8a24a;
    --brass-dim:#8a7038;
    --ok:#5fae6e;
    --warn:#c96a4a;
    --mono: "BIZ UDPGothic", "SF Mono","Consolas","Menlo",monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #1a2118 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family: var(--mono);
    overflow:hidden;
    overscroll-behavior:none;
  }
  .wrap{
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .top{
    flex:0 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 18px 0;
  }
  .ticker{
    flex:0 0 auto;
    height:26px;
    background:#000;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    position:relative;
  }
  .tickerTrack{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change: transform;
    animation: none;
  }
  .tickerTrack .tickerEmpty{
    color:#ff2df2;
    font-size:11px;
    letter-spacing:.1em;
    padding-left:18px;
  }
  .tickerItem{
    display:inline-flex;
    align-items:baseline;
    gap:0;
    padding:0 28px 0 0;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.04em;
    color:#ff9d1f;
    text-shadow:0 0 4px currentColor;
  }
  .tickerItem .tName{ font-weight:400; font-size:14px; color:#FF0000; margin-right:6px; }
  .tickerItem .tDist{ color:#22e5e5; font-size:14px; margin-left:6px; }
  .tickerItem .tDist .tUnit{ font-size:9px; }
  .tickerItem.near-blink{
    animation: dist-blink 0.8s step-start infinite;
  }
  @keyframes dist-blink{
    0%, 49%   { opacity: 1; }
    50%, 100% { opacity: 0.1; }
  }
  .tickerItem .tLine{ color:#FF9D1F; font-size:9px; margin-right:6px; }
  .tickerItem .tSep{ color:#FFFFFF; font-size:14px; padding-right:0; }
  .tickerItem .tNearest{ color:#39FF14; font-size:14px; margin-right:2px; }
  @keyframes ticker-scroll{
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .mapPane{
    flex:1 1 auto;
    min-height:160px;
    position:relative;
    border-top:1px solid var(--line);
  }
  #map{
    position:absolute; inset:0;
    background:var(--panel);
  }
  #map .leaflet-tile-pane{
    filter: grayscale(0.9) sepia(0.15) hue-rotate(190deg) saturate(1.3) brightness(.52) contrast(1.2);
  }
  #map .leaflet-marker-pane,
  #map .leaflet-marker-pane *,
  #map .leaflet-overlay-pane,
  #map .leaflet-overlay-pane *,
  #map .leaflet-arrowPane-pane,
  #map .leaflet-arrowPane-pane *{
    filter:none;
  }
  .station-label{
    background:transparent; border:none;
  }
  .station-label .pin{
    width:8px; height:8px; border-radius:50%;
    background:#ff2d95;
    margin:0 auto 3px;
  }
  .station-label .name{
    font-family: var(--mono);
    font-size:14px;
    font-weight:700;
    letter-spacing:.03em;
    white-space:nowrap;
    text-align:center;
    background:rgba(0,0,0,0.2);
    padding:0px 3px;
    border-radius:4px;
    display:block;
    width:fit-content;
    margin:0 auto;
    text-shadow:
      1px 0 0 #fff, -1px 0 0 #fff,
      0 1px 0 #fff, 0 -1px 0 #fff,
      1px 1px 0 #fff, -1px 1px 0 #fff,
      1px -1px 0 #fff, -1px -1px 0 #fff;
  }
  .station-label .lineName{
    font-family: var(--mono);
    font-size:9px;
    font-weight:600;
    letter-spacing:.02em;
    white-space:nowrap;
    text-align:center;
    background:rgba(0,0,0,0.2);
    padding:0px 3px;
    border-radius:4px;
    display:block;
    width:fit-content;
    margin:0 auto;
    text-shadow:
      1px 0 0 #fff, -1px 0 0 #fff,
      0 1px 0 #fff, 0 -1px 0 #fff,
      1px 1px 0 #fff, -1px 1px 0 #fff,
      1px -1px 0 #fff, -1px -1px 0 #fff;
  }
  .statusFoot{
    flex:0 0 auto;
    min-height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    padding-bottom:env(safe-area-inset-bottom);
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .mapOverlay{
    font-size:9px; letter-spacing:.15em; text-transform:uppercase;
    color:#FFFFFF;
  }
  .versionLabel{
    font-size:9px; letter-spacing:.05em;
    color:#FFFFFF;
    font-family: var(--mono);
  }
  .recenterBtn{
    position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px; z-index:500;
    width:38px; height:38px; border-radius:2px;
    background:rgba(14,18,16,.85); border:1px solid #FF9D1F;
    color:#FF9D1F; display:flex; align-items:center; justify-content:center;
    font-size:16px; -webkit-appearance:none;
  }
  .recenterBtn:active{ background:rgba(255,157,31,.15); }

  /* header */
  .head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-bottom:8px; margin-bottom:10px;
    border-bottom:1px solid var(--line);
    letter-spacing:.12em;
  }
  .head .title{ font-size:11px; color:#22e5e5; text-transform:uppercase; }
  .head .status{ font-size:10px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); flex:none; }
  .dot.live{ background:var(--ok); box-shadow:0 0 6px var(--ok); animation:pulse 2s infinite; }
  .dot.err{ background:var(--warn); box-shadow:0 0 6px var(--warn); }
  .dot.low{ background:var(--warn); box-shadow:0 0 6px var(--warn); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes ripple{
    0%   { transform:scale(0.2); opacity:.7; }
    100% { transform:scale(1);   opacity:0; }
  }
  .pulse-ring{
    position:absolute;
    top:50%; left:50%;
    width:54px; height:54px;
    margin-top:-27px; margin-left:-27px;
    border-radius:50%;
    background: currentColor;
    box-sizing:border-box;
    animation: ripple 2.2s ease-out infinite;
    transform-origin: center center;
  }
  .pulse-ring-delay{
    animation-delay: 1.1s;
  }

  /* main coordinate display */
  .coords{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .coordGrid{
    display:grid;
    grid-template-columns: auto 1fr;
    align-items:center;
    row-gap:6px;
    column-gap:16px;
  }
  .coordItem{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .coordItem .clabel{
    font-size:9px; letter-spacing:.12em; color:var(--ink-dim);
    text-transform:uppercase; flex:none;
    line-height:1.4;
    text-align:left;
  }
  .coordItem .hemi{ color:#39FF14; }
  .coordItem .hemiJa{
    color:#39FF14;
    font-size:9px;
    letter-spacing:.08em;
  }
  .coordItem .value{
    font-size:clamp(13px, 4.4vw, 17px);
    font-weight:600;
    letter-spacing:0;
    line-height:1.1;
    font-variant-numeric: tabular-nums;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    text-align:right;
  }

  /* secondary grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, auto);
    justify-content:end;
    gap:20px;
    margin-top:-2px;
  }
  .cell{
    padding:0;
    text-align:left;
  }
  .cell .clabel{ font-size:8px; letter-spacing:.15em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:3px; }
  .cell .cval{ font-size:14px; color:var(--ink); font-variant-numeric: tabular-nums; }
  .cell .cval .unit{ font-size:10px; color:var(--ink-dim); margin-left:2px; }
  .addressBox{
    display:flex;
    align-items:baseline;
    gap:4px;
    min-width:0;
  }
  .addressLabel{
    font-size:11px;
    color:#39FF14;
    flex:none;
  }
  .addressVal{
    font-size:11px;
    color:#FFFFFF;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .msg{
    text-align:center; color:var(--warn); font-size:12px;
    padding:10px 0 0; letter-spacing:.05em; line-height:1.6;
  }

  #coordsTapArea{
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #coordsTapArea:active{
    opacity:.85;
  }

  .infoModalOverlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,0.55);
    align-items:center;
    justify-content:center;
  }
  .infoModalOverlay.open{
    display:flex;
  }
  .infoModal{
    width:85%;
    height:85%;
    max-width:85vw;
    max-height:85vh;
    background:rgba(20,25,21,0.9);
    border:1px solid #ffffff;
    border-radius:14px;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
    overflow-y:auto;
    padding:18px;
    box-sizing:border-box;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
    font-family: var(--mono);
  }
  .infoLine1{
    font-size:15px;
    color:var(--ink);
    letter-spacing:.05em;
    margin-bottom:6px;
  }
  .infoAddress{
    font-size:20px;
    font-weight:700;
    color:#FFFFFF;
    letter-spacing:.03em;
    margin-bottom:22px;
    line-height:1.4;
  }
  .infoLine2{
    font-size:14px;
    color:#39FF14;
    letter-spacing:.08em;
    margin-bottom:10px;
    padding-bottom:6px;
    border-bottom:1px solid rgba(255,255,255,0.25);
  }
  .infoStationList{
    overflow-x:auto;
  }
  .infoStationTable{
    border-collapse:collapse;
    width:100%;
    table-layout:fixed;
    font-family: var(--mono);
  }
  .infoTh{
    font-size:10px;
    color:#39FF14;
    letter-spacing:.05em;
    padding:0 8px 6px 8px;
    white-space:nowrap;
    vertical-align:top;
  }
  .infoThName{ text-align:left; }
  .infoThLine{ text-align:left; }
  .infoThDist{ text-align:right; }
  .infoThTime{ text-align:right; }
  .infoThDir{ text-align:center; }
  .infoTd{
    padding:8px 8px;
    white-space:nowrap;
    font-size:13px;
    color:#FFFFFF;
    vertical-align:top;
    height:40px;
  }
  .infoTdName{
    color:#FF0000;
    font-weight:700;
    font-size:15px;
    text-align:left;
    white-space:nowrap;
  }
  .infoTdLine{
    color:#FF9D1F;
    font-size:11px;
    text-align:left;
    white-space:normal;
  }
  .infoTdDist{
    color:#22e5e5;
    font-size:13px;
    text-align:right;
    white-space:nowrap;
  }
  .infoTdTime{
    color:#22e5e5;
    font-size:13px;
    text-align:right;
    white-space:nowrap;
  }
  .infoTdDir{
    color:#84909b;
    font-size:13px;
    text-align:center;
    white-space:nowrap;
  }

  /* leaflet dark-theme tweaks */
  .leaflet-control-zoom a{
    background:rgba(14,18,16,.85) !important;
    color:#FF9D1F !important;
    border-color:#FF9D1F !important;
    font-family: var(--mono) !important;
  }
  .leaflet-control-attribution{
    background:rgba(14,18,16,.7) !important;
    color:var(--ink-dim) !important;
    font-size:9px !important;
    font-family: var(--mono) !important;
  }
  .leaflet-control-attribution a{ color:var(--brass-dim) !important; }
  .leaflet-container{
    font-family: var(--mono) !important;
  }

  /* crosshair decoration */
  .mark{
    position:fixed; pointer-events:none; opacity:.5;
    color:var(--line);
    font-size:10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="head">
      <div class="title">WHERE YOU AT?</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">待機中</span></div>
    </div>

    <div class="coords" id="coordsTapArea">
      <div class="coordGrid">
        <div class="coordItem">
          <span class="clabel">LAT <span class="hemi" id="latHemi">—</span><br><span class="hemiJa" id="latHemiJa">—</span></span>
          <span class="value" id="latVal">--.------°</span>
        </div>
        <div class="grid">
          <div class="cell">
            <div class="clabel">精度</div>
            <div class="cval" id="accVal">--<span class="unit">m</span></div>
          </div>
          <div class="cell">
            <div class="clabel">高度</div>
            <div class="cval" id="altVal">--<span class="unit">m</span></div>
          </div>
          <div class="cell">
            <div class="clabel">速度</div>
            <div class="cval" id="spdVal">--<span class="unit">km/h</span></div>
          </div>
        </div>
        <div class="coordItem">
          <span class="clabel">LNG <span class="hemi" id="lngHemi">—</span><br><span class="hemiJa" id="lngHemiJa">—</span></span>
          <span class="value" id="lngVal">--.------°</span>
        </div>
        <div class="addressBox">
          <span class="addressLabel">今どこ？</span>
          <span class="addressVal" id="addressVal">--</span>
        </div>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="infoModalOverlay" id="infoModalOverlay">
    <div class="infoModal" id="infoModal">
      <div class="infoLine1">今いる場所は、</div>
      <div class="infoAddress" id="infoAddress">--</div>
      <div class="infoLine2">最寄り駅</div>
      <div class="infoStationList" id="infoStationList"></div>
    </div>
  </div>

  <div class="ticker">
    <div class="tickerTrack" id="tickerTrack">
      <span class="tickerEmpty">駅情報を取得中…</span>
    </div>
  </div>

  <div class="mapPane">
    <div id="map"></div>
    <button class="recenterBtn" id="recenterBtn" aria-label="現在地に戻る">◎</button>
  </div>

  <div class="statusFoot">
    <span class="mapOverlay">Map View</span>
    <span class="versionLabel">v20260730080719</span>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const latVal = document.getElementById('latVal');
  const lngVal = document.getElementById('lngVal');
  const latHemi = document.getElementById('latHemi');
  const lngHemi = document.getElementById('lngHemi');
  const latHemiJa = document.getElementById('latHemiJa');
  const lngHemiJa = document.getElementById('lngHemiJa');
  const accVal = document.getElementById('accVal');
  const altVal = document.getElementById('altVal');
  const spdVal = document.getElementById('spdVal');
  const addressVal = document.getElementById('addressVal');
  const msg = document.getElementById('msg');
  const mapOverlay = document.querySelector('.mapOverlay');

  let watchId = null;
  let followMe = true;

  // --- 精度フィルタ & 移動平均 ---
  const MAX_ACCEPT_ACCURACY = 100; // これより精度(誤差半径)が悪い測位は棄却 [m]
  const FORCE_ACCEPT_AFTER = 5;    // 悪い精度でも連続でこの回数棄却したら強制採用
  const SMOOTH_WINDOW = 5;        // 移動平均に使う直近サンプル数
  let recentFixes = [];           // { lat, lng, accuracy } の履歴
  let rejectStreak = 0;           // 精度不足で連続棄却した回数

  function smoothedPosition(lat, lng, accuracy){
    // 直近の平均から大きく離れた場合は「移動した」とみなし履歴をリセット(古い位置に引きずられて動きが鈍く見える問題の対策)
    if(recentFixes.length > 0){
      const last = recentFixes[recentFixes.length - 1];
      const jump = L.latLng(lat, lng).distanceTo([last.lat, last.lng]);
      if(jump > 100){
        recentFixes = [];
      }
    }

    recentFixes.push({ lat, lng, accuracy });
    if(recentFixes.length > SMOOTH_WINDOW) recentFixes.shift();

    // 精度が良いサンプルほど重みを大きくした加重平均
    let wSum = 0, latSum = 0, lngSum = 0;
    recentFixes.forEach(f=>{
      const w = 1 / Math.max(f.accuracy, 5); // 精度(誤差)が小さいほど重み大
      wSum += w;
      latSum += f.lat * w;
      lngSum += f.lng * w;
    });
    return { lat: latSum / wSum, lng: lngSum / wSum };
  }

  // --- map setup ---
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: true
  }).setView([35.681236, 139.767125], 15);

  L.control.attribution({ prefix:false }).addTo(map);
  L.control.zoom({ position:'bottomleft' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 最寄り駅への矢印を駅ラベル等より確実に最前面へ表示するための専用pane
  try{
    const arrowPaneEl = map.createPane('arrowPane');
    arrowPaneEl.style.zIndex = 700;
    arrowPaneEl.style.pointerEvents = 'none';
  }catch(paneErr){
    console.warn('arrowPane creation failed (non-critical):', paneErr);
  }

  // 高度に応じたマーカー色: 50m以下は緑、超えると蛍光ブルー
  const ALT_THRESHOLD = 50;
  const COLOR_LOW = '#39ff8f';   // 緑
  const COLOR_HIGH = '#39caff';  // 蛍光ブルー
  function colorForAltitude(alt){
    if(alt == null) return COLOR_LOW;
    return alt > ALT_THRESHOLD ? COLOR_HIGH : COLOR_LOW;
  }

  function makePosIcon(color){
    return L.divIcon({
      className: '',
      html: `
        <div style="position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center;">
          <div class="pulse-ring" style="color:${color};"></div>
        </div>`,
      iconSize: [160,160],
      iconAnchor: [80,80]
    });
  }

  let marker = null;
  let accCircle = null;
  let radiusCircleNear = null; // 半径1km
  let radiusCircleFar = null;  // 半径2km
  let currentMarkerColor = null;
  let nearestArrowLine = null;   // 現在地→最寄り駅 中間点までの線
  let nearestArrowHead = null;   // 矢印の先端(三角形)
  let radiusLabelNear = null; // 1000mラベル
  let radiusLabelFar = null;  // 2000mラベル

  // 中心点から指定方位角(度)・距離(m)先の緯度経度を計算(球面上の目的地点)
  function destinationPoint(lat, lng, bearingDeg, distanceM){
    const R = 6378137; // 地球の半径[m]
    const brng = bearingDeg * Math.PI / 180;
    const lat1 = lat * Math.PI / 180;
    const lng1 = lng * Math.PI / 180;
    const lat2 = Math.asin(Math.sin(lat1) * Math.cos(distanceM / R) + Math.cos(lat1) * Math.sin(distanceM / R) * Math.cos(brng));
    const lng2 = lng1 + Math.atan2(
      Math.sin(brng) * Math.sin(distanceM / R) * Math.cos(lat1),
      Math.cos(distanceM / R) - Math.sin(lat1) * Math.sin(lat2)
    );
    return L.latLng(lat2 * 180 / Math.PI, lng2 * 180 / Math.PI);
  }

  function radiusLabelIcon(text, color){
    return L.divIcon({
      className: '',
      html: `<div style="font-size:9px; font-weight:700; font-family:var(--mono); color:${color}; white-space:nowrap; background:rgba(0,0,0,0.2); padding:0px 3px; border-radius:4px; display:inline-block; text-shadow:1px 0 0 #fff,-1px 0 0 #fff,0 1px 0 #fff,0 -1px 0 #fff,1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff;">${text}</div>`,
      iconSize: [56, 16],
      iconAnchor: [0, 16] // 左下を基準にすることで、円周点から見て右上方向にテキストが伸びる(円の縁と重ならない)
    });
  }

  function updateMap(lat, lng, accuracy, altitude){
    const latlng = [lat, lng];
    const color = colorForAltitude(altitude);
    if(!marker){
      currentMarkerColor = color;
      marker = L.marker(latlng, { icon: makePosIcon(color), interactive:false }).addTo(map);
      accCircle = L.circle(latlng, {
        radius: accuracy || 0,
        color: color, weight:1, opacity:.4,
        fillColor: color, fillOpacity:.08
      }).addTo(map);

      radiusCircleNear = L.circle(latlng, {
        radius: STATION_RADIUS_NEAR,
        color: COLOR_NEAR, weight:2, opacity:.8,
        fill:false
      }).addTo(map);
      radiusCircleFar = L.circle(latlng, {
        radius: STATION_RADIUS_FAR,
        color: COLOR_FAR, weight:2, opacity:.8,
        fill:false
      }).addTo(map);

      // 右上(北東・方位角45度)の円周上にメートル数のラベルを配置(縁と重ならないよう外側にアンカー)
      const nearLabelPos = destinationPoint(lat, lng, 45, STATION_RADIUS_NEAR);
      const farLabelPos = destinationPoint(lat, lng, 45, STATION_RADIUS_FAR);
      radiusLabelNear = L.marker(nearLabelPos, { icon: radiusLabelIcon('1000m', COLOR_NEAR), interactive:false }).addTo(map);
      radiusLabelFar = L.marker(farLabelPos, { icon: radiusLabelIcon('2000m', COLOR_FAR), interactive:false }).addTo(map);

      // 初期表示: 半径3km(直径6km)が画面に収まるように表示
      const bounds = L.latLng(latlng).toBounds(6000); // 一辺6kmの正方形
      map.fitBounds(bounds);
    } else {
      marker.setLatLng(latlng);
      // 色が変わった時はDOM要素を作り直さず、色だけを直接書き換える(波紋アニメーションを継続させるため)
      if(color !== currentMarkerColor){
        currentMarkerColor = color;
        const el = marker.getElement();
        if(el){
          el.querySelectorAll('.pulse-ring').forEach(r => r.style.color = color);
        }
      }
      accCircle.setLatLng(latlng);
      accCircle.setRadius(accuracy || 0);
      accCircle.setStyle({ color: color, fillColor: color });
      radiusCircleNear.setLatLng(latlng);
      radiusCircleFar.setLatLng(latlng);
      const nearLabelPos = destinationPoint(lat, lng, 45, STATION_RADIUS_NEAR);
      const farLabelPos = destinationPoint(lat, lng, 45, STATION_RADIUS_FAR);
      if(radiusLabelNear) radiusLabelNear.setLatLng(nearLabelPos);
      if(radiusLabelFar) radiusLabelFar.setLatLng(farLabelPos);
      if(followMe) map.panTo(latlng, { animate:true });
    }
  }

  map.on('dragstart', ()=>{ followMe = false; });

  document.getElementById('recenterBtn').addEventListener('click', ()=>{
    followMe = true;
    if(marker) map.setView(marker.getLatLng(), Math.max(map.getZoom(), 17), { animate:true });
  });

  // --- 情報モーダル(緯度経度エリアタップで開閉) ---
  const coordsTapArea = document.getElementById('coordsTapArea');
  const infoModalOverlay = document.getElementById('infoModalOverlay');
  const infoModal = document.getElementById('infoModal');

  function openInfoModal(){
    infoModalOverlay.classList.add('open');
  }
  function closeInfoModal(){
    infoModalOverlay.classList.remove('open');
  }

  coordsTapArea.addEventListener('click', openInfoModal);
  infoModal.addEventListener('click', closeInfoModal);

  // --- station labels via Overpass API ---
  let stationMarkers = [];
  let stationFetchTimer = null;
  let stationRetryTimer = null;
  let stationFailCount = 0; // 連続失敗回数(バックオフ間隔の計算に使用)
  let lastStationCenter = null;

  function clearStations(){
    stationMarkers.forEach(m => map.removeLayer(m));
    stationMarkers = [];
  }

  function stationIcon(name, color, lines){
    const lineText = (lines && lines.length > 0)
      ? lines.slice(0, 2).join(' / ') + (lines.length > 2 ? ' 他' : '')
      : '';
    const lineHtml = lineText
      ? `<div class="lineName" style="color:${color};">${lineText}</div>`
      : '';
    return L.divIcon({
      className: 'station-label',
      html: '<div class="pin" style="background:'+color+'"></div><div class="name" style="color:'+color+';">'+name+'</div>' + lineHtml,
      iconSize: [140, 48],
      iconAnchor: [70, 4]
    });
  }

  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter'
  ];

  function fetchWithTimeout(url, ms){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), ms);
    return fetch(url, {
      signal: controller.signal,
      headers: { 'Accept': 'application/json' }
    }).finally(()=> clearTimeout(timer));
  }

  // --- 住所表示(逆ジオコーディング / Nominatim) ---
  let lastAddressCenter = null;
  let lastAddressFetchTime = 0;
  const ADDRESS_MIN_DISTANCE = 15;   // これ以上動いたら再取得 [m]
  const ADDRESS_MIN_INTERVAL = 5000; // 最短でもこの間隔は空ける [ms] (Nominatimの利用ポリシー上、あまり短くしすぎない)
  let isFetchingStations = false; // 駅取得と住所取得のネットワーク処理が重ならないようにする排他フラグ
  let isFetchingExtended = false; // 拡張取得(5km圏)・路線名取得の重複実行を防ぐフラグ(Overpassの同時実行制限対策)
  let stationFetchAttempted = false; // 一度でも駅取得を開始したか(最初の駅取得より前に住所取得が走らないようにする)

  async function fetchAddress(lat, lng){
    try{
      const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&accept-language=ja`;
      const res = await fetchWithTimeout(url, 12000);
      if(!res.ok) return;
      const data = await res.json();
      if(data && data.address){
        const a = data.address;
        // 都道府県・市区町村・町名・丁目・番地の順で組み立てる(存在するものだけ)
        const parts = [
          a.state,
          a.city || a.town || a.village || a.county,
          a.suburb || a.city_district,
          a.neighbourhood || a.quarter,
          a.house_number
        ].filter(Boolean);
        addressVal.textContent = (parts.length > 0 ? parts.join(' ') : (data.display_name || '住所不明')) + ' 付近';
      } else {
        addressVal.textContent = '住所不明';
      }
    }catch(e){
      console.warn('fetchAddress failed (non-critical):', e);
      addressVal.textContent = '取得失敗';
    }
  }

  function refreshAddressIfNeeded(lat, lng){
    if(isFetchingStations || isFetchingExtended || !stationFetchAttempted) return; // 駅関連の通信中、または駅取得が一度も開始されていなければスキップ(駅名を優先)
    const now = Date.now();
    const current = L.latLng(lat, lng);
    if(lastAddressCenter){
      const moved = lastAddressCenter.distanceTo(current);
      if(moved < ADDRESS_MIN_DISTANCE && (now - lastAddressFetchTime) < ADDRESS_MIN_INTERVAL){
        return; // 移動が小さく、時間も経っていなければスキップ
      }
    }
    lastAddressCenter = current;
    lastAddressFetchTime = now;
    fetchAddress(lat, lng);
  }

  const STATION_RADIUS_NEAR = 1000; // 蛍光赤 [m]
  const STATION_RADIUS_FAR  = 2000; // 蛍光オレンジ [m]
  const STATION_RADIUS_XFAR = 5000; // 蛍光ブルー(これを超えると非表示) [m]
  const COLOR_NEAR = '#ff3b3b'; // 蛍光赤
  const COLOR_FAR  = '#ff9d1f'; // 蛍光オレンジ
  const COLOR_XFAR = '#25A2FF'; // 蛍光ブルー(2001m〜5000m)

  function colorForStationDistance(dist){
    if(dist <= STATION_RADIUS_NEAR) return COLOR_NEAR;
    if(dist <= STATION_RADIUS_FAR) return COLOR_FAR;
    return COLOR_XFAR;
  }

  const tickerTrack = document.getElementById('tickerTrack');

  let lastTickerKey = null; // 直近表示した駅の並び順(名前ベース)を記録し、変化がなければアニメーションを再スタートさせない

  function formatLineName(lines){
    if(!lines || lines.length === 0) return '';
    let joined = lines.slice(0,2).join('/') + (lines.length > 2 ? '他' : '');
    if(joined.length > 10) joined = joined.slice(0, 9) + '‥';
    return joined;
  }

  // 2点間の方位角(度)を計算し、8方位の文字列に変換する
  function calculateBearing(lat1, lng1, lat2, lng2){
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const dLng = toRad(lng2 - lng1);
    const y = Math.sin(dLng) * Math.cos(toRad(lat2));
    const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
    const brng = toDeg(Math.atan2(y, x));
    return (brng + 360) % 360;
  }
  function bearingToDirection(bearing){
    const dirs = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
    return dirs[Math.round(bearing / 22.5) % 16];
  }

  const infoAddressEl = document.getElementById('infoAddress');
  const infoStationListEl = document.getElementById('infoStationList');

  function updateInfoModal(){
    if(!infoAddressEl || !infoStationListEl) return;
    if(!marker) return;

    infoAddressEl.textContent = (addressVal && addressVal.textContent) ? addressVal.textContent : '--';

    const origin = marker.getLatLng();
    const nearby = cachedStations
      .map(s => ({ name: s.name, dist: origin.distanceTo([s.lat, s.lng]), lines: s.lines, lat: s.lat, lng: s.lng }));

    if(!nearby || nearby.length === 0){
      infoStationListEl.innerHTML = '<div style="color:var(--ink-dim); font-size:13px;">周辺に駅が見つかりません</div>';
      return;
    }
    const top3 = nearby.slice().sort((a,b)=> a.dist - b.dist).slice(0, 10);

    const rowsHtml = top3.map((s, idx)=>{
      const lineNameJoined = formatLineName(s.lines);
      const walkMin = Math.round(s.dist / 80);
      let dirText = '—';
      if(origin && s.lat != null && s.lng != null){
        const bearing = calculateBearing(origin.lat, origin.lng, s.lat, s.lng);
        dirText = bearingToDirection(bearing);
      }
      return `<tr>
        <td class="infoTd infoTdName">${s.name}駅</td>
        <td class="infoTd infoTdLine">${lineNameJoined || '—'}</td>
        <td class="infoTd infoTdDist">${Math.round(s.dist)}m</td>
        <td class="infoTd infoTdTime">${walkMin}分</td>
        <td class="infoTd infoTdDir">${dirText}</td>
      </tr>`;
    }).join('');

    infoStationListEl.innerHTML = `<table class="infoStationTable">
      <thead>
        <tr>
          <th class="infoTh infoThName">駅名</th>
          <th class="infoTh infoThLine">路線名</th>
          <th class="infoTh infoThDist">距離</th>
          <th class="infoTh infoThTime">時間(徒歩)</th>
          <th class="infoTh infoThDir">方角</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  function updateTicker(nearby){
    if(!nearby || nearby.length === 0){
      lastTickerKey = null;
      tickerTrack.innerHTML = '<span class="tickerEmpty">周辺2km以内に駅が見つかりません</span>';
      tickerTrack.style.animation = 'none';
      return;
    }
    const top3 = nearby.slice().sort((a,b)=> a.dist - b.dist).slice(0, 3);
    const key = top3.map(s => s.name).join('|');

    if(key === lastTickerKey){
      // 駅の並び順に変化なし: アニメーションを止めずに距離・徒歩分の数字、路線名だけを更新する
      const itemEls = tickerTrack.querySelectorAll('.tickerItem');
      const distEls = tickerTrack.querySelectorAll('.tDist');
      const total = top3.length;
      distEls.forEach((el, i)=>{
        const s = top3[i % total];
        const walkMin = Math.round(s.dist / 80);
        el.innerHTML = `${Math.round(s.dist)}<span class="tUnit">m(徒歩</span>${walkMin}<span class="tUnit">分)</span>`;
      });
      itemEls.forEach((el, i)=>{
        const s = top3[i % total];
        el.classList.toggle('near-blink', s.dist <= 100);

        // 路線名は後から非同期で届くことがあるため、既存要素の有無に関わらず反映する
        const lineNameJoined = formatLineName(s.lines);
        let lineEl = el.querySelector('.tLine');
        if(lineNameJoined){
          if(!lineEl){
            lineEl = document.createElement('span');
            lineEl.className = 'tLine';
            const nameEl = el.querySelector('.tName');
            if(nameEl) nameEl.insertAdjacentElement('afterend', lineEl);
          }
          lineEl.textContent = lineNameJoined;
        } else if(lineEl){
          lineEl.remove();
        }
      });
      return;
    }
    lastTickerKey = key;

    const circledNumbers = ['①', '②', '③'];
    const itemsHtml = top3.map((s, idx)=>{
      const lineNameJoined = formatLineName(s.lines);
      const lineText = lineNameJoined ? '<span class="tLine">' + lineNameJoined + '</span>' : '';
      const walkMin = Math.round(s.dist / 80); // 徒歩1分=80mとして換算(整数)
      const nearestTag = idx === 0 ? '<span class="tNearest">(最寄り駅)</span>' : '';
      const blinkClass = s.dist <= 100 ? ' near-blink' : '';
      const distText = `${Math.round(s.dist)}<span class="tUnit">m(徒歩</span>${walkMin}<span class="tUnit">分)</span>`;
      const num = '<span class="tSep">' + circledNumbers[idx % circledNumbers.length] + '</span>';
      return `<span class="tickerItem${blinkClass}">${num}${nearestTag}<span class="tName">${s.name}駅</span>${lineText}<span class="tDist">${distText}</span></span>`;
    }).join('');

    // シームレスループのため2回連結
    tickerTrack.innerHTML = itemsHtml + itemsHtml;

    // コンテンツ量に応じて速度を調整(短すぎず長すぎない一定速度になるよう)
    const approxWidth = top3.reduce((sum, s)=> sum + s.name.length * 14 + 90, 0);
    const duration = Math.max(10, (approxWidth * 2) / 60); // おおよそ60px/秒
    tickerTrack.style.animation = `ticker-scroll ${duration}s linear infinite`;
  }

  let cachedStations = []; // { name, lat, lng, lines } 直近取得した駅の生データ(距離を都度再計算するため)

  // --- 最寄り駅への矢印: requestAnimationFrameで「線が伸びて到達→フェードアウト」を矢印の先端と完全同期させる ---
  let arrowControlPoints = null; // { p0, p1, p2, cosLat } 現在の曲線制御点(GPS更新のたびに差し替え)
  let arrowAnimId = null;
  let arrowAnimStart = null;
  const ARROW_CYCLE_MS = 2600;   // 1周期
  const ARROW_DRAW_END = 0.6;    // このタイミングで線が最寄り駅に到達

  function bezierPoint(p0, p1, p2, t){
    return {
      x: (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x,
      y: (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y
    };
  }

  function arrowAnimFrame(ts){
    if(!arrowControlPoints){ arrowAnimId = null; return; }
    if(!arrowAnimStart) arrowAnimStart = ts;
    const cycle = ((ts - arrowAnimStart) % ARROW_CYCLE_MS) / ARROW_CYCLE_MS; // 0〜1

    const { p0, p1, p2, cosLat } = arrowControlPoints;

    let drawT, opacity;
    if(cycle < ARROW_DRAW_END){
      drawT = cycle / ARROW_DRAW_END; // 線が伸びる進行度 0〜1
      opacity = drawT; // 現在地(薄い/透明)→最寄り駅(濃い/不透明)へ徐々にフェードイン
    } else {
      drawT = 1;
      opacity = 1 - (cycle - ARROW_DRAW_END) / (1 - ARROW_DRAW_END); // 到達後、最寄り駅側からフェードアウト
    }

    // 現在の進行度(drawT)まで曲線を点列化(矢印の先端はこの曲線の終点と常に一致する)
    const steps = 24;
    const linePoints = [];
    for(let i = 0; i <= steps; i++){
      const t = (i / steps) * drawT;
      const pt = bezierPoint(p0, p1, p2, t);
      linePoints.push(L.latLng(pt.y, pt.x / cosLat));
    }
    const tip = linePoints[linePoints.length - 1];

    // 接線方向(矢印の向き)
    const tangentX = 2*(1-drawT)*(p1.x-p0.x) + 2*drawT*(p2.x-p1.x);
    const tangentY = 2*(1-drawT)*(p1.y-p0.y) + 2*drawT*(p2.y-p1.y);
    const angleDeg = Math.atan2(tangentX, tangentY) * 180 / Math.PI;

    if(!nearestArrowLine){
      nearestArrowLine = L.polyline(linePoints, { color: '#0095d9', weight: 5, smoothFactor: 1, pane: 'arrowPane' }).addTo(map);
      if(nearestArrowLine.bringToFront) nearestArrowLine.bringToFront();
    } else {
      nearestArrowLine.setLatLngs(linePoints);
    }
    const pathEl = nearestArrowLine._path;
    if(pathEl) pathEl.style.opacity = String(opacity);

    if(!nearestArrowHead){
      const arrowIcon = L.divIcon({
        className: '',
        html: `<div class="arrow-head-inner" style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:12px solid #0095d9;transform:rotate(${angleDeg}deg);transform-origin:center center;"></div>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6]
      });
      nearestArrowHead = L.marker(tip, { icon: arrowIcon, interactive:false, pane: 'arrowPane' }).addTo(map);
    } else {
      nearestArrowHead.setLatLng(tip);
      const el = nearestArrowHead.getElement();
      const inner = el ? el.querySelector('.arrow-head-inner') : null;
      if(inner) inner.style.transform = `rotate(${angleDeg}deg)`;
      if(el) el.style.opacity = String(opacity);
    }

    arrowAnimId = requestAnimationFrame(arrowAnimFrame);
  }

  // 現在地から最寄り駅方向への矢印(放物線の制御点だけを更新する軽量な関数。実際の描画はrequestAnimationFrameループが担当)
  function updateNearestArrow(originLatLng, nearestLatLng){
    if(!originLatLng || !nearestLatLng){
      arrowControlPoints = null;
      if(arrowAnimId){ cancelAnimationFrame(arrowAnimId); arrowAnimId = null; }
      if(nearestArrowLine){ map.removeLayer(nearestArrowLine); nearestArrowLine = null; }
      if(nearestArrowHead){ map.removeLayer(nearestArrowHead); nearestArrowHead = null; }
      return;
    }

    // 緯度による経度方向の縮尺差を補正した簡易平面座標(短距離のみ対象なので十分な精度)
    const latRad = originLatLng.lat * Math.PI / 180;
    const cosLat = Math.cos(latRad) || 1;

    const p0 = { x: originLatLng.lng * cosLat, y: originLatLng.lat };
    const p2 = { x: nearestLatLng.lng * cosLat, y: nearestLatLng.lat };

    const dx = p2.x - p0.x;
    const dy = p2.y - p0.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1e-9;

    // 進行方向に対して垂直な向きに膨らませ、放物線の制御点を作る
    const perpX = -dy / dist;
    const perpY = dx / dist;
    const bulge = dist * 0.28; // 膨らみ量(距離の28%)
    const p1 = { x: (p0.x + p2.x) / 2 + perpX * bulge, y: (p0.y + p2.y) / 2 + perpY * bulge };

    arrowControlPoints = { p0, p1, p2, cosLat };

    if(!arrowAnimId){
      arrowAnimStart = null;
      arrowAnimId = requestAnimationFrame(arrowAnimFrame);
    }
  }

  function refreshTickerDistances(){
    if(!marker || cachedStations.length === 0) return;
    const origin = marker.getLatLng();
    const nearby = cachedStations
      .map(s => ({ name: s.name, dist: origin.distanceTo([s.lat, s.lng]), lines: s.lines, lat: s.lat, lng: s.lng }))
      .filter(s => s.dist <= STATION_RADIUS_FAR);
    updateTicker(nearby);
    try{ updateInfoModal(); }catch(modalErr){ console.warn('updateInfoModal failed (non-critical):', modalErr); }

    try{
      if(nearby.length > 0){
        const nearest = nearby.slice().sort((a,b)=> a.dist - b.dist)[0];
        updateNearestArrow(origin, L.latLng(nearest.lat, nearest.lng));
      } else {
        updateNearestArrow(null, null);
      }
    }catch(arrowErr){
      console.warn('updateNearestArrow failed (non-critical):', arrowErr);
    }
  }

  let preferredEndpointIndex = 0; // 直近成功したエンドポイントを優先する

  function orderedEndpoints(){
    const list = OVERPASS_ENDPOINTS.slice();
    const [preferred] = list.splice(preferredEndpointIndex, 1);
    return preferred ? [preferred, ...list] : list;
  }

  // 2km〜5km圏の駅は失敗しても基本表示(1km/2km圏)に影響しないよう、別途ベストエフォートで取得
  async function fetchExtendedStations(origin){
    // サーバー側で「5km圏 - 2km圏」の差分だけを取得し、レスポンスを軽量化する
    const query = `[out:json][timeout:15];
      (
        node["railway"="station"](around:${STATION_RADIUS_XFAR},${origin.lat},${origin.lng});
        -
        node["railway"="station"](around:${STATION_RADIUS_FAR},${origin.lat},${origin.lng});
      );
      out body;`;

    for(const endpoint of orderedEndpoints()){
      try{
        const res = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(query), 20000);
        if(!res.ok) continue;
        const data = await res.json();
        const stationNodes = (data.elements || []).filter(el => el.type === 'node' && el.tags && el.tags.railway === 'station');
        if(stationNodes.length === 0) return;

        // 基本取得(cachedStations)に、まだ含まれていない駅だけ追加する
        const existingIds = new Set(cachedStations.map(s => s.id));
        let addedCount = 0;
        stationNodes.forEach(el=>{
          if(existingIds.has(el.id)) return; // 既に基本取得(2km圏)で描画済み
          const name = (el.tags && (el.tags['name:ja'] || el.tags.name)) || null;
          if(!name) return;
          const dist = origin.distanceTo([el.lat, el.lon]);
          if(dist > STATION_RADIUS_XFAR) return; // 念のための保険(サーバー側で既に絞り込み済み)
          const lines = el.tags.network ? [el.tags.network] : [];
          cachedStations.push({ name, lat: el.lat, lng: el.lon, lines, id: el.id });
          const color = colorForStationDistance(dist);
          const m = L.marker([el.lat, el.lon], { icon: stationIcon(name, color, lines), interactive:false }).addTo(map);
          stationMarkers.push(m);
          addedCount++;
        });
        if(addedCount > 0){
          mapOverlay.textContent = '駅 ' + cachedStations.length + '件';
        }
        return; // 成功したらそこで終了(他のエンドポイントは試さない)
      }catch(e){
        console.warn('fetchExtendedStations endpoint failed (non-critical):', endpoint, e);
      }
    }
  }

  // 路線名はベストエフォートで後追い取得(失敗しても駅表示自体には影響しない)
  async function fetchStationLines(origin, stationNodes, preferredEndpoint){
    try{
      const lineQuery = `[out:json][timeout:12];rel["type"="route"]["route"~"^(train|subway|light_rail)$"](around:${STATION_RADIUS_XFAR},${origin.lat},${origin.lng});out body;`;
      const res = await fetchWithTimeout(preferredEndpoint + '?data=' + encodeURIComponent(lineQuery), 16000);
      if(!res.ok) return;
      const data = await res.json();
      const routeRelations = (data.elements || []).filter(el => el.type === 'relation');
      if(routeRelations.length === 0) return;

      const stationIdToLines = new Map();
      routeRelations.forEach(rel=>{
        const lineName = (rel.tags && (rel.tags['name:ja'] || rel.tags.name)) || (rel.tags && rel.tags.ref) || null;
        if(!lineName) return;
        (rel.members || []).forEach(mem=>{
          if(mem.type !== 'node') return;
          if(!stationIdToLines.has(mem.ref)) stationIdToLines.set(mem.ref, new Set());
          stationIdToLines.get(mem.ref).add(lineName);
        });
        const relText = [rel.tags.from, rel.tags.to, rel.tags.via].filter(Boolean).join(' ');
        if(relText){
          stationNodes.forEach(st=>{
            const stName = (st.tags && (st.tags['name:ja'] || st.tags.name)) || '';
            if(stName && relText.includes(stName)){
              if(!stationIdToLines.has(st.id)) stationIdToLines.set(st.id, new Set());
              stationIdToLines.get(st.id).add(lineName);
            }
          });
        }
      });

      if(stationIdToLines.size === 0) return;

      // キャッシュと地図上のラベルに路線名を反映
      cachedStations.forEach(s=>{
        const lineSet = stationIdToLines.get(s.id);
        if(lineSet){
          lineSet.forEach(l => { if(!s.lines.includes(l)) s.lines.push(l); });
        }
      });
      try{ refreshTickerDistances(); }catch(e){ console.warn('refreshTickerDistances failed (non-critical):', e); }

      // 地図上のラベルも路線名付きで再描画(失敗しても既存ラベルが消えたままにならないよう、新規描画が全て成功した場合のみ置き換える)
      try{
        const origin2 = marker.getLatLng();
        const newMarkers = [];
        cachedStations.forEach(s=>{
          const dist = origin2.distanceTo([s.lat, s.lng]);
          if(dist > STATION_RADIUS_XFAR) return;
          const color = colorForStationDistance(dist);
          const m = L.marker([s.lat, s.lng], { icon: stationIcon(s.name, color, s.lines), interactive:false });
          newMarkers.push(m);
        });
        clearStations();
        newMarkers.forEach(m=>{ m.addTo(map); stationMarkers.push(m); });
      }catch(e){
        console.warn('station label redraw failed (non-critical, existing labels kept):', e);
      }
    }catch(e){
      console.warn('fetchStationLines failed (non-critical):', e);
    }
  }

  async function fetchStations(){
    if(isFetchingStations) return; // 既に実行中なら重複実行しない
    isFetchingStations = true;
    stationFetchAttempted = true;
    try{
      if(!marker){ return; } // 現在地が未取得ならまだ実行しない
      if(map.getZoom() < 13){ clearStations(); mapOverlay.textContent = 'MAP VIEW'; return; }

      const origin = marker.getLatLng(); // 現在地(GPS)中心
      if(lastStationCenter && lastStationCenter.distanceTo(origin) < 200){
        return; // 現在地がほぼ動いていなければAPI再取得は間引く(距離表示自体は別途更新される)
      }

      // まず駅ノードのみを軽量取得(路線リレーションは含めない: レスポンスを軽くして成功率を上げる)
      const stationQuery = `[out:json][timeout:10];node["railway"="station"](around:${STATION_RADIUS_FAR},${origin.lat},${origin.lng});out body;`;

      mapOverlay.textContent = '駅情報取得中…';

      let succeeded = false;
      let lastError = null;
      const endpoints = orderedEndpoints();
      for(let i = 0; i < endpoints.length; i++){
        const endpoint = endpoints[i];
        try{
          // クライアント側の待機時間は、クエリ内のサーバー側timeout(10秒)より必ず長くする
          const res = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(stationQuery), 14000);
          if(!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          clearStations();

          const stationNodes = (data.elements || []).filter(el => el.type === 'node' && el.tags && el.tags.railway === 'station');

          let count = 0;
          const nearby = []; // { name, dist, lines, lat, lng }
          cachedStations = [];
          stationNodes.forEach(el=>{
            const name = (el.tags && (el.tags['name:ja'] || el.tags.name)) || null;
            if(!name) return;
            const dist = origin.distanceTo([el.lat, el.lon]);
            const lines = el.tags.network ? [el.tags.network] : [];
            cachedStations.push({ name, lat: el.lat, lng: el.lon, lines, id: el.id });
            if(dist > STATION_RADIUS_XFAR) return; // 5km超は非表示
            const color = colorForStationDistance(dist);
            const m = L.marker([el.lat, el.lon], { icon: stationIcon(name, color, lines), interactive:false }).addTo(map);
            stationMarkers.push(m);
            nearby.push({ name, dist, lines, lat: el.lat, lng: el.lon });
            count++;
          });
          mapOverlay.textContent = count > 0 ? ('駅 ' + count + '件') : 'MAP VIEW';
          try{ updateTicker(nearby); }catch(tickerErr){ console.warn('updateTicker failed (non-critical):', tickerErr); }
          try{ updateInfoModal(); }catch(modalErr){ console.warn('updateInfoModal failed (non-critical):', modalErr); }
          try{
            if(nearby.length > 0){
              const nearest = nearby.slice().sort((a,b)=> a.dist - b.dist)[0];
              updateNearestArrow(origin, L.latLng(nearest.lat, nearest.lng));
            } else {
              updateNearestArrow(null, null);
            }
          }catch(arrowErr){
            console.warn('updateNearestArrow failed (non-critical):', arrowErr);
          }
          lastStationCenter = origin; // 成功時のみ記録(失敗時は次回も必ず再試行させる)
          clearTimeout(stationRetryTimer);
          stationFailCount = 0;
          succeeded = true;

          // 使えたエンドポイントを次回優先にする
          preferredEndpointIndex = OVERPASS_ENDPOINTS.indexOf(endpoint);
          if(preferredEndpointIndex < 0) preferredEndpointIndex = 0;

          // 基本の駅名(1km/2km圏)はここまでで確定・表示済み。以降の拡張取得・路線名取得は
          // バックグラウンドで続けるが、住所取得をブロックし続けないようフラグはここで先に解除する。
          isFetchingStations = false;

          // 2km〜5km圏の駅、路線名は、同じサーバーへの同時リクエストを避けるため順番に実行する
          // (失敗しても基本の駅表示には影響しないベストエフォート処理。Overpassは同時実行数が
          //  厳しく制限されているため、既に実行中なら重複させない)
          if(!isFetchingExtended){
            isFetchingExtended = true;
            fetchExtendedStations(origin).then(()=>{
              return fetchStationLines(origin, stationNodes, endpoint);
            }).finally(()=>{
              isFetchingExtended = false;
            });
          }
          break;
        }catch(e){
          lastError = e;
          console.warn('overpass endpoint failed:', endpoint, e);
        }
      }
      if(!succeeded){
        stationFailCount++;
        const reason = lastError ? (lastError.name === 'AbortError' ? 'タイムアウト' : lastError.message) : '不明';
        mapOverlay.textContent = `駅情報取得失敗(${reason}) 再試行中…`;
        clearTimeout(stationRetryTimer);
        // 連続失敗するほど間隔を伸ばす(3秒→6秒→12秒...最大30秒): 過度な連打によるレート制限を避ける
        const backoff = Math.min(30000, 3000 * Math.pow(2, stationFailCount - 1));
        stationRetryTimer = setTimeout(fetchStations, backoff);
      }
    }catch(e){
      console.error('fetchStations error:', e);
      stationFailCount++;
      mapOverlay.textContent = '駅情報取得失敗(再試行中)';
      clearTimeout(stationRetryTimer);
      const backoff = Math.min(30000, 3000 * Math.pow(2, stationFailCount - 1));
      stationRetryTimer = setTimeout(fetchStations, backoff);
    }finally{
      isFetchingStations = false;
    }
  }

  map.on('moveend', ()=>{
    clearTimeout(stationFetchTimer);
    stationFetchTimer = setTimeout(fetchStations, 1500);
  });

  function fmtCoord(v){
    const abs = Math.abs(v);
    return abs.toFixed(6) + '°';
  }


  function onPosition(pos){
    const c = pos.coords;

    // 精度の悪い測位は原則棄却するが、一定回数連続したら強制的に採用する(GPSが止まって見える問題の対策)
    if(c.accuracy != null && c.accuracy > MAX_ACCEPT_ACCURACY && rejectStreak < FORCE_ACCEPT_AFTER){
      rejectStreak++;
      dot.className = 'dot low';
      statusText.textContent = '精度低(除外 ' + Math.round(c.accuracy) + 'm)';
      accVal.innerHTML = Math.round(c.accuracy) + '<span class="unit">m</span>';
      return;
    }
    rejectStreak = 0;

    dot.className = 'dot live';
    statusText.textContent = '受信中';
    msg.textContent = '';

    const smoothed = smoothedPosition(c.latitude, c.longitude, c.accuracy || 30);

    latVal.textContent = fmtCoord(smoothed.lat);
    lngVal.textContent = fmtCoord(smoothed.lng);
    latHemi.textContent = smoothed.lat >= 0 ? 'N' : 'S';
    latHemiJa.textContent = smoothed.lat >= 0 ? '北緯' : '南緯';
    lngHemi.textContent = smoothed.lng >= 0 ? 'E' : 'W';
    lngHemiJa.textContent = smoothed.lng >= 0 ? '東経' : '西経';

    accVal.innerHTML = (c.accuracy != null ? Math.round(c.accuracy) : '--') + '<span class="unit">m</span>';
    altVal.innerHTML = (c.altitude != null ? Math.round(c.altitude) : '--') + '<span class="unit">m</span>';
    const kmh = c.speed != null ? (c.speed * 3.6).toFixed(1) : '--';
    spdVal.innerHTML = kmh + '<span class="unit">km/h</span>';

    updateMap(smoothed.lat, smoothed.lng, c.accuracy, c.altitude);
    refreshTickerDistances(); // 通信を伴わない軽量処理: GPS移動のたびに距離表示だけ更新
    // 住所取得はGPS更新の同期処理から切り離し、少し遅延させて実行する(他のネットワーク処理との競合を避けるため)
    setTimeout(()=>{
      try{ refreshAddressIfNeeded(smoothed.lat, smoothed.lng); }catch(addrErr){ console.warn('refreshAddressIfNeeded failed (non-critical):', addrErr); }
    }, 50);
  }

  function onError(err){
    dot.className = 'dot err';
    statusText.textContent = 'エラー';
    const messages = {
      1: '位置情報の利用が許可されていません。設定から許可してください。',
      2: '位置情報を取得できませんでした。電波状況を確認してください。',
      3: 'タイムアウトしました。再試行してください。'
    };
    msg.textContent = messages[err.code] || '不明なエラーが発生しました。';
    stop();
  }

  function start(){
    if(!('geolocation' in navigator)){
      msg.textContent = 'このブラウザは位置情報に対応していません。';
      return;
    }
    recentFixes = [];
    rejectStreak = 0;
    dot.className = 'dot';
    statusText.textContent = '取得中…';
    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 15000
    });
  }

  function stop(){
    if(watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if(dot.className !== 'dot err'){
      dot.className = 'dot';
      statusText.textContent = '停止中';
    }
  }

  // auto start on load
  start();

  setTimeout(()=> map.invalidateSize(), 200);
  setTimeout(()=> map.invalidateSize(), 800); // レイアウト確定の遅延分の保険
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=> map.invalidateSize()); // Webフォント読み込みで高さが変わるケースに対応
  }
  window.addEventListener('resize', ()=> map.invalidateSize());
  window.addEventListener('orientationchange', ()=> setTimeout(()=> map.invalidateSize(), 300));

  // .mapPane自体のサイズ変化(共有シートの開閉、アドレスバーの表示切替等)にも追従
  if(window.ResizeObserver){
    const mapPaneEl = document.querySelector('.mapPane');
    if(mapPaneEl){
      const ro = new ResizeObserver(()=> map.invalidateSize());
      ro.observe(mapPaneEl);
    }
  }

  setTimeout(fetchStations, 500);
  // 駅情報の再取得はGPS更新とは無関係に、一定間隔(10秒)だけで判断する
  // (GPS更新のたびにトリガーすると通信処理がGPS表示の体感速度を妨げるため分離)
  setInterval(fetchStations, 10000);
</script>
</body>
</html>
