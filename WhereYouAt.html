<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>座標計測</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0e1210;
    --panel:#141915;
    --line:#2a332c;
    --ink:#e8ecdf;
    --ink-dim:#7c8a76;
    --brass:#c8a24a;
    --brass-dim:#8a7038;
    --ok:#5fae6e;
    --warn:#c96a4a;
    --mono: "BIZ UDPGothic", "SF Mono","Consolas","Menlo",monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%; margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, #1a2118 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family: var(--mono);
    overflow:hidden;
    overscroll-behavior:none;
  }
  .wrap{
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  .top{
    flex:0 0 auto;
    padding: max(10px, env(safe-area-inset-top)) 18px 0;
  }
  .ticker{
    flex:0 0 auto;
    height:26px;
    background:#000;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    overflow:hidden;
    position:relative;
  }
  .tickerTrack{
    position:absolute;
    top:0; left:0;
    height:100%;
    display:flex;
    align-items:center;
    white-space:nowrap;
    will-change: transform;
    animation: none;
  }
  .tickerTrack .tickerEmpty{
    color:#ff2df2;
    font-size:11px;
    letter-spacing:.1em;
    padding-left:18px;
  }
  .tickerItem{
    display:inline-flex;
    align-items:baseline;
    gap:0;
    padding:0 28px 0 0;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.04em;
    color:#ff9d1f;
    text-shadow:0 0 4px currentColor;
  }
  .tickerItem .tName{ font-weight:400; font-size:14px; color:#FF0000; margin-right:6px; }
  .tickerItem .tDist{ color:#22e5e5; font-size:14px; margin-left:6px; }
  .tickerItem .tLine{ color:#FF9D1F; font-size:9px; margin-right:6px; }
  .tickerItem .tSep{ color:#FFFFFF; font-size:14px; padding:0 10px; }
  .tickerItem .tNearest{ color:#39FF14; font-size:14px; margin-right:2px; }
  @keyframes ticker-scroll{
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .mapPane{
    flex:1 1 auto;
    min-height:160px;
    position:relative;
    border-top:1px solid var(--line);
  }
  #map{
    position:absolute; inset:0;
    background:var(--panel);
  }
  #map .leaflet-tile-pane{
    filter: grayscale(1) brightness(.8) contrast(1.15);
  }
  #map .leaflet-marker-pane,
  #map .leaflet-marker-pane *,
  #map .leaflet-overlay-pane,
  #map .leaflet-overlay-pane *{
    filter:none;
  }
  .station-label{
    background:transparent; border:none;
  }
  .station-label .pin{
    width:8px; height:8px; border-radius:50%;
    background:#ff2d95;
    margin:0 auto 3px;
  }
  .station-label .name{
    color:#ff2d95;
    font-family: var(--mono);
    font-size:14px;
    font-weight:700;
    letter-spacing:.03em;
    white-space:nowrap;
    text-align:center;
    text-shadow:
       1px  0    0 #fff,
      -1px  0    0 #fff,
       0    1px  0 #fff,
       0   -1px  0 #fff,
       1px  1px  0 #fff,
      -1px  1px  0 #fff,
       1px -1px  0 #fff,
      -1px -1px  0 #fff,
       2px  0    0 #fff,
      -2px  0    0 #fff,
       0    2px  0 #fff,
       0   -2px  0 #fff;
  }
  .station-label .lineName{
    font-family: var(--mono);
    font-size:8px;
    font-weight:600;
    letter-spacing:.02em;
    white-space:nowrap;
    text-align:center;
    margin-top:1px;
    text-shadow:
      1px 0 0 #fff, -1px 0 0 #fff,
      0 1px 0 #fff, 0 -1px 0 #fff,
      1px 1px 0 #fff, -1px 1px 0 #fff,
      1px -1px 0 #fff, -1px -1px 0 #fff;
  }
  .statusFoot{
    flex:0 0 auto;
    padding:8px 18px;
    padding-bottom:calc(8px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .mapOverlay{
    font-size:9px; letter-spacing:.15em; text-transform:uppercase;
    color:#FFFFFF;
  }
  .recenterBtn{
    position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px; z-index:500;
    width:38px; height:38px; border-radius:2px;
    background:rgba(14,18,16,.85); border:1px solid var(--brass-dim);
    color:var(--brass); display:flex; align-items:center; justify-content:center;
    font-size:16px; -webkit-appearance:none;
  }
  .recenterBtn:active{ background:rgba(200,162,74,.15); }

  /* header */
  .head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-bottom:8px; margin-bottom:10px;
    border-bottom:1px solid var(--line);
    letter-spacing:.12em;
  }
  .head .title{ font-size:11px; color:#22e5e5; text-transform:uppercase; }
  .head .status{ font-size:10px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--ink-dim); flex:none; }
  .dot.live{ background:var(--ok); box-shadow:0 0 6px var(--ok); animation:pulse 2s infinite; }
  .dot.err{ background:var(--warn); box-shadow:0 0 6px var(--warn); }
  .dot.low{ background:var(--warn); box-shadow:0 0 6px var(--warn); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }
  @keyframes ripple{
    0%   { transform:scale(0.2); opacity:.7; }
    100% { transform:scale(1);   opacity:0; }
  }
  .pulse-ring{
    position:absolute;
    top:50%; left:50%;
    width:54px; height:54px;
    margin-top:-27px; margin-left:-27px;
    border-radius:50%;
    background: currentColor;
    box-sizing:border-box;
    animation: ripple 2.2s ease-out infinite;
    transform-origin: center center;
  }
  .pulse-ring-delay{
    animation-delay: 1.1s;
  }

  /* main coordinate display */
  .coords{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .coordGrid{
    display:grid;
    grid-template-columns: auto 1fr;
    align-items:center;
    row-gap:6px;
    column-gap:16px;
  }
  .coordItem{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .coordItem .clabel{
    font-size:9px; letter-spacing:.12em; color:var(--ink-dim);
    text-transform:uppercase; flex:none;
    line-height:1.4;
    text-align:left;
  }
  .coordItem .hemi{ color:#39FF14; }
  .coordItem .hemiJa{
    color:#39FF14;
    font-size:9px;
    letter-spacing:.08em;
  }
  .coordItem .value{
    font-size:clamp(13px, 4.4vw, 17px);
    font-weight:600;
    letter-spacing:0;
    line-height:1.1;
    font-variant-numeric: tabular-nums;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    flex:1;
    text-align:right;
  }

  /* secondary grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(3, auto);
    justify-content:end;
    gap:20px;
    margin-top:-2px;
  }
  .cell{
    padding:0;
    text-align:left;
  }
  .cell .clabel{ font-size:8px; letter-spacing:.15em; color:var(--ink-dim); text-transform:uppercase; margin-bottom:3px; }
  .cell .cval{ font-size:14px; color:var(--ink); font-variant-numeric: tabular-nums; }
  .cell .cval .unit{ font-size:10px; color:var(--ink-dim); margin-left:2px; }

  .msg{
    text-align:center; color:var(--warn); font-size:12px;
    padding:10px 0 0; letter-spacing:.05em; line-height:1.6;
  }

  /* leaflet dark-theme tweaks */
  .leaflet-control-zoom a{
    background:rgba(14,18,16,.85) !important;
    color:var(--brass) !important;
    border-color:var(--line) !important;
    font-family: var(--mono) !important;
  }
  .leaflet-control-attribution{
    background:rgba(14,18,16,.7) !important;
    color:var(--ink-dim) !important;
    font-size:9px !important;
    font-family: var(--mono) !important;
  }
  .leaflet-control-attribution a{ color:var(--brass-dim) !important; }
  .leaflet-container{
    font-family: var(--mono) !important;
  }

  /* crosshair decoration */
  .mark{
    position:fixed; pointer-events:none; opacity:.5;
    color:var(--line);
    font-size:10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="head">
      <div class="title">WHERE YOU AT?</div>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">待機中</span></div>
    </div>

    <div class="coords">
      <div class="coordGrid">
        <div class="coordItem">
          <span class="clabel">LAT <span class="hemi" id="latHemi">—</span><br><span class="hemiJa" id="latHemiJa">—</span></span>
          <span class="value" id="latVal">--.------°</span>
        </div>
        <div class="grid">
          <div class="cell">
            <div class="clabel">精度</div>
            <div class="cval" id="accVal">--<span class="unit">m</span></div>
          </div>
          <div class="cell">
            <div class="clabel">高度</div>
            <div class="cval" id="altVal">--<span class="unit">m</span></div>
          </div>
          <div class="cell">
            <div class="clabel">速度</div>
            <div class="cval" id="spdVal">--<span class="unit">km/h</span></div>
          </div>
        </div>
        <div class="coordItem">
          <span class="clabel">LNG <span class="hemi" id="lngHemi">—</span><br><span class="hemiJa" id="lngHemiJa">—</span></span>
          <span class="value" id="lngVal">--.------°</span>
        </div>
        <div></div>
      </div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="ticker">
    <div class="tickerTrack" id="tickerTrack">
      <span class="tickerEmpty">駅情報を取得中…</span>
    </div>
  </div>

  <div class="mapPane">
    <div id="map"></div>
    <button class="recenterBtn" id="recenterBtn" aria-label="現在地に戻る">◎</button>
  </div>

  <div class="statusFoot">
    <span class="mapOverlay">Map View</span>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  const dot = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const latVal = document.getElementById('latVal');
  const lngVal = document.getElementById('lngVal');
  const latHemi = document.getElementById('latHemi');
  const lngHemi = document.getElementById('lngHemi');
  const latHemiJa = document.getElementById('latHemiJa');
  const lngHemiJa = document.getElementById('lngHemiJa');
  const accVal = document.getElementById('accVal');
  const altVal = document.getElementById('altVal');
  const spdVal = document.getElementById('spdVal');
  const msg = document.getElementById('msg');
  const mapOverlay = document.querySelector('.mapOverlay');

  let watchId = null;
  let followMe = true;

  // --- 精度フィルタ & 移動平均 ---
  const MAX_ACCEPT_ACCURACY = 100; // これより精度(誤差半径)が悪い測位は棄却 [m]
  const FORCE_ACCEPT_AFTER = 5;    // 悪い精度でも連続でこの回数棄却したら強制採用
  const SMOOTH_WINDOW = 5;        // 移動平均に使う直近サンプル数
  let recentFixes = [];           // { lat, lng, accuracy } の履歴
  let rejectStreak = 0;           // 精度不足で連続棄却した回数

  function smoothedPosition(lat, lng, accuracy){
    // 直近の平均から大きく離れた場合は「移動した」とみなし履歴をリセット(古い位置に引きずられて動きが鈍く見える問題の対策)
    if(recentFixes.length > 0){
      const last = recentFixes[recentFixes.length - 1];
      const jump = L.latLng(lat, lng).distanceTo([last.lat, last.lng]);
      if(jump > 100){
        recentFixes = [];
      }
    }

    recentFixes.push({ lat, lng, accuracy });
    if(recentFixes.length > SMOOTH_WINDOW) recentFixes.shift();

    // 精度が良いサンプルほど重みを大きくした加重平均
    let wSum = 0, latSum = 0, lngSum = 0;
    recentFixes.forEach(f=>{
      const w = 1 / Math.max(f.accuracy, 5); // 精度(誤差)が小さいほど重み大
      wSum += w;
      latSum += f.lat * w;
      lngSum += f.lng * w;
    });
    return { lat: latSum / wSum, lng: lngSum / wSum };
  }

  // --- map setup ---
  const map = L.map('map', {
    zoomControl: false,
    attributionControl: true
  }).setView([35.681236, 139.767125], 15);

  L.control.attribution({ prefix:false }).addTo(map);
  L.control.zoom({ position:'bottomleft' }).addTo(map);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  // 高度に応じたマーカー色: 50m以下は緑、超えると蛍光ブルー
  const ALT_THRESHOLD = 50;
  const COLOR_LOW = '#39ff8f';   // 緑
  const COLOR_HIGH = '#39caff';  // 蛍光ブルー
  function colorForAltitude(alt){
    if(alt == null) return COLOR_LOW;
    return alt > ALT_THRESHOLD ? COLOR_HIGH : COLOR_LOW;
  }

  function makePosIcon(color){
    return L.divIcon({
      className: '',
      html: `
        <div style="position:relative; width:160px; height:160px; display:flex; align-items:center; justify-content:center;">
          <div class="pulse-ring" style="color:${color};"></div>
        </div>`,
      iconSize: [160,160],
      iconAnchor: [80,80]
    });
  }

  let marker = null;
  let accCircle = null;
  let radiusCircleNear = null; // 半径1km
  let radiusCircleFar = null;  // 半径2km
  let currentMarkerColor = null;

  function updateMap(lat, lng, accuracy, altitude){
    const latlng = [lat, lng];
    const color = colorForAltitude(altitude);
    if(!marker){
      currentMarkerColor = color;
      marker = L.marker(latlng, { icon: makePosIcon(color), interactive:false }).addTo(map);
      accCircle = L.circle(latlng, {
        radius: accuracy || 0,
        color: color, weight:1, opacity:.4,
        fillColor: color, fillOpacity:.08
      }).addTo(map);

      radiusCircleNear = L.circle(latlng, {
        radius: STATION_RADIUS_NEAR,
        color: COLOR_NEAR, weight:2, opacity:.8,
        fill:false
      }).addTo(map);
      radiusCircleFar = L.circle(latlng, {
        radius: STATION_RADIUS_FAR,
        color: COLOR_FAR, weight:2, opacity:.8,
        fill:false
      }).addTo(map);

      // 初期表示: 半径3km(直径6km)が画面に収まるように表示
      const bounds = L.latLng(latlng).toBounds(6000); // 一辺6kmの正方形
      map.fitBounds(bounds);
    } else {
      marker.setLatLng(latlng);
      // 色が変わった時はDOM要素を作り直さず、色だけを直接書き換える(波紋アニメーションを継続させるため)
      if(color !== currentMarkerColor){
        currentMarkerColor = color;
        const el = marker.getElement();
        if(el){
          el.querySelectorAll('.pulse-ring').forEach(r => r.style.color = color);
        }
      }
      accCircle.setLatLng(latlng);
      accCircle.setRadius(accuracy || 0);
      accCircle.setStyle({ color: color, fillColor: color });
      radiusCircleNear.setLatLng(latlng);
      radiusCircleFar.setLatLng(latlng);
      if(followMe) map.panTo(latlng, { animate:true });
    }
  }

  map.on('dragstart', ()=>{ followMe = false; });

  document.getElementById('recenterBtn').addEventListener('click', ()=>{
    followMe = true;
    if(marker) map.setView(marker.getLatLng(), Math.max(map.getZoom(), 17), { animate:true });
  });

  // --- station labels via Overpass API ---
  let stationMarkers = [];
  let stationFetchTimer = null;
  let stationRetryTimer = null;
  let stationFailCount = 0; // 連続失敗回数(バックオフ間隔の計算に使用)
  let lastStationCenter = null;

  function clearStations(){
    stationMarkers.forEach(m => map.removeLayer(m));
    stationMarkers = [];
  }

  function stationIcon(name, color, lines){
    const lineText = (lines && lines.length > 0)
      ? lines.slice(0, 2).join(' / ') + (lines.length > 2 ? ' 他' : '')
      : '';
    const lineHtml = lineText
      ? `<div class="lineName" style="color:${color};">${lineText}</div>`
      : '';
    return L.divIcon({
      className: 'station-label',
      html: '<div class="pin" style="background:'+color+'"></div><div class="name" style="color:'+color+'; text-shadow:1px 0 0 #fff,-1px 0 0 #fff,0 1px 0 #fff,0 -1px 0 #fff,1px 1px 0 #fff,-1px 1px 0 #fff,1px -1px 0 #fff,-1px -1px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff,0 2px 0 #fff,0 -2px 0 #fff;">'+name+'</div>' + lineHtml,
      iconSize: [140, 48],
      iconAnchor: [70, 30]
    });
  }

  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
    'https://overpass.openstreetmap.ru/api/interpreter'
  ];

  function fetchWithTimeout(url, ms){
    const controller = new AbortController();
    const timer = setTimeout(()=> controller.abort(), ms);
    return fetch(url, { signal: controller.signal }).finally(()=> clearTimeout(timer));
  }

  const STATION_RADIUS_NEAR = 1000; // 蛍光赤 [m]
  const STATION_RADIUS_FAR  = 2000; // 蛍光オレンジ(これを超えると非表示) [m]
  const COLOR_NEAR = '#ff3b3b'; // 蛍光赤
  const COLOR_FAR  = '#ff9d1f'; // 蛍光オレンジ

  const tickerTrack = document.getElementById('tickerTrack');

  function updateTicker(nearby){
    if(!nearby || nearby.length === 0){
      tickerTrack.innerHTML = '<span class="tickerEmpty">周辺2km以内に駅が見つかりません</span>';
      tickerTrack.style.animation = 'none';
      return;
    }
    const top3 = nearby.slice().sort((a,b)=> a.dist - b.dist).slice(0, 3);

    const circledNumbers = ['①', '②', '③'];
    const itemsHtml = top3.map((s, idx)=>{
      const lineText = (s.lines && s.lines.length > 0)
        ? '<span class="tLine">' + (s.lines.slice(0,2).join('/') + (s.lines.length > 2 ? '他' : '')) + '</span>'
        : '';
      const walkMin = Math.round(s.dist / 80); // 徒歩1分=80mとして換算(整数)
      const nearestTag = idx === 0 ? '<span class="tNearest">(最寄り駅)</span>' : '';
      const distText = `${Math.round(s.dist)}m(徒歩${walkMin}分)`;
      const sep = '<span class="tSep">' + circledNumbers[idx % circledNumbers.length] + '</span>';
      return `<span class="tickerItem">${nearestTag}<span class="tName">${s.name}駅</span>${lineText}<span class="tDist">${distText}</span></span>${sep}`;
    }).join('');

    // シームレスループのため2回連結
    tickerTrack.innerHTML = itemsHtml + itemsHtml;

    // コンテンツ量に応じて速度を調整(短すぎず長すぎない一定速度になるよう)
    const approxWidth = top3.reduce((sum, s)=> sum + s.name.length * 14 + 90, 0);
    const duration = Math.max(10, (approxWidth * 2) / 60); // おおよそ60px/秒
    tickerTrack.style.animation = `ticker-scroll ${duration}s linear infinite`;
  }

  let cachedStations = []; // { name, lat, lng, lines } 直近取得した駅の生データ(距離を都度再計算するため)

  function refreshTickerDistances(){
    if(!marker || cachedStations.length === 0) return;
    const origin = marker.getLatLng();
    const nearby = cachedStations
      .map(s => ({ name: s.name, dist: origin.distanceTo([s.lat, s.lng]), lines: s.lines }))
      .filter(s => s.dist <= STATION_RADIUS_FAR);
    updateTicker(nearby);
  }

  let preferredEndpointIndex = 0; // 直近成功したエンドポイントを優先する

  function orderedEndpoints(){
    const list = OVERPASS_ENDPOINTS.slice();
    const [preferred] = list.splice(preferredEndpointIndex, 1);
    return preferred ? [preferred, ...list] : list;
  }

  // 路線名はベストエフォートで後追い取得(失敗しても駅表示自体には影響しない)
  async function fetchStationLines(origin, stationNodes, preferredEndpoint){
    try{
      const lineQuery = `[out:json][timeout:12];rel["type"="route"]["route"~"^(train|subway|light_rail)$"](around:${STATION_RADIUS_FAR},${origin.lat},${origin.lng});out body;`;
      const res = await fetchWithTimeout(preferredEndpoint + '?data=' + encodeURIComponent(lineQuery), 8000);
      if(!res.ok) return;
      const data = await res.json();
      const routeRelations = (data.elements || []).filter(el => el.type === 'relation');
      if(routeRelations.length === 0) return;

      const stationIdToLines = new Map();
      routeRelations.forEach(rel=>{
        const lineName = (rel.tags && (rel.tags['name:ja'] || rel.tags.name)) || (rel.tags && rel.tags.ref) || null;
        if(!lineName) return;
        (rel.members || []).forEach(mem=>{
          if(mem.type !== 'node') return;
          if(!stationIdToLines.has(mem.ref)) stationIdToLines.set(mem.ref, new Set());
          stationIdToLines.get(mem.ref).add(lineName);
        });
        const relText = [rel.tags.from, rel.tags.to, rel.tags.via].filter(Boolean).join(' ');
        if(relText){
          stationNodes.forEach(st=>{
            const stName = (st.tags && (st.tags['name:ja'] || st.tags.name)) || '';
            if(stName && relText.includes(stName)){
              if(!stationIdToLines.has(st.id)) stationIdToLines.set(st.id, new Set());
              stationIdToLines.get(st.id).add(lineName);
            }
          });
        }
      });

      if(stationIdToLines.size === 0) return;

      // キャッシュと地図上のラベルに路線名を反映
      cachedStations.forEach(s=>{
        const lineSet = stationIdToLines.get(s.id);
        if(lineSet){
          lineSet.forEach(l => { if(!s.lines.includes(l)) s.lines.push(l); });
        }
      });
      refreshTickerDistances();
      // 地図上のラベルも路線名付きで再描画
      const origin2 = marker.getLatLng();
      clearStations();
      cachedStations.forEach(s=>{
        const dist = origin2.distanceTo([s.lat, s.lng]);
        if(dist > STATION_RADIUS_FAR) return;
        const color = dist <= STATION_RADIUS_NEAR ? COLOR_NEAR : COLOR_FAR;
        const m = L.marker([s.lat, s.lng], { icon: stationIcon(s.name, color, s.lines), interactive:false }).addTo(map);
        stationMarkers.push(m);
      });
    }catch(e){
      console.warn('fetchStationLines failed (non-critical):', e);
    }
  }

  async function fetchStations(){
    try{
      if(!marker){ return; } // 現在地が未取得ならまだ実行しない
      if(map.getZoom() < 13){ clearStations(); mapOverlay.textContent = 'MAP VIEW'; return; }

      const origin = marker.getLatLng(); // 現在地(GPS)中心
      if(lastStationCenter && lastStationCenter.distanceTo(origin) < 200){
        return; // 現在地がほぼ動いていなければAPI再取得は間引く(距離表示自体は別途更新される)
      }

      // まず駅ノードのみを軽量取得(路線リレーションは含めない: レスポンスを軽くして成功率を上げる)
      const stationQuery = `[out:json][timeout:10];node["railway"="station"](around:${STATION_RADIUS_FAR},${origin.lat},${origin.lng});out body;`;

      mapOverlay.textContent = '駅情報取得中…';

      let succeeded = false;
      let lastError = null;
      const endpoints = orderedEndpoints();
      for(let i = 0; i < endpoints.length; i++){
        const endpoint = endpoints[i];
        try{
          const res = await fetchWithTimeout(endpoint + '?data=' + encodeURIComponent(stationQuery), 7000);
          if(!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          clearStations();

          const stationNodes = (data.elements || []).filter(el => el.type === 'node' && el.tags && el.tags.railway === 'station');

          let count = 0;
          const nearby = []; // { name, dist, lines }
          cachedStations = [];
          stationNodes.forEach(el=>{
            const name = (el.tags && (el.tags['name:ja'] || el.tags.name)) || null;
            if(!name) return;
            const dist = origin.distanceTo([el.lat, el.lon]);
            const lines = el.tags.network ? [el.tags.network] : [];
            cachedStations.push({ name, lat: el.lat, lng: el.lon, lines, id: el.id });
            if(dist > STATION_RADIUS_FAR) return; // 2km超は非表示
            const color = dist <= STATION_RADIUS_NEAR ? COLOR_NEAR : COLOR_FAR;
            const m = L.marker([el.lat, el.lon], { icon: stationIcon(name, color, lines), interactive:false }).addTo(map);
            stationMarkers.push(m);
            nearby.push({ name, dist, lines });
            count++;
          });
          mapOverlay.textContent = count > 0 ? ('駅 ' + count + '件') : 'MAP VIEW';
          updateTicker(nearby);
          lastStationCenter = origin; // 成功時のみ記録(失敗時は次回も必ず再試行させる)
          clearTimeout(stationRetryTimer);
          stationFailCount = 0;
          succeeded = true;

          // 使えたエンドポイントを次回優先にする
          preferredEndpointIndex = OVERPASS_ENDPOINTS.indexOf(endpoint);
          if(preferredEndpointIndex < 0) preferredEndpointIndex = 0;

          // 路線名は失敗しても駅表示に影響しないよう、別途ベストエフォートで取得
          fetchStationLines(origin, stationNodes, endpoint);
          break;
        }catch(e){
          lastError = e;
          console.warn('overpass endpoint failed:', endpoint, e);
        }
      }
      if(!succeeded){
        stationFailCount++;
        const reason = lastError ? (lastError.name === 'AbortError' ? 'タイムアウト' : lastError.message) : '不明';
        mapOverlay.textContent = `駅情報取得失敗(${reason}) 再試行中…`;
        clearTimeout(stationRetryTimer);
        // 連続失敗するほど間隔を伸ばす(3秒→6秒→12秒...最大30秒): 過度な連打によるレート制限を避ける
        const backoff = Math.min(30000, 3000 * Math.pow(2, stationFailCount - 1));
        stationRetryTimer = setTimeout(fetchStations, backoff);
      }
    }catch(e){
      console.error('fetchStations error:', e);
      stationFailCount++;
      mapOverlay.textContent = '駅情報取得失敗(再試行中)';
      clearTimeout(stationRetryTimer);
      const backoff = Math.min(30000, 3000 * Math.pow(2, stationFailCount - 1));
      stationRetryTimer = setTimeout(fetchStations, backoff);
    }
  }

  map.on('moveend', ()=>{
    clearTimeout(stationFetchTimer);
    stationFetchTimer = setTimeout(fetchStations, 1500);
  });

  function fmtCoord(v){
    const abs = Math.abs(v);
    return abs.toFixed(6) + '°';
  }


  function onPosition(pos){
    const c = pos.coords;

    // 精度の悪い測位は原則棄却するが、一定回数連続したら強制的に採用する(GPSが止まって見える問題の対策)
    if(c.accuracy != null && c.accuracy > MAX_ACCEPT_ACCURACY && rejectStreak < FORCE_ACCEPT_AFTER){
      rejectStreak++;
      dot.className = 'dot low';
      statusText.textContent = '精度低(除外 ' + Math.round(c.accuracy) + 'm)';
      accVal.innerHTML = Math.round(c.accuracy) + '<span class="unit">m</span>';
      return;
    }
    rejectStreak = 0;

    dot.className = 'dot live';
    statusText.textContent = '受信中';
    msg.textContent = '';

    const smoothed = smoothedPosition(c.latitude, c.longitude, c.accuracy || 30);

    latVal.textContent = fmtCoord(smoothed.lat);
    lngVal.textContent = fmtCoord(smoothed.lng);
    latHemi.textContent = smoothed.lat >= 0 ? 'N' : 'S';
    latHemiJa.textContent = smoothed.lat >= 0 ? '北緯' : '南緯';
    lngHemi.textContent = smoothed.lng >= 0 ? 'E' : 'W';
    lngHemiJa.textContent = smoothed.lng >= 0 ? '東経' : '西経';

    accVal.innerHTML = (c.accuracy != null ? Math.round(c.accuracy) : '--') + '<span class="unit">m</span>';
    altVal.innerHTML = (c.altitude != null ? Math.round(c.altitude) : '--') + '<span class="unit">m</span>';
    const kmh = c.speed != null ? (c.speed * 3.6).toFixed(1) : '--';
    spdVal.innerHTML = kmh + '<span class="unit">km/h</span>';

    updateMap(smoothed.lat, smoothed.lng, c.accuracy, c.altitude);
    refreshTickerDistances(); // 通信を伴わない軽量処理: GPS移動のたびに距離表示だけ更新
  }

  function onError(err){
    dot.className = 'dot err';
    statusText.textContent = 'エラー';
    const messages = {
      1: '位置情報の利用が許可されていません。設定から許可してください。',
      2: '位置情報を取得できませんでした。電波状況を確認してください。',
      3: 'タイムアウトしました。再試行してください。'
    };
    msg.textContent = messages[err.code] || '不明なエラーが発生しました。';
    stop();
  }

  function start(){
    if(!('geolocation' in navigator)){
      msg.textContent = 'このブラウザは位置情報に対応していません。';
      return;
    }
    recentFixes = [];
    rejectStreak = 0;
    dot.className = 'dot';
    statusText.textContent = '取得中…';
    watchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true,
      maximumAge: 500,
      timeout: 15000
    });
  }

  function stop(){
    if(watchId !== null){
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    if(dot.className !== 'dot err'){
      dot.className = 'dot';
      statusText.textContent = '停止中';
    }
  }

  // auto start on load
  start();

  setTimeout(()=> map.invalidateSize(), 200);
  setTimeout(()=> map.invalidateSize(), 800); // レイアウト確定の遅延分の保険
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=> map.invalidateSize()); // Webフォント読み込みで高さが変わるケースに対応
  }
  window.addEventListener('resize', ()=> map.invalidateSize());
  window.addEventListener('orientationchange', ()=> setTimeout(()=> map.invalidateSize(), 300));

  // .mapPane自体のサイズ変化(共有シートの開閉、アドレスバーの表示切替等)にも追従
  if(window.ResizeObserver){
    const mapPaneEl = document.querySelector('.mapPane');
    if(mapPaneEl){
      const ro = new ResizeObserver(()=> map.invalidateSize());
      ro.observe(mapPaneEl);
    }
  }

  setTimeout(fetchStations, 500);
  // 駅情報の再取得はGPS更新とは無関係に、一定間隔(10秒)だけで判断する
  // (GPS更新のたびにトリガーすると通信処理がGPS表示の体感速度を妨げるため分離)
  setInterval(fetchStations, 10000);
</script>
</body>
</html>
