<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAP DUNGEON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:'BIZ UDPGothic', sans-serif; }
  .mont { font-family:'Montserrat', sans-serif; }
  #gamecanvas { display:block; width:100%; height:100%; }

  #titleScreen {
    position:fixed; inset:0; z-index:50;
    background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#026881;
    padding:0 24px;
  }
  #titleScreen h1 {
    font-size:clamp(28px,8vw,52px);
    letter-spacing:8px;
    margin-bottom:14px;
    font-weight:normal;
    text-align:center;
  }
  #titleScreen .sub {
    font-size:13px; letter-spacing:0.5px; color:#4fa8bf; margin-bottom:40px;
    text-align:center; max-width:340px; line-height:1.6;
  }
  .btn {
    display:block; width:min(60vw,220px); background:#000; border:1px solid #026881; color:#026881;
    padding:13px 8px; font-family:inherit; font-size:14px; letter-spacing:4px; margin-top:8px;
    cursor:pointer; text-align:center;
  }
  .btn:active { background:#026881; color:#000; }
  #statusLine {
    margin-top:18px; font-size:11px; letter-spacing:1px; color:#026881; min-height:16px; text-align:center;
    max-width:84vw;
  }

  #hud { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; color:#026881; font-size:12px; letter-spacing:1px; }
  #msgLog {
    position:absolute; top:46px; left:10px; font-size:11px; color:#026881; text-shadow:0 0 4px #000;
    display:flex; flex-direction:column; gap:2px; max-width:70vw;
  }
  #msgLog span { opacity:0; transition:opacity 0.3s; }

  #minimapWrap {
    position:absolute; top:10px; right:10px; width:120px; height:120px;
    border:1px solid #013e4d; background:rgba(0,0,0,0.55);
  }
  #minimapCanvas { width:100%; height:100%; }
  #headingLabel {
    position:absolute; top:132px; right:10px; width:120px; text-align:center;
    font-size:10px; letter-spacing:2px; color:#4fa8bf; text-shadow:0 0 4px #000;
  }

  #crosshair {
    position:absolute; top:50%; left:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
    border:1px solid #026881; border-radius:50%; opacity:0.6;
  }

  #gpsBadge {
    position:absolute; bottom:42px; right:10px; font-size:10px; letter-spacing:1px;
    color:#4fa8bf; background:rgba(0,0,0,0.5); padding:4px 8px; border:1px solid #013e4d;
    display:none;
  }
  #gpsInfo {
    position:absolute; bottom:10px; left:10px; right:10px; font-size:8px; letter-spacing:0.2px;
    color:#4fa8bf; background:rgba(0,0,0,0.5); border:1px solid #013e4d; padding:5px 6px;
    display:flex; flex-direction:row; justify-content:space-between; gap:3px;
  }
  #gpsInfo .row { display:flex; flex-direction:column; align-items:center; gap:1px; flex:1 1 0; min-width:0; overflow:hidden; }
  #gpsInfo .row span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  #gpsInfo .row span:first-child { color:#013e4d; }
  #gpsInfo .row span:last-child { color:#026881; }

  /* touch controls */
  #joyZone, #lookZone {
    position:fixed; bottom:0; width:50%; height:46%; z-index:25; pointer-events:auto;
  }
  #joyZone { left:0; }
  #lookZone { right:0; }
  #joyBase {
    position:absolute; width:88px; height:88px; border:1px solid rgba(2,104,129,0.5);
    border-radius:50%; display:none;
  }
  #joyStick {
    position:absolute; width:38px; height:38px; border:1px solid #026881; background:rgba(2,104,129,0.25);
    border-radius:50%; display:none;
  }

  #desktopHint {
    position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:10px; color:#013e4d; letter-spacing:1px; text-align:center; pointer-events:none;
  }
</style>
</head>
<body>

<canvas id="gamecanvas"></canvas>

<div id="titleScreen">
  <h1 class="mont">Real Quest</h1>
  <div class="sub mont">Embark on a journey through a 3D dungeon generated from a map.</div>
  <button class="btn mont" id="startBtn">START</button>
  <div id="statusLine"></div>
</div>

<div id="hud">
  <div id="msgLog"></div>
  <div id="minimapWrap"><canvas id="minimapCanvas"></canvas></div>
  <div id="headingLabel" class="mont">N 0°</div>
  <div id="crosshair"></div>
  <div id="gpsBadge" class="mont">GPS LINK ●</div>
  <div id="gpsInfo" class="mont">
    <div class="row"><span>LAT</span><span id="gpsLat">--</span></div>
    <div class="row"><span>LNG</span><span id="gpsLon">--</span></div>
    <div class="row"><span>ACC</span><span id="gpsAcc">-- m</span></div>
    <div class="row"><span>ALT</span><span id="gpsAlt">-- m</span></div>
    <div class="row"><span>SPD</span><span id="gpsSpd">-- km/h</span></div>
  </div>
</div>

<div id="joyZone"><div id="joyBase"></div><div id="joyStick"></div></div>
<div id="lookZone"></div>
<div id="desktopHint">WASD 移動 / ドラッグ 視点 / クリックで視点ロック</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- state ----------
  let scene, camera, renderer;
  let corridorSegs = []; // {p1:{x,z}, p2:{x,z}, half}
  let monsters = [], loots = [];
  let player = { x:0, z:0, y:1.6, yaw:0, pitch:0 };
  let lon0=null, lat0=null;
  let score = 0;
  let gpsLinked = false;
  let clock;
  const isTouch = ('ontouchstart' in window);

  const statusLine = document.getElementById('statusLine');
  const titleScreen = document.getElementById('titleScreen');
  const hud = document.getElementById('hud');
  const DEFAULT_RADIUS = 300;

  function setStatus(t){ statusLine.textContent = t; }

  // ---------- overpass ----------

  async function fetchRoads(lat, lon, radius){
    const q = `[out:json][timeout:25];way["highway"](around:${radius},${lat},${lon});out geom;`;
    const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(q);
    const res = await fetch(url);
    if(!res.ok) throw new Error('overpass failed');
    const data = await res.json();
    return data.elements || [];
  }

  function project(lat, lon){
    const R = 6378137;
    const x = (lon - lon0) * Math.PI/180 * R * Math.cos(lat0*Math.PI/180);
    const z = -(lat - lat0) * Math.PI/180 * R;
    return { x, z };
  }

  // fallback synthetic maze if fetch fails (CORS/offline)
  function proceduralFallback(){
    const segs = [];
    const step = 24, n = 8;
    for(let i=-n;i<=n;i++){
      segs.push({a:{x:i*step,z:-n*step}, b:{x:i*step,z:n*step}});
    }
    for(let j=-n;j<=n;j++){
      if(j % 2 === 0) segs.push({a:{x:-n*step,z:j*step}, b:{x:n*step,z:j*step}});
      else segs.push({a:{x:-n*step*0.4,z:j*step}, b:{x:n*step*0.4,z:j*step}});
    }
    return segs;
  }

  // ---------- build dungeon ----------
  function buildDungeonFromWays(ways){
    const rawSegs = [];
    ways.forEach(w=>{
      if(!w.geometry || w.geometry.length < 2) return;
      const pts = w.geometry.map(g=>project(g.lat, g.lon));
      for(let i=0;i<pts.length-1;i++){
        rawSegs.push({a:pts[i], b:pts[i+1]});
      }
    });
    return rawSegs;
  }

  function assemble(rawSegs){
    corridorSegs = [];
    const wallVerts = [];
    const floorVerts = [];
    const floorFillVerts = [];
    const half = 3.2;
    const wallH = 4.4;
    const nodeMap = new Map(); // shared endpoints across segments -> filled/walled joint pillar

    function nodeKey(p){ return Math.round(p.x*10)+'_'+Math.round(p.z*10); }
    function registerNode(p){
      const k = nodeKey(p);
      if(!nodeMap.has(k)) nodeMap.set(k, p);
    }

    rawSegs.forEach(seg=>{
      const dx = seg.b.x - seg.a.x, dz = seg.b.z - seg.a.z;
      const len = Math.sqrt(dx*dx+dz*dz);
      if(len < 0.5) return;
      const nx = -dz/len, nz = dx/len; // normal

      const l1 = {x:seg.a.x+nx*half, z:seg.a.z+nz*half};
      const l2 = {x:seg.b.x+nx*half, z:seg.b.z+nz*half};
      const r1 = {x:seg.a.x-nx*half, z:seg.a.z-nz*half};
      const r2 = {x:seg.b.x-nx*half, z:seg.b.z-nz*half};

      corridorSegs.push({p1:seg.a, p2:seg.b, half:half});
      registerNode(seg.a);
      registerNode(seg.b);

      // wall rectangles as line loops (bottom, top, 2 verticals) for both sides
      [[l1,l2],[r1,r2]].forEach(([p1,p2])=>{
        pushLine(wallVerts, p1.x,0,p1.z, p2.x,0,p2.z);
        pushLine(wallVerts, p1.x,wallH,p1.z, p2.x,wallH,p2.z);
        pushLine(wallVerts, p1.x,0,p1.z, p1.x,wallH,p1.z);
        pushLine(wallVerts, p2.x,0,p2.z, p2.x,wallH,p2.z);
      });
      // floor edge outline
      pushLine(floorVerts, l1.x,0.02,l1.z, l2.x,0.02,l2.z);
      pushLine(floorVerts, r1.x,0.02,r1.z, r2.x,0.02,r2.z);

      // filled road surface (two triangles per segment quad)
      floorFillVerts.push(
        l1.x,0.01,l1.z,  r1.x,0.01,r1.z,  r2.x,0.01,r2.z,
        l1.x,0.01,l1.z,  r2.x,0.01,r2.z,  l2.x,0.01,l2.z
      );
    });

    // joint pillars at every shared node: seals the gap where segments meet at an angle
    // (each segment offsets its own walls independently, so corners don't line up at bends/intersections)
    nodeMap.forEach(p=>{
      const cx0=p.x-half, cx1=p.x+half, cz0=p.z-half, cz1=p.z+half;
      const corners = [[cx0,cz0],[cx1,cz0],[cx1,cz1],[cx0,cz1]];
      for(let i=0;i<4;i++){
        const [ax,az] = corners[i], [bx,bz] = corners[(i+1)%4];
        pushLine(wallVerts, ax,0,az, bx,0,bz);
        pushLine(wallVerts, ax,wallH,az, bx,wallH,bz);
        pushLine(wallVerts, ax,0,az, ax,wallH,az);
      }
      floorFillVerts.push(
        cx0,0.01,cz0,  cx1,0.01,cz0,  cx1,0.01,cz1,
        cx0,0.01,cz0,  cx1,0.01,cz1,  cx0,0.01,cz1
      );
    });

    const wallGeo = new THREE.BufferGeometry();
    wallGeo.setAttribute('position', new THREE.Float32BufferAttribute(wallVerts,3));
    const wallMat = new THREE.LineBasicMaterial({ color:0x026881, transparent:true, opacity:0.85 });
    const wallLines = new THREE.LineSegments(wallGeo, wallMat);
    scene.add(wallLines);

    const fillGeo = new THREE.BufferGeometry();
    fillGeo.setAttribute('position', new THREE.Float32BufferAttribute(floorFillVerts,3));
    fillGeo.computeVertexNormals();
    const fillMat = new THREE.MeshBasicMaterial({ color:0x026881, transparent:true, opacity:0.5, side:THREE.DoubleSide });
    scene.add(new THREE.Mesh(fillGeo, fillMat));

    const floorGeo = new THREE.BufferGeometry();
    floorGeo.setAttribute('position', new THREE.Float32BufferAttribute(floorVerts,3));
    const floorMat = new THREE.LineBasicMaterial({ color:0x013e4d, transparent:true, opacity:0.5 });
    scene.add(new THREE.LineSegments(floorGeo, floorMat));
  }

  function pushLine(arr, x1,y1,z1,x2,y2,z2){
    arr.push(x1,y1,z1,x2,y2,z2);
  }

  // ---------- monsters & loot (adventure seed) ----------
  function scatterEntities(){
    monsters = []; loots = [];
    if(corridorSegs.length === 0) return;
    const mCount = Math.min(16, Math.max(6, Math.floor(corridorSegs.length/3)));
    const lCount = Math.min(10, Math.max(4, Math.floor(corridorSegs.length/5)));

    for(let i=0;i<mCount;i++){
      const seg = corridorSegs[Math.floor(Math.random()*corridorSegs.length)];
      const t = 0.2 + Math.random()*0.6;
      const x = seg.p1.x + (seg.p2.x-seg.p1.x)*t;
      const z = seg.p1.z + (seg.p2.z-seg.p1.z)*t;
      const geo = new THREE.OctahedronGeometry(0.6,0);
      const mat = new THREE.MeshBasicMaterial({ color:0xff3355, wireframe:true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.9, z);
      scene.add(mesh);
      monsters.push({mesh, x, z, alive:true});
    }
    for(let i=0;i<lCount;i++){
      const seg = corridorSegs[Math.floor(Math.random()*corridorSegs.length)];
      const t = 0.2 + Math.random()*0.6;
      const x = seg.p1.x + (seg.p2.x-seg.p1.x)*t;
      const z = seg.p1.z + (seg.p2.z-seg.p1.z)*t;
      const geo = new THREE.BoxGeometry(0.5,0.5,0.5);
      const mat = new THREE.MeshBasicMaterial({ color:0xffe93a, wireframe:true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.6, z);
      scene.add(mesh);
      loots.push({mesh, x, z, alive:true});
    }
  }

  function logMsg(text){
    const log = document.getElementById('msgLog');
    const line = document.createElement('span');
    line.textContent = text;
    log.appendChild(line);
    requestAnimationFrame(()=> line.style.opacity = 1);
    setTimeout(()=>{ line.style.opacity = 0; setTimeout(()=>line.remove(), 400); }, 2200);
    while(log.children.length > 4) log.removeChild(log.firstChild);
  }

  // ---------- three.js setup ----------
  function initThree(){
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x000000, 8, 70);
    camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.1, 200);
    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gamecanvas'), antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio,2));
    window.addEventListener('resize', ()=>{
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    clock = new THREE.Clock();
  }

  // ---------- controls ----------
  const keys = {};
  window.addEventListener('keydown', e=> keys[e.code]=true);
  window.addEventListener('keyup', e=> keys[e.code]=false);

  let pointerLocked = false;
  document.getElementById('gamecanvas').addEventListener('click', ()=>{
    if(!isTouch) document.getElementById('gamecanvas').requestPointerLock();
  });
  document.addEventListener('pointerlockchange', ()=>{
    pointerLocked = document.pointerLockElement === document.getElementById('gamecanvas');
  });
  document.addEventListener('mousemove', e=>{
    if(!pointerLocked) return;
    player.yaw -= e.movementX * 0.0022;
    player.pitch -= e.movementY * 0.0022;
    player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch));
  });

  // touch joystick
  let joyTouchId=null, joyStart=null, joyVec={x:0,y:0};
  let lookTouchId=null, lookLast=null;
  const joyZone = document.getElementById('joyZone');
  const lookZone = document.getElementById('lookZone');
  const joyBase = document.getElementById('joyBase');
  const joyStick = document.getElementById('joyStick');

  joyZone.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    joyTouchId = t.identifier;
    joyStart = {x:t.clientX, y:t.clientY};
    joyBase.style.display='block'; joyStick.style.display='block';
    joyBase.style.left=(t.clientX-44)+'px'; joyBase.style.top=(t.clientY-44)+'px';
    joyStick.style.left=(t.clientX-19)+'px'; joyStick.style.top=(t.clientY-19)+'px';
  }, {passive:true});
  joyZone.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(t.identifier !== joyTouchId) continue;
      let dx = t.clientX - joyStart.x, dy = t.clientY - joyStart.y;
      const d = Math.min(44, Math.sqrt(dx*dx+dy*dy));
      const ang = Math.atan2(dy,dx);
      dx = Math.cos(ang)*d; dy = Math.sin(ang)*d;
      joyStick.style.left=(joyStart.x+dx-19)+'px'; joyStick.style.top=(joyStart.y+dy-19)+'px';
      joyVec.x = dx/44; joyVec.y = dy/44;
    }
  }, {passive:true});
  function joyEnd(e){
    for(const t of e.changedTouches){
      if(t.identifier !== joyTouchId) continue;
      joyTouchId=null; joyVec={x:0,y:0};
      joyBase.style.display='none'; joyStick.style.display='none';
    }
  }
  joyZone.addEventListener('touchend', joyEnd);
  joyZone.addEventListener('touchcancel', joyEnd);

  lookZone.addEventListener('touchstart', e=>{
    const t = e.changedTouches[0];
    lookTouchId = t.identifier;
    lookLast = {x:t.clientX, y:t.clientY};
  }, {passive:true});
  lookZone.addEventListener('touchmove', e=>{
    for(const t of e.changedTouches){
      if(t.identifier !== lookTouchId) continue;
      const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
      player.yaw -= dx * 0.0045;
      player.pitch -= dy * 0.0045;
      player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch));
      lookLast = {x:t.clientX, y:t.clientY};
    }
  }, {passive:true});
  lookZone.addEventListener('touchend', e=>{
    for(const t of e.changedTouches) if(t.identifier===lookTouchId) lookTouchId=null;
  });

  // ---------- keep player snapped onto the nearest road at all times ----------
  function clampToCorridor(x,z){
    if(corridorSegs.length===0) return {x,z};
    let bestD=Infinity, bestPt=null;
    for(const s of corridorSegs){
      const abx=s.p2.x-s.p1.x, abz=s.p2.z-s.p1.z;
      const len2 = abx*abx+abz*abz || 1e-6;
      let t = ((x-s.p1.x)*abx + (z-s.p1.z)*abz)/len2;
      t = Math.max(0,Math.min(1,t));
      const px = s.p1.x+abx*t, pz = s.p1.z+abz*t;
      const d = (x-px)*(x-px)+(z-pz)*(z-pz);
      if(d<bestD){ bestD=d; bestPt={x:px,z:pz}; }
    }
    // always snap exactly onto the nearest road's centerline
    return bestPt;
  }

  // ---------- game loop ----------
  function update(dt){
    if(!gpsLinked){
      const speed = 6.2;
      let mx=0, mz=0;
      if(keys['KeyW']||keys['ArrowUp']) mz -= 1;
      if(keys['KeyS']||keys['ArrowDown']) mz += 1;
      if(keys['KeyA']||keys['ArrowLeft']) mx -= 1;
      if(keys['KeyD']||keys['ArrowRight']) mx += 1;
      if(joyVec.x||joyVec.y){ mx += joyVec.x; mz += joyVec.y; }
      const mlen = Math.sqrt(mx*mx+mz*mz);
      if(mlen>0.001){
        mx/=mlen; mz/=mlen;
        const cos=Math.cos(player.yaw), sin=Math.sin(player.yaw);
        const wx = mx*cos - mz*sin, wz = mx*sin + mz*cos;
        const nx = player.x + wx*speed*dt;
        const nz = player.z + wz*speed*dt;
        const clamped = clampToCorridor(nx,nz);
        player.x = clamped.x; player.z = clamped.z;
      }
    }

    camera.position.set(player.x, player.y, player.z);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    // entity interactions
    monsters.forEach(m=>{
      if(!m.alive) return;
      const d = Math.hypot(player.x-m.x, player.z-m.z);
      m.mesh.rotation.y += dt*0.8;
      if(d < 1.6){
        m.alive=false; scene.remove(m.mesh);
        score += 100;
        logMsg('モンスターを撃退した！ +100');
      }
    });
    loots.forEach(l=>{
      if(!l.alive) return;
      l.mesh.rotation.y += dt*1.4;
      const d = Math.hypot(player.x-l.x, player.z-l.z);
      if(d < 1.4){
        l.alive=false; scene.remove(l.mesh);
        score += 30;
        logMsg('宝を発見した！ +30');
      }
    });

    drawMinimap();
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());
    update(dt);
    renderer.render(scene, camera);
  }

  // ---------- minimap (fixed north-up, like a real map; player marker rotates to show facing) ----------
  const mmCanvas = document.getElementById('minimapCanvas');
  const headingLabel = document.getElementById('headingLabel');
  const compassNames = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];

  function drawMinimap(){
    const w = mmCanvas.clientWidth, h = mmCanvas.clientHeight;
    if(mmCanvas.width !== w) { mmCanvas.width=w; mmCanvas.height=h; }
    const ctx = mmCanvas.getContext('2d');
    ctx.clearRect(0,0,w,h);
    const scale = 1.4;

    // map content: fixed orientation (north = up, matching a real-world map), only pans with the player
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.strokeStyle = 'rgba(2,104,129,0.55)';
    ctx.lineWidth = 6.4 * scale; // filled road width (matches corridor width)
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    corridorSegs.forEach(s=>{
      const x1=(s.p1.x-player.x)*scale, y1=(s.p1.z-player.z)*scale;
      const x2=(s.p2.x-player.x)*scale, y2=(s.p2.z-player.z)*scale;
      if((Math.abs(x1)<w && Math.abs(y1)<h) || (Math.abs(x2)<w && Math.abs(y2)<h)){
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      }
    });
    ctx.stroke();
    // road centerline / edge accent on top of the fill
    ctx.strokeStyle = 'rgba(2,104,129,0.8)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    corridorSegs.forEach(s=>{
      const x1=(s.p1.x-player.x)*scale, y1=(s.p1.z-player.z)*scale;
      const x2=(s.p2.x-player.x)*scale, y2=(s.p2.z-player.z)*scale;
      if((Math.abs(x1)<w && Math.abs(y1)<h) || (Math.abs(x2)<w && Math.abs(y2)<h)){
        ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
      }
    });
    ctx.stroke();
    ctx.fillStyle = '#ff3355';
    monsters.forEach(m=>{
      if(!m.alive) return;
      const x=(m.x-player.x)*scale, y=(m.z-player.z)*scale;
      if(Math.abs(x)<w && Math.abs(y)<h) ctx.fillRect(x-1.5,y-1.5,3,3);
    });
    ctx.restore();

    // "N" tick at the top edge — anchors the map to real-world north
    ctx.fillStyle = '#4fa8bf';
    ctx.font = '9px "Montserrat", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('N', w/2, 10);

    // player marker: field-of-view cone + triangle, rotated to the actual facing direction
    ctx.save();
    ctx.translate(w/2, h/2);
    ctx.rotate(player.yaw);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(-13,-30);
    ctx.lineTo(13,-30);
    ctx.closePath();
    ctx.fillStyle = 'rgba(2,104,129,0.20)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,-8);
    ctx.lineTo(-5.5,5.5);
    ctx.lineTo(5.5,5.5);
    ctx.closePath();
    ctx.fillStyle = '#026881';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fill();
    ctx.restore();

    // heading readout
    let deg = (player.yaw * 180/Math.PI) % 360;
    if(deg < 0) deg += 360;
    const compass = compassNames[Math.round(deg/22.5) % 16];
    headingLabel.textContent = compass + ' ' + Math.round(deg) + '°';
  }

  // ---------- GPS link mode ----------
  let gpsWatchId = null;

  function enableGPSLink(){
    if(!navigator.geolocation){ logMsg('This device does not support GPS'); return; }
    gpsLinked = true;
    document.getElementById('gpsBadge').style.display='block';
    gpsWatchId = navigator.geolocation.watchPosition(pos=>{
      const c = pos.coords;
      const p = project(c.latitude, c.longitude);
      const snapped = clampToCorridor(p.x, p.z);
      player.x = snapped.x; player.z = snapped.z;
      if(c.heading!=null && !isNaN(c.heading)){
        player.yaw = -c.heading * Math.PI/180;
      }
      document.getElementById('gpsLat').textContent = c.latitude.toFixed(5);
      document.getElementById('gpsLon').textContent = c.longitude.toFixed(5);
      document.getElementById('gpsAcc').textContent = (c.accuracy!=null ? c.accuracy.toFixed(1) : '--') + ' m';
      document.getElementById('gpsAlt').textContent = (c.altitude!=null ? c.altitude.toFixed(1) : '--') + ' m';
      document.getElementById('gpsSpd').textContent = (c.speed!=null ? (c.speed*3.6).toFixed(1) : '--') + ' km/h';
    }, err=>{ logMsg('GPS取得に失敗しました'); }, { enableHighAccuracy:true, maximumAge:1000 });

    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(state=>{
        if(state==='granted') window.addEventListener('deviceorientation', onOrient);
      }).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation', onOrient);
    }
  }
  function disableGPSLink(){
    gpsLinked = false;
    document.getElementById('gpsBadge').style.display='none';
    if(gpsWatchId != null){ navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  }
  function onOrient(e){
    if(!gpsLinked) return;
    let heading = e.webkitCompassHeading != null ? e.webkitCompassHeading : (360 - e.alpha);
    if(heading!=null && !isNaN(heading)) player.yaw = heading * Math.PI/180;
  }

  // ---------- startup flows ----------
  async function startGame(lat, lon, radius){
    setStatus('Fetching road data...');
    lat0 = lat; lon0 = lon;
    initThree();
    let rawSegs;
    try {
      const ways = await fetchRoads(lat, lon, radius);
      rawSegs = buildDungeonFromWays(ways);
      if(rawSegs.length === 0) throw new Error('no roads');
    } catch(e){
      setStatus('Could not fetch map data — using a fallback maze instead');
      rawSegs = proceduralFallback().map(s=>({a:s.a,b:s.b}));
    }
    assemble(rawSegs);
    scatterEntities();
    player.x = 0; player.z = 0; player.yaw = 0; player.pitch = 0;

    titleScreen.style.display = 'none';
    hud.style.display = 'block';
    if(isTouch){ document.getElementById('desktopHint').style.display='none'; }
    else { joyZone.style.pointerEvents='none'; lookZone.style.pointerEvents='none'; }
    animate();

    // GPS-linked mode is the default: walking the real roads moves you through the dungeon
    enableGPSLink();
  }

  document.getElementById('startBtn').addEventListener('click', ()=>{
    if(!navigator.geolocation){ setStatus('This device does not support GPS'); return; }
    setStatus('Getting current location...');
    navigator.geolocation.getCurrentPosition(pos=>{
      startGame(pos.coords.latitude, pos.coords.longitude, DEFAULT_RADIUS);
    }, err=>{
      setStatus('Could not get your location (please check location permissions)');
    }, { enableHighAccuracy:true, timeout:10000 });
  });

  // tap the minimap to toggle GPS-linked mode on/off (default is ON)
  document.getElementById('minimapWrap').addEventListener('click', ()=>{
    if(gpsLinked){
      disableGPSLink();
      logMsg('GPS連動モードOFF: 手動操作に切替');
    } else {
      enableGPSLink();
      logMsg('GPS連動モードON: 実際に歩くとダンジョンが進みます');
    }
  });

})();
</script>
