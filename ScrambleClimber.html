<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Scramble Climber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{font-family:'Open Sans',sans-serif;font-weight:400;margin:0;height:100%;background:#e5e5e5;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
try{document.fonts&&document.fonts.load('400 16px Open Sans');document.fonts.load('700 16px Open Sans')}catch(e){}
const COLS=7,SEG=10,NP=10;
const DX=10/37.6-0.1275,DY=10/37.6-0.1545;
let outline=[],miniOutline=[];
const PATC={};
for(let m=0;m<128;m++){const k=m.toString(2).padStart(7,'0');PATC[k]=[];for(let c=0;c<COLS;c++)PATC[k][c]=k[c]==='1';}
let pat=Array(10).fill('1111111');
function comps(k){const a=PATC[k],r=[];let c=0;while(c<COLS){if(a[c]){let e=c;while(e+1<COLS&&a[e+1])e++;r.push([c,e]);c=e+1;}else c++;}return r;}
// ステージ構成: 上(屋上側)から下へ10段、1段=10階、7文字=窓7列(1=ビル,0=空間)
const STAGES=[
['1111111','1111111','1111111','1111111','1111111','1111111','1111111','1111111','1111111','1111111'],
['1111111','1111111','0011100','0011100','1111111','1111111','0011100','0011100','1111111','1111111'],
['1111111','1111111','1100011','1100011','1111111','1111111','1100011','1100011','1111111','1111111'],
['0011100','0011100','0011100','1111111','1111111','0011100','0011100','0011100','1111111','1111111'],
['0011100','1111111','1100011','1111111','0011100','1111111','1100011','1111111','0011100','1111111'],
['0111110','0111110','0111110','0111110','0111110','0111110','0111110','0111110','0111110','0111110'],
['0110110','0110110','0011100','0011100','0110110','0110110','0011100','0011100','0111110','0111110'],
['0111110','0111110','0110110','0110110','0111110','0111110','0110110','0110110','0111110','0111110'],
['0011100','0011100','0011100','0011100','0011100','0011100','0011100','0011100','1111111','1111111'],
['0011100','0111110','1100011','0111110','0011100','1111111','1100011','0111110','0011100','0111110']];
function stagePat(n){return STAGES[(n-1)%STAGES.length].slice().reverse();}
function cellOK(r,c){
  if(c<0||c>=COLS||r<0)return false;
  if(r===0)return PATC[pat[0]][c];
  return PATC[pat[Math.min(NP-1,Math.floor((r-1)/SEG))]][c];
}
let lastR=[];
function makeOutline(dx,dy){
  const R=[];lastR=R;
  for(let i=0;i<NP;i++){
    const ya=i===0?0:SEG*i+1-dy,yb=SEG*i+SEG+1+dy;
    for(const cp of comps(pat[i]))R.push([cp[0]-dx,ya,cp[1]+1+dx,yb]);
  }
  const xs=[...new Set(R.flatMap(r=>[r[0],r[2]]))].sort((a,b)=>a-b);
  const ys=[...new Set(R.flatMap(r=>[r[1],r[3]]))].sort((a,b)=>a-b);
  const cov=(i,j)=>{
    if(i<0||j<0||i>=xs.length-1||j>=ys.length-1)return false;
    const cx=(xs[i]+xs[i+1])/2,cy=(ys[j]+ys[j+1])/2;
    return R.some(r=>cx>r[0]&&cx<r[2]&&cy>r[1]&&cy<r[3]);
  };
  const out=[];
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){
    if(!cov(i,j))continue;
    if(!cov(i-1,j))out.push([xs[i],ys[j],xs[i],ys[j+1]]);
    if(!cov(i+1,j))out.push([xs[i+1],ys[j],xs[i+1],ys[j+1]]);
    if(!cov(i,j-1))out.push([xs[i],ys[j],xs[i+1],ys[j]]);
    if(!cov(i,j+1))out.push([xs[i],ys[j+1],xs[i+1],ys[j+1]]);
  }
  return out;
}
const QUOTES=[["So many men, so many minds.", "十人十色"], ["Failure teaches success.", "失敗は成功のもと"], ["It is no use crying over spilt milk.", "覆水盆に返らず"], ["The early bird catches the worm.", "早起きは三文の徳"], ["Out of the mouth comes evil.", "口は災いの元"], ["Better to ask the way than go astray.", "聞くは一時の恥、聞かぬは一生の恥"], ["He that will lie will steal.", "嘘つきは泥棒の始まり"], ["Misfortunes never come singly.", "泣き面に蜂"], ["Seeing is believing.", "百聞は一見にしかず"], ["A word is enough to the wise.", "一を聞いて十を知る"], ["Don’t teach your grandmother to suck eggs.", "釈迦に説法"], ["When poverty comes in at the door, love flies out of the window.", "金の切れ間が縁の切れ目"], ["Love me, love my dog.", "坊主憎けりゃ袈裟まで憎い"], ["After the storm comes a calm.", "雨降って地固まる"], ["He that would the daughter win, must with the mother first begin.", "将を射んとせば馬を射よ"], ["Kill two birds with one stone.", "一石二鳥"], ["All is well that ends well.", "終わりよければすべてよし"], ["Rome wasn’t built in a day.", "ローマは一日にして成らず"], ["When in Rome do as the Romans do.", "郷に入っては郷に従え"], ["Better late than never.", "遅れても、やらないよりはまし"], ["Nothing comes of nothing.", "無から得られるものはなし"], ["Never put off till tomorrow what can be done today.", "今日できることは明日まで延ばすな"], ["No pain, no gain.", "虎穴に入らずんば虎子を得ず"], ["Where there is a will, there is a way.", "為せば成る、なさねばならぬ何事も"], ["It’s always darkest before the dawn.", "いつでも夜明け前が一番暗い"], ["It is a long lane that has no turning.", "待てば海路の日和あり"], ["Everything comes to him who waits.", "待つ者はどんなことでも叶えられる"], ["Hope for the best, but prepare for the worst.", "最善を望み、最悪に備えよ"], ["Custom makes all things easy.", "習うより慣れろ"], ["A friend in need is a friend indeed.", "まさかの友こそ真の友"], ["A creaking gate hangs long on its hinges.", "柳に雪折れなし"], ["Experience must be bought.", "経験はお金を出してでも買わなければならない"], ["Absence makes the heart grow fonder.", "会えない時間が愛を育てる"], ["Two is company, three is a crowd.", "2人なら仲間、3人は群衆"], ["Love begets love.", "愛が愛を生む"], ["Like attracts like.", "同気相求む"], ["A good wife makes a good husband.", "夫は妻次第・よき妻にしてよき夫あり"], ["Tis better to have loved and lost than never to have loved at all.", "失恋でも恋しないよりまし"], ["Time heals all wounds.", "時が解決してくれる"], ["No seek, no find.", "探さなければ見つからない"], ["All is fair in love and war.", "恋愛と戦争では手段を選ばない"], ["Love is blind.", "恋は盲目"], ["Woman is as fickle as April weather.", "女は4月の天気のように気まぐれ"], ["It takes two to tango.", "タンゴを踊るには2人必要"], ["Love laughs at locksmiths.", "愛はどんな障害も乗り越える"], ["The peacock has fair feathers, but foul feet.", "美しいものにも難点はある"], ["Way to a man’s heart is through his stomach.", "人の心をつかむなら、胃袋から"]];
let bodyR=[],miniR=[],bgT=0;
function buildOutline(){outline=makeOutline(DX,DY);bodyR=lastR;miniOutline=makeOutline(0,0);miniR=lastR;}
function doorC(){return COLS/2-1;}
function bestC(r){let b=3,bd=99;for(let c=0;c<COLS-1;c++)if(cellOK(r,c)&&cellOK(r,c+1)){const d=Math.abs(c+1-COLS/2);if(d<bd){bd=d;b=c;}}return b;}
let W,H,DPR,cs,playH,ctrlH,btnH,bx0,viewRows,stripH,camOff,camMin;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctrlH=0;
  playH=H;btnH=0;
  cs=Math.min(W*0.94/6,playH/8.5)*0.82*6/8;
  bx0=(W-cs*COLS)/2;
  viewRows=playH/cs;
  stripH=0;
  camOff=1.4;camMin=-0.4;
}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- state ----------
let state='title',stage=1,score=0,lives=3,hi=0;
try{hi=+localStorage.getItem('sc_hi_m')||0}catch(e){}
let ROWS=30,wins=[],objs=[],birds=[],camY=0,maxRow=2,ck=2,invuln=0;
let time=0,closeT=2,turnT=0,turnFrom=0,turnTo=0,quietT=0,turnDir=1,face=0,faces=[],guardT=0,guardMsg='Ouch!',sayT=0,spawnT=2,signT=40,birdT=8,clearT=0,clearBonus=0,fallT=0,fallLand=false,fy=0,fvy=0,frot=0,flash=0,lastEnd=0;
const P={c:3,hl:1,hr:1,dhl:1,dhr:1,dc:3};

function startStage(n){
  stage=n;ROWS=SEG*NP+1;pat=stagePat(n);buildOutline();
  const mkWins=()=>{const ws=[];
  for(let r=0;r<ROWS;r++){
    ws[r]=[];
    for(let c=0;c<COLS;c++){
      let w=null;
      if(r>=1&&cellOK(r,c)&&!(r<=1&&c+1>doorC()&&c<doorC()+2))w={a:false,t:0,ud:6.0,od:2,cd:2.0};
      ws[r][c]=w;
    }
  }
  return ws;};
  bgT=0;faces=[mkWins(),mkWins(),mkWins(),mkWins()];face=0;wins=faces[0];turnT=0;
  objs=[];birds=[];resetClimber(1);
  maxRow=1;ck=1;sayT=0;spawnT=4;signT=40;birdT=15;closeT=3;state='play';introT=0;introSaid=true;sayT=2;
}
function resetClimber(r){P.c=P.dc=bestC(r);P.hl=P.hr=P.dhl=P.dhr=r;invuln=2;camY=Math.max(camMin,r-camOff);objs=[];birds=[];}
let introT=0,introSaid=false;
const INTRO_T1=1.3,INTRO_T2=0.4;
function introVals(){const p=Math.min(1,introT/INTRO_T1),ease=p*p,D=viewRows+2.5,ph=Math.max(0,introT-INTRO_T1);return{off:(1-ease)*D,rise:ph*ph*8,e:1-Math.min(1,ph/INTRO_T2)};}
let stageHist=[],miniCache={};
function miniData(n){if(miniCache[n])return miniCache[n];const sv=pat;pat=stagePat(n);const o=makeOutline(0,0),r=lastR;pat=sv;return miniCache[n]={o,r};}
const TBG=[[154,205,50],[135,206,250],[30,100,230],[255,140,0]],tbg=TBG[Math.floor(Math.random()*TBG.length)];
let selMode=false,selRects=[],descRect=null,tapT=0,startTimer=null;
function newGame(n){score=0;lives=3;stageHist=[];selMode=false;startStage(n||1);}
function winState(r,c,ws){const w=(ws||wins)[r]&&(ws||wins)[r][c];if(!w||!w.a)return 0;const t=w.t;return (t>=w.ud&&t<w.ud+w.od)?2:1;}

// ---------- input ----------
const TURN=0.9;
const mk=()=>({mv:false,id:null,ox:0,oy:0,x:0,y:0,dir:null,next:0,last:null});
const S=[mk(),mk()];
const K={};
const KM=[{u:['w'],d:[],l:['a'],r:['d']},{u:['arrowup','i'],d:[],l:['arrowleft','j'],r:['arrowright','l']}];
function kdir(k){for(const d of ['u','d','l','r'])for(const key of KM[k][d])if(K[key])return d;return null}
const btn=[0,0],PT=new Map();
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'){
    if(selMode){const h=selRects.find(r=>e.clientX>=r.x&&e.clientX<=r.x+r.w&&e.clientY>=r.y&&e.clientY<=r.y+r.h);if(h)newGame(h.n);else selMode=false;return;}
    if(descRect&&e.clientY>=descRect.y0&&e.clientY<=descRect.y1){
      const now=performance.now();
      if(tapT&&now-tapT<350){clearTimeout(startTimer);tapT=0;selMode=true;return;}
      tapT=now;clearTimeout(startTimer);startTimer=setTimeout(()=>{tapT=0;if(state==='title'&&!selMode)newGame();},350);return;
    }
    newGame();return;
  }
  if(state==='over'){if(performance.now()-lastEnd>700)newGame();return;}
  const k=e.clientX<W/2?0:1;
  const p={k,x:e.clientX,done:false,bad:false};
  for(const q of PT.values())if(q.k!==k){q.bad=true;p.bad=true;}
  PT.set(e.pointerId,p);
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  const p=PT.get(e.pointerId);
  if(!p||p.done)return;
  e.preventDefault();
  const dx=e.clientX-p.x;
  if(Math.abs(dx)>=20){
    p.done=true;
    if(!p.bad&&((p.k===1&&dx>0)||(p.k===0&&dx<0))){btn[p.k]=0.15;act(0,dx>0?'r':'l');}
  }
});
const rel=(e,ok)=>{
  const p=PT.get(e.pointerId);
  if(!p)return;
  PT.delete(e.pointerId);
  if(ok&&!p.done&&!p.bad){btn[p.k]=0.12;act(p.k,'u');}
};
cv.addEventListener('pointerup',e=>rel(e,true));cv.addEventListener('pointercancel',e=>rel(e,false));
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();K[k]=true;
  if(k.startsWith('arrow')||k===' ')e.preventDefault();
  if(selMode)return;
  if((state==='title'||state==='over')&&performance.now()-lastEnd>700)newGame();
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false;});

function blk(r,c){let L=c,R=c;while(L>0&&cellOK(r,L-1))L--;while(R<COLS-1&&cellOK(r,R+1))R++;return [L,R];}
function act(k,d){
  if(state!=='play'||turnT>0)return;
  const me=k?'hr':'hl',ot=k?'hl':'hr';
  if(d==='u'){
    if(P[me]<=P[ot]&&P[me]<ROWS&&cellOK(P[me]+1,k?P.c+1:P.c)&&winState(P[me]+1,k?P.c+1:P.c)!==2){
      P[me]++;
      const m=Math.max(P.hl,P.hr);
      if(m>maxRow){score+=(m-maxRow);maxRow=m;ck=1+10*Math.floor((maxRow-1)/10);}
    }
  }else if(d==='d'){
      }else if(d==='l'){
    if(P.c>0&&cellOK(P.hl,P.c-1)&&cellOK(P.hr,P.c))P.c--;
    else{const t=Math.min(blk(P.hl,P.c)[1],blk(P.hr,P.c+1)[1]-1);
      if(t>=0&&cellOK(P.hl,t)&&cellOK(P.hr,t+1)){turnT=TURN;turnDir=-1;turnFrom=P.c;turnTo=t;}}
  }else if(d==='r'){
    if(P.c<COLS-2&&cellOK(P.hl,P.c+1)&&cellOK(P.hr,P.c+2))P.c++;
    else{const t=Math.max(blk(P.hl,P.c)[0],blk(P.hr,P.c+1)[0]-1);
      if(t<=COLS-2&&cellOK(P.hl,t)&&cellOK(P.hr,t+1)){turnT=TURN;turnDir=1;turnFrom=P.c;turnTo=t;}}
  }
}
function hit(){
  if(invuln>0||turnT>0||state!=='play')return;
  state='fall';fallT=0;fallLand=false;fy=0;fvy=3;frot=0;flash=0.25;
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
}
function absorb(side){
  const k=side||(Math.random()<0.5?'hl':'hr'),o=k==='hl'?'hr':'hl';
  const col=h=>h==='hl'?P.c:P.c+1;
  if(P[k]>1&&cellOK(P[k]-1,col(k)))P[k]--;else if(P[o]>1&&cellOK(P[o]-1,col(o)))P[o]--;
  invuln=0.9;guardT=0.9;guardMsg=['Ouch!','Ow!','That hurts!','It hurts!','???'][Math.floor(Math.random()*5)];flash=0.1;
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
}
function endGame(){
  state='over';lastEnd=performance.now();stageHist[stage-1]={h:Math.max(0,maxRow-1),c:P.dc+1};
  if(score>hi){hi=score;try{localStorage.setItem('sc_hi_m',hi)}catch(e){}}
  S.forEach(s=>{s.id=null;s.dir=null;});
}

function throwObj(r,c){
  const o=Math.random()<0.5?{t:'pot',w:0.384,h:0.448,vr:0}:{t:'bell',rd:Math.random()<0.5,w:0.576,h:0.256,vr:(Math.random()<0.5?-1:1)*(3+Math.random()*3)};
  o.x=c+0.5;o.y=r+0.5;o.vy=2.8+Math.random()*1.2+stage*0.2;o.say=['Watch out!','Be careful!','Step aside!','Oh no!'][Math.floor(Math.random()*4)];o.rot=o.t==='bell'?(Math.random()<0.5?-1:1)*(0.3+Math.random()*1.0):0;o.hold=1;
  objs.push(o);
}
function closeOne(){
  const lo=Math.max(1,Math.floor(camY)),hi=Math.min(ROWS-1,Math.floor(camY+viewRows));
  const avg=(P.dhl+P.dhr)/2;
  for(let i=0;i<10;i++){
    let r,c;
    if(state==='play'&&Math.random()<0.35){r=Math.round(avg+1+Math.random()*4);c=P.c-1+Math.floor(Math.random()*4);}
    else{r=lo+Math.floor(Math.random()*Math.max(1,hi-lo+1));c=Math.floor(Math.random()*COLS);}
    r=Math.max(1,Math.min(ROWS-1,r));c=Math.max(0,Math.min(COLS-1,c));
    const w=wins[r]&&wins[r][c];
    let near=false;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nb=(dr||dc)&&wins[r+dr]&&wins[r+dr][c+dc];
      if(nb&&nb.a)near=true;
    }
    if(w&&!w.a&&!near){w.a=true;w.t=0;w.th=false;w.od=2+Math.floor(Math.random()*4);return;}
  }
}
// ---------- update ----------
function update(dt){
  time+=dt;
  {const tg=Math.min(1,Math.floor(Math.max(P.hl,P.hr)/20)/5);bgT+=(tg-bgT)*Math.min(1,dt*1.5);}
  if(invuln>0)invuln-=dt;
  if(quietT>0)quietT-=dt;
  if(turnT>0){turnT=Math.max(0,turnT-dt);
    if(turnT<=0){face=(face+turnDir+4)%4;wins=faces[face];P.c=P.dc=turnTo;invuln=Math.max(invuln,0.6);quietT=0.6;}}
  if(flash>0)flash-=dt;
  if(guardT>0)guardT-=dt;
  if(sayT>0)sayT-=dt;
  if(btn[0]>0)btn[0]-=dt;
  if(btn[1]>0)btn[1]-=dt;
  for(let r=1;r<ROWS;r++){const row=wins[r];for(let c=0;c<COLS;c++){const w=row[c];if(w&&w.a){w.t+=dt;if(!w.th&&w.t>=w.ud){w.th=true;if(state==='play'&&r>Math.max(P.hl,P.hr)+1&&Math.random()<Math.min(0.95,(0.25+0.05*(stage-1))*1.5))throwObj(r,c);}if(w.t>=w.ud+w.od+w.cd){w.a=false;w.t=0;}}}}
  closeT-=dt;
  if(closeT<=0&&state!=='over'){closeT=Math.max(0.25,0.6-0.0375*stage)*(0.6+Math.random()*0.8);closeOne();}
  if(state==='title'||state==='over'){
    return;
  }
  const lk=Math.min(1,dt*16);
  if(state==='play'||state==='clear'){
    P.dc+=(P.c-P.dc)*lk;P.dhl+=(P.hl-P.dhl)*lk;P.dhr+=(P.hr-P.dhr)*lk;
  }
  if(state==='play'){
    for(let k=0;k<2;k++){
      const s=S[k];
      const d=s.id!==null?s.dir:kdir(k);
      if(d!==s.last){s.last=d;s.next=0;}
      if(d&&time>=s.next){act(k,d);s.next=time+((d==='l'||d==='r')?0.18:0.14);}
    }
    // closing windows
    if(invuln<=0&&turnT<=0&&(winState(P.hl,P.c)===2||winState(P.hr,P.c+1)===2))hit();
    // spawn
    birdT-=dt;
    spawnT-=dt;signT-=dt;
    if(signT<=0&&Math.max(P.hl,P.hr)>5){
      signT=30+Math.random()*10;
      const yy=camY+viewRows+1.5;
      objs.push({t:'sign',msg:QUOTES[Math.floor(Math.random()*QUOTES.length)],w:4,h:1.5,x:2+Math.random()*(COLS-4),y:yy,by:yy,bt:0,bnc:true,hop:11,vy:0,rot:0.1,vr:0,hbx:2,hby:0.75});
    }
    if(spawnT<=0&&Math.max(P.hl,P.hr)>5){
      spawnT=15+Math.random()*5;
      const yy=camY+viewRows+1.5;
      objs.push({t:'beam',hop:8,w:2.304,h:0.288,x:1+Math.random()*(COLS-2),y:yy,by:yy,bt:0,bnc:true,vy:0,rot:(Math.random()<0.5?-1:1)*(0.15+Math.random()*0.15),vr:(Math.random()<0.5?-1:1)*(0.6+Math.random()*0.5),hbx:1.152,hby:0.24});
    }
    if(birdT<=0&&Math.max(P.hl,P.hr)>10){
      birdT=20+Math.random()*5;
      const d=Math.random()<.5?1:-1;
      birds.push({x:d>0?-1:COLS+1,dy:viewRows*0.8,d,dr:false});

  ctx.restore();
  drawHUD();
  if(turnT<=0&&(state==='play'||state==='fall'||state==='clear')){ctx.save();ctx.beginPath();ctx.rect(0,0,W,playH);ctx.clip();for(const b of birds)drawBird(b);ctx.restore();}
  if(state!=='title')drawControls();
  else drawControls();
}

startStage(1);state='title';
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
