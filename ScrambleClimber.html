<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Scramble Climber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<style>
html,body{font-family:'Montserrat',sans-serif;font-weight:400;margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
try{document.fonts&&document.fonts.load('400 16px Montserrat');document.fonts.load('700 16px Montserrat')}catch(e){}
const COLS=8,SEG=10,NP=10;
const DX=10/37.6-0.1275,DY=10/37.6-0.1545;
let outline=[],miniOutline=[];
const PATC={};
for(let m=0;m<16;m++){const k=m.toString(2).padStart(4,'0');PATC[k]=[];for(let c=0;c<COLS;c++)PATC[k][c]=k[c>>1]==='1';}
let pat=Array(10).fill('1111');
function comps(k){const a=PATC[k],r=[];let c=0;while(c<COLS){if(a[c]){let e=c;while(e+1<COLS&&a[e+1])e++;r.push([c,e]);c=e+1;}else c++;}return r;}
// ステージ構成: 上(屋上側)から下へ10段、1段=10階、1ブロック=窓2枚分(1=ビル,0=空間)
const STAGES=[
['1111','1111','1111','1111','1111','1111','1111','1111','1111','1111'],
['1111','1111','0110','0110','1111','1111','0110','0110','1111','1111'],
['1111','1111','1001','1001','1111','1111','1001','1001','1111','1111'],
['0110','0110','0110','0110','1111','1111','0110','0110','1111','1111'],
['1111','0011','1111','1100','1111','0011','1111','1100','1111','1111']];
function stagePat(n){return STAGES[(n-1)%STAGES.length].slice().reverse();}
function cellOK(r,c){
  if(c<0||c>=COLS||r<0)return false;
  if(r===0)return PATC[pat[0]][c];
  return PATC[pat[Math.min(NP-1,Math.floor((r-1)/SEG))]][c];
}
let lastR=[];
function makeOutline(dx,dy){
  const R=[];lastR=R;
  for(let i=0;i<NP;i++){
    const ya=i===0?0:SEG*i+1-dy,yb=SEG*i+SEG+1+dy;
    for(const cp of comps(pat[i]))R.push([cp[0]-dx,ya,cp[1]+1+dx,yb]);
  }
  const xs=[...new Set(R.flatMap(r=>[r[0],r[2]]))].sort((a,b)=>a-b);
  const ys=[...new Set(R.flatMap(r=>[r[1],r[3]]))].sort((a,b)=>a-b);
  const cov=(i,j)=>{
    if(i<0||j<0||i>=xs.length-1||j>=ys.length-1)return false;
    const cx=(xs[i]+xs[i+1])/2,cy=(ys[j]+ys[j+1])/2;
    return R.some(r=>cx>r[0]&&cx<r[2]&&cy>r[1]&&cy<r[3]);
  };
  const out=[];
  for(let i=0;i<xs.length-1;i++)for(let j=0;j<ys.length-1;j++){
    if(!cov(i,j))continue;
    if(!cov(i-1,j))out.push([xs[i],ys[j],xs[i],ys[j+1]]);
    if(!cov(i+1,j))out.push([xs[i+1],ys[j],xs[i+1],ys[j+1]]);
    if(!cov(i,j-1))out.push([xs[i],ys[j],xs[i+1],ys[j]]);
    if(!cov(i,j+1))out.push([xs[i],ys[j+1],xs[i+1],ys[j+1]]);
  }
  return out;
}
const QUOTES=["So many men, so many minds.", "Failure teaches success.", "It is no use crying over spilt milk.", "The early bird catches the worm.", "Out of the mouth comes evil.", "Better to ask the way than go astray.", "He that will lie will steal.", "Misfortunes never come singly.", "Seeing is believing.", "A word is enough to the wise.", "Don’t teach your grandmother to suck eggs.", "When poverty comes in at the door, love flies out of the window.", "Love me, love my dog.", "After the storm comes a calm.", "He that would the daughter win, must with the mother first begin.", "Kill two birds with one stone.", "All is well that ends well.", "Rome wasn’t built in a day.", "When in Rome do as the Romans do.", "Better late than never.", "Nothing comes of nothing.", "Never put off till tomorrow what can be done today.", "No pain, no gain.", "Where there is a will, there is a way.", "It’s always darkest before the dawn.", "It is a long lane that has no turning.", "Everything comes to him who waits.", "Hope for the best, but prepare for the worst.", "Custom makes all things easy.", "A friend in need is a friend indeed.", "A creaking gate hangs long on its hinges.", "Experience must be bought.", "Absence makes the heart grow fonder.", "Two is company, three is a crowd.", "Love begets love.", "Like attracts like.", "A good wife makes a good husband.", "Tis better to have loved and lost than never to have loved at all.", "Time heals all wounds.", "No seek, no find.", "All is fair in love and war.", "Love is blind.", "Woman is as fickle as April weather.", "It takes two to tango.", "Love laughs at locksmiths.", "The peacock has fair feathers, but foul feet.", "Way to a man’s heart is through his stomach."];
let bodyR=[],miniR=[],bgT=0;
function buildOutline(){outline=makeOutline(DX,DY);bodyR=lastR;miniOutline=makeOutline(0,0);miniR=lastR;}
function bestC(r){let b=3,bd=99;for(let c=0;c<COLS-1;c++)if(cellOK(r,c)&&cellOK(r,c+1)){const d=Math.abs(c+1-4);if(d<bd){bd=d;b=c;}}return b;}
let W,H,DPR,cs,playH,ctrlH,btnH,bx0,viewRows,stripH,camOff,camMin;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctrlH=0;
  playH=H;btnH=0;
  cs=Math.min(W*0.94/6,playH/8.5)*0.82*6/COLS;
  bx0=(W-cs*COLS)/2;
  viewRows=playH/cs;
  stripH=0;
  camOff=1.4;camMin=-0.4;
}
addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- state ----------
let state='title',stage=1,score=0,lives=3,hi=0;
try{hi=+localStorage.getItem('sc_hi_m')||0}catch(e){}
let ROWS=30,wins=[],objs=[],birds=[],camY=0,maxRow=2,ck=2,invuln=0;
let time=0,closeT=2,turnT=0,turnFrom=0,turnTo=0,quietT=0,turnDir=1,face=0,faces=[],guardT=0,guardMsg='Ouch!',sayT=0,spawnT=2,signT=40,birdT=8,clearT=0,clearBonus=0,fallT=0,fy=0,fvy=0,frot=0,flash=0,lastEnd=0;
const P={c:3,hl:1,hr:1,dhl:1,dhr:1,dc:3};

function startStage(n){
  stage=n;ROWS=SEG*NP+1;pat=stagePat(n);buildOutline();
  const mkWins=()=>{const ws=[];
  for(let r=0;r<ROWS;r++){
    ws[r]=[];
    for(let c=0;c<COLS;c++){
      let w=null;
      if(r>=1&&cellOK(r,c)&&!(r===1&&(c===bestC(1)||c===bestC(1)+1)))w={a:false,t:0,ud:3.0,od:3,cd:2.0};
      ws[r][c]=w;
    }
  }
  return ws;};
  bgT=0;faces=[mkWins(),mkWins(),mkWins(),mkWins()];face=0;wins=faces[0];turnT=0;
  objs=[];birds=[];resetClimber(1);
  maxRow=1;ck=1;sayT=2;spawnT=4;signT=40;birdT=15;closeT=3;state='play';
}
function resetClimber(r){P.c=P.dc=bestC(r);P.hl=P.hr=P.dhl=P.dhr=r;invuln=2;camY=Math.max(camMin,r-camOff);objs=[];birds=[];}
function newGame(){score=0;lives=3;startStage(1);}
function winState(r,c,ws){const w=(ws||wins)[r]&&(ws||wins)[r][c];if(!w||!w.a)return 0;const t=w.t;return (t>=w.ud&&t<w.ud+w.od)?2:1;}

// ---------- input ----------
const TURN=0.9;
const mk=()=>({mv:false,id:null,ox:0,oy:0,x:0,y:0,dir:null,next:0,last:null});
const S=[mk(),mk()];
const K={};
const KM=[{u:['w'],d:[],l:['a'],r:['d']},{u:['arrowup','i'],d:[],l:['arrowleft','j'],r:['arrowright','l']}];
function kdir(k){for(const d of ['u','d','l','r'])for(const key of KM[k][d])if(K[key])return d;return null}
const btn=[0,0],PT=new Map();
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state==='title'||state==='over'){if(performance.now()-lastEnd>700)newGame();return;}
  const k=e.clientX<W/2?0:1;
  const p={k,x:e.clientX,done:false,bad:false};
  for(const q of PT.values())if(q.k!==k){q.bad=true;p.bad=true;}
  PT.set(e.pointerId,p);
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  const p=PT.get(e.pointerId);
  if(!p||p.done)return;
  e.preventDefault();
  const dx=e.clientX-p.x;
  if(Math.abs(dx)>=20){
    p.done=true;
    if(!p.bad&&((p.k===1&&dx>0)||(p.k===0&&dx<0))){btn[p.k]=0.15;act(0,dx>0?'r':'l');}
  }
});
const rel=(e,ok)=>{
  const p=PT.get(e.pointerId);
  if(!p)return;
  PT.delete(e.pointerId);
  if(ok&&!p.done&&!p.bad){btn[p.k]=0.12;act(p.k,'u');}
};
cv.addEventListener('pointerup',e=>rel(e,true));cv.addEventListener('pointercancel',e=>rel(e,false));
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();K[k]=true;
  if(k.startsWith('arrow')||k===' ')e.preventDefault();
  if((state==='title'||state==='over')&&performance.now()-lastEnd>700)newGame();
});
addEventListener('keyup',e=>{K[e.key.toLowerCase()]=false;});

function blk(r,c){let L=c,R=c;while(L>0&&cellOK(r,L-1))L--;while(R<COLS-1&&cellOK(r,R+1))R++;return [L,R];}
function act(k,d){
  if(state!=='play'||turnT>0)return;
  const me=k?'hr':'hl',ot=k?'hl':'hr';
  if(d==='u'){
    if(P[me]<=P[ot]&&P[me]<ROWS&&cellOK(P[me]+1,k?P.c+1:P.c)&&winState(P[me]+1,k?P.c+1:P.c)!==2){
      P[me]++;
      const m=Math.max(P.hl,P.hr);
      if(m>maxRow){score+=(m-maxRow);maxRow=m;ck=1+10*Math.floor((maxRow-1)/10);}
    }
  }else if(d==='d'){
      }else if(d==='l'){
    if(P.c>0&&cellOK(P.hl,P.c-1)&&cellOK(P.hr,P.c)){if(winState(P.hl,P.c-1)!==2&&winState(P.hr,P.c)!==2)P.c--;}
    else{const t=Math.min(blk(P.hl,P.c)[1],blk(P.hr,P.c+1)[1]-1);
      if(t>=0&&cellOK(P.hl,t)&&cellOK(P.hr,t+1)&&winState(P.hl,t,faces[(face+3)%4])!==2&&winState(P.hr,t+1,faces[(face+3)%4])!==2){turnT=TURN;turnDir=-1;turnFrom=P.c;turnTo=t;}}
  }else if(d==='r'){
    if(P.c<COLS-2&&cellOK(P.hl,P.c+1)&&cellOK(P.hr,P.c+2)){if(winState(P.hl,P.c+1)!==2&&winState(P.hr,P.c+2)!==2)P.c++;}
    else{const t=Math.max(blk(P.hl,P.c)[0],blk(P.hr,P.c+1)[0]-1);
      if(t<=COLS-2&&cellOK(P.hl,t)&&cellOK(P.hr,t+1)&&winState(P.hl,t,faces[(face+1)%4])!==2&&winState(P.hr,t+1,faces[(face+1)%4])!==2){turnT=TURN;turnDir=1;turnFrom=P.c;turnTo=t;}}
  }
}
function hit(){
  if(invuln>0||turnT>0||state!=='play')return;
  state='fall';fallT=0;fy=0;fvy=3;frot=0;flash=0.25;
  try{navigator.vibrate&&navigator.vibrate(120)}catch(e){}
}
function absorb(){
  const k=Math.random()<0.5?'hl':'hr',o=k==='hl'?'hr':'hl';
  const col=h=>h==='hl'?P.c:P.c+1;
  if(P[k]>1&&cellOK(P[k]-1,col(k)))P[k]--;else if(P[o]>1&&cellOK(P[o]-1,col(o)))P[o]--;
  invuln=0.9;guardT=0.9;guardMsg=['Ouch!','Ow!','That hurts!','It hurts!','???'][Math.floor(Math.random()*5)];flash=0.1;
  try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}
}
function endGame(){
  state='over';lastEnd=performance.now();
  if(score>hi){hi=score;try{localStorage.setItem('sc_hi_m',hi)}catch(e){}}
  S.forEach(s=>{s.id=null;s.dir=null;});
}

function throwObj(r,c){
  const o=Math.random()<0.5?{t:'pot',w:0.384,h:0.448,vr:0}:{t:'bell',w:0.576,h:0.256,vr:(Math.random()<0.5?-1:1)*(3+Math.random()*3)};
  o.x=c+0.5;o.y=r+0.5;o.vy=2.8+Math.random()*1.2+stage*0.2;o.say=['Watch out!','Be careful!','Step aside!','Oh no!'][Math.floor(Math.random()*4)];o.rot=o.t==='bell'?(Math.random()<0.5?-1:1)*(0.3+Math.random()*1.0):0;o.hold=1;
  objs.push(o);
}
function closeOne(){
  const lo=Math.max(1,Math.floor(camY)),hi=Math.min(ROWS-1,Math.floor(camY+viewRows));
  const avg=(P.dhl+P.dhr)/2;
  for(let i=0;i<10;i++){
    let r,c;
    if(state==='play'&&Math.random()<0.35){r=Math.round(avg+1+Math.random()*4);c=P.c-1+Math.floor(Math.random()*4);}
    else{r=lo+Math.floor(Math.random()*Math.max(1,hi-lo+1));c=Math.floor(Math.random()*COLS);}
    r=Math.max(1,Math.min(ROWS-1,r));c=Math.max(0,Math.min(COLS-1,c));
    const w=wins[r]&&wins[r][c];
    let near=false;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      const nb=(dr||dc)&&wins[r+dr]&&wins[r+dr][c+dc];
      if(nb&&nb.a)near=true;
    }
    if(w&&!w.a&&!near){w.a=true;w.t=0;w.th=false;w.od=2+Math.floor(Math.random()*4);return;}
  }
}
// ---------- update ----------
function update(dt){
  time+=dt;
  {const tg=Math.min(1,Math.floor(Math.max(P.hl,P.hr)/20)/5);bgT+=(tg-bgT)*Math.min(1,dt*1.5);}
  if(invuln>0)invuln-=dt;
  if(quietT>0)quietT-=dt;
  if(turnT>0){turnT=Math.max(0,turnT-dt);
    if(turnT<=0){face=(face+turnDir+4)%4;wins=faces[face];P.c=P.dc=turnTo;invuln=Math.max(invuln,0.6);quietT=0.6;}}
  if(flash>0)flash-=dt;
  if(guardT>0)guardT-=dt;
  if(sayT>0)sayT-=dt;
  if(btn[0]>0)btn[0]-=dt;
  if(btn[1]>0)btn[1]-=dt;
  for(let r=1;r<ROWS;r++){const row=wins[r];for(let c=0;c<COLS;c++){const w=row[c];if(w&&w.a){w.t+=dt;if(!w.th&&w.t>=w.ud){w.th=true;if(state==='play'&&r>Math.max(P.hl,P.hr)+1&&Math.random()<Math.min(0.95,0.25+0.05*(stage-1)))throwObj(r,c);}if(w.t>=w.ud+w.od+w.cd){w.a=false;w.t=0;}}}}
  closeT-=dt;
  if(closeT<=0&&state!=='over'){closeT=Math.max(0.25,0.6-0.0375*stage)*(0.6+Math.random()*0.8);closeOne();}
  if(state==='title'||state==='over'){
    return;
  }
  const lk=Math.min(1,dt*16);
  if(state==='play'||state==='clear'){
    P.dc+=(P.c-P.dc)*lk;P.dhl+=(P.hl-P.dhl)*lk;P.dhr+=(P.hr-P.dhr)*lk;
  }
  if(state==='play'){
    for(let k=0;k<2;k++){
      const s=S[k];
      const d=s.id!==null?s.dir:kdir(k);
      if(d!==s.last){s.last=d;s.next=0;}
      if(d&&time>=s.next){act(k,d);s.next=time+((d==='l'||d==='r')?0.18:0.14);}
    }
    // closing windows
    if(invuln<=0&&turnT<=0&&(winState(P.hl,P.c)===2||winState(P.hr,P.c+1)===2))hit();
    // spawn
    birdT-=dt;
    spawnT-=dt;signT-=dt;
    if(signT<=0&&Math.max(P.hl,P.hr)>5){
      signT=50+Math.random()*20;
      const yy=camY+viewRows+1.5;
      objs.push({t:'sign',msg:QUOTES[Math.floor(Math.random()*QUOTES.length)],w:4,h:1.5,x:2+Math.random()*(COLS-4),y:yy,by:yy,bt:0,bnc:true,vy:0,rot:0.1,vr:0,hbx:2,hby:0.75});
    }
    if(spawnT<=0&&Math.max(P.hl,P.hr)>5){
      spawnT=7+Math.random()*6;
      const yy=camY+viewRows+1.5;
      objs.push({t:'beam',w:2.304,h:0.288,x:1+Math.random()*(COLS-2),y:yy,by:yy,bt:0,bnc:true,vy:0,rot:(Math.random()<0.5?-1:1)*(0.15+Math.random()*0.15),vr:(Math.random()<0.5?-1:1)*(0.6+Math.random()*0.5),hbx:1.152,hby:0.24});
    }
    if(birdT<=0&&Math.max(P.hl,P.hr)>10){
      birdT=12+Math.random()*10;
      const d=Math.random()<.5?1:-1;
      birds.push({x:d>0?-1:COLS+1,dy:viewRows*0.8,d,dr:false});
    }
    // objects
    const cxm=P.dc+1,avg=(P.dhl+P.dhr)/2,top=avg+0.75,bot=avg-0.95;
    for(const o of objs){
      if(o.hold>0){o.hold-=dt;continue;}
      if(o.bnc){
        const pick=()=>{const lo=o.hbx,hi=COLS-o.hbx;o.hd=o.bx+0.5>hi?-1:(o.bx-0.5<lo?1:(Math.random()<0.5?-1:1));};
        if(o.bx===undefined){o.bx=o.x;pick();}
        o.bt+=dt;while(o.bt>=1.3){o.bt-=1.3;o.by-=4;o.bx+=o.hd*0.5;pick();}
        const p=o.bt/1.3;o.y=o.by-4*p+4*p*(1-p);o.x=o.bx+o.hd*0.5*p;}else{o.y-=o.vy*dt;if(o.g)o.vy+=o.g*dt;o.x+=(o.vx||0)*dt;}o.rot+=(o.vr||0)*dt;
      const hbx=o.hbx||0.25,hby=o.hby||0.25;
      if(state==='play'&&invuln<=0&&turnT<=0&&!o.hit&&Math.abs(o.x-cxm)<hbx+0.4&&o.y<top+hby&&o.y>bot-hby){o.hit=true;if(P.hl===P.hr){absorb();if(o.t!=='beam'&&o.t!=='sign'){o.vx=(o.x<cxm?-1:o.x>cxm?1:(Math.random()<0.5?-1:1))*(2+Math.random()*1.5);o.vy=-4;o.g=16;if(!o.vr)o.vr=o.vx>0?6:-6;}}else hit();}
    }
    objs=objs.filter(o=>o.y>camY-2&&!o.dead);
    for(const b of birds){
      b.x+=b.d*2.2*dt;
      if((b.d>0&&b.x>COLS+1)||(b.d<0&&b.x<-1)){b.turns=(b.turns||0)+1;if(b.turns>=2)b.gone=true;else{b.d=-b.d;b.dr=false;}}
      if(!b.dr&&Math.abs(b.x-cxm)<0.5){b.dr=true;objs.push({t:'drop',x:b.x,y:camY+b.dy-0.3,vy:5,w:0.13824,h:0.18432,rot:0,vr:0});}
    }
    birds=birds.filter(b=>!b.gone);
    // goal
    if(P.hl>=ROWS&&P.hr>=ROWS&&state==='play'){
      state='clear';clearT=0;clearBonus=0;objs=[];birds=[];
    }
    const target=avg-camOff;
    camY+=(target-camY)*Math.min(1,dt*5);
    camY=Math.max(camMin,camY);
  }else if(state==='fall'){
    fallT+=dt;fvy-=30*dt;fy+=fvy*dt;frot+=dt*6;
    for(const o of objs)o.y-=o.vy*dt;
    if(fallT>1.1){
      lives--;
      if(lives<=0)endGame();
      else{resetClimber(ck);state='play';}
    }
  }else if(state==='clear'){
    clearT+=dt;
    const lift=clearT>1.8?(clearT-1.8)*1.8:0;
    const target=(P.dhl+P.dhr)/2+lift-camOff;
    camY+=(target-camY)*Math.min(1,dt*4);
    if(clearT>4.5)startStage(stage+1);
  }
}

// ---------- draw helpers ----------
const wx=x=>bx0+x*cs;
const wy=r=>playH-(r-camY)*cs;
function poly(pts,close){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);if(close)ctx.closePath();ctx.stroke();}
function seg(a,b,c,d){ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();}

function drawWindow(r,c){

  ctx.lineWidth=Math.max(1,cs*0.03);

function drawBuilding(){

  ctx.lineWidth=1;ctx.strokeStyle='#333';
  for(let r=r0;r<=r1;r++)for(let c=0;c<COLS;c++){
    if(!cellOK(r,c))continue;
    seg(wx(c-(cellOK(r,c-1)?0:DX)),wy(r),wx(c+1+(cellOK(r,c+1)?0:DX)),wy(r));
  }
  for(let r=Math.max(1,r0);r<=r1;r++)for(let c=0;c<COLS;c++)if(cellOK(r,c)&&wins[r]&&wins[r][c])drawWindow(r,c);

    const bc=bestC(1);
    ctx.strokeStyle='#888';ctx.lineWidth=Math.max(1.5,cs*0.035);
    ctx.strokeRect(wx(bc),wy(2),cs*2,cs*2);
    seg(wx(bc+1),wy(2),wx(bc+1),wy(0));

  ctx.strokeStyle='#aaa';ctx.lineWidth=Math.max(2,cs*0.05);
  seg(0,wy(0),W,wy(0));
}

function drawClimber(off,rot){
  const hxL=wx(P.dc+0.5),hxR=wx(P.dc+1.5);
  const hyL=wy(P.dhl+0.667+off),hyR=wy(P.dhr+0.667+off);
  const m=(hxL+hxR)/2,sy=(hyL+hyR)/2+cs*0.4,hipY=sy+cs*0.5;
  ctx.save();
  if(rot){const cy=sy+cs*0.2;ctx.translate(m,cy);ctx.rotate(rot);ctx.translate(-m,-cy);}
  const SKIN='#fff',SHIRT='#39ff14',SHORTS='#4aa8ff',SHIRTF='rgba(57,255,20,0.6)',SHORTSF='rgba(74,168,255,0.6)';
  ctx.lineWidth=Math.max(1.5,cs*0.045);

  const fpoly=(pts,fc)=>{ctx.fillStyle=fc||'#000';ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill();ctx.stroke();};

    const dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,nx=-dy/l*t,ny=dx/l*t;
    fpoly([[ax+nx,ay+ny],[bx+nx,by+ny],[bx-nx,by-ny],[ax-nx,ay-ny]],fc);
  };
  const mv=Math.min(1,(Math.abs(P.hl-P.dhl)+Math.abs(P.hr-P.dhr)+Math.abs(P.c-P.dc))*1.5);
  const hr=cs*0.17,hy=sy-cs*0.107;
  ctx.strokeStyle=SHIRT;
  fpoly([[m-cs*0.2,sy],[m+cs*0.2,sy],[m+cs*0.15,hipY],[m-cs*0.15,hipY]],SHIRTF);
  for(const [s,hx,hyy] of [[-1,hxL,hyL],[1,hxR,hyR]]){
    const sx=m+s*cs*0.2,ex=(sx+hx)/2+s*cs*(0.1+0.2*mv),ey=(sy+hyy)/2;
    const qx=sx+(ex-sx)*0.5,qy=sy+(ey-sy)*0.5;
    ctx.strokeStyle=SKIN;
    poly([[qx,qy],[ex,ey],[hx,hyy]],false);
    ctx.strokeRect(hx-cs*0.07,hyy-cs*0.07,cs*0.14,cs*0.14);
    ctx.strokeStyle=SHIRT;tube(sx,sy,qx,qy,cs*0.07,SHIRTF);
  }
  const lL=clamp(P.dhr-P.dhl,-1,1)*cs*0.2,lR=clamp(P.dhl-P.dhr,-1,1)*cs*0.2;
  for(const [s,l] of [[-1,lL],[1,lR]]){
    const px=m+s*cs*0.1,fx=m+s*cs*0.28,fyy=hipY+cs*0.697-l,kx=m+s*cs*(0.3+0.22*mv),ky=hipY+cs*0.38-l*0.4;
    const qx=px+(kx-px)*0.55,qy=hipY+(ky-hipY)*0.55;
    ctx.strokeStyle=SKIN;
    poly([[qx,qy],[kx,ky],[fx,fyy]],false);ctx.strokeRect(fx-cs*0.07,fyy-cs*0.07,cs*0.14,cs*0.14);
    ctx.strokeStyle=SHORTS;tube(px,hipY,qx,qy,cs*0.085,SHORTSF);
  }
  ctx.strokeStyle=SHORTS;seg(m-cs*0.15,hipY,m+cs*0.15,hipY);
  ctx.strokeStyle=SKIN;
  ctx.fillStyle='#000';ctx.beginPath();ctx.arc(m,hy,hr,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.restore();
}

function overlay(){
  const fs=Math.min(W/16,26);
  if(state==='title'){
    ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,playH);
    const tfs=20*4/3,dfs=10*4/3,sfs=12*4/3;
    ctx.font=dfs+'px Montserrat, sans-serif';
    const paras=['Give it your all, climb the building, and take the helicopter to challenge the next one!','Tap the left side to raise your left hand, tap the right side to raise your right hand, and climb with rhythm! Swipe left or right to move sideways!'];
    const rows=[];
    for(const para of paras){
      let line='';
      for(const word of para.split(' ')){
        const t=line?line+' '+word:word;
        if(line&&ctx.measureText(t).width>W*0.9){rows.push(line);line=word;}
        else line=t;
      }
      if(line)rows.push(line);
      rows.push(null);
    }
    rows.pop();
    const lh=dfs*1.5,gap=tfs;
    const descH=rows.reduce((a,r)=>a+(r===null?dfs*0.8:lh),0);
    const total=tfs*2.3+gap+descH+gap+sfs;
    let yy=playH/2-total/2;
    txt('Scramble',W/2,yy+tfs*0.5,tfs,'#0f8');
    txt('Climber',W/2,yy+tfs*1.8,tfs,'#0f8');
    yy+=tfs*2.3+gap;

    txt('SCORE '+score+'m',W/2,playH*0.5,gfs,'#fff');

  }else if(state==='clear'){
    txt('STAGE '+stage+' CLEAR!',W/2,playH*0.3,Math.min(W/9,42),'#fff');
  }
  const bubble=(msg,col,up)=>{
    const bs=Math.max(14,cs*0.35),bx=wx(P.dc+1),by=wy((P.dhl+P.dhr)/2+2.2+(up||0));
    ctx.font=bs+'px Montserrat, sans-serif';

  };

function bubblePath(x0,y0,bw,bh,bx,bs){
  const r=bs*0.4,tx=Math.max(x0+r+bs*0.3,Math.min(x0+bw-r-bs*0.6,bx));

  ctx.lineTo(x0+bw,y0+bh-r);ctx.arcTo(x0+bw,y0+bh,x0+bw-r,y0+bh,r);
  ctx.lineTo(tx+bs*0.5,y0+bh);ctx.lineTo(bx,y0+bh+bs*0.7);ctx.lineTo(tx-bs*0.2,y0+bh);
  ctx.lineTo(x0+r,y0+bh);ctx.arcTo(x0,y0+bh,x0,y0+bh-r,r);
  ctx.lineTo(x0,y0+r);ctx.arcTo(x0,y0,x0+r,y0,r);ctx.closePath();
}

function turnGeom(){
  const e=1-turnT/TURN,sm=e*e*(3-2*e),th=sm*Math.PI/2,m=turnDir>0?1:-1;
  const Wb=COLS*cs,h=Wb/2,cx=bx0+h,D=Wb*2.5,yh=wy((P.dhl+P.dhr)/2);
  const cosT=Math.cos(th),sinT=Math.sin(th);
  const pt=(kind,u)=>{const uu=m>0?u:1-u;let x,z;
    if(kind===0){x=-h+2*h*uu;z=h;}else{x=h;z=h-2*h*uu;}
    const xr=x*cosT-z*sinT,zr=x*sinT+z*cosT,sc=D/(D-zr);
    return {X:cx+m*xr*sc,sc};};
  return {e:sm,m,Wb,yh,pt};
}
function drawTurn(){
  const g=turnGeom(),N=14,saved=wins;
  const idx=[face,(face+turnDir+4)%4];
  for(let kind=0;kind<2;kind++){
    wins=faces[idx[kind]];
    for(let i=0;i<N;i++){
      const u0=i/N,u1=(i+1)/N,a=g.pt(kind,u0),b=g.pt(kind,u1),mid=g.pt(kind,(u0+u1)/2);
      const xa=Math.min(a.X,b.X),xb=Math.max(a.X,b.X);
      if(xb-xa<0.05)continue;
      const kx=(b.X-a.X)/(g.Wb/N);
      ctx.save();ctx.beginPath();ctx.rect(xa-0.5,0,xb-xa+1,playH);ctx.clip();
      ctx.translate(a.X,g.yh);ctx.scale(kx,mid.sc);ctx.translate(-(bx0+u0*g.Wb),-g.yh);
      drawBuilding();ctx.restore();
    }
  }
  wins=saved;
}

function draw(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,playH);ctx.clip();
  drawBG();
  if(turnT>0)drawTurn();
  else{
    drawBuilding();
    for(const o of objs)drawObj(o);
    for(const b of birds)drawBird(b);
    for(const o of objs)if(o.hold>0&&o.say)bubbleAt(o.say,'#ff8a00',wx(o.x),wy(o.y+1.1));
  }
  if(state==='play'){
    if(turnT>0)drawTurnClimber();
    else if(!(invuln>0&&quietT<=0&&Math.floor(time*10)%2))drawClimber(0,0);
  }else if(state==='fall'){
    drawClimber(fy,frot);
  }else if(state==='clear'){
    const lift=clearT>1.8?(clearT-1.8)*1.8:0;
    const e=Math.min(clearT/1.8,1);
    const heliRow=ROWS+6-(3.4*e)+lift;
    drawHeli(heliRow,lift,e);
    drawClimber(lift,0);
  }else if(state==='title'){
    // demo: nothing
  }
  overlay();
  ctx.restore();
  drawHUD();
  if(state!=='title')drawControls();
  else drawControls();
}

startStage(1);state='title';
let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
