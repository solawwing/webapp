<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>ROLLING FREE WAY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #05030a;
    overflow: hidden;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'BIZ UDPGothic', sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .title {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    font-family: 'BIZ UDPGothic', sans-serif;
    font-weight: 400;
    font-size: 9pt;
    letter-spacing: 0.1em;
    color: #eafcff;
    text-shadow:
      0 0 6px rgba(255,255,255,0.9),
      0 0 16px rgba(0,255,242,0.9),
      0 0 34px rgba(0,255,242,0.6),
      0 0 60px rgba(255,80,190,0.45);
    user-select: none;
    -webkit-user-select: none;
    opacity: 1;
    transition: opacity 1.6s ease, letter-spacing 1.6s ease;
  }
  .title.title-exit {
    opacity: 0;
    letter-spacing: 1.6em;
  }
  .clock {
    position: fixed;
    top: max(8px, env(safe-area-inset-top, 8px));
    right: max(6px, env(safe-area-inset-right, 6px));
    pointer-events: none;
    font-family: 'BIZ UDPGothic', sans-serif;
    font-size: 6pt;
    letter-spacing: 0.06em;
    color: #eafcff;
    text-shadow:
      0 0 4px rgba(255,255,255,0.85),
      0 0 12px rgba(0,255,242,0.7);
    user-select: none;
    -webkit-user-select: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title" id="title">ROLLING FREE WAY</div>
<div class="clock" id="clock"></div>
<script>
  setTimeout(function(){
    document.getElementById('title').classList.add('title-exit');
  }, 5000);

  function updateClock(){
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12;
    if(h === 0) h = 12;
    const hh = String(h).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').textContent = hh + ':' + mm + ':' + ss + ampm;
  }
  updateClock();
  setInterval(updateClock, 1000);
</script>
<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();

  const roadHalfWidth = 8;
  const roadScreenFrac = 1.0; // 基準：z=0で画面幅と同じになる基準値（この上に手前2倍・最遠1.5倍のテーパーをかける）
  const widthMulNear = 2.0;   // 画面最下部（z=0）の道幅倍率
  const widthMulFar = 1.5;    // 描画最遠端（z=drawDist）の道幅倍率
  const camHeight = 0.5;
  const camDepth = 2.6;
  const horizonBaseFrac = 0.44; // 画面中央よりわずかに上を基準にし、少し見下ろす視点にする
  const segLen = 0.6;
  const drawDist = 220;
  const speed = 34;

  let scrollZ = 0;
  let last = performance.now();
  let horizonShift = 0;
  let prevCamX = 0;
  let starDriftX = 0;
  let cloudDriftX = 0; // カーブの動きにゆっくり反応する雲の横方向オフセット
  let cloudFactor = 0; // 昼になりきってからゆっくりフェードインする雲の不透明度係数
  const roadFillAlpha = 0.9 + Math.random() * 0.09; // 道の中の半透明度（90〜99%でランダムに固定）
  const shootingStars = []; // ごくたまに出現する流れ星（残像つき、夜のみ）
  const contrails = []; // ごくたまに出現する飛行機雲（流れ星と逆向き、昼のみ）

  // ---- 昼夜切り替え：シングルタップ、または3分間隔で自動的にトグルする ----
  let dayTarget = 0;        // 0=夜, 1=昼
  let dayFactorCur = 0;     // 実際に描画に使う、なめらかに追従する値
  let lastToggleAt = performance.now();
  const AUTO_TOGGLE_MS = 3 * 60 * 1000; // 3分
  function toggleDayNight(){
    dayTarget = dayTarget === 0 ? 1 : 0;
    lastToggleAt = performance.now();
  }

  // ---- 速度切り替え：ダブルタップで通常速度⇔半分の速度を約2秒かけて切り替える ----
  let speedModeTarget = 1;   // 1=通常速度, 0.5=半分の速度
  let speedModeCur = 1;      // 実際の描画・移動に使う、なめらかに追従する値
  function toggleSpeedMode(){
    speedModeTarget = speedModeTarget === 1 ? 0.5 : 1;
  }

  // ---- シングルタップとダブルタップを判定して振り分ける ----
  let lastTapAt = 0;
  let singleTapTimer = null;
  const DOUBLE_TAP_MS = 300;
  window.addEventListener('pointerdown', function(){
    const now = performance.now();
    if(now - lastTapAt < DOUBLE_TAP_MS){
      clearTimeout(singleTapTimer);
      lastTapAt = 0;
      toggleSpeedMode();
    } else {
      lastTapAt = now;
      singleTapTimer = setTimeout(toggleDayNight, DOUBLE_TAP_MS);
    }
  });

  // ---- 星（3階層：遠い星はゆっくり、近い星は速く流れる。道の動きに同期） ----
  const starLayers = [
    { count: 22, speed: 0.0016, size: 1.1, alphaBase: 0.18, alphaTw: 0.22, twinkle: true,  parallax: 0.4  }, // 遠い星
    { count: 14, speed: 0.0040, size: 1.7, alphaBase: 0.30, alphaTw: 0.25, twinkle: true,  parallax: 0.9  }, // 中間の星
    { count: 8,  speed: 0.0090, size: 2.4, alphaBase: 0.55, alphaTw: 0.20, twinkle: false, parallax: 1.6  }  // 近い星
  ];
  const starField = starLayers.map((layer, li) => {
    const arr = [];
    for(let i = 0; i < layer.count; i++){
      arr.push({
        x: hash(li * 1000 + i * 7.3 + 1.7),
        y0: hash(li * 1000 + i * 13.1 + 2.9),
        tw: hash(li * 1000 + i * 17.5 + 3.3) * Math.PI * 2
      });
    }
    return arr;
  });

  // ---- 昼の空にゆっくり流れる雲（横長の長方形を3〜5個ずらして重ねる） ----
  const CLOUD_COUNT = 3;
  const cloudClusters = [];
  for(let ci = 0; ci < CLOUD_COUNT; ci++){
    const rectCount = 2 + Math.floor(hash(ci * 13.7 + 5) * 7); // 2〜8個・ランダム
    const rects = [];
    for(let r = 0; r < rectCount; r++){
      rects.push({
        dx: (hash(ci * 7.1 + r * 3.3 + 1) - 0.5) * 130,
        dy: (hash(ci * 11.3 + r * 5.1 + 2) - 0.5) * 30,
        w: 60 + hash(ci * 9.7 + r * 4.4 + 3) * 120,
        h: 6 + hash(ci * 5.3 + r * 2.2 + 4) * 8,
        alpha: 0.01 + hash(ci * 3.1 + r * 1.7 + 5) * 0.04 // 1〜5%
      });
    }
    cloudClusters.push({
      baseXFrac: hash(ci * 17.3 + 9),
      baseYFrac: 0.12 + hash(ci * 19.1 + 11) * 0.55,
      depth: 0.25 + hash(ci * 23.1 + 13) * 0.75, // レイヤー：値が小さいほど奥＝動きが遅い
      rects
    });
  }

  function hash(i){
    const s = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
    return s - Math.floor(s);
  }
  function smoothstep(t){
    t = Math.max(0, Math.min(1, t));
    return t * t * (3 - 2 * t);
  }

  const curveWP = [{ z: 0, val: 0 }];
  function ensureCurveWP(maxZ){
    while(curveWP[curveWP.length - 1].z < maxZ){
      const i = curveWP.length;
      const prev = curveWP[curveWP.length - 1];
      const isCurve = (i % 2 === 1);
      let val = prev.val;
      let len;
      if(isCurve){
        const dir = hash(i * 3.1 + 11) < 0.5 ? -1 : 1;
        const seconds = 3.5 + hash(i * 2.3 + 9) * 1.5;   // カーブ:3.5〜5秒
        len = seconds * speed;
        const mag = len * 2.3;                          // カーブをさらに急に
        val = prev.val + dir * mag;
      } else {
        const seconds = 3 + hash(i * 4.1 + 5) * 2;      // 直線:3〜5秒
        len = seconds * speed;
      }
      curveWP.push({ z: prev.z + len, val });
    }
  }
  function lateralAt(z){
    ensureCurveWP(z + 10);
    let k = 0;
    while(curveWP[k + 1] && curveWP[k + 1].z < z) k++;
    const a = curveWP[k], b = curveWP[k + 1] || a;
    if(b.z === a.z) return a.val;
    const t = smoothstep((z - a.z) / (b.z - a.z));
    return a.val + (b.val - a.val) * t;
  }

  const hillWP = [{ z: 0, val: 0 }];
  const bridgeZones = []; // 橋（平坦な区間）の [start, end] を記録
  let nextBridgeZ = 260 + hash(211) * 420;
  function ensureHillWP(maxZ){
    while(hillWP[hillWP.length - 1].z < maxZ){
      const i = hillWP.length;
      const prev = hillWP[hillWP.length - 1];

      if(prev.z >= nextBridgeZ){
        // ---- 橋：手前で徐々にアップ→橋の上は平坦→渡り終えたら徐々にダウン ----
        const rampMag = 10 + hash(i * 9.3 + 4) * 6;
        const rampSeconds = 3 + hash(i * 6.1 + 8) * 1.5;
        const rampLen = rampSeconds * speed;
        const bridgeLen = 40 + hash(i * 17.3 + 223) * 45;

        const upVal = prev.val + rampMag;
        hillWP.push({ z: prev.z + rampLen, val: upVal }); // 徐々にアップ
        const flatStart = prev.z + rampLen;
        const flatEnd = flatStart + bridgeLen;
        hillWP.push({ z: flatEnd, val: upVal });           // 橋の上は平坦
        const bridgeType = hash(i * 21.7 + 233) < 0.5 ? 'truss' : 'suspension';
        bridgeZones.push({ start: flatStart, end: flatEnd, type: bridgeType });
        hillWP.push({ z: flatEnd + rampLen, val: prev.val }); // 徐々にダウン（元の高さへ）

        nextBridgeZ = flatEnd + rampLen + 260 + hash(i * 31.1 + 211) * 420;
        continue;
      }

      const r = hash(i * 7.7 + 3); // 上り:平坦:下り = 1:20:3 の確率
      let val = prev.val;
      let len;
      if(r < 1 / 24){
        // 上り
        const mag = 12 + hash(i * 9.3 + 4) * 9;
        val = prev.val + mag;
        const seconds = 4.5 + hash(i * 6.1 + 8) * 2.5;
        len = seconds * speed;
      } else if(r < 21 / 24){
        // 平坦
        len = 80 + hash(i * 8.9 + 1) * 90;
        val = prev.val;
      } else {
        // 下り
        const mag = 12 + hash(i * 9.3 + 4) * 9;
        val = prev.val - mag;
        const seconds = 4.5 + hash(i * 6.1 + 8) * 2.5;
        len = seconds * speed;
      }
      hillWP.push({ z: prev.z + len, val });
    }
    while(bridgeZones.length > 40 && bridgeZones[0].end < hillWP[hillWP.length - 1].z - drawDist - 200){
      bridgeZones.shift();
    }
  }
  function hillAt(z){
    ensureHillWP(z + 10);
    let k = 0;
    while(hillWP[k + 1] && hillWP[k + 1].z < z) k++;
    const a = hillWP[k], b = hillWP[k + 1] || a;
    if(b.z === a.z) return a.val;
    const t = smoothstep((z - a.z) / (b.z - a.z));
    return a.val + (b.val - a.val) * t;
  }

  function project(z, xWorld, relHeight, horizonY){
    const scale = camDepth / (z + camDepth);
    const vScale = H - horizonY; // 地平線から画面下端までの高さ（z=0が必ずここに一致する）
    const y = horizonY + scale * vScale - scale * relHeight * (vScale / camHeight);
    const xScale = (W * roadScreenFrac / 2) / roadHalfWidth;
    const x = W / 2 + xWorld * scale * xScale;
    return { x, y, scale };
  }

  // ---- 道路脇にたまに現れる、とんがったワイヤーフレームの木 ----
  const treeList = [];
  let treeGenZ = 0;
  function ensureTrees(maxZ){
    while(treeGenZ < maxZ){
      const i = treeList.length + Math.floor(treeGenZ) + 1;
      const gap = 10 + hash(i * 3.7 + 21) * 22; // 候補地点の間隔（世界単位・さらに出現頻度アップ）
      treeGenZ += gap;
      const spawn = hash(i * 5.3 + 37) < 0.62;   // 出現確率を引き上げ
      if(spawn){
        const side = hash(i * 2.9 + 41) < 0.5 ? -1 : 1;
        const extra = 20 + hash(i * 4.1 + 53) * 55;      // 道端からの追加オフセット（さらに離す）
        const height = (5.5 + hash(i * 6.5 + 61) * 4.5) * 3;   // 木の高さ（3倍）
        const baseHalf = (0.45 + hash(i * 7.3 + 67) * 0.35) * 5.2; // 底辺の半幅（もう少し広げる）
        treeList.push({ z: treeGenZ, side, extra, height, baseHalf });
      }
    }
    // 通り過ぎた古い木を間引く（軽量化）
    while(treeList.length > 400 && treeList[0].z < treeGenZ - drawDist - 200){
      treeList.shift();
    }
  }
  function drawTrees(scrollZ, camX, camY, horizonY){
    ensureTrees(scrollZ + drawDist + 20);
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#258c6d';
    ctx.lineWidth = 1;
    const worldUnitPx = (W * roadScreenFrac / 2) / roadHalfWidth; // scale=1地点でのワールド単位あたりのピクセル数
    for(const t of treeList){
      const z = t.z - scrollZ;
      if(z < 0 || z > drawDist) continue;
      const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
      const roadCenter = lateralAt(t.z) - camX;
      const edgeOffset = roadHalfWidth * widthMul;
      const xCenter = roadCenter + t.side * (edgeOffset + t.extra);
      const relHeightGround = hillAt(t.z) - camY;

      const pBaseL = project(z, xCenter - t.baseHalf, relHeightGround, horizonY);
      const pBaseR = project(z, xCenter + t.baseHalf, relHeightGround, horizonY);
      const pBaseC = project(z, xCenter, relHeightGround, horizonY);
      if(pBaseC.y < horizonY - 0.5) continue;
      // 木の高さは道の起伏用のスケールとは切り離し、専用の見た目のバランスで計算する
      const apexY = pBaseC.y - pBaseC.scale * t.height * worldUnitPx * 1.15;
      const trunkY = pBaseC.y + pBaseC.scale * t.height * worldUnitPx * 0.28;

      ctx.beginPath();
      ctx.moveTo(pBaseC.x, apexY);
      ctx.lineTo(pBaseR.x, pBaseR.y);
      ctx.lineTo(pBaseL.x, pBaseL.y);
      ctx.closePath();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pBaseC.x, pBaseC.y);
      ctx.lineTo(pBaseC.x, trunkY);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- 道路脇にたくさん生える、V字型の黄緑色の草 ----
  const grassList = [];
  let grassGenZ = 0;
  function ensureGrass(maxZ){
    while(grassGenZ < maxZ){
      const i = grassList.length + Math.floor(grassGenZ) + 1;
      const gap = 1.6 + hash(i * 2.1 + 91) * 3.2; // さらに密集させる
      grassGenZ += gap;
      const spawn = hash(i * 4.4 + 97) < 0.8;
      if(spawn){
        const side = hash(i * 1.7 + 101) < 0.5 ? -1 : 1;
        const extra = 3 + hash(i * 3.3 + 103) * 6;   // 道端から少し離す
        const height = (0.9 + hash(i * 5.9 + 107) * 1.1) * 0.5;  // 草の高さ（半分に）
        const spread = (0.35 + hash(i * 6.7 + 109) * 0.35) * 0.5; // V字の開き幅（半分に）
        grassList.push({ z: grassGenZ, side, extra, height, spread });
      }
    }
    while(grassList.length > 900 && grassList[0].z < grassGenZ - drawDist - 200){
      grassList.shift();
    }
  }
  function drawGrass(scrollZ, camX, camY, horizonY){
    ensureGrass(scrollZ + drawDist + 20);
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#3ab483';
    ctx.lineWidth = 1;
    const worldUnitPx = (W * roadScreenFrac / 2) / roadHalfWidth;
    for(const g of grassList){
      const z = g.z - scrollZ;
      if(z < 0 || z > drawDist) continue;
      const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
      const roadCenter = lateralAt(g.z) - camX;
      const edgeOffset = roadHalfWidth * widthMul;
      const xCenter = roadCenter + g.side * (edgeOffset + g.extra);
      const relHeightGround = hillAt(g.z) - camY;

      const pBase = project(z, xCenter, relHeightGround, horizonY);
      if(pBase.y < horizonY - 0.5) continue;
      const pTipL = project(z, xCenter - g.spread, relHeightGround, horizonY);
      const pTipR = project(z, xCenter + g.spread, relHeightGround, horizonY);
      const liftPx = pBase.scale * g.height * worldUnitPx * 1.15;

      ctx.beginPath();
      ctx.moveTo(pBase.x, pBase.y);
      ctx.lineTo(pTipL.x, pTipL.y - liftPx);
      ctx.moveTo(pBase.x, pBase.y);
      ctx.lineTo(pTipR.x, pTipR.y - liftPx);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ---- ごくたまに道が渡る、ワイヤーフレームの橋（トラス橋／吊り橋。橋ゾーンは坂道生成側で作られる） ----
  function drawBridges(scrollZ, camX, camY, horizonY, dayFactor){
    ensureHillWP(scrollZ + drawDist + 20);
    ctx.save();
    const nightR = 235, nightG = 255, nightB = 15; // 蛍光イエロー
    const dayR = 255, dayG = 255, dayB = 255; // 白
    const brR = Math.round(nightR + (dayR - nightR) * dayFactor);
    const brG = Math.round(nightG + (dayG - nightG) * dayFactor);
    const brB = Math.round(nightB + (dayB - nightB) * dayFactor);
    const brAlpha = 0.4 + (0.8 - 0.4) * dayFactor;
    ctx.strokeStyle = 'rgba(' + brR + ',' + brG + ',' + brB + ',' + brAlpha + ')';
    ctx.lineWidth = 1;
    const nodeSpacing = 2.4;
    const sideExtra = 0.3; // 道から少し離す
    const worldUnitPx = (W * roadScreenFrac / 2) / roadHalfWidth;

    // トラス橋のパラメータ
    const trussTopHeight = 2.4;
    const trussBottomHeight = 22;

    // 吊り橋のパラメータ（画像参考：塔の間をケーブルがたわみ、等間隔のハンガーが吊る）
    const towerHeight = 22;
    const towerOvershoot = 3;
    const deckDip = 2;

    for(const zone of bridgeZones){
      const zoneStart = Math.max(zone.start, scrollZ);
      const zoneEnd = Math.min(zone.end, scrollZ + drawDist);
      if(zoneEnd <= zoneStart) continue;
      const zoneLen = Math.max(1, zone.end - zone.start);

      for(const side of [-1, 1]){
        if(zone.type === 'suspension'){
          const nodes = [];
          for(let wz = zoneStart; wz <= zoneEnd; wz += nodeSpacing){
            const z = wz - scrollZ;
            if(z < 0 || z > drawDist) continue;
            const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
            const roadCenter = lateralAt(wz) - camX;
            const edgeOffset = roadHalfWidth * widthMul + sideExtra;
            const relHeightGround = hillAt(wz) - camY;
            const xWorld = roadCenter + side * edgeOffset;
            const base = project(z, xWorld, relHeightGround, horizonY);
            if(base.y < horizonY - 0.5) continue;
            const f = (wz - zone.start) / zoneLen; // 0(左の塔)〜1(右の塔)
            const cableH = deckDip + (towerHeight - deckDip) * Math.pow(2 * f - 1, 2);
            const liftCable = base.scale * cableH * worldUnitPx * 1.15;
            nodes.push({ x: base.x, y: base.y - liftCable, baseX: base.x, baseY: base.y, f, scale: base.scale });
          }
          if(nodes.length < 2) continue;

          // メインケーブル（たわむ曲線）
          ctx.beginPath();
          ctx.moveTo(nodes[0].x, nodes[0].y);
          for(let k = 1; k < nodes.length; k++) ctx.lineTo(nodes[k].x, nodes[k].y);
          ctx.stroke();

          // ハンガー（ケーブルからデッキへの垂直線）と、両端の塔
          for(const n of nodes){
            ctx.beginPath();
            if(n.f < 0.02 || n.f > 0.98){
              // 塔：ケーブルより少し上まで突き出す
              const towerLift = n.scale * (towerHeight + towerOvershoot) * worldUnitPx * 1.15;
              ctx.moveTo(n.baseX, n.baseY);
              ctx.lineTo(n.baseX, n.baseY - towerLift);
            } else {
              ctx.moveTo(n.baseX, n.baseY);
              ctx.lineTo(n.x, n.y);
            }
            ctx.stroke();
          }
          continue;
        }

        // ---- トラス橋（上弦材＋ジグザグの斜材） ----
        const nodes = [];
        let idx = 0;
        for(let wz = zoneStart; wz <= zoneEnd; wz += nodeSpacing, idx++){
          const z = wz - scrollZ;
          if(z < 0 || z > drawDist) continue;
          const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
          const roadCenter = lateralAt(wz) - camX;
          const edgeOffset = roadHalfWidth * widthMul + sideExtra;
          const relHeightGround = hillAt(wz) - camY;
          const xWorld = roadCenter + side * edgeOffset;
          const base = project(z, xWorld, relHeightGround, horizonY);
          if(base.y < horizonY - 0.5) continue;
          const isTop = (idx % 2 === 0);
          const h = isTop ? trussTopHeight : trussBottomHeight;
          const lift = base.scale * h * worldUnitPx * 1.15;
          nodes.push({ x: base.x, y: base.y - lift, isTop });
        }
        if(nodes.length < 2) continue;

        // ジグザグ（上弦材と下側の頂点を交互につなぐ斜材）
        ctx.beginPath();
        ctx.moveTo(nodes[0].x, nodes[0].y);
        for(let k = 1; k < nodes.length; k++) ctx.lineTo(nodes[k].x, nodes[k].y);
        ctx.stroke();

        // 上弦材（頂点同士を結ぶ水平に近い直線）
        ctx.beginPath();
        let started = false;
        for(const n of nodes){
          if(!n.isTop) continue;
          if(!started){ ctx.moveTo(n.x, n.y); started = true; }
          else ctx.lineTo(n.x, n.y);
        }
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  // ---- 昼間の道の中にランダムに現れる、白い半透明の横線 ----
  const roadMarkList = [];
  let roadMarkGenZ = 0;
  function ensureRoadMarks(maxZ){
    while(roadMarkGenZ < maxZ){
      const i = roadMarkList.length + Math.floor(roadMarkGenZ) + 1;
      const gap = 3 + hash(i * 2.7 + 131) * 5;
      roadMarkGenZ += gap;
      const spawn = hash(i * 4.9 + 137) < 0.6;
      if(spawn){
        const lateralFrac = (hash(i * 1.3 + 139) - 0.5) * 1.6; // 道の中央寄り〜端寄りまでランダム
        const len = 0.8 + hash(i * 3.7 + 149) * 2.2;
        const alpha = 0.1 + hash(i * 5.1 + 151) * 0.8; // 10〜90%
        roadMarkList.push({ z: roadMarkGenZ, lateralFrac, len, alpha });
      }
    }
    while(roadMarkList.length > 900 && roadMarkList[0].z < roadMarkGenZ - drawDist - 200){
      roadMarkList.shift();
    }
  }
  function drawRoadMarks(scrollZ, camX, camY, horizonY, dayFactor){
    ensureRoadMarks(scrollZ + drawDist + 20);
    ctx.save();
    ctx.lineWidth = 1;
    for(const m of roadMarkList){
      const z = m.z - scrollZ;
      if(z < 0 || z > drawDist) continue;
      const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
      const roadCenter = lateralAt(m.z) - camX;
      const halfWidthAtZ = roadHalfWidth * widthMul;
      const xCenter = roadCenter + m.lateralFrac * halfWidthAtZ;
      const relHeightGround = hillAt(m.z) - camY;

      const pL = project(z, xCenter - m.len / 2, relHeightGround, horizonY);
      const pR = project(z, xCenter + m.len / 2, relHeightGround, horizonY);
      if(pL.y < horizonY - 0.5) continue;

      ctx.strokeStyle = 'rgba(255,255,255,' + m.alpha + ')';
      ctx.beginPath();
      ctx.moveTo(pL.x, pL.y);
      ctx.lineTo(pR.x, pR.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function draw(now){
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    // 坂の傾斜（上り/下り）を先読みし、上りは減速・下りは加速させて起伏をダイナミックに見せる
    const slopeEps = 3;
    const slopeNow = (hillAt(scrollZ + slopeEps) - hillAt(scrollZ - slopeEps)) / (2 * slopeEps);
    const speedFactor = Math.max(0.45, Math.min(1.55, 1 - slopeNow * 7.5));
    speedModeCur += (speedModeTarget - speedModeCur) * Math.min(1, dt * 1.1); // 約2秒かけてなめらかに変化
    scrollZ += speed * speedFactor * speedModeCur * dt;

    const camX = lateralAt(scrollZ);
    const camY = hillAt(scrollZ);
    const camXDelta = camX - prevCamX;
    prevCamX = camX;
    starDriftX += camXDelta * 5.5;
    starDriftX *= Math.max(0, 1 - dt * 1.1);
    cloudDriftX += camXDelta * 1.1;
    cloudDriftX *= Math.max(0, 1 - dt * 0.12); // 雲はカーブの動きにゆっくり反応する

    // 坂の傾斜（上り/下り）に応じて地平線を上下させる。下り坂は上がりすぎないよう控えめに。
    const slope = (hillAt(scrollZ + slopeEps) - hillAt(scrollZ - slopeEps)) / (2 * slopeEps);
    const targetHorizonShift = slope >= 0
      ? Math.min(1, slope * 13) * (H * 0.46)      // 上り：地平線が下がる
      : Math.max(-1, slope * 30) * (H * 1.1);     // 下り：上りの5倍ダイナミックに（地平線側でクランプ）
    horizonShift += (targetHorizonShift - horizonShift) * Math.min(1, dt * 2.2);
    const horizonY = Math.max(H * 0.2, Math.min(H * 0.85, H * horizonBaseFrac + horizonShift));

    if(now - lastToggleAt >= AUTO_TOGGLE_MS){
      dayTarget = dayTarget === 0 ? 1 : 0;
      lastToggleAt = now;
    }
    dayFactorCur += (dayTarget - dayFactorCur) * Math.min(1, dt * 0.3);
    const dayFactor = dayFactorCur;
    const cloudTarget = dayFactor > 0.92 ? 1 : 0; // 昼に切り替わりきってから雲を出す
    cloudFactor += (cloudTarget - cloudFactor) * Math.min(1, dt * 0.12); // ゆっくりフェードイン
    // 夜：漆黒 / 昼：地平線より上＝青(#00479d)を95%の半透明、地平線より下＝緑(#8ec54a)を30%の半透明
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    const skyTopY = 0;
    const skyBottomY = Math.max(0, horizonY);
    if(skyBottomY > skyTopY){
      const skyAlpha = 0.95 * dayFactor;
      const skyGrad = ctx.createLinearGradient(0, skyTopY, 0, skyBottomY);
      skyGrad.addColorStop(0, 'rgba(0,71,157,' + skyAlpha + ')');
      skyGrad.addColorStop(1, 'rgba(255,255,255,' + skyAlpha + ')');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, skyTopY, W, skyBottomY - skyTopY);
    }
    if(H > horizonY){
      ctx.fillStyle = 'rgba(142,197,74,' + (0.50 * dayFactor) + ')';
      ctx.fillRect(0, horizonY, W, H - horizonY);
    }

    // ---- 昼の空に浮かぶ雲（横長の長方形を3〜5個ずらして重ねる） ----
    if(cloudFactor > 0.02){
      ctx.save();
      const cloudSkyH = Math.max(0, horizonY - 6);
      for(const cluster of cloudClusters){
        let cx = cluster.baseXFrac * W - cloudDriftX * 0.5 * cluster.depth;
        cx = ((cx % W) + W) % W;
        const cy = cluster.baseYFrac * cloudSkyH;
        for(const r of cluster.rects){
          ctx.fillStyle = 'rgba(255,255,255,' + (r.alpha * cloudFactor) + ')';
          ctx.fillRect(cx + r.dx - r.w / 2, cy + r.dy - r.h / 2, r.w, r.h);
        }
      }
      ctx.restore();
    }

    ctx.save();
    ctx.globalAlpha = 1 - dayFactor; // 昼になるほど星を消す
    const skyH = Math.max(0, horizonY - 4);
    for(let li = 0; li < starLayers.length; li++){
      const layer = starLayers[li];
      for(const s of starField[li]){
        // scrollZ（道が実際に進んだ距離）に同期して星を流す
        const yFrac = (s.y0 + scrollZ * layer.speed) % 1;
        const sy = yFrac * skyH;
        let sx = s.x * W - starDriftX * layer.parallax;
        sx = ((sx % W) + W) % W;
        let alpha = layer.alphaBase;
        if(layer.twinkle){
          alpha += layer.alphaTw * (0.5 + 0.5 * Math.sin(now / 500 + s.tw));
        }
        ctx.fillStyle = 'rgba(210,225,255,' + alpha + ')';
        ctx.fillRect(sx, sy, layer.size, layer.size);
      }
    }
    ctx.restore();

    // ---- ごくたまに現れる流れ星（残像つき・夜のみ） ----
    if(dayFactor < 0.1 && Math.random() < 0.0018 && horizonY > 30){
      const startX = Math.random() * W;
      const startY = -10;
      const spd = 90 + Math.random() * 60; // ゆっくり
      const dir = Math.random() < 0.5 ? -1 : 1;
      shootingStars.push({
        x: startX, y: startY,
        vx: dir * (0.6 + Math.random() * 0.5) * spd, // しっかり斜めに流れる
        vy: spd,
        life: 0,
        maxLife: 8
      });
    }
    ctx.save();
    for(let i = shootingStars.length - 1; i >= 0; i--){
      const s = shootingStars[i];
      s.life += dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      if(s.life >= s.maxLife || s.y > horizonY || s.x < -60 || s.x > W + 60){
        shootingStars.splice(i, 1);
        continue;
      }
      const fadeAlpha = Math.max(0, Math.min(1, 1 - s.y / horizonY)) * (1 - dayFactor);
      const tx = s.x - s.vx * 0.9;
      const ty = s.y - s.vy * 0.9;
      const trailGrad = ctx.createLinearGradient(tx, ty, s.x, s.y);
      trailGrad.addColorStop(0, 'rgba(255,255,255,0)');
      trailGrad.addColorStop(1, 'rgba(255,255,255,' + fadeAlpha + ')');
      ctx.strokeStyle = trailGrad;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
    }
    ctx.restore();

    // ---- ごくたまに現れる飛行機雲（流れ星と逆向き＝画面端から画面端へ、緩やかな角度・昼のみ） ----
    if(dayFactor > 0.9 && Math.random() < 0.0018 && horizonY > 30){
      const dir = Math.random() < 0.5 ? -1 : 1;
      const startX = dir === 1 ? -30 : W + 30; // 画面端から出現
      const startY = horizonY * (0.15 + Math.random() * 0.6);
      const spd = (55 + Math.random() * 35) / 3; // 飛行機なのでゆったり（さらに1/3に減速）
      contrails.push({
        x: startX, y: startY,
        vx: dir * (2.4 + Math.random() * 0.8) * spd, // さらに水平方向優位＝より緩やかな傾斜
        vy: -spd * 0.15,                              // 上昇はごくわずか
        life: 0,
        maxLife: 90,
        trail: [],
        trailTimer: 0
      });
    }
    ctx.save();
    for(let i = contrails.length - 1; i >= 0; i--){
      const c = contrails[i];
      c.life += dt;
      c.x += c.vx * dt;
      c.y += c.vy * dt;
      c.trailTimer += dt;
      if(c.trailTimer > 0.04){
        c.trail.push({ x: c.x, y: c.y });
        c.trailTimer = 0;
        if(c.trail.length > 600) c.trail.shift();
      }
      if(c.life >= c.maxLife || c.y < -20 || c.x < -220 || c.x > W + 220){
        contrails.splice(i, 1);
        continue;
      }
      // 出現時はフェードイン。画面端（進行方向の出口側）に近づいたら位置ベースでフェードアウト
      const fadeIn = Math.min(1, c.life / (c.maxLife * 0.15));
      const fadeDist = 140;
      let edgeFade = 1;
      if(c.vx > 0){
        edgeFade = c.x <= W ? 1 : Math.max(0, 1 - (c.x - W) / fadeDist);
      } else {
        edgeFade = c.x >= 0 ? 1 : Math.max(0, 1 - (0 - c.x) / fadeDist);
      }
      const fadeAlpha = Math.max(0, Math.min(1, fadeIn * edgeFade)) * dayFactor * 0.8;
      if(c.trail.length > 1){
        const head = c.trail[c.trail.length - 1];
        const tail = c.trail[0];
        const trailGrad = ctx.createLinearGradient(tail.x, tail.y, head.x, head.y);
        trailGrad.addColorStop(0, 'rgba(255,255,255,0)');
        trailGrad.addColorStop(1, 'rgba(255,255,255,' + fadeAlpha + ')');
        ctx.strokeStyle = trailGrad;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(c.trail[0].x, c.trail[0].y);
        for(let k = 1; k < c.trail.length; k++) ctx.lineTo(c.trail[k].x, c.trail[k].y);
        ctx.lineTo(c.x, c.y);
        ctx.stroke();
      }
    }
    ctx.restore();

    ctx.save();
    // 夜は水色ネオン、昼は青系の地平線にブレンド
    const hzR = 140 + (40 - 140) * dayFactor, hzG = 235 + (110 - 235) * dayFactor, hzB = 255 + (230 - 255) * dayFactor;
    ctx.shadowColor = dayFactor < 0.5 ? '#00e5ff' : '#2f74e0';
    ctx.shadowBlur = 18;
    const horizonGrad = ctx.createLinearGradient(0, 0, W, 0);
    horizonGrad.addColorStop(0,    'rgba(' + hzR + ',' + hzG + ',' + hzB + ',0)');
    horizonGrad.addColorStop(0.18, 'rgba(' + hzR + ',' + hzG + ',' + hzB + ',0.95)');
    horizonGrad.addColorStop(0.82, 'rgba(' + hzR + ',' + hzG + ',' + hzB + ',0.95)');
    horizonGrad.addColorStop(1,    'rgba(' + hzR + ',' + hzG + ',' + hzB + ',0)');
    ctx.strokeStyle = horizonGrad;
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(0, horizonY);
    ctx.lineTo(W, horizonY);
    ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    drawTrees(scrollZ, camX, camY, horizonY);
    drawGrass(scrollZ, camX, camY, horizonY);
    drawBridges(scrollZ, camX, camY, horizonY, dayFactor);

    // 道の内側（左右のラインの間）をグレーで塗る
    function collectEdgePoints(side){
      const pts = [];
      for(let z = 0; z <= drawDist; z += segLen){
        const worldZ = scrollZ + z;
        const cx = lateralAt(worldZ) - camX;
        const relHeight = hillAt(worldZ) - camY;
        const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
        const xWorld = cx + side * roadHalfWidth * widthMul;
        const p = project(z, xWorld, relHeight, horizonY);
        if(p.y < horizonY - 0.5) break;
        pts.push(p);
      }
      return pts;
    }
    const leftPts = collectEdgePoints(-1);
    const rightPts = collectEdgePoints(1);
    if(leftPts.length > 1 && rightPts.length > 1){
      const roadR = Math.round(4 + (99 - 4) * dayFactor);
      const roadG = Math.round(4 + (96 - 4) * dayFactor);
      const roadB = Math.round(6 + (98 - 6) * dayFactor);
      ctx.beginPath();
      ctx.moveTo(leftPts[0].x, leftPts[0].y);
      for(let i = 1; i < leftPts.length; i++) ctx.lineTo(leftPts[i].x, leftPts[i].y);
      for(let i = rightPts.length - 1; i >= 0; i--) ctx.lineTo(rightPts[i].x, rightPts[i].y);
      ctx.closePath();
      ctx.fillStyle = 'rgba(' + roadR + ',' + roadG + ',' + roadB + ',' + roadFillAlpha + ')';
      ctx.fill();
    }

    drawRoadMarks(scrollZ, camX, camY, horizonY, dayFactor);

    for(const side of [-1, 1]){
      ctx.beginPath();
      let started = false;

      for(let z = 0; z <= drawDist; z += segLen){
        const worldZ = scrollZ + z;
        const cx = lateralAt(worldZ) - camX;
        const relHeight = hillAt(worldZ) - camY;
        const widthMul = widthMulNear + (widthMulFar - widthMulNear) * (z / drawDist);
        const xWorld = cx + side * roadHalfWidth * widthMul;
        const p = project(z, xWorld, relHeight, horizonY);
        if(p.y < horizonY - 0.5) break;
        if(!started){ ctx.moveTo(p.x, p.y); started = true; }
        else ctx.lineTo(p.x, p.y);
      }

      const grad = ctx.createLinearGradient(0, horizonY, 0, H);
      grad.addColorStop(0,    'rgba(20,180,90,0.10)');
      grad.addColorStop(0.22, 'rgba(25,255,110,0.55)');
      grad.addColorStop(0.6,  'rgba(70,255,140,0.85)');
      grad.addColorStop(1,    'rgba(210,255,225,1)');

      const coreGrad = ctx.createLinearGradient(0, horizonY, 0, H);
      coreGrad.addColorStop(0,   'rgba(225,255,235,0.08)');
      coreGrad.addColorStop(0.22,'rgba(225,255,235,0.45)');
      coreGrad.addColorStop(0.6, 'rgba(230,255,240,0.75)');
      coreGrad.addColorStop(1,   'rgba(255,255,255,1)');

      ctx.strokeStyle = grad;
      ctx.shadowColor = '#25ff7a';
      ctx.shadowBlur = 26 * (1 - dayFactor);
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.shadowBlur = 8 * (1 - dayFactor);
      ctx.lineWidth = 1;
      ctx.strokeStyle = coreGrad;
      ctx.stroke();
    }
    ctx.restore();

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
